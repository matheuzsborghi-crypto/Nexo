n    .cpx-btn-ghost{background:transparent;border-color:var(--border,#e8e8e8);color:var(--text-secondary,#6b6b6b);}\n    .cpx-btn-primary{background:var(--accent,#E07A5F);color:#fff;}\n    .cpx-btn-danger{background:#C25450;color:#fff;}\n  `;\n\n  let _styleEl = null;\n  function injectCSS() {\n    if (_styleEl) return;\n    _styleEl = document.createElement('style');\n    _styleEl.id = 'nx-it-styles';\n    _styleEl.textContent = CSS;\n    document.head.appendChild(_styleEl);\n  }\n\n  // ── 2. HELPERS ──────────────────────────────────────────────────────────\n  function fmtBR(n, decimals = 2) {\n    if (n == null || isNaN(n)) return '—';\n    return new Intl.NumberFormat('pt-BR', { minimumFractionDigits: decimals, maximumFractionDigits: decimals }).format(n);\n  }\n  function fmtQty(n) {\n    if (n == null || isNaN(n)) return '—';\n    return new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 0, maximumFractionDigits: 6 }).format(n);\n  }\n  function parseBR(str) {\n    if (typeof str === 'number') return str;\n    return parseFloat(String(str).replace(/\\./g, '').replace(',', '.')) || 0;\n  }\n  function fmtDate(str) {\n    if (!str) return '—';\n    const d = new Date(str + (str.length === 10 ? 'T00:00:00' : ''));\n    return d.toLocaleDateString('pt-BR');\n  }\n  function relativeDate(iso) {\n    if (!iso) return '';\n    const d = new Date(iso);\n    const now = Date.now();\n    const diff = now - d.getTime();\n    const days = Math.floor(diff / 86400000);\n    if (days === 0) return 'today';\n    if (days === 1) return 'yesterday';\n    if (days < 30) return days + ' days ago';\n    const months = Math.floor(days / 30);\n    if (months < 12) return months + (months === 1 ? ' month ago' : ' months ago');\n    const years = Math.floor(months / 12);\n    return years + (years === 1 ? ' year ago' : ' years ago');\n  }\n  function txRelativeDate(str) {\n    if (!str) return '';\n    const d = new Date(str + 'T00:00:00');\n    const now = Date.now();\n    const diff = now - d.getTime();\n    const days = Math.floor(diff / 86400000);\n    if (days === 0) return 'today';\n    if (days === 1) return 'yesterday';\n    return days + ' days ago';\n  }\n  function generateId() {\n    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);\n  }\n  function monthLabel(dateStr) {\n    if (!dateStr) return 'Unknown';\n    const d = new Date(dateStr + 'T00:00:00');\n    return d.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });\n  }\n  function monthKey(dateStr) {\n    if (!dateStr) return '0000-00';\n    return dateStr.slice(0, 7);\n  }\n  function escHtml(s) {\n    return String(s || '').replace(/&/g,'&amp;').replace(/<\/g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;');\n  }\n\n  // ── 3. DATA LAYER ────────────────────────────────────────────────────────\n  const ASSETS_KEY = 'nexo_investment_assets';\n  const TXS_KEY = 'nexo_investment_transactions';\n  const VIEW_KEY = 'nexo:investments:txView';\n\n  function getAssets() {\n    try { return JSON.parse(localStorage.getItem(ASSETS_KEY) || '[]'); } catch { return []; }\n  }\n  function getTxs() {\n    try { return JSON.parse(localStorage.getItem(TXS_KEY) || '[]'); } catch { return []; }\n  }\n\n  // ── Gist sync helpers ──────────────────────────────────────────────────────\n  // O Gist usa o formato: { meta:{...}, data:{ ..., investmentAssets:[...], investmentTransactions:[...] } }\n  // O interceptor fetch() já cuida da autenticação — basta chamar /api/sync/data.\n\n  async function loadFromGist() {\n    try {\n      const resp = await fetch('/api/sync/data');\n      if (!resp.ok) return;\n      const json = await resp.json();\n      const d = json && json.payload && json.payload.data;\n      if (!d) return;\n      if (Array.isArray(d.investmentAssets))\n        localStorage.setItem(ASSETS_KEY, JSON.stringify(d.investmentAssets));\n      if (Array.isArray(d.investmentTransactions))\n        localStorage.setItem(TXS_KEY, JSON.stringify(d.investmentTransactions));\n    } catch (e) {\n      console.warn('[Nexo IT] loadFromGist failed:', e);\n    }\n  }\n\n  async function syncToGist(assets, txs) {\n    try {\n      const resp = await fetch('/api/sync/data');\n      if (!resp.ok) return;\n      const json = await resp.json();\n      if (!json || !json.payload) return;\n      const payload = json.payload;\n      if (!payload.data) payload.data = {};\n      payload.data.investmentAssets = assets;\n      payload.data.investmentTransactions = txs;\n      if (!payload.meta) payload.meta = {};\n      payload.meta.updatedAt = new Date().toISOString();\n      await fetch('/api/sync/data', {\n        method: 'PUT',\n        headers: { 'Content-Type': 'application/json' },\n        body: JSON.stringify(payload),\n      });\n    } catch (e) {\n      console.warn('[Nexo IT] syncToGist failed:', e);\n    }\n  }\n\n  function saveAssets(arr) {\n    localStorage.setItem(ASSETS_KEY, JSON.stringify(arr));\n    syncToGist(arr, getTxs());\n  }\n  function saveTxs(arr) {\n    localStorage.setItem(TXS_KEY, JSON.stringify(arr));\n    syncToGist(getAssets(), arr);\n  }\n  function saveAsset(asset) {\n    const arr = getAssets();\n    const idx = arr.findIndex(a => a.id === asset.id);\n    if (idx >= 0) arr[idx] = asset; else arr.push(asset);\n    saveAssets(arr);\n  }\n\n  // ── Closed positions: view state + persistência atômica (absorvido do cpx.js) ──\n  const CPX_VIEW_KEY = 'nexo:cpx:assetView'; // mesma chave usada pelo cpx.js\n  function getAssetView() { return localStorage.getItem(CPX_VIEW_KEY) === 'closed' ? 'closed' : 'active'; }\n  function setAssetView(v) { localStorage.setItem(CPX_VIEW_KEY, v === 'closed' ? 'closed' : 'active'); }\n\n  // Grava assets+txs juntos com UM único sync ao Gist (idêntico ao persist() do cpx;\n  // evita dois PUTs concorrentes que saveAssets+saveTxs em sequência causariam).\n  function persist(assets, txs) {\n    localStorage.setItem(ASSETS_KEY, JSON.stringify(assets));\n    localStorage.setItem(TXS_KEY, JSON.stringify(txs));\n    syncToGist(assets, txs);\n  }\n\n  // Mesmo formato de id que o cpx.js usava para a transação de encerramento.\n  function cpxUid() {\n    return 'cpx-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);\n  }\n\n  // ── 4. CALCULATIONS ──────────────────────────────────────────────────────\n  const FIXED_INCOME = new Set(['CDB', 'LCI', 'LCA', 'Fund']);\n\n  function isFixedIncome(assetClass) { return FIXED_INCOME.has(assetClass); }\n\n  function txTotal(tx, assetClass) {\n    if (tx.type === 'buy' || tx.type === 'sell') {\n      if (isFixedIncome(assetClass)) return parseFloat(tx.amount) || 0;\n      return (parseFloat(tx.amount) || 0) * (parseFloat(tx.quantity) || 0);\n    }\n    return parseFloat(tx.amount) || 0;\n  }\n\n  function calcAvgPrice(txs, assetClass) {\n    const buys = txs.filter(t => t.type === 'buy');\n    if (!buys.length) return 0;\n    if (isFixedIncome(assetClass)) {\n      const totalAmt = buys.reduce((s, t) => s + (parseFloat(t.amount) || 0), 0);\n      const totalQty = buys.reduce((s, t) => s + (parseFloat(t.quantity) || 1), 0);\n      return totalQty ? totalAmt / totalQty : 0;\n    } else {\n      const totalCost = buys.reduce((s, t) => s + (parseFloat(t.amount) || 0) * (parseFloat(t.quantity) || 0), 0);\n      const totalQty = buys.reduce((s, t) => s + (parseFloat(t.quantity) || 0), 0);\n      return totalQty ? totalCost / totalQty : 0;\n    }\n  }\n\n  function calcQty(txs) {\n    return txs.filter(t => t.type === 'buy' || t.type === 'sell').reduce((s, t) => {\n      const q = parseFloat(t.quantity) || 0;\n      return t.type === 'buy' ? s + q : s - q;\n    }, 0);\n  }\n\n  function calcTotalCost(txs, assetClass) {\n    const buys = txs.filter(t => t.type === 'buy');\n    if (isFixedIncome(assetClass)) {\n      return buys.reduce((s, t) => s + (parseFloat(t.amount) || 0), 0);\n    } else {\n      return buys.reduce((s, t) => s + (parseFloat(t.amount) || 0) * (parseFloat(t.quantity) || 0), 0);\n    }\n  }\n\n  // Para fundos/renda fixa: capital líquido investido = Σ(buys) − Σ(sells)\n  function calcNetInvested(txs) {\n    const totalBuys  = txs.filter(t => t.type === 'buy' ).reduce((s, t) => s + (parseFloat(t.amount) || 0), 0);\n    const totalSells = txs.filter(t => t.type === 'sell').reduce((s, t) => s + (parseFloat(t.amount) || 0), 0);\n    return totalBuys - totalSells;\n  }\n\n  function calcPosition(asset, qty) {\n    const price = parseFloat(asset.manualUnitPrice) || 0;\n    if (isFixedIncome(asset.assetClass)) return price;\n    return price * qty;\n  }\n\n  function calcPL(asset, avgPriceOrNet, qty) {\n    const price = parseFloat(asset.manualUnitPrice) || 0;\n    if (isFixedIncome(asset.assetClass)) {\n      // avgPriceOrNet é netInvested para renda fixa/fundos\n      return price - avgPriceOrNet;\n    } else {\n      return (price - avgPriceOrNet) * qty;\n    }\n  }\n\n  function calcPortfolioTotal(assets) {\n    return assets.reduce((s, asset) => {\n      const txs = getTxs().filter(t => t.assetId === asset.id);\n      const qty = calcQty(txs);\n      return s + calcPosition(asset, qty);\n    }, 0);\n  }\n\n  // ── Matemática de posições encerradas (absorvido do cpx.js) ───────────────\n  // Proceeds de todas as vendas registradas (cost basis já é calcTotalCost).\n  function calcProceeds(asset, txs) {\n    const fi = isFixedIncome(asset.assetClass);\n    return txs.filter(t => t.type === 'sell').reduce((s, t) => {\n      const amt = parseFloat(t.amount) || 0;\n      const q = parseFloat(t.quantity) || 0;\n      return s + (fi ? amt : amt * q);\n    }, 0);\n  }\n\n  function calcIncomeTotal(txs) {\n    return txs.filter(t => t.type === 'income').reduce((s, t) => s + (parseFloat(t.amount) || 0), 0);\n  }\n\n  // Realized P/L de uma posição (totalmente) encerrada = proceeds + income − cost.\n  function calcRealized(asset, txs) {\n    const proceeds = calcProceeds(asset, txs);\n    const cost = calcTotalCost(txs, asset.assetClass);\n    const income = calcIncomeTotal(txs);\n    return { proceeds, cost, income, realized: proceeds + income - cost };\n  }\n\n  // Detecta posição fechada mesmo se a flag `closed` foi removida por um\n  // normalizador de dados: qualquer sell com closing===true (ou nota\n  // \"Position closed\") conta como encerramento. Idêntico ao cpx.js.\n  function closingTxFor(asset, allTxs) {\n    let found = null;\n    allTxs.forEach(t => {\n      if (t.assetId === asset.id && t.type === 'sell' &&\n          (t.closing === true || (t.notes && /position closed/i.test(t.notes)))) {\n        if (!found || (t.date || '') >= (found.date || '')) found = t;\n      }\n    });\n    return found;\n  }\n\n  function isClosedAsset(asset, allTxs) { return !!(asset.closed || closingTxFor(asset, allTxs)); }\n\n  // ── 5. STATE ─────────────────────────────────────────────────────────────\n  let state = {\n    from: '', to: '', assetId: '', search: '', typeFilter: 'all',\n    view: localStorage.getItem(VIEW_KEY) || 'table',\n    showAssets: true,\n    confirmDelete: null,   // { txId }\n    modal: null,           // { type: 'newAsset'|'addTx'|'editTx', data: {} }\n    closeModal: null,      // { assetId, value?, date?, note? } — modal Close position (ex-cpx)\n    // Aba Assets — filtro e ordenação por classe (persistidos)\n    assetClassFilter: localStorage.getItem('nexo:assets:classFilter') || 'all',\n    assetSort: localStorage.getItem('nexo:assets:sort') || 'default',\n    openMenu: null         // id do asset cujo menu ⋯ está aberto\n  };\n  let txPickerClass = 'all';   // filtro de classe do asset picker no modal Add transaction\n  const ASSET_CLASSES = ['ETF', 'Stock', 'Fund', 'CDB', 'LCI', 'LCA', 'Cash'];\n  const NX_CLASS_COLOR = { ETF: 'var(--accent, #E07A5F)', Stock: '#8E5A8A', Fund: '#4C7A99', CDB: '#5C8A6C', LCI: '#5C8A6C', LCA: '#5C8A6C', Cash: '#7A756F' };\n  function nxClassColor(c) { return NX_CLASS_COLOR[c] || '#7A756F'; }\n  const NX_TX_TYPE = {\n    buy:        { label: 'Buy',    color: 'var(--buy, #5C8A6C)',  light: 'var(--buy-light, #E8F0EA)' },\n    sell:       { label: 'Sell',   color: 'var(--sell, #C25450)', light: 'var(--sell-light, #F6E6E5)' },\n    income:     { label: 'Income', color: 'var(--div, #B58A3B)',  light: 'var(--div-light, #F6EDD9)' },\n    adjustment: { label: 'Adjust', color: 'var(--adj, #7A756F)',  light: 'var(--adj-light, #EFEAE3)' }\n  };\n\n  // dirty / justSaved per asset id\n  const editState = {}; // { [assetId]: { raw: string, dirty: bool, justSaved: bool } }\n\n  // ── 6. BADGE / TYPE HELPERS ──────────────────────────────────────────────\n  function badgeInfo(tx, assetClass) {\n    if (tx.type === 'buy') return { cls: 'nx-badge-buy', dot: 'var(--buy)', label: 'Buy' };\n    if (tx.type === 'sell') return { cls: 'nx-badge-sell', dot: 'var(--sell)', label: 'Sell' };\n    if (tx.type === 'adjustment') return { cls: 'nx-badge-adj', dot: 'var(--adj)', label: 'Adj' };\n    if (tx.type === 'income') {\n      if (['CDB','LCI','LCA'].includes(assetClass)) return { cls: 'nx-badge-coup', dot: 'var(--coup)', label: 'Coupon' };\n      return { cls: 'nx-badge-div', dot: 'var(--div)', label: 'Dividend' };\n    }\n    return { cls: 'nx-badge-adj', dot: 'var(--adj)', label: tx.type };\n  }\n\n  function totalClass(type) {\n    if (type === 'buy') return 'nx-total-buy';\n    if (type === 'sell') return 'nx-total-sell';\n    if (type === 'income') return 'nx-total-income';\n    return 'nx-total-adj';\n  }\n\n  function totalSign(type) {\n    if (type === 'buy') return '−';\n    if (type === 'sell') return '+';\n    if (type === 'income') return '+';\n    return '±';\n  }\n\n  // ── 7. RENDER ─────────────────────────────────────────────────────────────\n  let _txContainer = null;      // container da aba 'investments_transactions'\n  let _assetsContainer = null;  // container da aba 'assets'\n\n  // ── Preservação de foco/cursor através do re-render ───────────────────────\n  // Sem isso, qualquer re-render (inclusive o que troca \"✓ Saved\" por\n  // \"Last updated\" 2s depois) recria os inputs e o usuário perde o foco e o\n  // texto que estava digitando em outro campo.\n  function captureFocus(container) {\n    const a = document.activeElement;\n    if (!a || !container || !container.contains(a)) return null;\n    const tag = a.tagName;\n    if (tag !== 'INPUT' && tag !== 'SELECT' && tag !== 'TEXTAREA') return null;\n    let sel = '';\n    if (a.dataset && a.dataset.assetId && a.classList.contains('nx-editable-input')) {\n      sel = '.nx-editable-input[data-asset-id=\"' + (window.CSS && CSS.escape ? CSS.escape(a.dataset.assetId) : a.dataset.assetId) + '\"]';\n    } else if (a.dataset && a.dataset.filter) {\n      sel = '[data-filter=\"' + a.dataset.filter + '\"]';\n    } else if (a.id) {\n      sel = '#' + (window.CSS && CSS.escape ? CSS.escape(a.id) : a.id);\n    } else {\n      return null;\n    }\n    let start = null, end = null;\n    try { start = a.selectionStart; end = a.selectionEnd; } catch (e) {}\n    return { sel: sel, start: start, end: end };\n  }\n\n  function restoreFocus(container, info) {\n    if (!info || !info.sel || !container) return;\n    const el = container.querySelector(info.sel);\n    if (!el) return;\n    if (el === document.activeElement) return;\n    try { el.focus({ preventScroll: true }); } catch (e) { try { el.focus(); } catch (e2) {} }\n    if (info.start != null) {\n      try { el.setSelectionRange(info.start, info.end != null ? info.end : info.start); } catch (e) {}\n    }\n  }\n\n  // Em qual aba um modal deve ser renderizado (deriva do tipo do modal).\n  function modalHostOf(m) {\n    if (!m) return null;\n    return (m.type === 'addTx' || m.type === 'editTx') ? 'tx' : 'assets';\n  }\n\n  function renderTxPage() {\n    if (!_txContainer) return;\n    const _focus = captureFocus(_txContainer);\n    const assets = getAssets();\n    const allTxs = getTxs();\n    _txContainer.innerHTML = renderTxHeader() +\n      renderFilters(assets) +\n      renderTransactionsSection(assets, allTxs) +\n      (modalHostOf(state.modal) === 'tx' ? renderModal(assets) : '') +\n      renderConfirmModal();\n    attachEventListeners(_txContainer);\n    restoreFocus(_txContainer, _focus);\n  }\n\n  function renderAssetsPage() {\n    if (!_assetsContainer) return;\n    const _focus = captureFocus(_assetsContainer);\n    const assets = getAssets();\n    const allTxs = getTxs();\n    _assetsContainer.innerHTML = renderAssetsHeader() +\n      renderAssetsSection(assets, allTxs) +\n      (modalHostOf(state.modal) === 'assets' ? renderModal(assets) : '') +\n      renderClosePositionModal(assets, allTxs);\n    attachEventListeners(_assetsContainer);\n    restoreFocus(_assetsContainer, _focus);\n  }\n\n  // Mutações de assets/txs re-renderizam as duas abas (se já montadas), síncrono.\n  function renderAll() { renderTxPage(); renderAssetsPage(); }\n  function renderHost(host) { if (host === 'assets') renderAssetsPage(); else renderTxPage(); }\n\n  function renderTxHeader() {\n    return `\n      <div class=\"nx-page-header\">\n        <div class=\"nx-page-header-left\">\n          <h1>Investments Transactions<\/h1>\n          <p>Track your portfolio assets and transaction history<\/p>\n        <\/div>\n        <div class=\"nx-header-btns\">\n          <button class=\"nx-btn nx-btn-primary\" data-action=\"open-add-tx\">+ Add transaction<\/button>\n        <\/div>\n      <\/div>`;\n  }\n\n  function renderAssetsHeader() {\n    return `\n      <div class=\"nx-page-header\">\n        <div class=\"nx-page-header-left\">\n          <h1>Assets<\/h1>\n          <p>Update current values and manage open and closed positions<\/p>\n        <\/div>\n        <div class=\"nx-header-btns\">\n          <button class=\"nx-btn nx-btn-primary\" data-action=\"open-new-asset\">+ New asset<\/button>\n        <\/div>\n      <\/div>`;\n  }\n\n  function renderFilters(assets) {\n    const s = state;\n    const chips = [\n      { key: 'all', label: 'All types', dot: '#aaa' },\n      { key: 'buy', label: 'Buy', dot: 'var(--buy)' },\n      { key: 'sell', label: 'Sell', dot: 'var(--sell)' },\n      { key: 'income-div', label: 'Dividend', dot: 'var(--div)' },\n      { key: 'income-coup', label: 'Coupon', dot: 'var(--coup)' },\n      { key: 'adjustment', label: 'Adjustment', dot: 'var(--adj)' },\n    ];\n    const assetOptions = assets.map(a => `<option value=\"${escHtml(a.id)}\" ${s.assetId === a.id ? 'selected' : ''}>${escHtml(a.name)}${a.ticker ? ' (' + escHtml(a.ticker) + ')' : ''}<\/option>`).join('');\n    return `\n      <div class=\"nx-filter-card\">\n        <div class=\"nx-filter-grid\">\n          <div class=\"nx-filter-field\">\n            <label>From date<\/label>\n            <input type=\"date\" data-filter=\"from\" value=\"${escHtml(s.from)}\" />\n          <\/div>\n          <div class=\"nx-filter-field\">\n            <label>To date<\/label>\n            <input type=\"date\" data-filter=\"to\" value=\"${escHtml(s.to)}\" />\n          <\/div>\n          <div class=\"nx-filter-field\">\n            <label>Asset<\/label>\n            <select data-filter=\"assetId\">\n              <option value=\"\">All assets<\/option>\n              ${assetOptions}\n            <\/select>\n          <\/div>\n          <div class=\"nx-filter-field\">\n            <label>Search<\/label>\n            <input type=\"text\" data-filter=\"search\" value=\"${escHtml(s.search)}\" placeholder=\"Ticker or note…\" />\n          <\/div>\n        <\/div>\n        <div class=\"nx-chips\">\n          ${chips.map(c => `<span class=\"nx-chip ${s.typeFilter === c.key ? 'nx-chip-active' : ''}\" data-action=\"type-filter\" data-val=\"${escHtml(c.key)}\"><span class=\"nx-chip-dot\" style=\"background:${c.dot}\"><\/span>${escHtml(c.label)}<\/span>`).join('')}\n          <button class=\"nx-clear-btn\" data-action=\"clear-filters\">Clear all<\/button>\n        <\/div>\n      <\/div>`;\n  }\n\n  function sortAssetsForView(list, allTxs, view) {\n    const s = state.assetSort;\n    if (s === 'default') return list;\n    const txsOf = a => allTxs.filter(t => t.assetId === a.id);\n    const val = a => (view === 'closed')\n      ? calcRealized(a, txsOf(a)).realized\n      : calcPosition(a, calcQty(txsOf(a)));\n    const byName = (a, b) => String(a.name || '').localeCompare(String(b.name || ''), 'pt-BR', { sensitivity: 'base' });\n    const arr = list.slice();\n    if (s === 'class') arr.sort((a, b) => String(a.assetClass || '').localeCompare(String(b.assetClass || '')) || byName(a, b));\n    else if (s === 'value') arr.sort((a, b) => val(b) - val(a));\n    else if (s === 'name') arr.sort(byName);\n    return arr;\n  }\n\n  function renderAssetsControls() {\n    const known = ASSET_CLASSES.slice();\n    getAssets().forEach(a => { if (a.assetClass && known.indexOf(a.assetClass) < 0) known.push(a.assetClass); });\n    const sorts = [['default', 'Default'], ['class', 'Class (A–Z)'], ['value', 'Value (high–low)'], ['name', 'Name (A–Z)']];\n    return `\n      <div class=\"nx-assets-controls\">\n        <div class=\"nx-filter-field\"><label>Class<\/label>\n          <select data-afilter=\"assetClassFilter\">\n            <option value=\"all\" ${state.assetClassFilter === 'all' ? 'selected' : ''}>All classes<\/option>\n            ${known.map(c => `<option value=\"${escHtml(c)}\" ${state.assetClassFilter === c ? 'selected' : ''}>${escHtml(c)}<\/option>`).join('')}\n          <\/select><\/div>\n        <div class=\"nx-filter-field\"><label>Sort by<\/label>\n          <select data-afilter=\"assetSort\">\n            ${sorts.map(([v, l]) => `<option value=\"${v}\" ${state.assetSort === v ? 'selected' : ''}>${l}<\/option>`).join('')}\n          <\/select><\/div>\n      <\/div>`;\n  }\n\n  function renderAssetsSection(assets, allTxs) {\n    const view = getAssetView();\n\n    // Backfill de closedAt para exibição quando a flag se perdeu (só em memória).\n    assets.forEach(a => {\n      if (!a.closedAt) { const ct = closingTxFor(a, allTxs); if (ct) a.closedAt = ct.date; }\n    });\n    const allClosed = assets.filter(a => isClosedAsset(a, allTxs));\n    const allActive = assets.filter(a => !isClosedAsset(a, allTxs));\n    const cls = state.assetClassFilter;\n    const filterCls = list => (cls === 'all') ? list : list.filter(a => (a.assetClass || '') === cls);\n    const closedAssets = sortAssetsForView(filterCls(allClosed), allTxs, 'closed');\n    const activeAssets = sortAssetsForView(filterCls(allActive), allTxs, 'active');\n\n    // Pill calculado com o conjunto certo desde o primeiro paint (sem flick).\n    let pill;\n    if (view === 'active') {\n      const totalActive = calcPortfolioTotal(activeAssets);\n      pill = `${activeAssets.length} asset${activeAssets.length !== 1 ? 's' : ''} · R$ ${fmtBR(totalActive)}`;\n    } else {\n      let totalRealized = 0;\n      closedAssets.forEach(a => {\n        totalRealized += calcRealized(a, allTxs.filter(t => t.assetId === a.id)).realized;\n      });\n      const sign = totalRealized >= 0 ? '+' : '−';\n      pill = `${closedAssets.length} closed · ${sign}R$ ${fmtBR(Math.abs(totalRealized))} realized`;\n    }\n\n    const arrow = state.showAssets ? '▲' : '▼';\n    let body = '';\n    if (state.showAssets) {\n      if (view === 'active') {\n        if (!assets.length) {\n          body = `<div class=\"nx-empty\"><div class=\"nx-empty-icon\">📊<\/div><h3>No assets yet<\/h3><p>Add your first investment asset to start tracking.<\/p><button class=\"nx-btn nx-btn-primary\" data-action=\"open-new-asset\">+ New asset<\/button><\/div>`;\n        } else if (!activeAssets.length) {\n          body = cls !== 'all'\n            ? `<div class=\"cpx-empty\">No open ${escHtml(cls)} positions.<\/div>`\n            : `<div class=\"cpx-empty\">${allClosed.length ? 'No open positions. Your closed positions are under the \"Closed\" tab.' : 'No open positions yet.'}<\/div>`;\n        } else {\n          // % de alocação sempre relativo à carteira ativa COMPLETA, mesmo com filtro de classe\n          const portfolioTotal = calcPortfolioTotal(allActive);\n          body = `<div class=\"nx-asset-grid\">${activeAssets.map(a => renderAssetCard(a, allTxs.filter(t => t.assetId === a.id), portfolioTotal)).join('')}<\/div>`;\n        }\n      } else {\n        if (!closedAssets.length) {\n          body = cls !== 'all' && allClosed.length\n            ? `<div class=\"cpx-empty\">No closed ${escHtml(cls)} positions.<\/div>`\n            : `<div class=\"cpx-empty\">No closed positions yet. Use \"Close position\" on an asset to record a full sale.<\/div>`;\n        } else {\n          body = `<div class=\"nx-asset-grid cpx-closed-grid\">${closedAssets.map(a => {\n            const txs = allTxs.filter(t => t.assetId === a.id);\n            return closedCardHTML(a, txs, calcRealized(a, txs));\n          }).join('')}<\/div>`;\n        }\n      }\n    }\n    return `\n      <div class=\"nx-section\">\n        <div class=\"nx-section-header\">\n          <h2 class=\"nx-section-title\">Assets<\/h2>\n          <span class=\"nx-pill\">${escHtml(pill)}<\/span>\n          <div class=\"cpx-toggle\">\n            <button class=\"cpx-v ${view === 'active' ? 'active' : ''}\" data-action=\"set-asset-view\" data-val=\"active\">Active<\/button>\n            <button class=\"cpx-v ${view === 'closed' ? 'active' : ''}\" data-action=\"set-asset-view\" data-val=\"closed\">Closed<\/button>\n          <\/div>\n          <button class=\"nx-collapse-btn\" data-action=\"toggle-assets\">${arrow}<\/button>\n        <\/div>\n        ${state.showAssets ? renderAssetsControls() : ''}\n        ${body}\n      <\/div>`;\n  }\n\n  function renderAssetCard(asset, txs, portfolioTotal) {\n    const fi = isFixedIncome(asset.assetClass);\n    const qty = calcQty(txs);\n    const txCount = txs.filter(t => t.type === 'buy' || t.type === 'sell').length;\n\n    // Para fundos/renda fixa: usa capital líquido investido\n    // Para ETFs: usa preço médio ponderado por cota\n    const netInvested = fi ? calcNetInvested(txs) : 0;\n    const avgPrice    = fi ? 0 : calcAvgPrice(txs, asset.assetClass);\n\n    // Renda fixa (cupons) e renda variável (dividendos): inclui rendimentos recebidos no Total P/L\n    const totalIncome = txs.filter(t => t.type === 'income').reduce((s, t) => s + (parseFloat(t.amount) || 0), 0);\n\n    const position  = calcPosition(asset, qty);\n\n    // Para fi: Total P/L = (valor atual − capital líquido) + rendimentos recebidos\n    // Para ETF: Unrealized P/L = (preço atual − preço médio) × qtd\n    const unrealizedPL = fi\n      ? calcPL(asset, netInvested, qty)\n      : calcPL(asset, avgPrice, qty);\n    const pl = unrealizedPL + totalIncome;\n\n    const plBase    = fi ? netInvested : calcTotalCost(txs, asset.assetClass);\n    const plPct     = plBase ? (pl / plBase * 100) : 0;\n    const allocation = portfolioTotal ? (position / portfolioTotal * 100) : 0;\n    const totalCost = fi ? netInvested : calcTotalCost(txs, asset.assetClass);\n\n    // Label: \"Total P/L\" quando há rendimentos (cupons/dividendos), senão \"Unrealized P/L\"\n    const plLabel = (fi || totalIncome > 0) ? 'Total P/L' : 'Unrealized P/L';\n    // Subtítulo: mostra quanto veio de rendimentos recebidos\n    const plSub = (totalIncome > 0)\n      ? `incl. R$ ${fmtBR(totalIncome)} income`\n      : '';\n\n    const plCls  = pl >= 0 ? 'nx-stat-buy' : 'nx-stat-sell';\n    const plSign = pl >= 0 ? '+' : '';\n\n    // Editable state\n    const es = editState[asset.id] || (editState[asset.id] = { raw: fmtBR(asset.manualUnitPrice || 0), dirty: false, justSaved: false });\n    let subText = '';\n    if (es.dirty) {\n      subText = `<span class=\"nx-stat-accent\">Press Enter or ✓ to save<\/span>`;\n    } else if (es.justSaved) {\n      subText = `<span class=\"nx-stat-buy\">✓ Saved · recalculated<\/span>`;\n    } else {\n      const upd = asset.priceUpdatedAt ? 'Last updated · ' + relativeDate(asset.priceUpdatedAt) : 'Not yet updated';\n      subText = `<span>${escHtml(upd)}<\/span>`;\n    }\n\n    const editLabel = fi ? 'Current total value' : 'Current unit price';\n    const footerLeft = fi\n      ? `Net invested · R$ ${fmtBR(netInvested)}`\n      : `Cost basis · R$ ${fmtBR(totalCost)}`;\n    const footerRight = fi\n      ? 'Editable value = total net position'\n      : 'Editable value = unit price per share';\n\n    // Stat 3: \"Capital investido\" (fi) ou \"Avg unit price\" (ETF)\n    const avgLabel = fi ? 'Capital invested' : 'Avg unit price';\n    const avgValue = fi ? fmtBR(netInvested) : fmtBR(avgPrice);\n    const avgSub = fi\n      ? `${txCount} transaction${txCount !== 1 ? 's' : ''}`\n      : `${fmtQty(qty)} shares · ${txCount} tx`;\n\n    const couponBtn = fi\n      ? `<button class=\"nx-btn nx-btn-outline nx-btn-sm\" data-action=\"open-coupon\" data-asset-id=\"${escHtml(asset.id)}\">+ Coupon<\/button>`\n      : (asset.assetClass !== 'Cash' ? `<button class=\"nx-btn nx-btn-outline nx-btn-sm\" data-action=\"open-dividend\" data-asset-id=\"${escHtml(asset.id)}\">+ Dividend<\/button>` : '');\n\n    return `\n      <div class=\"nx-asset-card nx-asset-card-compact\" data-asset-id=\"${escHtml(asset.id)}\">\n        <div class=\"nx-ac-top\">\n          <div class=\"nx-ac-ident\">\n            <span class=\"nx-ac-name\">${escHtml(asset.name)}<\/span>\n            <span class=\"nx-asset-class-badge\" style=\"background:${nxClassColor(asset.assetClass)}1f;color:${nxClassColor(asset.assetClass)};\">${escHtml(asset.assetClass || '')}<\/span>\n            ${(asset.ticker || asset.issuer) ? `<span class=\"nx-ac-meta\">${asset.ticker ? escHtml(asset.ticker) : ''}${asset.issuer ? (asset.ticker ? ' · ' : '') + escHtml(asset.issuer) : ''}<\/span>` : ''}\n          <\/div>\n          <div class=\"nx-ac-menu-wrap\">\n            <button class=\"nx-ac-menu-btn\" data-action=\"toggle-asset-menu\" data-asset-id=\"${escHtml(asset.id)}\" aria-label=\"Actions\">⋯<\/button>\n            ${state.openMenu === asset.id ? `\n            <div class=\"nx-ac-menu\">\n              <button data-action=\"add-tx-for-asset\" data-asset-id=\"${escHtml(asset.id)}\">＋ Add transaction<\/button>\n              <button data-action=\"open-edit-asset\" data-asset-id=\"${escHtml(asset.id)}\">Edit asset<\/button>\n              ${fi ? `<button data-action=\"open-coupon\" data-asset-id=\"${escHtml(asset.id)}\">＋ Add coupon<\/button>` : (asset.assetClass !== 'Cash' ? `<button data-action=\"open-dividend\" data-asset-id=\"${escHtml(asset.id)}\">＋ Add dividend<\/button>` : '')}\n              <button class=\"nx-ac-menu-danger\" data-action=\"open-close-position\" data-asset-id=\"${escHtml(asset.id)}\">⊘ Close position<\/button>\n            <\/div>` : ''}\n          <\/div>\n        <\/div>\n        <div class=\"nx-ac-stats\">\n          <div class=\"nx-ac-stat\">\n            <div class=\"nx-stat-label\">Current position<\/div>\n            <div class=\"nx-stat-value\">R$ ${fmtBR(position)}<span class=\"nx-alloc-chip\">${fmtBR(allocation, 1)}%<\/span><\/div>\n            <div class=\"nx-stat-sub\">${fi ? 'Net position' : fmtQty(qty) + ' shares'}<\/div>\n          <\/div>\n          <div class=\"nx-ac-stat\">\n            <div class=\"nx-stat-label\">${avgLabel}<\/div>\n            <div class=\"nx-stat-value\">R$ ${avgValue}<\/div>\n            <div class=\"nx-stat-sub\">${escHtml(avgSub)}<\/div>\n          <\/div>\n          <div class=\"nx-ac-stat\">\n            <div class=\"nx-stat-label\">${escHtml(plLabel)}<\/div>\n            <div class=\"nx-stat-value ${plCls}\">${plSign}R$ ${fmtBR(Math.abs(pl))}<\/div>\n            <div class=\"nx-stat-sub ${plCls}\">${plSign}${fmtBR(Math.abs(plPct), 1)}%${plSub ? ' · ' + escHtml(plSub) : ''}<\/div>\n          <\/div>\n          <div class=\"nx-ac-stat nx-ac-price\">\n            <div class=\"nx-stat-label\">${escHtml(editLabel)}<\/div>\n            <div class=\"nx-editable-wrap\">\n              <div class=\"nx-editable-input-row\">\n                <span class=\"nx-editable-prefix\">R$<\/span>\n                <input class=\"nx-editable-input\" type=\"text\" data-action=\"price-input\" data-asset-id=\"${escHtml(asset.id)}\" value=\"${escHtml(es.raw)}\" inputmode=\"decimal\" />\n                <button class=\"nx-editable-confirm\" data-action=\"price-save\" data-asset-id=\"${escHtml(asset.id)}\" ${es.dirty ? '' : 'disabled'}>✓<\/button>\n              <\/div>\n              <div class=\"nx-editable-sub\">${subText}<\/div>\n            <\/div>\n          <\/div>\n        <\/div>\n        <div class=\"nx-ac-allocbar\"><span style=\"width:${Math.max(1, Math.min(100, allocation))}%;\"><\/span><\/div>\n      <\/div>`;\n  }\n\n  // Card de posição encerrada (absorvido do cpx.js — mesmo markup/classes).\n  function closedCardHTML(asset, txs, r) {\n    const plCls = r.realized >= 0 ? 'cpx-pos' : 'cpx-neg';\n    const plSign = r.realized >= 0 ? '+' : '−';\n    const pct = r.cost ? (r.realized / r.cost * 100) : 0;\n    const meta = (asset.ticker ? escHtml(asset.ticker) : '') +\n      (asset.closedAt ? (asset.ticker ? ' · ' : '') + 'closed ' + fmtDate(asset.closedAt) : '');\n    return `\n      <div class=\"nx-asset-card\" data-asset-id=\"${escHtml(asset.id)}\" style=\"opacity:.96;\">\n        <div class=\"nx-asset-card-header\">\n          <div>\n            <div class=\"nx-asset-card-name\">${escHtml(asset.name)}<span class=\"nx-asset-class-badge\">${escHtml(asset.assetClass || '')}<\/span><span class=\"cpx-closed-badge\">Closed<\/span><\/div>\n            <div class=\"nx-asset-card-meta\">${meta}<\/div>\n          <\/div>\n          <div class=\"nx-asset-actions\">\n            <button class=\"nx-btn nx-btn-outline nx-btn-sm\" data-action=\"reopen-asset\" data-asset-id=\"${escHtml(asset.id)}\">↺ Reopen<\/button>\n          <\/div>\n        <\/div>\n        <div class=\"nx-stats-grid\">\n          <div class=\"nx-stat\"><div class=\"nx-stat-label\">Total invested<\/div><div class=\"nx-stat-value\">R$ ${fmtBR(r.cost)}<\/div><\/div>\n          <div class= on renderTransactionsSection(assets, allTxs) {\n    const filtered = filterTxs(allTxs, assets);\n    const count = filtered.length;\n    const isCards = state.view === 'cards';\n    return `\n      <div class=\"nx-section\">\n        <div class=\"nx-section-header\">\n          <h2 class=\"nx-section-title\">Transactions<\/h2>\n          <span class=\"nx-pill\">${count} transaction${count !== 1 ? 's' : ''}<\/span>\n          <div class=\"nx-section-view-toggle\">\n            <button class=\"nx-vt-btn ${!isCards ? 'active' : ''}\" data-action=\"set-view\" data-val=\"table\">Table<\/button>\n            <button class=\"nx-vt-btn ${isCards ? 'active' : ''}\" data-action=\"set-view\" data-val=\"cards\">Cards<\/button>\n          <\/div>\n        <\/div>\n        ${isCards ? renderCardsView(filtered, assets) : renderTableView(filtered, assets)}\n      <\/div>`;\n  }\n\n  function renderTableView(filtered, assets) {\n    if (!filtered.length) {\n      return `<div class=\"nx-table-wrap\"><div class=\"nx-table-empty\">No transactions match these filters · <a data-action=\"clear-filters\">Clear filters<\/a><\/div><\/div>`;\n    }\n    const assetMap = {};\n    assets.forEach(a => { assetMap[a.id] = a; });\n\n    // group by month descending\n    const groups = {};\n    filtered.forEach(tx => {\n      const k = monthKey(tx.date);\n      if (!groups[k]) groups[k] = [];\n      groups[k].push(tx);\n    });\n    const sortedKeys = Object.keys(groups).sort((a, b) => b.localeCompare(a));\n\n    let html = '<div class=\"nx-table-wrap\">';\n    html += '<table class=\"nx-table\"><thead><tr>' +\n      '<th>Type<\/th><th>Asset<\/th><th>Date<\/th><th>Qty<\/th><th>Unit price<\/th><th>Total<\/th><th>Note<\/th><th><\/th>' +\n      '<\/tr><\/thead><tbody>';\n\n    sortedKeys.forEach(key => {\n      const txs = groups[key];\n      const sorted = [...txs].sort((a, b) => b.date.localeCompare(a.date));\n      // month net\n      const net = sorted.reduce((s, tx) => {\n        const a = assetMap[tx.assetId];\n        const t = txTotal(tx, a ? a.assetClass : 'ETF');\n        if (tx.type === 'buy') return s - t;\n        if (tx.type === 'sell' || tx.type === 'income') return s + t;\n        return s;\n      }, 0);\n      const netSign = net >= 0 ? '+' : '';\n      const lbl = monthLabel(key + '-01');\n      html += `<tr><td colspan=\"8\" style=\"padding:0;\"><div class=\"nx-month-header\"><span class=\"nx-month-label\">${escHtml(lbl)}<\/span><span class=\"nx-month-meta\">Net: ${netSign}R$ ${fmtBR(Math.abs(net))} · ${sorted.length} transaction${sorted.length !== 1 ? 's' : ''}<\/span><\/div><\/td><\/tr>`;\n\n      sorted.forEach(tx => {\n        const asset = assetMap[tx.assetId];\n        const ac = asset ? asset.assetClass : 'ETF';\n        const badge = badgeInfo(tx, ac);\n        const total = txTotal(tx, ac);\n        const totalCls = totalClass(tx.type);\n        const sign = totalSign(tx.type);\n        const unitPrice = (tx.type === 'buy' || tx.type === 'sell') ? 'R$ ' + fmtBR(parseFloat(tx.amount) || 0) : '—';\n        const qty = (tx.type === 'buy' || tx.type === 'sell') ? fmtQty(parseFloat(tx.quantity) || 0) : '—';\n        html += `<tr>\n          <td><span class=\"nx-type-badge ${badge.cls}\"><span class=\"nx-chip-dot\" style=\"background:${badge.dot}\"><\/span>${escHtml(badge.label)}<\/span><\/td>\n          <td><div class=\"nx-asset-name-cell\">${escHtml(asset ? asset.name : tx.assetId)}<div class=\"nx-asset-ticker-meta\">${asset && asset.ticker ? escHtml(asset.ticker) + ' · ' : ''}${escHtml(ac)}<\/div><\/div><\/td>\n          <td><div class=\"nx-date-main\">${fmtDate(tx.date)}<\/div><div class=\"nx-date-sub\">${txRelativeDate(tx.date)}<\/div><\/td>\n          <td>${qty}<\/td>\n          <td>${unitPrice}<\/td>\n          <td><span class=\"${totalCls}\">${sign}R$ ${fmtBR(total)}<\/span><\/td>\n          <td><span class=\"nx-note-cell\" title=\"${escHtml(tx.notes || '')}\">${escHtml(tx.notes || '')}<\/span><\/td>\n          <td><div class=\"nx-table-actions\">\n            <button class=\"nx-tbl-icon-btn\" data-action=\"edit-tx\" data-tx-id=\"${escHtml(tx.id)}\" title=\"Edit\">✏️<\/button>\n            <button class=\"nx-tbl-icon-btn nx-danger\" data-action=\"delete-tx\" data-tx-id=\"${escHtml(tx.id)}\" title=\"Delete\">🗑️<\/button>\n          <\/div><\/td>\n        <\/tr>`;\n      });\n    });\n\n    html += '<\/tbody><\/table><\/div>';\n    return html;\n  }\n\n  function renderCardsView(filtered, assets) {\n    if (!filtered.length) {\n      return `<div class=\"nx-table-wrap\"><div class=\"nx-table-empty\">No transactions match these filters · <a data-action=\"clear-filters\">Clear filters<\/a><\/div><\/div>`;\n    }\n    const assetMap = {};\n    assets.forEach(a => { assetMap[a.id] = a; });\n\n    const groups = {};\n    filtered.forEach(tx => {\n      const k = monthKey(tx.date);\n      if (!groups[k]) groups[k] = [];\n      groups[k].push(tx);\n    });\n    const sortedKeys = Object.keys(groups).sort((a, b) => b.localeCompare(a));\n\n    let html = '';\n    sortedKeys.forEach(key => {\n      const txs = [...groups[key]].sort((a, b) => b.date.localeCompare(a.date));\n      const lbl = monthLabel(key + '-01');\n      html += `<div class=\"nx-month-section\">\n        <div class=\"nx-month-header\" style=\"border-radius:10px;margin-bottom:10px;\"><span class=\"nx-month-label\">${escHtml(lbl)}<\/span><span class=\"nx-month-meta\">${txs.length} transaction${txs.length !== 1 ? 's' : ''}<\/span><\/div>\n        <div class=\"nx-cards-grid\">`;\n      txs.forEach(tx => {\n        const asset = assetMap[tx.assetId];\n        const ac = asset ? asset.assetClass : 'ETF';\n        const badge = badgeInfo(tx, ac);\n        const total = txTotal(tx, ac);\n        const sign = totalSign(tx.type);\n        html += `<div class=\"nx-tx-card\">\n          <div class=\"nx-tx-card-header\">\n            <span class=\"nx-type-badge ${badge.cls}\"><span class=\"nx-chip-dot\" style=\"background:${badge.dot}\"><\/span>${esc
