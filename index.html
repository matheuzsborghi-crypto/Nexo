    .cpx-err{display:none;color:#C25450;font-size:13px;margin-bottom:10px;}
    .cpx-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:6px;}
    .cpx-btn{cursor:pointer;border-radius:8px;padding:9px 16px;font-size:13px;font-weight:600;font-family:inherit;border:1px solid transparent;}
    .cpx-btn-ghost{background:transparent;border-color:var(--border,#e8e8e8);color:var(--text-secondary,#6b6b6b);}
    .cpx-btn-primary{background:var(--accent,#E07A5F);color:#fff;}
    .cpx-btn-danger{background:#C25450;color:#fff;}
  `;

  let _styleEl = null;
  function injectCSS() {
    if (_styleEl) return;
    _styleEl = document.createElement('style');
    _styleEl.id = 'nx-it-styles';
    _styleEl.textContent = CSS;
    document.head.appendChild(_styleEl);
  }

  // ── 2. HELPERS ──────────────────────────────────────────────────────────
  function fmtBR(n, decimals = 2) {
    if (n == null || isNaN(n)) return '—';
    return new Intl.NumberFormat('pt-BR', { minimumFractionDigits: decimals, maximumFractionDigits: decimals }).format(n);
  }
  function fmtQty(n) {
    if (n == null || isNaN(n)) return '—';
    return new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 0, maximumFractionDigits: 6 }).format(n);
  }
  function parseBR(str) {
    if (typeof str === 'number') return str;
    return parseFloat(String(str).replace(/\./g, '').replace(',', '.')) || 0;
  }
  function fmtDate(str) {
    if (!str) return '—';
    const d = new Date(str + (str.length === 10 ? 'T00:00:00' : ''));
    return d.toLocaleDateString('pt-BR');
  }
  function relativeDate(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    const now = Date.now();
    const diff = now - d.getTime();
    const days = Math.floor(diff / 86400000);
    if (days === 0) return 'today';
    if (days === 1) return 'yesterday';
    if (days < 30) return days + ' days ago';
    const months = Math.floor(days / 30);
    if (months < 12) return months + (months === 1 ? ' month ago' : ' months ago');
    const years = Math.floor(months / 12);
    return years + (years === 1 ? ' year ago' : ' years ago');
  }
  function txRelativeDate(str) {
    if (!str) return '';
    const d = new Date(str + 'T00:00:00');
    const now = Date.now();
    const diff = now - d.getTime();
    const days = Math.floor(diff / 86400000);
    if (days === 0) return 'today';
    if (days === 1) return 'yesterday';
    return days + ' days ago';
  }
  function generateId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }
  function monthLabel(dateStr) {
    if (!dateStr) return 'Unknown';
    const d = new Date(dateStr + 'T00:00:00');
    return d.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
  }
  function monthKey(dateStr) {
    if (!dateStr) return '0000-00';
    return dateStr.slice(0, 7);
  }
  function escHtml(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── 3. DATA LAYER ────────────────────────────────────────────────────────
  const ASSETS_KEY = 'nexo_investment_assets';
  const TXS_KEY = 'nexo_investment_transactions';
  const VIEW_KEY = 'nexo:investments:txView';

  function getAssets() {
    try { return JSON.parse(localStorage.getItem(ASSETS_KEY) || '[]'); } catch { return []; }
  }
  function getTxs() {
    try { return JSON.parse(localStorage.getItem(TXS_KEY) || '[]'); } catch { return []; }
  }

  // ── Gist sync helpers ──────────────────────────────────────────────────────
  // O Gist usa o formato: { meta:{...}, data:{ ..., investmentAssets:[...], investmentTransactions:[...] } }
  // O interceptor fetch() já cuida da autenticação — basta chamar /api/sync/data.

  async function loadFromGist() {
    try {
      const resp = await fetch('/api/sync/data');
      if (!resp.ok) return;
      const json = await resp.json();
      const d = json && json.payload && json.payload.data;
      if (!d) return;
      if (Array.isArray(d.investmentAssets))
        localStorage.setItem(ASSETS_KEY, JSON.stringify(d.investmentAssets));
      if (Array.isArray(d.investmentTransactions))
        localStorage.setItem(TXS_KEY, JSON.stringify(d.investmentTransactions));
    } catch (e) {
      console.warn('[Nexo IT] loadFromGist failed:', e);
    }
  }

  async function syncToGist(assets, txs) {
    try {
      const resp = await fetch('/api/sync/data');
      if (!resp.ok) return;
      const json = await resp.json();
      if (!json || !json.payload) return;
      const payload = json.payload;
      if (!payload.data) payload.data = {};
      payload.data.investmentAssets = assets;
      payload.data.investmentTransactions = txs;
      if (!payload.meta) payload.meta = {};
      payload.meta.updatedAt = new Date().toISOString();
      await fetch('/api/sync/data', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
    } catch (e) {
      console.warn('[Nexo IT] syncToGist failed:', e);
    }
  }

  function saveAssets(arr) {
    localStorage.setItem(ASSETS_KEY, JSON.stringify(arr));
    syncToGist(arr, getTxs());
  }
  function saveTxs(arr) {
    localStorage.setItem(TXS_KEY, JSON.stringify(arr));
    syncToGist(getAssets(), arr);
  }
  function saveAsset(asset) {
    const arr = getAssets();
    const idx = arr.findIndex(a => a.id === asset.id);
    if (idx >= 0) arr[idx] = asset; else arr.push(asset);
    saveAssets(arr);
  }

  // ── Closed positions: view state + persistência atômica (absorvido do cpx.js) ──
  const CPX_VIEW_KEY = 'nexo:cpx:assetView'; // mesma chave usada pelo cpx.js
  function getAssetView() { return localStorage.getItem(CPX_VIEW_KEY) === 'closed' ? 'closed' : 'active'; }
  function setAssetView(v) { localStorage.setItem(CPX_VIEW_KEY, v === 'closed' ? 'closed' : 'active'); }

  // Grava assets+txs juntos com UM único sync ao Gist (idêntico ao persist() do cpx;
  // evita dois PUTs concorrentes que saveAssets+saveTxs em sequência causariam).
  function persist(assets, txs) {
    localStorage.setItem(ASSETS_KEY, JSON.stringify(assets));
    localStorage.setItem(TXS_KEY, JSON.stringify(txs));
    syncToGist(assets, txs);
  }

  // Mesmo formato de id que o cpx.js usava para a transação de encerramento.
  function cpxUid() {
    return 'cpx-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
  }

  // ── 4. CALCULATIONS ──────────────────────────────────────────────────────
  const FIXED_INCOME = new Set(['CDB', 'LCI', 'LCA', 'Fund']);

  function isFixedIncome(assetClass) { return FIXED_INCOME.has(assetClass); }

  function txTotal(tx, assetClass) {
    if (tx.type === 'buy' || tx.type === 'sell') {
      if (isFixedIncome(assetClass)) return parseFloat(tx.amount) || 0;
      return (parseFloat(tx.amount) || 0) * (parseFloat(tx.quantity) || 0);
    }
    return parseFloat(tx.amount) || 0;
  }

  function calcAvgPrice(txs, assetClass) {
    const buys = txs.filter(t => t.type === 'buy');
    if (!buys.length) return 0;
    if (isFixedIncome(assetClass)) {
      const totalAmt = buys.reduce((s, t) => s + (parseFloat(t.amount) || 0), 0);
      const totalQty = buys.reduce((s, t) => s + (parseFloat(t.quantity) || 1), 0);
      return totalQty ? totalAmt / totalQty : 0;
    } else {
      const totalCost = buys.reduce((s, t) => s + (parseFloat(t.amount) || 0) * (parseFloat(t.quantity) || 0), 0);
      const totalQty = buys.reduce((s, t) => s + (parseFloat(t.quantity) || 0), 0);
      return totalQty ? totalCost / totalQty : 0;
    }
  }

  function calcQty(txs) {
    return txs.filter(t => t.type === 'buy' || t.type === 'sell').reduce((s, t) => {
      const q = parseFloat(t.quantity) || 0;
      return t.type === 'buy' ? s + q : s - q;
    }, 0);
  }

  function calcTotalCost(txs, assetClass) {
    const buys = txs.filter(t => t.type === 'buy');
    if (isFixedIncome(assetClass)) {
      return buys.reduce((s, t) => s + (parseFloat(t.amount) || 0), 0);
    } else {
      return buys.reduce((s, t) => s + (parseFloat(t.amount) || 0) * (parseFloat(t.quantity) || 0), 0);
    }
  }

  // Para fundos/renda fixa: capital líquido investido = Σ(buys) − Σ(sells)
  function calcNetInvested(txs) {
    const totalBuys  = txs.filter(t => t.type === 'buy' ).reduce((s, t) => s + (parseFloat(t.amount) || 0), 0);
    const totalSells = txs.filter(t => t.type === 'sell').reduce((s, t) => s + (parseFloat(t.amount) || 0), 0);
    return totalBuys - totalSells;
  }

  function calcPosition(asset, qty) {
    const price = parseFloat(asset.manualUnitPrice) || 0;
    if (isFixedIncome(asset.assetClass)) return price;
    return price * qty;
  }

  function calcPL(asset, avgPriceOrNet, qty) {
    const price = parseFloat(asset.manualUnitPrice) || 0;
    if (isFixedIncome(asset.assetClass)) {
      // avgPriceOrNet é netInvested para renda fixa/fundos
      return price - avgPriceOrNet;
    } else {
      return (price - avgPriceOrNet) * qty;
    }
  }

  function calcPortfolioTotal(assets) {
    return assets.reduce((s, asset) => {
      const txs = getTxs().filter(t => t.assetId === asset.id);
      const qty = calcQty(txs);
      return s + calcPosition(asset, qty);
    }, 0);
  }

  // ── Matemática de posições encerradas (absorvido do cpx.js) ───────────────
  // Proceeds de todas as vendas registradas (cost basis já é calcTotalCost).
  function calcProceeds(asset, txs) {
    const fi = isFixedIncome(asset.assetClass);
    return txs.filter(t => t.type === 'sell').reduce((s, t) => {
      const amt = parseFloat(t.amount) || 0;
      const q = parseFloat(t.quantity) || 0;
      return s + (fi ? amt : amt * q);
    }, 0);
  }

  function calcIncomeTotal(txs) {
    return txs.filter(t => t.type === 'income').reduce((s, t) => s + (parseFloat(t.amount) || 0), 0);
  }

  // Realized P/L de uma posição (totalmente) encerrada = proceeds + income − cost.
  function calcRealized(asset, txs) {
    const proceeds = calcProceeds(asset, txs);
    const cost = calcTotalCost(txs, asset.assetClass);
    const income = calcIncomeTotal(txs);
    return { proceeds, cost, income, realized: proceeds + income - cost };
  }

  // Detecta posição fechada mesmo se a flag `closed` foi removida por um
  // normalizador de dados: qualquer sell com closing===true (ou nota
  // "Position closed") conta como encerramento. Idêntico ao cpx.js.
  function closingTxFor(asset, allTxs) {
    let found = null;
    allTxs.forEach(t => {
      if (t.assetId === asset.id && t.type === 'sell' &&
          (t.closing === true || (t.notes && /position closed/i.test(t.notes)))) {
        if (!found || (t.date || '') >= (found.date || '')) found = t;
      }
    });
    return found;
  }

  function isClosedAsset(asset, allTxs) { return !!(asset.closed || closingTxFor(asset, allTxs)); }

  // ── 5. STATE ─────────────────────────────────────────────────────────────
  let state = {
    from: '', to: '', assetId: '', search: '', typeFilter: 'all',
    view: localStorage.getItem(VIEW_KEY) || 'table',
    showAssets: true,
    confirmDelete: null,   // { txId }
    modal: null,           // { type: 'newAsset'|'addTx'|'editTx', data: {} }
    closeModal: null       // { assetId, value?, date?, note? } — modal Close position (ex-cpx)
  };

  // dirty / justSaved per asset id
  const editState = {}; // { [assetId]: { raw: string, dirty: bool, justSaved: bool } }

  // ── 6. BADGE / TYPE HELPERS ──────────────────────────────────────────────
  function badgeInfo(tx, assetClass) {
    if (tx.type === 'buy') return { cls: 'nx-badge-buy', dot: 'var(--buy)', label: 'Buy' };
    if (tx.type === 'sell') return { cls: 'nx-badge-sell', dot: 'var(--sell)', label: 'Sell' };
    if (tx.type === 'adjustment') return { cls: 'nx-badge-adj', dot: 'var(--adj)', label: 'Adj' };
    if (tx.type === 'income') {
      if (['CDB','LCI','LCA'].includes(assetClass)) return { cls: 'nx-badge-coup', dot: 'var(--coup)', label: 'Coupon' };
      return { cls: 'nx-badge-div', dot: 'var(--div)', label: 'Dividend' };
    }
    return { cls: 'nx-badge-adj', dot: 'var(--adj)', label: tx.type };
  }

  function totalClass(type) {
    if (type === 'buy') return 'nx-total-buy';
    if (type === 'sell') return 'nx-total-sell';
    if (type === 'income') return 'nx-total-income';
    return 'nx-total-adj';
  }

  function totalSign(type) {
    if (type === 'buy') return '−';
    if (type === 'sell') return '+';
    if (type === 'income') return '+';
    return '±';
  }

  // ── 7. RENDER ─────────────────────────────────────────────────────────────
  let _txContainer = null;      // container da aba 'investments_transactions'
  let _assetsContainer = null;  // container da aba 'assets'

  // ── Preservação de foco/cursor através do re-render ───────────────────────
  // Sem isso, qualquer re-render (inclusive o que troca "✓ Saved" por
  // "Last updated" 2s depois) recria os inputs e o usuário perde o foco e o
  // texto que estava digitando em outro campo.
  function captureFocus(container) {
    const a = document.activeElement;
    if (!a || !container || !container.contains(a)) return null;
    const tag = a.tagName;
    if (tag !== 'INPUT' && tag !== 'SELECT' && tag !== 'TEXTAREA') return null;
    let sel = '';
    if (a.dataset && a.dataset.assetId && a.classList.contains('nx-editable-input')) {
      sel = '.nx-editable-input[data-asset-id="' + (window.CSS && CSS.escape ? CSS.escape(a.dataset.assetId) : a.dataset.assetId) + '"]';
    } else if (a.dataset && a.dataset.filter) {
      sel = '[data-filter="' + a.dataset.filter + '"]';
    } else if (a.id) {
      sel = '#' + (window.CSS && CSS.escape ? CSS.escape(a.id) : a.id);
    } else {
      return null;
    }
    let start = null, end = null;
    try { start = a.selectionStart; end = a.selectionEnd; } catch (e) {}
    return { sel: sel, start: start, end: end };
  }

  function restoreFocus(container, info) {
    if (!info || !info.sel || !container) return;
    const el = container.querySelector(info.sel);
    if (!el) return;
    if (el === document.activeElement) return;
    try { el.focus({ preventScroll: true }); } catch (e) { try { el.focus(); } catch (e2) {} }
    if (info.start != null) {
      try { el.setSelectionRange(info.start, info.end != null ? info.end : info.start); } catch (e) {}
    }
  }

  // Em qual aba um modal deve ser renderizado (deriva do tipo do modal).
  function modalHostOf(m) {
    if (!m) return null;
    return (m.type === 'addTx' || m.type === 'editTx') ? 'tx' : 'assets';
  }

  function renderTxPage() {
    if (!_txContainer) return;
    const _focus = captureFocus(_txContainer);
    const assets = getAssets();
    const allTxs = getTxs();
    _txContainer.innerHTML = renderTxHeader() +
      renderFilters(assets) +
      renderTransactionsSection(assets, allTxs) +
      (modalHostOf(state.modal) === 'tx' ? renderModal(assets) : '') +
      renderConfirmModal();
    attachEventListeners(_txContainer);
    restoreFocus(_txContainer, _focus);
  }

  function renderAssetsPage() {
    if (!_assetsContainer) return;
    const _focus = captureFocus(_assetsContainer);
    const assets = getAssets();
    const allTxs = getTxs();
    _assetsContainer.innerHTML = renderAssetsHeader() +
      renderAssetsSection(assets, allTxs) +
      (modalHostOf(state.modal) === 'assets' ? renderModal(assets) : '') +
      renderClosePositionModal(assets, allTxs);
    attachEventListeners(_assetsContainer);
    restoreFocus(_assetsContainer, _focus);
  }

  // Mutações de assets/txs re-renderizam as duas abas (se já montadas), síncrono.
  function renderAll() { renderTxPage(); renderAssetsPage(); }
  function renderHost(host) { if (host === 'assets') renderAssetsPage(); else renderTxPage(); }

  function renderTxHeader() {
    return `
      <div class="nx-page-header">
        <div class="nx-page-header-left">
          <h1>Investments Transactions</h1>
          <p>Track your portfolio assets and transaction history</p>
        </div>
        <div class="nx-header-btns">
          <button class="nx-btn nx-btn-primary" data-action="open-add-tx">+ Add transaction</button>
        </div>
      </div>`;
  }

  function renderAssetsHeader() {
    return `
      <div class="nx-page-header">
        <div class="nx-page-header-left">
          <h1>Assets</h1>
          <p>Update current values and manage open and closed positions</p>
        </div>
        <div class="nx-header-btns">
          <button class="nx-btn nx-btn-primary" data-action="open-new-asset">+ New asset</button>
        </div>
      </div>`;
  }

  function renderFilters(assets) {
    const s = state;
    const chips = [
      { key: 'all', label: 'All types', dot: '#aaa' },
      { key: 'buy', label: 'Buy', dot: 'var(--buy)' },
      { key: 'sell', label: 'Sell', dot: 'var(--sell)' },
      { key: 'income-div', label: 'Dividend', dot: 'var(--div)' },
      { key: 'income-coup', label: 'Coupon', dot: 'var(--coup)' },
      { key: 'adjustment', label: 'Adjustment', dot: 'var(--adj)' },
    ];
    const assetOptions = assets.map(a => `<option value="${escHtml(a.id)}" ${s.assetId === a.id ? 'selected' : ''}>${escHtml(a.name)}${a.ticker ? ' (' + escHtml(a.ticker) + ')' : ''}</option>`).join('');
    return `
      <div class="nx-filter-card">
        <div class="nx-filter-grid">
          <div class="nx-filter-field">
            <label>From date</label>
            <input type="date" data-filter="from" value="${escHtml(s.from)}" />
          </div>
          <div class="nx-filter-field">
            <label>To date</label>
            <input type="date" data-filter="to" value="${escHtml(s.to)}" />
          </div>
          <div class="nx-filter-field">
            <label>Asset</label>
            <select data-filter="assetId">
              <option value="">All assets</option>
              ${assetOptions}
            </select>
          </div>
          <div class="nx-filter-field">
            <label>Search</label>
            <input type="text" data-filter="search" value="${escHtml(s.search)}" placeholder="Ticker or note…" />
          </div>
        </div>
        <div class="nx-chips">
          ${chips.map(c => `<span class="nx-chip ${s.typeFilter === c.key ? 'nx-chip-active' : ''}" data-action="type-filter" data-val="${escHtml(c.key)}"><span class="nx-chip-dot" style="background:${c.dot}"></span>${escHtml(c.label)}</span>`).join('')}
          <button class="nx-clear-btn" data-action="clear-filters">Clear all</button>
        </div>
      </div>`;
  }

  function renderAssetsSection(assets, allTxs) {
    const view = getAssetView();

    // Backfill de closedAt para exibição quando a flag se perdeu (só em memória).
    assets.forEach(a => {
      if (!a.closedAt) { const ct = closingTxFor(a, allTxs); if (ct) a.closedAt = ct.date; }
    });
    const closedAssets = assets.filter(a => isClosedAsset(a, allTxs));
    const activeAssets = assets.filter(a => !isClosedAsset(a, allTxs));

    // Pill calculado com o conjunto certo desde o primeiro paint (sem flick).
    let pill;
    if (view === 'active') {
      const totalActive = calcPortfolioTotal(activeAssets);
      pill = `${activeAssets.length} asset${activeAssets.length !== 1 ? 's' : ''} · R$ ${fmtBR(totalActive)}`;
    } else {
      let totalRealized = 0;
      closedAssets.forEach(a => {
        totalRealized += calcRealized(a, allTxs.filter(t => t.assetId === a.id)).realized;
      });
      const sign = totalRealized >= 0 ? '+' : '−';
      pill = `${closedAssets.length} closed · ${sign}R$ ${fmtBR(Math.abs(totalRealized))} realized`;
    }

    const arrow = state.showAssets ? '▲' : '▼';
    let body = '';
    if (state.showAssets) {
      if (view === 'active') {
        if (!assets.length) {
          body = `<div class="nx-empty"><div class="nx-empty-icon">📊</div><h3>No assets yet</h3><p>Add your first investment asset to start tracking.</p><button class="nx-btn nx-btn-primary" data-action="open-new-asset">+ New asset</button></div>`;
        } else if (!activeAssets.length) {
          body = `<div class="cpx-empty">${closedAssets.length ? 'No open positions. Your closed positions are under the "Closed" tab.' : 'No open positions yet.'}</div>`;
        } else {
          const portfolioTotal = calcPortfolioTotal(activeAssets);
          body = `<div class="nx-asset-grid">${activeAssets.map(a => renderAssetCard(a, allTxs.filter(t => t.assetId === a.id), portfolioTotal)).join('')}</div>`;
        }
      } else {
        if (!closedAssets.length) {
          body = `<div class="cpx-empty">No closed positions yet. Use "Close position" on an asset to record a full sale.</div>`;
        } else {
          body = `<div class="nx-asset-grid cpx-closed-grid">${closedAssets.map(a => {
            const txs = allTxs.filter(t => t.assetId === a.id);
            return closedCardHTML(a, txs, calcRealized(a, txs));
          }).join('')}</div>`;
        }
      }
    }
    return `
      <div class="nx-section">
        <div class="nx-section-header">
          <h2 class="nx-section-title">Assets</h2>
          <span class="nx-pill">${escHtml(pill)}</span>
          <div class="cpx-toggle">
            <button class="cpx-v ${view === 'active' ? 'active' : ''}" data-action="set-asset-view" data-val="active">Active</button>
            <button class="cpx-v ${view === 'closed' ? 'active' : ''}" data-action="set-asset-view" data-val="closed">Closed</button>
          </div>
          <button class="nx-collapse-btn" data-action="toggle-assets">${arrow}</button>
        </div>
        ${body}
      </div>`;
  }

  function renderAssetCard(asset, txs, portfolioTotal) {
    const fi = isFixedIncome(asset.assetClass);
    const qty = calcQty(txs);
    const txCount = txs.filter(t => t.type === 'buy' || t.type === 'sell').length;

    // Para fundos/renda fixa: usa capital líquido investido
    // Para ETFs: usa preço médio ponderado por cota
    const netInvested = fi ? calcNetInvested(txs) : 0;
    const avgPrice    = fi ? 0 : calcAvgPrice(txs, asset.assetClass);

    // Renda fixa (cupons) e renda variável (dividendos): inclui rendimentos recebidos no Total P/L
    const totalIncome = txs.filter(t => t.type === 'income').reduce((s, t) => s + (parseFloat(t.amount) || 0), 0);

    const position  = calcPosition(asset, qty);

    // Para fi: Total P/L = (valor atual − capital líquido) + rendimentos recebidos
    // Para ETF: Unrealized P/L = (preço atual − preço médio) × qtd
    const unrealizedPL = fi
      ? calcPL(asset, netInvested, qty)
      : calcPL(asset, avgPrice, qty);
    const pl = unrealizedPL + totalIncome;

    const plBase    = fi ? netInvested : calcTotalCost(txs, asset.assetClass);
    const plPct     = plBase ? (pl / plBase * 100) : 0;
    const allocation = portfolioTotal ? (position / portfolioTotal * 100) : 0;
    const totalCost = fi ? netInvested : calcTotalCost(txs, asset.assetClass);

    // Label: "Total P/L" quando há rendimentos (cupons/dividendos), senão "Unrealized P/L"
    const plLabel = (fi || totalIncome > 0) ? 'Total P/L' : 'Unrealized P/L';
    // Subtítulo: mostra quanto veio de rendimentos recebidos
    const plSub = (totalIncome > 0)
      ? `incl. R$ ${fmtBR(totalIncome)} income`
      : '';

    const plCls  = pl >= 0 ? 'nx-stat-buy' : 'nx-stat-sell';
    const plSign = pl >= 0 ? '+' : '';

    // Editable state
    const es = editState[asset.id] || (editState[asset.id] = { raw: fmtBR(asset.manualUnitPrice || 0), dirty: false, justSaved: false });
    let subText = '';
    if (es.dirty) {
      subText = `<span class="nx-stat-accent">Press Enter or ✓ to save</span>`;
    } else if (es.justSaved) {
      subText = `<span class="nx-stat-buy">✓ Saved · recalculated</span>`;
    } else {
      const upd = asset.priceUpdatedAt ? 'Last updated · ' + relativeDate(asset.priceUpdatedAt) : 'Not yet updated';
      subText = `<span>${escHtml(upd)}</span>`;
    }

    const editLabel = fi ? 'Current total value' : 'Current unit price';
    const footerLeft = fi
      ? `Net invested · R$ ${fmtBR(netInvested)}`
      : `Cost basis · R$ ${fmtBR(totalCost)}`;
    const footerRight = fi
      ? 'Editable value = total net position'
      : 'Editable value = unit price per share';

    // Stat 3: "Capital investido" (fi) ou "Avg unit price" (ETF)
    const avgLabel = fi ? 'Capital invested' : 'Avg unit price';
    const avgValue = fi ? fmtBR(netInvested) : fmtBR(avgPrice);
    const avgSub = fi
      ? `${txCount} transaction${txCount !== 1 ? 's' : ''}`
      : `${fmtQty(qty)} shares · ${txCount} tx`;

    const couponBtn = fi
      ? `<button class="nx-btn nx-btn-outline nx-btn-sm" data-action="open-coupon" data-asset-id="${escHtml(asset.id)}">+ Coupon</button>`
      : (asset.assetClass !== 'Cash' ? `<button class="nx-btn nx-btn-outline nx-btn-sm" data-action="open-dividend" data-asset-id="${escHtml(asset.id)}">+ Dividend</button>` : '');

    return `
      <div class="nx-asset-card" data-asset-id="${escHtml(asset.id)}">
        <div class="nx-asset-card-header">
          <div>
            <div class="nx-asset-card-name">${escHtml(asset.name)}<span class="nx-asset-class-badge">${escHtml(asset.assetClass || '')}</span></div>
            <div class="nx-asset-card-meta">${asset.ticker ? escHtml(asset.ticker) : ''}${asset.issuer ? ' · ' + escHtml(asset.issuer) : ''}</div>
          </div>
          <div class="nx-asset-actions">
            <button class="nx-btn nx-btn-outline nx-btn-sm" data-action="open-edit-asset" data-asset-id="${escHtml(asset.id)}">Edit</button>
            ${couponBtn}
            <button class="nx-btn nx-btn-outline nx-btn-sm cpx-close-btn" data-action="open-close-position" data-asset-id="${escHtml(asset.id)}">⊘ Close position</button>
          </div>
        </div>
        <div class="nx-stats-grid">
          <div class="nx-stat">
            <div class="nx-stat-label">${escHtml(editLabel)}</div>
            <div class="nx-editable-wrap">
              <div class="nx-editable-input-row">
                <span class="nx-editable-prefix">R$</span>
                <input class="nx-editable-input" type="text" data-action="price-input" data-asset-id="${escHtml(asset.id)}" value="${escHtml(es.raw)}" inputmode="decimal" />
                <button class="nx-editable-confirm" data-action="price-save" data-asset-id="${escHtml(asset.id)}" ${es.dirty ? '' : 'disabled'}>✓</button>
              </div>
              <div class="nx-editable-sub">${subText}</div>
            </div>
          </div>
          <div class="nx-stat">
            <div class="nx-stat-label">Current position</div>
            <div class="nx-stat-value">R$ ${fmtBR(position)}<span class="nx-alloc-chip">${fmtBR(allocation, 1)}%</span></div>
            <div class="nx-stat-sub">${fi ? 'Net position' : fmtQty(qty) + ' shares'}</div>
          </div>
          <div class="nx-stat">
            <div class="nx-stat-label">${avgLabel}</div>
            <div class="nx-stat-value">R$ ${avgValue}</div>
            <div class="nx-stat-sub">${escHtml(avgSub)}</div>
          </div>
          <div class="nx-stat">
            <div class="nx-stat-label">${escHtml(plLabel)}</div>
            <div class="nx-stat-value ${plCls}">${plSign}R$ ${fmtBR(Math.abs(pl))}</div>
            <div class="nx-stat-sub ${plCls}">${plSign}${fmtBR(Math.abs(plPct), 1)}%${plSub ? '<br><span style="font-size:10px;opacity:.8;">' + escHtml(plSub) + '</span>' : ''}</div>
          </div>
        </div>
        <div class="nx-asset-footer">
          <span class="nx-asset-footer-left">${escHtml(footerLeft)}</span>
          <span class="nx-asset-footer-right">${escHtml(footerRight)}</span>
        </div>
      </div>`;
  }

  // Card de posição encerrada (absorvido do cpx.js — mesmo markup/classes).
  function closedCardHTML(asset, txs, r) {
    const plCls = r.realized >= 0 ? 'cpx-pos' : 'cpx-neg';
    const plSign = r.realized >= 0 ? '+' : '−';
    const pct = r.cost ? (r.realized / r.cost * 100) : 0;
    const meta = (asset.ticker ? escHtml(asset.ticker) : '') +
      (asset.closedAt ? (asset.ticker ? ' · ' : '') + 'closed ' + fmtDate(asset.closedAt) : '');
    return `
      <div class="nx-asset-card" data-asset-id="${escHtml(asset.id)}" style="opacity:.96;">
        <div class="nx-asset-card-header">
          <div>
            <div class="nx-asset-card-name">${escHtml(asset.name)}<span class="nx-asset-class-badge">${escHtml(asset.assetClass || '')}</span><span class="cpx-closed-badge">Closed</span></div>
            <div class="nx-asset-card-meta">${meta}</div>
          </div>
          <div class="nx-asset-actions">
            <button class="nx-btn nx-btn-outline nx-btn-sm" data-action="reopen-asset" data-asset-id="${escHtml(asset.id)}">↺ Reopen</button>
          </div>
        </div>
        <div class="nx-stats-grid">
          <div class="nx-stat"><div class="nx-stat-label">Total invested</div><div class="nx-stat-value">R$ ${fmtBR(r.cost)}</div></div>
          <div class="nx-stat"><div class="nx-stat-label">Total received</div><div class="nx-stat-value">R$ ${fmtBR(r.proceeds)}</div>${r.income > 0 ? '<div class="nx-stat-sub">incl. R$ ' + fmtBR(r.income) + ' income</div>' : ''}</div>
          <div class="nx-stat"><div class="nx-stat-label">Realized P/L</div><div class="nx-stat-value ${plCls}">${plSign}R$ ${fmtBR(Math.abs(r.realized))}</div><div class="nx-stat-sub ${plCls}">${plSign}${fmtBR(Math.abs(pct), 1)}%</div></div>
        </div>
        <div class="nx-asset-footer">
          <span class="nx-asset-footer-left">History kept · ${txs.length} transaction${txs.length !== 1 ? 's' : ''}</span>
          <span class="nx-asset-footer-right">Removed from active wallet</span>
        </div>
      </div>`;
  }

  function filterTxs(allTxs, assets) {
    const s = state;
    const assetMap = {};
    assets.forEach(a => { assetMap[a.id] = a; });
    return allTxs.filter(tx => {
      if (s.from && tx.date < s.from) return false;
      if (s.to && tx.date > s.to) return false;
      if (s.assetId && tx.assetId !== s.assetId) return false;
      if (s.search) {
        const q = s.search.toLowerCase();
        const a = assetMap[tx.assetId];
        const ticker = (a && a.ticker || '').toLowerCase();
        const note = (tx.notes || '').toLowerCase();
        if (!ticker.includes(q) && !note.includes(q)) return false;
      }
      if (s.typeFilter !== 'all') {
        if (s.typeFilter === 'income-div') {
          const a = assetMap[tx.assetId];
          if (tx.type !== 'income' || !a || ['CDB','LCI','LCA'].includes(a.assetClass)) return false;
        } else if (s.typeFilter === 'income-coup') {
          const a = assetMap[tx.assetId];
          if (tx.type !== 'income' || !a || !['CDB','LCI','LCA'].includes(a.assetClass)) return false;
        } else {
          if (tx.type !== s.typeFilter) return false;
        }
      }
      return true;
    });
  }

  function renderTransactionsSection(assets, allTxs) {
    const filtered = filterTxs(allTxs, assets);
    const count = filtered.length;
    const isCards = state.view === 'cards';
    return `
      <div class="nx-section">
        <div class="nx-section-header">
          <h2 class="nx-section-title">Transactions</h2>
          <span class="nx-pill">${count} transaction${count !== 1 ? 's' : ''}</span>
          <div class="nx-section-view-toggle">
            <button class="nx-vt-btn ${!isCards ? 'active' : ''}" data-action="set-view" data-val="table">Table</button>
            <button class="nx-vt-btn ${isCards ? 'active' : ''}" data-action="set-view" data-val="cards">Cards</button>
          </div>
        </div>
        ${isCards ? renderCardsView(filtered, assets) : renderTableView(filtered, assets)}
      </div>`;
  }

  function renderTableView(filtered, assets) {
    if (!filtered.length) {
      return `<div class="nx-table-wrap"><div class="nx-table-empty">No transactions match these filters · <a data-action="clear-filters">Clear filters</a></div></div>`;
    }
    const assetMap = {};
    assets.forEach(a => { assetMap[a.id] = a; });

    // group by month descending
    const groups = {};
    filtered.forEach(tx => {
      const k = monthKey(tx.date);
      if (!groups[k]) groups[k] = [];
      groups[k].push(tx);
    });
    const sortedKeys = Object.keys(groups).sort((a, b) => b.localeCompare(a));

    let html = '<div class="nx-table-wrap">';
    html += '<table class="nx-table"><thead><tr>' +
      '<th>Type</th><th>Asset</th><th>Date</th><th>Qty</th><th>Unit price</th><th>Total</th><th>Note</th><th></th>' +
      '</tr></thead><tbody>';

    sortedKeys.forEach(key => {
      const txs = groups[key];
      const sorted = [...txs].sort((a, b) => b.date.localeCompare(a.date));
      // month net
      const net = sorted.reduce((s, tx) => {
        const a = assetMap[tx.assetId];
        const t = txTotal(tx, a ? a.assetClass : 'ETF');
        if (tx.type === 'buy') return s - t;
        if (tx.type === 'sell' || tx.type === 'income') return s + t;
        return s;
      }, 0);
      const netSign = net >= 0 ? '+' : '';
      const lbl = monthLabel(key + '-01');
      html += `<tr><td colspan="8" style="padding:0;"><div class="nx-month-header"><span class="nx-month-label">${escHtml(lbl)}</span><span class="nx-month-meta">Net: ${netSign}R$ ${fmtBR(Math.abs(net))} · ${sorted.length} transaction${sorted.length !== 1 ? 's' : ''}</span></div></td></tr>`;

      sorted.forEach(tx => {
        const asset = assetMap[tx.assetId];
        const ac = asset ? asset.assetClass : 'ETF';
        const badge = badgeInfo(tx, ac);
        const total = txTotal(tx, ac);
        const totalCls = totalClass(tx.type);
        const sign = totalSign(tx.type);
        const unitPrice = (tx.type === 'buy' || tx.type === 'sell') ? 'R$ ' + fmtBR(parseFloat(tx.amount) || 0) : '—';
        const qty = (tx.type === 'buy' || tx.type === 'sell') ? fmtQty(parseFloat(tx.quantity) || 0) : '—';
        html += `<tr>
          <td><span class="nx-type-badge ${badge.cls}"><span class="nx-chip-dot" style="background:${badge.dot}"></span>${escHtml(badge.label)}</span></td>
          <td><div class="nx-asset-name-cell">${escHtml(asset ? asset.name : tx.assetId)}<div class="nx-asset-ticker-meta">${asset && asset.ticker ? escHtml(asset.ticker) + ' · ' : ''}${escHtml(ac)}</div></div></td>
          <td><div class="nx-date-main">${fmtDate(tx.date)}</div><div class="nx-date-sub">${txRelativeDate(tx.date)}</div></td>
          <td>${qty}</td>
          <td>${unitPrice}</td>
          <td><span class="${totalCls}">${sign}R$ ${fmtBR(total)}</span></td>
          <td><span class="nx-note-cell" title="${escHtml(tx.notes || '')}">${escHtml(tx.notes || '')}</span></td>
          <td><div class="nx-table-actions">
            <button class="nx-tbl-icon-btn" data-action="edit-tx" data-tx-id="${escHtml(tx.id)}" title="Edit">✏️</button>
            <button class="nx-tbl-icon-btn nx-danger" data-action="delete-tx" data-tx-id="${escHtml(tx.id)}" title="Delete">🗑️</button>
          </div></td>
        </tr>`;
      });
    });

    html += '</tbody></table></div>';
    return html;
  }

  function renderCardsView(filtered, assets) {
    if (!filtered.length) {
      return `<div class="nx-table-wrap"><div class="nx-table-empty">No transactions match these filters · <a data-action="clear-filters">Clear filters</a></div></div>`;
    }
    const assetMap = {};
    assets.forEach(a => { assetMap[a.id] = a; });

    const groups = {};
    filtered.forEach(tx => {
      const k = monthKey(tx.date);
      if (!groups[k]) groups[k] = [];
      groups[k].push(tx);
    });
    const sortedKeys = Object.keys(groups).sort((a, b) => b.localeCompare(a));

    let html = '';
    sortedKeys.forEach(key => {
      const txs = [...groups[key]].sort((a, b) => b.date.localeCompare(a.date));
      const lbl = monthLabel(key + '-01');
      html += `<div class="nx-month-section">
        <div class="nx-month-header" style="border-radius:10px;margin-bottom:10px;"><span class="nx-month-label">${escHtml(lbl)}</span><span class="nx-month-meta">${txs.length} transaction${txs.length !== 1 ? 's' : ''}</span></div>
        <div class="nx-cards-grid">`;
      txs.forEach(tx => {
        const asset = assetMap[tx.assetId];
        const ac = asset ? asset.assetClass : 'ETF';
        const badge = badgeInfo(tx, ac);
        const total = txTotal(tx, ac);
        const sign = totalSign(tx.type);
        html += `<div class="nx-tx-card">
          <div class="nx-tx-card-header">
            <span class="nx-type-badge ${badge.cls}"><span class="nx-chip-dot" style="background:${badge.dot}"></span>${escHtml(badge.label)}</span>
            <div style="display:flex;gap:4px;">
              <button class="nx-tbl-icon-btn" data-action="edit-tx" data-tx-id="${escHtml(tx.id)}" title="Edit">✏️</button>
              <button class="nx-tbl-icon-btn nx-danger" data-action="delete-tx" data-tx-id="${escHtml(tx.id)}" title="Delete">🗑️</button>
            </div>
          </div>
          <div class="nx-tx-card-field"><div class="nx-tx-card-field-label">Asset</div><div class="nx-tx-card-field-value">${escHtml(asset ? asset.name : tx.assetId)}</div></div>
          <div class="nx-tx-card-field"><div class="nx-tx-card-field-label">Date</div><div class="nx-tx-card-field-value">${fmtDate(tx.date)} <span style="color:var(--text-secondary,#6b6b6b);font-size:11px;">${txRelativeDate(tx.date)}</span></div></div>
          ${(tx.type === 'buy' || tx.type === 'sell') ? `<div class="nx-tx-card-field"><div class="nx-tx-card-field-label">Qty</div><div class="nx-tx-card-field-value">${fmtQty(parseFloat(tx.quantity)||0)}</div></div>` : ''}
          <div class="nx-tx-card-field"><div class="nx-tx-card-field-label">Total</div><div class="nx-tx-card-field-value" style="font-family:'Fraunces',Georgia,serif;font-weight:600;">${sign}R$ ${fmtBR(total)}</div></div>
          ${tx.notes ? `<div class="nx-tx-card-field"><div class="nx-tx-card-field-label">Note</div><div class="nx-tx-card-field-value" style="font-style:italic;color:var(--text-secondary,#6b6b6b);">${escHtml(tx.notes)}</div></div>` : ''}
        </div>`;
      });
      html += '</div></div>';
    });
    return html;
  }

  // ── 8. MODALS ─────────────────────────────────────────────────────────────
  function renderModal(assets) {
    const m = state.modal;
    if (!m) return '';
    if (m.type === 'newAsset' || m.type === 'editAsset') return renderNewAssetModal();
    if (m.type === 'addTx' || m.type === 'editTx' || m.type === 'coupon' || m.type === 'dividend') return renderTxModal(assets, m);
    return '';
  }

  function renderNewAssetModal() {
    const d = state.modal.data || {};
    return `
      <div class="nx-modal-overlay" data-action="modal-overlay-close">
        <div class="nx-modal">
          <div class="nx-modal-title">${(state.modal && state.modal.type === 'editAsset') ? 'Edit asset' : 'New Asset'}</div>
          <div class="nx-modal-field"><label>Name *</label><input type="text" id="nm-name" value="${escHtml(d.name||'')}" placeholder="e.g. iShares S&P 500" /></div>
          <div class="nx-modal-field"><label>Ticker</label><input type="text" id="nm-ticker" value="${escHtml(d.ticker||'')}" placeholder="e.g. IVVB11" /></div>
          <div class="nx-modal-field"><label>Asset class *</label>
            <select id="nm-class">
              ${['ETF','Stock','Fund','CDB','LCI','LCA','Cash'].map(c => `<option value="${c}" ${(d.assetClass||'ETF')===c?'selected':''}>${c}</option>`).join('')}
            </select>
          </div>
          <div id="nm-fi-fields" style="${isFixedIncome(d.assetClass||'ETF')?'':'display:none'}">
            <div class="nx-modal-field"><label>Issuer</label><input type="text" id="nm-issuer" value="${escHtml(d.issuer||'')}" placeholder="e.g. Banco XYZ" /></div>
            <div class="nx-modal-field"><label>Maturity date</label><input type="date" id="nm-maturity" value="${escHtml(d.maturityDate||'')}" /></div>
          </div>
          <div id="nm-region-fields" style="${(['ETF','Stock','Fund'].indexOf(d.assetClass||'ETF')>=0)?'':'display:none'}">
            <div class="nx-modal-field"><label>Region</label>
              <select id="nm-region">
                <option value="BR" ${(d.region||'BR')==='BR'?'selected':''}>Domestic (BR)</option>
                <option value="INTL" ${(d.region||'BR')==='INTL'?'selected':''}>International</option>
                <option value="CRYPTO" ${(d.region||'BR')==='CRYPTO'?'selected':''}>Crypto</option>
              </select>
            </div>
          </div>
          <div class="nx-modal-field"><label>Notes</label><textarea id="nm-notes" rows="2" placeholder="Optional…">${escHtml(d.notes||'')}</textarea></div>
          <div class="nx-modal-footer">
            <button class="nx-btn nx-btn-ghost" data-action="modal-close">Cancel</button>
            <button class="nx-btn nx-btn-primary" data-action="save-new-asset">Save asset</button>
          </div>
        </div>
      </div>`;
  }

  function renderTxModal(assets, m) {
    const d = m.data || {};
    const isEdit = m.type === 'editTx';
    const isIncomeModal = m.type === 'coupon' || m.type === 'dividend';
    const title = isEdit ? 'Edit transaction' : (m.type === 'coupon' ? 'Add coupon' : (m.type === 'dividend' ? 'Add dividend' : 'Add transaction'));
    const ac = assets.find(a => a.id === (d.assetId||''));
    const fi = ac ? isFixedIncome(ac.assetClass) : false;
    const amountTotal = fi || m.type === 'dividend';
    return `
      <div class="nx-modal-overlay" data-action="modal-overlay-close">
        <div class="nx-modal">
          <div class="nx-modal-title">${escHtml(title)}</div>
          <div class="nx-modal-field"><label>Asset *</label>
            <select id="tm-asset" ${isIncomeModal ? 'disabled' : ''}>
              <option value="">Select asset…</option>
              ${assets.map(a => `<option value="${escHtml(a.id)}" ${d.assetId===a.id?'selected':''}>${escHtml(a.name)}${a.ticker?' ('+a.ticker+')':''}</option>`).join('')}
            </select>
          </div>
          <div class="nx-modal-field"><label>Type *</label>
            <select id="tm-type" ${isIncomeModal ? 'disabled' : ''}>
              ${['buy','sell','income','adjustment'].map(t => `<option value="${t}" ${(d.type||'buy')===t?'selected':''}>${t}</option>`).join('')}
            </select>
          </div>
          <div class="nx-modal-field"><label>Date *</label><input type="date" id="tm-date" value="${escHtml(d.date||new Date().toISOString().slice(0,10))}" /></div>
          <div id="tm-qty-wrap" class="nx-modal-field" style="${amountTotal?'display:none':''}"><label>Quantity</label><input type="number" id="tm-qty" value="${escHtml(d.quantity||'')}" placeholder="0" step="any" min="0" /></div>
          <div class="nx-modal-field">
            <label id="tm-amount-label">${amountTotal ? 'Total amount (R$)' : 'Unit price (R$)'} *</label>
            <div style="display:flex;align-items:center;gap:6px;border:1.5px solid var(--border,#e8e8e8);border-radius:8px;padding:0 10px;background:var(--input-bg,#fafafa);">
              <span style="font-size:13px;color:var(--text-secondary,#6b7280);flex-shrink:0;">R$</span>
              <input type="text" id="tm-amount" class="nx-modal-money-input"
                inputmode="decimal" autocomplete="off"
                value="${d.amount ? parseBR(d.amount).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}) : '0,00'}"
                placeholder="0,00"
                style="border:none;background:transparent;outline:none;font-size:14px;width:100%;padding:10px 0;color:var(--text,#1a1a1a);" />
            </div>
          </div>
          <div class="nx-modal-field"><label>Notes</label><textarea id="tm-notes" rows="2" placeholder="Optional…">${escHtml(d.notes||'')}</textarea></div>
          <div id="tm-save-error" style="display:none;color:var(--sell,#C25450);font-size:13px;margin-bottom:8px;"></div>
          <div class="nx-modal-footer">
            <button class="nx-btn nx-btn-ghost" data-action="modal-close">Cancel</button>
            <button class="nx-btn nx-btn-primary" data-action="save-tx" ${isEdit ? `data-tx-id="${escHtml(d.id||'')}"` : ''}>Save</button>
          </div>
        </div>
      </div>`;
  }

  function renderConfirmModal() {
    if (!state.confirmDelete) return '';
    return `
      <div class="nx-modal-overlay" data-action="modal-overlay-close">
        <div class="nx-confirm-modal">
          <p>Delete this transaction? This action cannot be undone.</p>
          <div class="nx-modal-footer">
            <button class="nx-btn nx-btn-ghost nx-btn-sm" data-action="cancel-delete">Cancel</button>
            <button class="nx-btn nx-btn-danger nx-btn-sm" data-action="confirm-delete" data-tx-id="${escHtml(state.confirmDelete.txId)}">Delete</button>
          </div>
        </div>
      </div>`;
  }

  // ── Modal Close position (absorvido do cpx.js — renderizado no fluxo normal) ──
  function renderClosePositionModal(assets, allTxs) {
    const cm = state.closeModal;
    if (!cm) return '';
    const asset = assets.find(a => a.id === cm.assetId);
    if (!asset) return '';
    const txs = allTxs.filter(t => t.assetId === asset.id);
    const fi = isFixedIncome(asset.assetClass);
    const qty = calcQty(txs);
    const cost = calcTotalCost(txs, asset.assetClass);
    const income = calcIncomeTotal(txs);
    const priorProceeds = calcProceeds(asset, txs);
    const base = priorProceeds + income - cost;              // resultado realizado ANTES desta venda
    const value = (cm.value != null) ? cm.value : calcPosition(asset, qty); // pré-preenche com valor atual estimado
    const realizedNow = base + value;

    const posInfo = fi
      ? `Net invested: <strong>R$ ${fmtBR(cost - priorProceeds)}</strong> · cost basis R$ ${fmtBR(cost)}`
      : `Current position: <strong>${fmtQty(qty)}</strong> shares · cost basis R$ ${fmtBR(cost)}`;
    const warn = (!fi && qty <= 0)
      ? '<div class="cpx-err" style="display:block;">This asset has no open shares to close.</div>' : '';

    return `
      <div class="cpx-overlay" data-action="close-position-overlay">
        <div class="cpx-modal" role="dialog" aria-modal="true">
          <h3>Close position — ${escHtml(asset.name)}</h3>
          <p class="cpx-sub">Records the full sale, removes the asset from the active wallet and keeps its history so the realized profit/loss stays available.</p>
          <div class="cpx-info">${posInfo}</div>
          ${warn}
          <div class="cpx-field"><label>Sale date *</label><input type="date" id="cpx-date" value="${escHtml(cm.date || new Date().toISOString().slice(0, 10))}"></div>
          <div class="cpx-field"><label>Total amount received (R$) *</label>
            <div class="cpx-money"><span>R$</span>
              <input type="text" id="cpx-value" inputmode="decimal" autocomplete="off" data-base="${base}" value="${fmtBR(value)}" placeholder="0,00">
            </div></div>
          <div class="cpx-field"><label>Note</label><textarea id="cpx-note" rows="2" placeholder="Optional…">${escHtml(cm.note || '')}</textarea></div>
          <div class="cpx-preview"><span class="lbl">Realized P/L</span>
            <span class="val ${realizedNow >= 0 ? 'cpx-pos' : 'cpx-neg'}" id="cpx-realized">${realizedNow >= 0 ? '+' : '−'}R$ ${fmtBR(Math.abs(realizedNow))}</span></div>
          <div class="cpx-err" id="cpx-error"></div>
          <div class="cpx-foot">
            <button class="cpx-btn cpx-btn-ghost" data-action="close-position-cancel">Cancel</button>
            <button class="cpx-btn cpx-btn-primary" data-action="close-position-confirm" data-asset-id="${escHtml(asset.id)}">Close position</button>
          </div>
        </div>
      </div>`;
  }

  // Confirma o encerramento: cria a sell "closing", marca o asset e persiste
  // atomicamente (mesmas chaves de localStorage e mesmo sync ao Gist do cpx.js).
  function confirmClosePosition(container, assetId) {
    const assets = getAssets();
    const idx = assets.findIndex(a => a.id === assetId);
    if (idx < 0) return;
    const asset = assets[idx];
    const fi = isFixedIncome(asset.assetClass);
    const txs = getTxs();
    const mine = txs.filter(t => t.assetId === assetId);
    const qty = calcQty(mine);

    const valEl = container.querySelector('#cpx-value');
    const dateEl = container.querySelector('#cpx-date');
    const noteEl = container.querySelector('#cpx-note');
    const errEl = container.querySelector('#cpx-error');
    const digits = ((valEl && valEl.value) || '').replace(/\D/g, '');
    const saleValue = parseInt(digits || '0', 10) / 100;
    const date = (dateEl && dateEl.value) || new Date().toISOString().slice(0, 10);
    const note = (noteEl && noteEl.value) || '';

    function fail(msg) { if (errEl) { errEl.textContent = msg; errEl.style.display = 'block'; } }
    if (isNaN(saleValue) || saleValue < 0) { fail('Enter a valid sale amount.'); return; }
    if (!fi && qty <= 0) { fail('This asset has no open shares to close.'); return; }

    const closingTx = {
      id: cpxUid(),
      assetId: assetId,
      type: 'sell',
      date: date,
      quantity: fi ? 1 : qty,
      amount: fi ? saleValue : (qty > 0 ? saleValue / qty : 0),
      notes: note || 'Position closed (full sale)',
      closing: true
    };
    txs.push(closingTx);

    asset.closed = true;
    asset.closedAt = date;
    asset.closeProceeds = saleValue;
    asset.closeTxId = closingTx.id;
    asset.manualUnitPrice = 0;            // zera o valor atual → sai da carteira ativa e do dashboard
    asset.priceUpdatedAt = new Date().toISOString();
    assets[idx] = asset;

    persist(assets, txs);
    editState[assetId] = { raw: fmtBR(0), dirty: false, justSaved: false }; // input reflete o preço zerado
    state.closeModal = null;
    setAssetView('closed');               // pula para a visão "Closed" para o resultado ficar visível
    renderAll();
  }

  function reopenAsset(assetId) {
    const assets = getAssets();
    const idx = assets.findIndex(a => a.id === assetId);
    if (idx < 0) return;
    const asset = assets[idx];
    let txs = getTxs();
    if (asset.closeTxId) txs = txs.filter(t => t.id !== asset.closeTxId);
    delete asset.closed;
    delete asset.closedAt;
    delete asset.closeProceeds;
    delete asset.closeTxId;
    assets[idx] = asset;
    persist(assets, txs);
    renderAll();
  }

  // ── 9. EVENT HANDLERS ─────────────────────────────────────────────────────
  function attachEventListeners(container) {
    if (!container) return;

    // Delegated click — remove antes de adicionar para evitar acúmulo entre re-renders
    container.removeEventListener('click', handleClick);
    container.addEventListener('click', handleClick);

    // Filter inputs (change + input)
    container.querySelectorAll('[data-filter]').forEach(el => {
      el.addEventListener('change', handleFilterChange);
      el.addEventListener('input', handleFilterChange);
    });

    // Price inputs (keydown for Enter, input for dirty)
    container.querySelectorAll('.nx-editable-input').forEach(el => {
      el.addEventListener('input', handlePriceInput);
      el.addEventListener('keydown', handlePriceKeydown);
      // Ao focar, seleciona tudo: o primeiro dígito digitado substitui o valor anterior,
      // garantindo que o input calculadora comece do zero.
      el.addEventListener('focus', () => el.select());
    });

    // Asset class change in new asset modal to show/hide fi fields
    const nmClass = container.querySelector('#nm-class');
    if (nmClass) {
      nmClass.addEventListener('change', () => {
        const fiFields = container.querySelector('#nm-fi-fields');
        if (fiFields) fiFields.style.display = isFixedIncome(nmClass.value) ? '' : 'none';
        const regionFields = container.querySelector('#nm-region-fields');
        if (regionFields) regionFields.style.display = (['ETF','Stock','Fund'].indexOf(nmClass.value) >= 0) ? '' : 'none';
      });
    }

    // Modal amount input — formato calculadora (igual ao campo de preço dos asset cards)
    const tmAmount = container.querySelector('#tm-amount');
    if (tmAmount) {
      tmAmount.addEventListener('input', function () {
        const digits = tmAmount.value.replace(/\D/g, '');
        const cents = parseInt(digits || '0', 10);
        const fmt = (cents / 100).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        tmAmount.value = fmt;
        tmAmount.setSelectionRange(fmt.length, fmt.length);
        // Limpa erro se existir
        const errEl = container.querySelector('#tm-save-error');
        if (errEl) errEl.style.display = 'none';
      });
      tmAmount.addEventListener('focus', function () { tmAmount.select(); });
    }

    // Asset select change in tx modal to show/hide qty
    const tmAsset = container.querySelector('#tm-asset');
    if (tmAsset) {
      tmAsset.addEventListener('change', () => {
        const assets = getAssets();
        const asset = assets.find(a => a.id === tmAsset.value);
        const fi = asset ? isFixedIncome(asset.assetClass) : false;
        const qtyWrap = container.querySelector('#tm-qty-wrap');
        if (qtyWrap) qtyWrap.style.display = fi ? 'none' : '';
      });
    }

    // Close-position modal — input calculadora + preview de Realized P/L (ex-recompute do cpx)
    const cpxValue = container.querySelector('#cpx-value');
    if (cpxValue) {
      cpxValue.addEventListener('input', () => {
        const digits = cpxValue.value.replace(/\D/g, '');
        const cents = parseInt(digits || '0', 10);
        const fmt = (cents / 100).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        cpxValue.value = fmt;
        try { cpxValue.setSelectionRange(fmt.length, fmt.length); } catch (e) {}
        if (state.closeModal) state.closeModal.value = cents / 100; // sobrevive a re-renders
        const prev = container.querySelector('#cpx-realized');
        if (prev) {
          const b = parseFloat(cpxValue.getAttribute('data-base')) || 0;
          const rl = b + cents / 100;
          prev.textContent = (rl >= 0 ? '+' : '−') + 'R$ ' + fmtBR(Math.abs(rl));
          prev.className = 'val ' + (rl >= 0 ? 'cpx-pos' : 'cpx-neg');
        }
        const err = container.querySelector('#cpx-error');
        if (err) err.style.display = 'none';
      });
      cpxValue.addEventListener('focus', () => cpxValue.select());
    }
    const cpxDate = container.querySelector('#cpx-date');
    if (cpxDate) cpxDate.addEventListener('change', () => { if (state.closeModal) state.closeModal.date = cpxDate.value; });
    const cpxNote = container.querySelector('#cpx-note');
    if (cpxNote) cpxNote.addEventListener('input', () => { if (state.closeModal) state.closeModal.note = cpxNote.value; });
  }

  function handleClick(e) {
    // O mesmo handler serve às duas abas: o container vem do evento delegado.
    const container = e.currentTarget;
    const host = (container === _assetsContainer) ? 'assets' : 'tx';
    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    const action = btn.dataset.action;

    if (action === 'open-new-asset') { state.modal = { type: 'newAsset', data: {} }; renderAssetsPage(); return; }
    if (action === 'open-add-tx') { state.modal = { type: 'addTx', data: {} }; renderTxPage(); return; }
    if (action === 'open-coupon') {
      const assetId = btn.dataset.assetId;
      state.modal = { type: 'coupon', data: { assetId, type: 'income' } };
      renderAssetsPage(); return;
    }
    if (action === 'open-dividend') {
      const assetId = btn.dataset.assetId;
      state.modal = { type: 'dividend', data: { assetId, type: 'income' } };
      renderAssetsPage(); return;
    }
    if (action === 'open-edit-asset') {
      const assetId = btn.dataset.assetId;
      const asset = getAssets().find(a => a.id === assetId);
      if (asset) { state.modal = { type: 'editAsset', data: { ...asset } }; renderAssetsPage(); }
      return;
    }
    if (action === 'modal-close') { state.modal = null; renderHost(host); return; }
    // modal-overlay-close: fecha apenas se o clique foi direto no overlay (não em conteúdo interno)
    if (action === 'modal-overlay-close') { if (e.target === btn) { state.modal = null; renderHost(host); } return; }
    if (action === 'toggle-assets') { state.showAssets = !state.showAssets; renderAssetsPage(); return; }
    if (action === 'type-filter') { state.typeFilter = btn.dataset.val; renderTxPage(); return; }
    if (action === 'set-view') {
      state.view = btn.dataset.val;
      localStorage.setItem(VIEW_KEY, state.view);
      renderTxPage(); return;
    }
    if (action === 'clear-filters') {
      state.from = ''; state.to = ''; state.assetId = ''; state.search = ''; state.typeFilter = 'all';
      renderTxPage(); return;
    }
    if (action === 'price-save') {
      const assetId = btn.dataset.assetId;
      savePriceForAsset(assetId);
      return;
    }
    if (action === 'save-new-asset') { doSaveNewAsset(container); return; }
    if (action === 'save-tx') { doSaveTx(container, btn.dataset.txId); return; }
    if (action === 'edit-tx') {
      const txId = btn.dataset.txId;
      const tx = getTxs().find(t => t.id === txId);
      if (tx) { state.modal = { type: 'editTx', data: { ...tx } }; renderTxPage(); }
      return;
    }
    if (action === 'delete-tx') {
      state.confirmDelete = { txId: btn.dataset.txId };
      renderTxPage(); return;
    }
    if (action === 'cancel-delete') { state.confirmDelete = null; renderTxPage(); return; }
    if (action === 'confirm-delete') {
      const txId = btn.dataset.txId;
      const txs = getTxs().filter(t => t.id !== txId);
      saveTxs(txs);
      state.confirmDelete = null;
      renderAll(); return;
    }

    // ── ações da visão Active/Closed (absorvidas do cpx.js) ──
    if (action === 'set-asset-view') { setAssetView(btn.dataset.val); renderAssetsPage(); return; }
    if (action === 'open-close-position') {
      state.closeModal = { assetId: btn.dataset.assetId };
      renderAssetsPage();
      const inp = _assetsContainer && _assetsContainer.querySelector('#cpx-value');
      if (inp) { try { inp.focus({ preventScroll: true }); inp.select(); } catch (err) {} }
      return;
    }
    if (action === 'close-position-cancel') { state.closeModal = null; renderAssetsPage(); return; }
    if (action === 'close-position-overlay') { if (e.target === btn) { state.closeModal = null; renderAssetsPage(); } return; }
    if (action === 'close-position-confirm') { confirmClosePosition(container, btn.dataset.assetId); return; }
    if (action === 'reopen-asset') { reopenAsset(btn.dataset.assetId); return; }
  }

  function handleFilterChange(e) {
    const el = e.target;
    const key = el.dataset.filter;
    if (key) { state[key] = el.value; renderTxPage(); }
  }

  function handlePriceInput(e) {
    const el = e.target;
    const assetId = el.dataset.assetId;
    if (!assetId) return;

    // Formato calculadora: extrai só os dígitos, trata como centavos e shifta pra esquerda.
    // Ex.: digitar "1","2","3","4","5" → "0,01" → "0,12" → "1,23" → "12,34" → "123,45"
    const digits = el.value.replace(/\D/g, '');
    const cents = parseInt(digits || '0', 10);
    const formatted = (cents / 100).toLocaleString('pt-BR', {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2,
    });
    // Atualiza o valor exibido e reposiciona o cursor no fim
    el.value = formatted;
    el.setSelectionRange(formatted.length, formatted.length);

    if (!editState[assetId]) editState[assetId] = { raw: formatted, dirty: false, justSaved: false };
    editState[assetId].raw = formatted;
    editState[assetId].dirty = true;
    editState[assetId].justSaved = false;

    // O input de preço só existe na aba Assets.
    const confirmBtn = _assetsContainer && _assetsContainer.querySelector(`.nx-editable-confirm[data-asset-id="${assetId}"]`);
    if (confirmBtn) confirmBtn.disabled = false;
    const subEl = el.closest('.nx-editable-wrap') && el.closest('.nx-editable-wrap').querySelector('.nx-editable-sub');
    if (subEl) subEl.innerHTML = `<span class="nx-stat-accent">Press Enter or ✓ to save</span>`;
  }

  function handlePriceKeydown(e) {
    if (e.key === 'Enter') {
      const assetId = e.target.dataset.assetId;
      if (assetId) savePriceForAsset(assetId);
    }
  }

  function savePriceForAsset(assetId) {
    const es = editState[assetId];
    if (!es) return;
    const raw = es.raw;
    const val = parseBR(raw);
    if (isNaN(val) || val < 0) return;
    const assets = getAssets();
    const asset = assets.find(a => a.id === assetId);
    if (!asset) return;
    asset.manualUnitPrice = val;
    asset.priceUpdatedAt = new Date().toISOString();
    saveAsset(asset);
    editState[assetId].dirty = false;
    editState[assetId].justSaved = true;
    editState[assetId].raw = fmtBR(val);
    renderAll();
    // clear justSaved after 2s (cosmético — só afeta a aba Assets)
    setTimeout(() => {
      if (editState[assetId]) {
        editState[assetId].justSaved = false;
        renderAssetsPage();
      }
    }, 2000);
  }

  function doSaveNewAsset(container) {
    const name = (container.querySelector('#nm-name') || {}).value || '';
    const ticker = (container.querySelector('#nm-ticker') || {}).value || '';
    const assetClass = (container.querySelector('#nm-class') || {}).value || 'ETF';
    const issuer = (container.querySelector('#nm-issuer') || {}).value || '';
    const maturityDate = (container.querySelector('#nm-maturity') || {}).value || '';
    const region = (container.querySelector('#nm-region') || {}).value || 'BR';
    const notes = (container.querySelector('#nm-notes') || {}).value || '';
    if (!name.trim()) { alert('Name is required.'); return; }
    const m = state.modal || {};
    if (m.type === 'editAsset' && m.data && m.data.id) {
      const arr = getAssets();
      const idx = arr.findIndex(a => a.id === m.data.id);
      if (idx >= 0) {
        arr[idx] = { ...arr[idx], name: name.trim(), ticker: ticker.trim(), assetClass, region, issuer, maturityDate, notes };
        saveAssets(arr);
      }
    } else {
      const asset = { id: generateId(), name: name.trim(), ticker: ticker.trim(), assetClass, region, issuer, maturityDate, notes, manualUnitPrice: 0, priceUpdatedAt: '' };
      saveAsset(asset);
    }
    state.modal = null;
    renderAll();
  }

  function doSaveTx(container, existingId) {
    const assetId = (container.querySelector('#tm-asset') || {}).value || '';
    const type = (container.querySelector('#tm-type') || {}).value || 'buy';
    const date = (container.querySelector('#tm-date') || {}).value || '';
    const quantity = (container.querySelector('#tm-qty') || {}).value || '1';
    const amount = (container.querySelector('#tm-amount') || {}).value || '';
    const notes = (container.querySelector('#tm-notes') || {}).value || '';
    if (!assetId || !date || !amount) {
      // Mostra erro inline em vez de alert()
      const errEl = container.querySelector('#tm-save-error');
      if (errEl) { errEl.textContent = 'Asset, date and amount are required.'; errEl.style.display = 'block'; }
      return;
    }
    const parsedAmount = parseBR(amount); // suporta "1.234,56", "1234,56" e "1234.56"
    const txs = getTxs();
    if (existingId) {
      const idx = txs.findIndex(t => t.id === existingId);
      if (idx >= 0) txs[idx] = { ...txs[idx], assetId, type, date, quantity: parseFloat(quantity)||1, amount: parsedAmount, notes };
    } else {
      txs.push({ id: generateId(), assetId, type, date, quantity: parseFloat(quantity)||1, amount: parsedAmount, notes });
    }
    saveTxs(txs);
    state.modal = null;
    renderAll();
  }

  // ── 10. MOUNT ─────────────────────────────────────────────────────────────

  // Esc fecha o modal Close position (paridade com o cpx.js).
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && state.closeModal) {
      state.closeModal = null;
      renderAssetsPage();
    }
  });

  /* Nexo 4.0: abas registradas no roteador síncrono — sem observers/timeouts.
     A visão Active/Closed é decidida no próprio render (sem pós-patch → sem flick). */
  Nexo.registerTab('investments_transactions', function () {
    return {
      mount(section) {
        injectCSS();
        _txContainer = document.createElement('div');
        _txContainer.id = 'nx-it-root';
        section.appendChild(_txContainer);
        renderTxPage(); // pinta já com dados locais
        loadFromGist().finally(renderAll);
      },
      show() {
        renderTxPage();
        loadFromGist().finally(renderAll);
      },
    };
  });

  Nexo.registerTab('assets', function () {
    return {
      mount(section) {
        injectCSS();
        _assetsContainer = document.createElement('div');
        _assetsContainer.id = 'nx-assets-root';
        section.appendChild(_assetsContainer);
        renderAssetsPage(); // já nasce filtrando fechados — sem flick
        loadFromGist().finally(renderAll);
      },
      show() {
        renderAssetsPage();
        loadFromGist().finally(renderAll);
      },
    };
  });
})();

</script>
<script>
/* ═══ new-investments.js ═══ */

/* ── Nexo — New Investments ─────────────────────────────────────────────── */
(function () {
  'use strict';

  // ── Constants ─────────────────────────────────────────────────────────────
  var ASSETS_KEY     = 'nexo_investment_assets';
  var TXS_KEY        = 'nexo_investment_transactions';
  var STRATEGY_KEY   = 'nexo_target_strategy';
  var REGION_MAP_KEY = 'nexo_asset_region_map';
  var LAST_AMT_KEY   = 'nexo_ni_last_amount';
  var FIXED_INCOME = ['CDB','LCI','LCA','Fund'];

  // 4 buckets — order is important (drives UI and aggressiveness scoring)
  var BUCKET_KEYS = ['rf','rvNac','rvInt','crypto'];
  var BUCKET_META = {
    rf:     { name: 'Fixed Income',         color: '#6B9E7A', riskWeight: 0   },
    rvNac:  { name: 'Domestic Equity',      color: '#E07A5F', riskWeight: 1.0 },
    rvInt:  { name: 'International Equity', color: '#4C7A99', riskWeight: 1.0 },
    crypto: { name: 'Crypto',               color: '#7A3F8F', riskWeight: 1.5 }
  };

  // Risk profiles
  var RISK_PROFILES = [
    { max: 20,  name: 'Very Conservative', color: '#3F6F50' },
    { max: 40,  name: 'Conservative',      color: '#6B9E7A' },

        localStorage.setItem('nexo_bea_settings', JSON.stringify(d.beaSettings));

  async function syncNiToGist() {
    try {
      const resp = await fetch('/api/sync/data');
      if (!resp.ok) return;
      const json = await resp.json();
      if (!json || !json.payload) return;
      const payload = json.payload;
      if (!payload.data) payload.data = {};
      payload.data.targetStrategy   = loadStrategy();
      payload.data.assetRegionMap   = loadRegionMap();
      payload.data.niLastAmount     = parseFloat(localStorage.getItem(LAST_AMT_KEY) || '0') || 0;
      payload.data.beaSettings      = loadBEASettings();
      payload.data.ibovComposition  = loadStoredIbov();   // may be null when no CSV was imported
      if (!payload.meta) payload.meta = {};
      payload.meta.updatedAt = new Date().toISOString();
      await fetch('/api/sync/data', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
    } catch (e) {
      console.warn('[Nexo NI] syncToGist failed:', e);
    }
  }

  function isFixedIncome(cls) { return FIXED_INCOME.indexOf(cls) >= 0; }
  function escHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c];
    });
  }
  function fmtBRL(v, d) {
    if (v == null || isNaN(v)) return 'R$ —';
    var opts = { minimumFractionDigits: d == null ? 2 : d, maximumFractionDigits: d == null ? 2 : d };
    return 'R$ ' + Math.abs(v).toLocaleString('pt-BR', opts);
  }
  function parseBR(str) {
    if (str == null) return 0;
    var s = String(str).trim().replace(/\s/g,'').replace(/R\$/g,'');
    if (s.indexOf(',') >= 0) s = s.replace(/\./g,'').replace(',', '.');
    var n = parseFloat(s);
    return isNaN(n) ? 0 : n;
  }
  function isValidRegion(r) { return r === 'BR' || r === 'INTL' || r === 'CRYPTO'; }
  function getRegion(asset, regionMap) {
    if (isValidRegion(asset.region))            return asset.region;
    if (isValidRegion(regionMap[asset.id]))     return regionMap[asset.id];
    return null; // explicitly unclassified
  }
  function classifyBucket(asset, regionMap) {
    if (isFixedIncome(asset.assetClass) || asset.assetClass === 'Cash') return 'rf';
    var r = getRegion(asset, regionMap);
    if (r === 'INTL')   return 'rvInt';
    if (r === 'CRYPTO') return 'crypto';
    // null or 'BR' → defaults to Domestic Equity for display purposes
    return 'rvNac';
  }

  // ── Aggressiveness scoring ───────────────────────────────────────────────
  // Score = Σ (weight_i × pct_i). Max = 100 × 1.5 (all crypto) = 150.
  // We normalize the threshold buckets against the raw weighted score (not divided).
  // 100% RF → 0;  100% RV  → 100;  100% Crypto → 150.
  function aggressivenessScore(pcts) {
    var sum = 0, total = 0;
    BUCKET_KEYS.forEach(function (k) {
      var p = +pcts[k] || 0;
      sum += p * BUCKET_META[k].riskWeight;
      total += p;
    });
    if (total <= 0) return 0;
    // Re-normalize percentages so they sum to 100 (in case input is unnormalized)
    return sum * (100 / total);
  }
  function riskProfileFor(score) {
    for (var i = 0; i < RISK_PROFILES.length; i++) {
      if (score <= RISK_PROFILES[i].max) return RISK_PROFILES[i];
    }
    return RISK_PROFILES[RISK_PROFILES.length - 1];
  }

  var INDEXED_PROXIES = ['BOVA11', 'BOVB11', 'BBOV11', 'XBOV11', 'BOVV11', 'IBOV11'];

  // ── Imported Ibov composition (from B3 CSV) ──────────────────────────────
  var STORED_IBOV_KEY = 'nexo_ibov_composition';
  function loadStoredIbov() {
    var d = loadJSON(STORED_IBOV_KEY, 'null');
    if (!d || !Array.isArray(d.stocks) || d.stocks.length === 0) return null;
    return d;

  function getActiveIbovSnapshot() {
    var stored = loadStoredIbov();
    if (stored) {
      return {
        date: 'Carteira do Dia ' + (stored.compositionDate || '?') + ' (imported)',
        stocks: stored.stocks,

    return { date: IBOV_SNAPSHOT.date, stocks: IBOV_SNAPSHOT.stocks, imported: false };
