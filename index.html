<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Cpath%20d%3D%22M16%2050V14L48%2050V14%22%20fill%3D%22none%22%20stroke%3D%22%23E07A5F%22%20stroke-width%3D%228%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3C%2Fsvg%3E" />
    <title>Nexo</title>
    <style>

@import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&display=swap');
:root {
  --bg: #FBF7F4; --surface: #FFFFFF; --surface-hover: #F9F5F2;
  --text: #2D2A26; --text-secondary: #7A756F; --border: #EDE8E3;
  --accent: #E07A5F; --accent-light: #FDF0ED;
  --shadow-sm: 0 1px 3px rgba(45,42,38,0.04), 0 1px 2px rgba(45,42,38,0.06);
  --shadow-md: 0 4px 16px rgba(45,42,38,0.06), 0 2px 6px rgba(45,42,38,0.04);
  --shadow-lg: 0 12px 40px rgba(45,42,38,0.08);
  --radius: 16px; --radius-sm: 10px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body, #root { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
.app { display: flex; min-height: 100vh; }
.sidebar { width: 240px; background: var(--surface); border-right: 1px solid var(--border); padding: 28px 16px; display: flex; flex-direction: column; gap: 4px; position: fixed; top: 0; left: 0; height: 100vh; z-index: 10; }
.sidebar-brand { font-family: 'Fraunces', serif; font-size: 22px; font-weight: 700; color: var(--accent); padding: 0 12px 24px; letter-spacing: -0.5px; }
.sidebar-brand-subline { margin-top: 2px; display: flex; align-items: center; gap: 6px; }
.sidebar-brand-subline span { font-size: 14px; color: var(--text-secondary); font-family: 'DM Sans', sans-serif; font-weight: 400; line-height: 1.2; }
.brand-edit-btn { width: 22px; height: 22px; border: 1px solid var(--border); border-radius: 7px; background: var(--surface); color: var(--text-secondary); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.15s; }
.brand-edit-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }
.brand-edit-btn svg { width: 12px; height: 12px; }
.sync-card { margin: 0 8px 10px; padding: 10px; border: 1px solid var(--border); border-radius: 12px; background: var(--bg); }
.sync-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--text-secondary); font-weight: 600; margin-bottom: 6px; }
.sync-status { font-size: 12px; color: var(--text-secondary); margin-bottom: 8px; line-height: 1.35; }
.sync-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.sync-actions .btn { padding: 7px 10px; font-size: 12px; }
.nav-bottom { margin-top: auto; padding-top: 8px; border-top: 1px solid var(--border); }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-radius: var(--radius-sm); cursor: pointer; transition: all 0.2s; font-size: 14.5px; font-weight: 500; color: var(--text-secondary); border: none; background: none; width: 100%; text-align: left; }
.nav-item:hover { background: var(--surface-hover); color: var(--text); }
.nav-item.active { background: var(--accent-light); color: var(--accent); font-weight: 600; }
.nav-item svg { width: 20px; height: 20px; flex-shrink: 0; }
.main { margin-left: 240px; flex: 1; padding: 32px 40px; max-width: 1100px; }
.page-title { font-family: 'Fraunces', serif; font-size: 28px; font-weight: 700; margin-bottom: 6px; letter-spacing: -0.5px; }
.page-sub { color: var(--text-secondary); font-size: 14.5px; margin-bottom: 28px; }
.stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 28px; }
.stat-card { background: var(--surface); border-radius: var(--radius); padding: 20px 22px; box-shadow: var(--shadow-sm); border: 1px solid var(--border); transition: transform 0.2s, box-shadow 0.2s; }
.stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.stat-label { font-size: 12.5px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.8px; font-weight: 500; }
.stat-value { font-family: 'Fraunces', serif; font-size: 26px; font-weight: 700; margin-top: 6px; letter-spacing: -0.5px; }
.stat-change { font-size: 12px; margin-top: 4px; font-weight: 500; }
.stat-change.up { color: #E07A5F; } .stat-change.down { color: #81B29A; }
.card { background: var(--surface); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow-sm); border: 1px solid var(--border); margin-bottom: 20px; }
.card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; flex-wrap: wrap; gap: 10px; }
.card-title { font-family: 'Fraunces', serif; font-size: 18px; font-weight: 600; }
.grid-2 { display: grid; grid-template-columns: 1.4fr 1fr; gap: 20px; }
.expense-row { display: flex; align-items: center; gap: 14px; padding: 13px 0; border-bottom: 1px solid var(--border); transition: background 0.15s; }
.expense-row:last-child { border-bottom: none; }
.expense-icon { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
.expense-info { flex: 1; min-width: 0; }
.expense-desc { font-weight: 500; font-size: 14px; }
.expense-meta { font-size: 12.5px; color: var(--text-secondary); margin-top: 2px; }
.expense-amount { font-family: 'Fraunces', serif; font-weight: 600; font-size: 16px; white-space: nowrap; }
.expense-actions { display: flex; gap: 4px; opacity: 0; transition: opacity 0.15s; }
.expense-row:hover .expense-actions { opacity: 1; }
.action-btn { width: 32px; height: 32px; border-radius: 8px; border: none; background: none; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text-secondary); transition: all 0.15s; }
.action-btn:hover { background: var(--surface-hover); color: var(--text); }
.action-btn.del:hover { background: #FEE; color: #D44; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 18px; border-radius: var(--radius-sm); border: none; font-family: 'DM Sans', sans-serif; font-size: 13.5px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
.btn-primary { background: var(--accent); color: white; }
.btn-primary:hover { background: #c96a52; transform: translateY(-1px); box-shadow: var(--shadow-md); }
.btn-ghost { background: none; color: var(--text-secondary); }
.btn-ghost:hover { background: var(--surface-hover); color: var(--text); }
.btn-outline { background: none; border: 1.5px solid var(--border); color: var(--text); }
.btn-outline:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }
.btn-danger { background: #FEE; color: #D44; border: 1px solid #FCC; }
.btn-danger:hover { background: #FDD; }
.modal-overlay { position: fixed; inset: 0; background: rgba(45,42,38,0.3); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 100; animation: fadeIn 0.2s; }
.modal { background: var(--surface); border-radius: 20px; padding: 32px; width: 480px; max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow-lg); animation: slideUp 0.25s ease-out; }
.modal h2 { font-family: 'Fraunces', serif; font-size: 22px; margin-bottom: 24px; }
.form-group { margin-bottom: 18px; }
.form-label { display: block; font-size: 12.5px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 6px; }
.form-input { width: 100%; padding: 10px 14px; border: 1.5px solid var(--border); border-radius: var(--radius-sm); font-family: 'DM Sans', sans-serif; font-size: 14px; outline: none; transition: border 0.2s; background: var(--bg); }
.form-input:focus { border-color: var(--accent); }
select.form-input { cursor: pointer; }
.cat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.cat-option { padding: 10px 6px; border-radius: var(--radius-sm); border: 1.5px solid var(--border); background: none; cursor: pointer; text-align: center; font-size: 11.5px; font-weight: 500; transition: all 0.15s; font-family: 'DM Sans', sans-serif; color: var(--text-secondary); }
.cat-option:hover { border-color: #ccc; }
.cat-option.selected { border-color: var(--accent); background: var(--accent-light); color: var(--accent); }
.cat-option .ico { font-size: 20px; display: block; margin-bottom: 4px; }
.budget-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
.budget-row:last-child { border-bottom: none; }
.budget-bar-bg { flex: 1; height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; }
.budget-bar { height: 100%; border-radius: 4px; transition: width 0.6s ease; }
.budget-label { width: 100px; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 6px; }
.budget-nums { font-size: 12px; color: var(--text-secondary); width: 120px; text-align: right; white-space: nowrap; }
.tab-bar { display: flex; gap: 4px; background: var(--bg); border-radius: var(--radius-sm); padding: 4px; margin-bottom: 20px; width: fit-content; }
.tab { padding: 8px 16px; border-radius: 8px; border: none; background: none; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer; color: var(--text-secondary); transition: all 0.15s; }
.tab.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }
.empty-state { text-align: center; padding: 48px 20px; color: var(--text-secondary); }
.empty-state .ico { font-size: 40px; margin-bottom: 12px; }
.upload-zone { border: 2px dashed var(--border); border-radius: var(--radius); padding: 32px; text-align: center; cursor: pointer; transition: all 0.2s; background: var(--bg); }
.upload-zone:hover, .upload-zone.drag { border-color: var(--accent); background: var(--accent-light); }
.upload-zone .ico { font-size: 36px; margin-bottom: 8px; }
.upload-zone p { font-size: 14px; color: var(--text-secondary); }
.upload-zone .hint { font-size: 12px; color: var(--text-secondary); margin-top: 6px; opacity: 0.7; }
.import-preview { max-height: 300px; overflow-y: auto; margin: 16px 0; }
.import-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.import-row:last-child { border-bottom: none; }
.toast { position: fixed; bottom: 24px; right: 24px; background: var(--surface); border-radius: var(--radius-sm); padding: 14px 20px; box-shadow: var(--shadow-lg); border: 1px solid var(--border); animation: slideUp 0.3s ease-out; z-index: 200; display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 500; }
.tooltip-custom { background: var(--surface) !important; border: 1px solid var(--border) !important; border-radius: 10px !important; box-shadow: var(--shadow-md) !important; padding: 10px 14px !important; font-family: 'DM Sans', sans-serif !important; }
@keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
@keyframes slideUp { from { opacity: 0; transform: translateY(12px) } to { opacity: 1; transform: translateY(0) } }
@media (max-width: 900px) { .sidebar { display: none; } .main { margin-left: 0; padding: 20px; padding-top: 100px; } .stats-row { grid-template-columns: repeat(2, 1fr); } .grid-2 { grid-template-columns: 1fr; } }

/* ── Nexo 4.0 extras ── */
.nx-view { min-height: 100%; }
#nx-total{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;background:var(--surface,#fff);border:1px solid var(--border,#e5e7eb);border-radius:10px;padding:14px 20px;margin-bottom:16px;box-shadow:var(--shadow-sm,0 1px 3px rgba(0,0,0,.06));}
#nx-total .nx-t-label{font-size:13px;font-weight:600;color:var(--text-secondary,#6b7280);text-transform:uppercase;letter-spacing:.5px;}
#nx-total .nx-t-right{display:flex;flex-direction:column;align-items:flex-end;gap:2px;}
#nx-total .nx-t-val{font-size:20px;font-weight:700;color:var(--accent,#E07A5F);letter-spacing:-.4px;}
#nx-total .nx-t-count{font-size:12px;color:var(--text-secondary,#6b7280);}

    </style>

  <body>
    <div class="app">
      <nav class="sidebar"></nav>
      <main class="main"></main>
    </div>
<script>
/* ═══ gist-sync.js ═══ */

(() => {
  const CONFIG_KEY = "nexo_github_sync_config";
  const SHA_KEY = "nexo_github_sync_sha";
  const originalFetch = window.fetch.bind(window);

  function loadConfig() {
    try { return JSON.parse(localStorage.getItem(CONFIG_KEY) || "null"); } catch { return null; }
  }

  function saveConfig(config) {
    localStorage.setItem(CONFIG_KEY, JSON.stringify(config));
  }

  function encodeUtf8Base64(text) {
    const bytes = new TextEncoder().encode(text);
    let binary = "";
    bytes.forEach((byte) => { binary += String.fromCharCode(byte); });
    return btoa(binary);
  }

  function decodeUtf8Base64(base64) {
    const binary = atob(String(base64 || "").replace(/\n/g, ""));
    const bytes = Uint8Array.from(binary, (char) => char.charCodeAt(0));
    return new TextDecoder().decode(bytes);
  }

  const GIST_DESCRIPTION = "Nexo HTML Sync Database";
  const GIST_FILE_NAME = "data-nexo.json";

  async function githubRequest(config, url, options = {}) {
    const headers = {
      Accept: "application/vnd.github+json",
      "X-GitHub-Api-Version": "2022-11-28",
      ...(options.headers || {}),
    };
    if (config.token) headers.Authorization = `Bearer ${config.token}`;
    return originalFetch(url, { ...options, headers });
  }

  async function findNexoGist(config) {
    const cachedId = localStorage.getItem(SHA_KEY) || "";
    if (cachedId) {
      const cached = await githubRequest(config, `https://api.github.com/gists/${cachedId}`, { cache: "no-store" });
      if (cached.ok) return cached.json();
      localStorage.removeItem(SHA_KEY);
    }

    const response = await githubRequest(config, "https://api.github.com/gists?per_page=100", { cache: "no-store" });
    if (!response.ok) throw new Error(`GitHub Gist search failed (${response.status})`);
    const gists = await response.json();
    const gist = Array.isArray(gists)
      ? gists.find((item) => item.description === GIST_DESCRIPTION && item.files && item.files[GIST_FILE_NAME])
      : null;
    if (gist?.id) {
      localStorage.setItem(SHA_KEY, gist.id);
      const full = await githubRequest(config, `https://api.github.com/gists/${gist.id}`, { cache: "no-store" });
      if (!full.ok) throw new Error(`GitHub Gist read failed (${full.status})`);
      return full.json();
    }
    return null;
  }

  async function readGistPayload(config) {
    const gist = await findNexoGist(config);
    if (!gist) return { exists: false, fileName: GIST_FILE_NAME, payload: null };
    const file = gist.files?.[GIST_FILE_NAME];
    if (!file) return { exists: false, fileName: GIST_FILE_NAME, payload: null };
    let text = file.content || "";
    if (file.truncated && file.raw_url) {
      const raw = await githubRequest(config, file.raw_url, { cache: "no-store" });
      if (!raw.ok) throw new Error(`GitHub Gist raw read failed (${raw.status})`);
      text = await raw.text();
    }
    const payload = text.trim() ? JSON.parse(text) : null;
    return { exists: true, fileName: GIST_FILE_NAME, payload };
  }

  async function writeGistPayload(config, payload) {
    const content = JSON.stringify(payload, null, 2);
    const gist = await findNexoGist(config);
    const body = {
      description: GIST_DESCRIPTION,
      public: false,
      files: { [GIST_FILE_NAME]: { content } },
    };
    const url = gist?.id ? `https://api.github.com/gists/${gist.id}` : "https://api.github.com/gists";
    const response = await githubRequest(config, url, {
      method: gist?.id ? "PATCH" : "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    if (!response.ok) {
      const details = await response.text().catch(() => "");
      throw new Error(`GitHub Gist write failed (${response.status}) ${details}`);
    }
    const data = await response.json();
    if (data?.id) localStorage.setItem(SHA_KEY, data.id);
    return { ok: true, fileName: GIST_FILE_NAME };
  }
  function jsonResponse(body, status = 200) {
    return new Response(JSON.stringify(body), {
      status,
      headers: { "Content-Type": "application/json; charset=utf-8" },
    });
  }

  // ── Migração de categorias: "delivery" foi fundido em "restaurants"
  //    (rótulo "Food & Beverages"). Remapeia tanto na leitura quanto na
  //    escrita do Gist, de forma idempotente, para não deixar lançamentos
  //    antigos órfãos. Roda no carregamento e persiste no próximo save.
  function nexoMigrateCategories(data) {
    if (!data || typeof data !== "object") return;
    if (Array.isArray(data.expenses)) {
      data.expenses.forEach((e) => { if (e && e.category === "delivery") e.category = "restaurants"; });
    }
    if (data.budgets && typeof data.budgets === "object" && data.budgets.delivery != null) {
      const dv = Number(data.budgets.delivery) || 0;
      data.budgets.restaurants = (Number(data.budgets.restaurants) || 0) + dv;
      delete data.budgets.delivery;
    }
    if (Array.isArray(data.customCategories)) {
      data.customCategories = data.customCategories.filter((c) => !(c && c.id === "delivery"));
    }
  }

  // Preserva meta.lastBackup (marca de "backup feito", usada pelo lembrete e
  // compartilhada via Gist entre dispositivos). Os saves normais do app
  // reconstroem o meta e apagariam esse campo — então recapturamos na leitura
  // e re-injetamos em toda escrita.
  var nexoLastBackup = null;
  function nexoCaptureBackup(payload) {
    if (payload && payload.meta && payload.meta.lastBackup) nexoLastBackup = payload.meta.lastBackup;
  }
  function nexoInjectBackup(payload) {
    if (!payload) return;
    if (payload.meta && payload.meta.lastBackup) { nexoLastBackup = payload.meta.lastBackup; return; }
    if (nexoLastBackup) { if (!payload.meta) payload.meta = {}; payload.meta.lastBackup = nexoLastBackup; }
  }

  window.fetch = async (input, init = {}) => {
    const url = typeof input === "string" ? input : input?.url;
    const method = String(init?.method || input?.method || "GET").toUpperCase();
    if (url === "/api/sync/status") {
      const config = loadConfig();
      if (!config?.token) return jsonResponse({ available: false, mode: "gist", exists: false }, 503);
      return jsonResponse({ available: true, mode: "gist", fileName: GIST_FILE_NAME, exists: true });
    }
    if (url === "/api/sync/data") {
      const config = loadConfig();
      if (!config?.token) return jsonResponse({ error: "GitHub Gist sync is not configured" }, 503);
      try {
        if (method === "GET") {
          const result = await readGistPayload(config);
          if (result && result.payload && result.payload.data) nexoMigrateCategories(result.payload.data);
          if (result && result.payload) nexoCaptureBackup(result.payload);
          return jsonResponse(result);
        }
        if (method === "PUT") {
          const incoming = JSON.parse(init.body || "null");
          if (incoming && incoming.data) nexoMigrateCategories(incoming.data);
          nexoInjectBackup(incoming);
          return jsonResponse(await writeGistPayload(config, incoming));
        }
        return jsonResponse({ error: "Method Not Allowed" }, 405);
      } catch (error) {
        console.error(error);
        return jsonResponse({ error: String(error?.message || error) }, 500);
      }
    }
    return originalFetch(input, init);
  };

  function mountPanel() {
    if (document.getElementById("nexo-github-panel")) return;
    const panel = document.createElement("div");
    panel.id = "nexo-github-panel";
    panel.innerHTML = `
      <button type="button" class="nexo-gh-toggle" title="GitHub sync">GitHub</button>
      <form class="nexo-gh-form" hidden>
        <strong>GitHub Gist sync</strong>
        <input name="token" type="password" placeholder="GitHub token with Gist access" autocomplete="off" />
        <div class="nexo-gh-actions">
          <button type="submit">Save</button>
          <button type="button" data-clear>Clear</button>
        </div>
        <button type="button" class="nexo-gh-import" data-import>Import JSON to Gist</button>
        <button type="button" class="nexo-gh-import" data-reveal-token>Reveal Token</button>
        <input type="file" data-import-file accept=".json,application/json" hidden />
        <small>Nexo will create or reuse a secret Gist named Nexo HTML Sync Database.</small>
      </form>`;
    document.body.appendChild(panel);
    const form = panel.querySelector("form");
    const config = loadConfig() || {};
    form.elements.token.value = config.token || "";
    panel.querySelector(".nexo-gh-toggle").addEventListener("click", () => { form.hidden = !form.hidden; });
    panel.querySelector("[data-clear]").addEventListener("click", () => {
      localStorage.removeItem(CONFIG_KEY);
      localStorage.removeItem(SHA_KEY);
      alert("GitHub sync settings cleared. Reloading Nexo.");
      location.reload();
    });
    const importInput = panel.querySelector("[data-import-file]");
    panel.querySelector("[data-reveal-token]").addEventListener("click", async () => {
      const typedToken = form.elements.token.value.trim();
      if (typedToken) saveConfig({ token: typedToken });
      const savedToken = loadConfig()?.token || "";
      if (!savedToken) {
        alert("No GitHub token is saved in this browser yet.");
        return;
      }
      const shouldReveal = confirm("Reveal your saved GitHub token? Only do this on a device you trust.");
      if (!shouldReveal) return;
      try { await navigator.clipboard?.writeText(savedToken); } catch {}
      prompt("Saved GitHub token. It was copied if your browser allowed it:", savedToken);
    });
    panel.querySelector("[data-import]").addEventListener("click", () => {
      const typedToken = form.elements.token.value.trim();
      if (typedToken) saveConfig({ token: typedToken });
      const configForImport = loadConfig();
      if (!configForImport?.token) {
        alert("Save your GitHub Gist token before importing the old Nexo JSON file.");
        return;
      }
      importInput.click();
    });
    importInput.addEventListener("change", async () => {
      const file = importInput.files?.[0];
      importInput.value = "";
      if (!file) return;
      try {
        const text = await file.text();
        const payload = JSON.parse(text);
        if (!payload || typeof payload !== "object" || !payload.data) {
          alert("This does not look like a Nexo sync JSON file.");
          return;
        }
        await writeGistPayload(loadConfig(), payload);

  function cleanOptionsSyncPanel() {

  }

    .nexo-gh-form strong{display:block;font-size:13px;margin-bottom:8px}.nexo-gh-form input{width:100%;box-sizing:border-box;margin:4px 0;padding:8px;border:1px solid #cbd5e1;border-radius:6px;font-size:12px}.nexo-gh-actions{display:flex;gap:8px;margin-top:8px}.nexo-gh-actions button{flex:1;border:0;border-radius:6px;padding:8px;font-weight:700;cursor:pointer}.nexo-gh-actions button:first-child{background:#2563eb;color:#fff}.nexo-gh-actions button:last-child{background:#e5e7eb;color:#111827}.nexo-gh-import{width:100%;margin-top:8px;border:1px solid #cbd5e1;border-radius:6px;background:#fff;color:#111827;padding:8px;font-weight:700;cursor:pointer}.nexo-gh-form small{display:block;margin-top:8px;color:#64748b;line-height:1.35}

  `;
  document.head.appendChild(style);
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", () => { mountPanel(); watchAboutTutorial(); }); else { mountPanel(); watchAboutTutorial(); }
})();
    
</script>
<script>
/* ═══ core.js ═══ */
/* ══════════════════════════════════════════════════════════════════════════
   Nexo 4.0 — Core (store + router + ui)
   Sem React. Vanilla JS. Mesmo formato de dados do Nexo 3.x.
   ══════════════════════════════════════════════════════════════════════════ */
(function () {
  'use strict';

  const Nexo = (window.Nexo = window.Nexo || {});

  /* ── Formatação e utilidades ─────────────────────────────────────────── */
  const fmtMoney = (e) =>
    new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(Number(e) || 0);
  const fmtPct = (e) => `${(Number(e) || 0).toFixed(2)}%`;
  const fmtNumber2 = (n) =>
    new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(Number(n) || 0);

  // parse "R$ 1.234,56" | "1234.56" | 1234.56 → Number  (fiel ao Me() do 3.x)
  function parseMoney(e) {
    if (typeof e === 'number') return e;
    if (e == null) return 0;
    const t = String(e).trim();
    if (!t) return 0;
    const n = t.replace(/\s/g, '').replace(/^R\$\s?/, '');
    const hasC = n.includes(','), hasD = n.includes('.');
    let a = n;
    if (hasC && hasD) a = n.replace(/\./g, '').replace(',', '.');
    else if (hasC) a = n.replace(',', '.');
    return Number.parseFloat(a) || 0;
  }
  // input monetário em centavos (fiel a qn/Rn/Ho do 3.x)
  const centsFromValue = (e) => { const t = Math.round(parseMoney(e) * 100); return t > 0 ? String(t) : ''; };
  const centsToNumber = (e) => (Number(e) || 0) / 100;
  const fmtCents = (e) => fmtMoney(centsToNumber(e));

  // Datas: sempre em horário local, nunca UTC (fiel a te() do 3.x)
  function parseDate(e) {
    if (e instanceof Date && !isNaN(e)) return e;
    if (typeof e === 'string') {
      const m = e.match(/^(\d{4})-(\d{2})-(\d{2})/);
      if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
      const d = new Date(e);
      if (!isNaN(d)) return d;
    }
    return new Date(NaN);
  }
  const pad2 = (n) => String(n).padStart(2, '0');
  const toISODate = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
  const todayISO = () => toISODate(new Date());
  const monthKey = (dateStrOrDate) => {
    const d = dateStrOrDate instanceof Date ? dateStrOrDate : parseDate(dateStrOrDate);
    return isNaN(d) ? '' : `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`;
  };
  const daysInMonth = (y, m0) => new Date(y, m0 + 1, 0).getDate();

  const MONTHS_EN = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const MONTHS_PT = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];

  const esc = (s) =>
    String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // el('div', {className:'card', onclick:fn}, child1, 'texto', ...)
  function el(tag, attrs, ...children) {
    const node = document.createElement(tag);
    if (attrs) {
      for (const k in attrs) {
        const v = attrs[k];
        if (v == null) continue;
        if (k === 'className') node.className = v;
        else if (k === 'style' && typeof v === 'object') Object.assign(node.style, v);
        else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2).toLowerCase(), v);
        else if (k === 'dataset') Object.assign(node.dataset, v);
        else if (k === 'html') node.innerHTML = v;
        else if (k in node && k !== 'list' && k !== 'form') { try { node[k] = v; } catch (_) { node.setAttribute(k, v); } }
        else node.setAttribute(k, v);
      }
    }
    for (const c of children.flat(Infinity)) {
      if (c == null || c === false) continue;
      node.appendChild(c instanceof Node ? c : document.createTextNode(String(c)));
    }
    return node;
  }

  function debounce(fn, ms) {
    let t = null;
    const d = function (...a) { clearTimeout(t); t = setTimeout(() => fn.apply(this, a), ms); };
    d.flush = () => { clearTimeout(t); fn(); };
    d.cancel = () => clearTimeout(t);
    return d;
  }

  // id numérico (expenses/incomes, fiel ao 3.x) e id string (loans etc.)
  let _lastNumId = 0;
  const numId = () => { let n = Date.now(); if (n <= _lastNumId) n = _lastNumId + 1; _lastNumId = n; return n; };
  const uid = (prefix) => `${prefix}_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;

  Nexo.util = { fmtMoney, fmtPct, fmtNumber2, parseMoney, centsFromValue, centsToNumber, fmtCents,
    parseDate, toISODate, todayISO, monthKey, daysInMonth, pad2, MONTHS_EN, MONTHS_PT, esc, el, debounce, numId, uid };

  /* ── Categorias ──────────────────────────────────────────────────────── */
  const DEFAULT_CATEGORIES = [
    { id: 'shopping', name: 'Shopping', icon: '🛍️', color: '#BC6C8A', bg: '#F8EDF2' },
    { id: 'education', name: 'Education', icon: '📚', color: '#5C80BC', bg: '#EEF3FB' },
    { id: 'groceries', name: 'Groceries', icon: '🛒', color: '#E07A5F', bg: '#FDF0ED' },
    { id: 'car', name: 'Car', icon: '🚗', color: '#3D85C6', bg: '#EBF3FA' },
    { id: 'restaurants', name: 'Food & Beverages', icon: '🍽️', color: '#A45C7A', bg: '#F8EDF2' },
    { id: 'pets', name: 'Pets', icon: '🐾', color: '#7A9E7E', bg: '#EEF6F0' },
    { id: 'housing', name: 'Housing', icon: '🏠', color: '#81B29A', bg: '#EEF6F2' },
    { id: 'subscriptions', name: 'Subscriptions', icon: '🔁', color: '#7B6ED6', bg: '#F1EEFD' },
    { id: 'health_personal_care', name: 'Health / Personal Care', icon: '🧴', color: '#F2994A', bg: '#FEF4EB' },
    { id: 'trip', name: 'Trip', icon: '✈️', color: '#4ECDC4', bg: '#E9FAF9' },
    { id: 'other', name: 'Other', icon: '📦', color: '#8D8D8D', bg: '#F2F2F2' },
    { id: 'gifts', name: 'Gifts', icon: '🎁', color: '#D9779B', bg: '#FCEFF4' },
    { id: 'entertainment', name: 'Entertainment', icon: '🎬', color: '#9B72CF', bg: '#F3EEF9' },
  ];
  const DEFAULT_BUDGETS = { shopping: 350, education: 300, groceries: 600, car: 500, restaurants: 500, pets: 180,
    housing: 1300, subscriptions: 120, health_personal_care: 200, trip: 400, other: 100, gifts: 150, entertainment: 200 };
  const NEW_CAT_ICONS = ['🛍️', '📚', '🛒', '🛵', '🚗', '🍷', '🐾', '🏠', '🔁', '🧴', '✈️', '📦', '🎁', '🎬', '💼', '💡', '🎯', '🧾'];
  const NEW_CAT_PALETTE = [
    { color: '#D9779B', bg: '#FCEFF4' }, { color: '#5C80BC', bg: '#EEF3FB' }, { color: '#7B6ED6', bg: '#F1EEFD' },
    { color: '#4ECDC4', bg: '#E9FAF9' }, { color: '#F2994A', bg: '#FEF4EB' }, { color: '#81B29A', bg: '#EEF6F2' },
  ];

  Nexo.categories = {
    defaults: DEFAULT_CATEGORIES,
    newCatIcons: NEW_CAT_ICONS,
    newCatPalette: NEW_CAT_PALETTE,
    all() { return DEFAULT_CATEGORIES.concat(Nexo.store.data.customCategories || []); },
    byId(id) {
      return this.all().find((c) => c.id === id) ||
        { id, name: id || 'Other', icon: '📦', color: '#8D8D8D', bg: '#F2F2F2' };
    },
  };

  /* ── Store ───────────────────────────────────────────────────────────── */
  const LS_KEYS = {
    expenses: 'spend_tracker_expenses',
    incomes: 'spend_tracker_income',
    loans: 'spend_tracker_loans',
    customCategories: 'spend_tracker_custom_categories',
    budgets: 'spend_tracker_budgets',
    brandSubtitle: 'spend_tracker_brand_subtitle',
    dashboardPeriod: 'spend_tracker_dashboard_period',
  };
  const LS_INV_ASSETS = 'nexo_investment_assets';
  const LS_INV_TXS = 'nexo_investment_transactions';

  function lsGet(key, fallback) {
    try { const v = localStorage.getItem(key); return v == null ? fallback : JSON.parse(v); }
    catch (_) { return fallback; }
  }
  function lsSet(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (_) {} }

  const sanitizeSubtitle = (v) => { const t = String(v == null ? '' : v).trim().slice(0, 32); return t || 'Nexo'; };

  const store = (Nexo.store = {
    data: {
      expenses: [], incomes: [], loans: [], customCategories: [],
      budgets: Object.assign({}, DEFAULT_BUDGETS),
      brandSubtitle: 'Nexo',
      dashboardPeriod: { type: 'thisMonth', from: '', to: '' },
    },
    syncMode: 'none',        // 'server' (Gist) | 'local'
    lastSyncedAt: null,
    lastError: null,
    loaded: false,

    _applyData(d) {
      if (!d || typeof d !== 'object') return;
      const t = this.data;
      if (Array.isArray(d.expenses)) t.expenses = d.expenses;
      if (Array.isArray(d.incomes)) t.incomes = d.incomes;
      if (Array.isArray(d.loans)) t.loans = d.loans;
      if (Array.isArray(d.customCategories)) t.customCategories = d.customCategories;
      if (d.budgets && typeof d.budgets === 'object') t.budgets = Object.assign({}, DEFAULT_BUDGETS, d.budgets);
      if (d.brandSubtitle != null) t.brandSubtitle = sanitizeSubtitle(d.brandSubtitle);
      if (d.dashboardPeriod && typeof d.dashboardPeriod === 'object')
        t.dashboardPeriod = { type: d.dashboardPeriod.type || 'thisMonth', from: d.dashboardPeriod.from || '', to: d.dashboardPeriod.to || '' };
      // investimentos: os módulos de investimento leem direto do localStorage
      if (Array.isArray(d.investmentAssets)) lsSet('nexo_investment_assets', d.investmentAssets);
      if (Array.isArray(d.investmentTransactions)) lsSet('nexo_investment_transactions', d.investmentTransactions);
    },

    _mirror() {
      const t = this.data;
      lsSet(LS_KEYS.expenses, t.expenses);
      lsSet(LS_KEYS.incomes, t.incomes);
      lsSet(LS_KEYS.loans, t.loans);
      lsSet(LS_KEYS.customCategories, t.customCategories);
      lsSet(LS_KEYS.budgets, t.budgets);
      lsSet(LS_KEYS.brandSubtitle, t.brandSubtitle);
      lsSet(LS_KEYS.dashboardPeriod, t.dashboardPeriod);
    },

    _loadLocal() {
      this._applyData({
        expenses: lsGet(LS_KEYS.expenses, []),
        incomes: lsGet(LS_KEYS.incomes, []),
        loans: lsGet(LS_KEYS.loans, []),
        customCategories: lsGet(LS_KEYS.customCategories, []),
        budgets: lsGet(LS_KEYS.budgets, null) || undefined,
        brandSubtitle: lsGet(LS_KEYS.brandSubtitle, null) || undefined,
        dashboardPeriod: lsGet(LS_KEYS.dashboardPeriod, null) || undefined,
      });
    },

    buildPayload() {
      const t = this.data;
      return {
        meta: { app: 'Nexo', version: 1, updatedAt: new Date().toISOString() },
        data: {
          expenses: t.expenses, incomes: t.incomes, loans: t.loans,
          customCategories: t.customCategories, budgets: t.budgets, brandSubtitle: t.brandSubtitle,
          investmentAssets: lsGet(LS_INV_ASSETS, []),
          investmentTransactions: lsGet(LS_INV_TXS, []),
          dashboardPeriod: t.dashboardPeriod,
        },
      };
    },

    async load() {
      this._loadLocal();           // pinta a tela na hora com o espelho local
      this.loaded = true;
      emitData();
      try {
        const st = await fetch('/api/sync/status').then((r) => (r.ok ? r.json() : null)).catch(() => null);
        if (st && st.available) {
          const res = await fetch('/api/sync/data');
          if (res.ok) {
            const body = await res.json();
            if (body && body.payload && body.payload.data) {
              this._applyData(body.payload.data);
              this._mirror();
              this.syncMode = 'server';
              this.lastSyncedAt = body.payload.meta && body.payload.meta.updatedAt || null;
              emitData();
              document.dispatchEvent(new CustomEvent('nexo:sync-state'));
              return;
            }
            if (body && body.exists === false) {
              // Gist configurado mas vazio → sobe o estado local
              this.syncMode = 'server';
              await this._put();
              document.dispatchEvent(new CustomEvent('nexo:sync-state'));
              return;
            }
          }
        }
      } catch (err) { this.lastError = String((err && err.message) || err); }
      this.syncMode = 'local';
      document.dispatchEvent(new CustomEvent('nexo:sync-state'));
    },

    async _put() {
      const payload = this.buildPayload();
      const res = await fetch('/api/sync/data', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      if (!res.ok) throw new Error(`sync PUT failed (${res.status})`);
      this.lastSyncedAt = payload.meta.updatedAt;
      this.lastError = null;
      document.dispatchEvent(new CustomEvent('nexo:sync-state'));
    },

    _scheduleSave: null, // definido abaixo

    // Toda mutação passa por aqui: aplica, espelha, notifica, agenda PUT.
    update(mutator) {
      mutator(this.data);
      this._mirror();
      emitData();
      if (this.syncMode === 'server') this._scheduleSave();
    },

    async syncNow() {
      if (this.syncMode !== 'server') throw new Error('Sync is not configured');
      this._scheduleSave.cancel();
      await this._put();
    },
  });
  store._scheduleSave = debounce(() => {
    store._put().catch((err) => {
      store.lastError = String((err && err.message) || err);
      Nexo.ui.toast('Sync failed — data kept locally');
      document.dispatchEvent(new CustomEvent('nexo:sync-state'));
    });
  }, 900);
  // não perder alterações ao fechar a página com PUT pendente
  window.addEventListener('beforeunload', () => { if (store.syncMode === 'server') store._scheduleSave.flush && store._scheduleSave.flush(); });

  function emitData() { document.dispatchEvent(new CustomEvent('nexo:data')); }
  Nexo.emitData = emitData;

  /* ── UI: toast + modal ───────────────────────────────────────────────── */
  const ui = (Nexo.ui = {});
  ui.toast = function (msg) {
    document.querySelectorAll('.toast').forEach((t) => t.remove());
    const t = el('div', { className: 'toast' }, msg);
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 3000);
  };
  // ui.modal(node) → {close}; fecha por overlay-click e Esc
  ui.modal = function (contentNode, opts) {
    opts = opts || {};
    const overlay = el('div', { className: 'modal-overlay' });
    const box = el('div', { className: 'modal' + (opts.wide ? ' modal-wide' : '') });
    box.addEventListener('click', (e) => e.stopPropagation());
    if (contentNode) box.appendChild(contentNode);
    overlay.appendChild(box);
    function close() {
      overlay.remove();
      document.removeEventListener('keydown', onKey);
      if (opts.onClose) opts.onClose();
    }
    function onKey(e) { if (e.key === 'Escape') close(); }
    overlay.addEventListener('click', close);
    document.addEventListener('keydown', onKey);
    document.body.appendChild(overlay);
    return { close, el: box, overlay };
  };

        let x = clientX - r.left + 14, y = clientY - r.top + 14;
        const tw = tip.offsetWidth, th = tip.offsetHeight;
        if (x + tw > r.width) x = Math.max(0, clientX - r.left - tw - 14);
        if (y + th > r.height) y = Math.max(0, clientY - r.top - th - 14);
        tip.style.left = x + 'px';
        tip.style.top = y + 'px';
      },
      hide() { tip.style.display = 'none'; },
    };
  }
  function tipRow(name, value, color) {
    return '<div style="display:flex;justify-content:space-between;gap:12px;font-size:13px;margin-top:4px">' +
      '<span style="color:var(--text-secondary)">' + U.esc(name) + '</span>' +
      '<span style="font-weight:600;color:' + color + '">' + U.esc(U.fmtMoney(value)) + '</span></div>';

  // Spending Trend: area chart com 2 séries (amountAll azul, amount laranja com gradiente)
  function drawTrendChart(box, data) {
    box.innerHTML = '';
    const W = Math.max(280, box.clientWidth || 560), H = 220;
    const m = { top: 12, right: 8, bottom: 24, left: 8 };
    const iw = W - m.left - m.right, ih = H - m.top - m.bottom;
    const n = data.length;
    if (!n) return;
    const maxV = Math.max.apply(null, data.map((p) => Math.max(amt(p.amount), amt(p.amountAll))));
    const yMax = niceCeil(Math.max(maxV, 1e-9));
    const xAt = (i) => (n === 1 ? m.left + iw / 2 : m.left + (i * iw) / (n - 1));
    const yAt = (v) => m.top + ih - (Math.max(0, v) / yMax) * ih;
    const baseY = m.top + ih;
    const ptsAll = data.map((p, i) => [xAt(i), yAt(amt(p.amountAll))]);
    const ptsBud = data.map((p, i) => [xAt(i), yAt(amt(p.amount))]);

    const svg = svgEl('svg', { width: W, height: H, viewBox: `0 0 ${W} ${H}` });
    svg.style.display = 'block';

    const defs = svgEl('defs');
    const grad = svgEl('linearGradient', { id: 'nx4-grad-trend', x1: '0', y1: '0', x2: '0', y2: '1' });
    grad.appendChild(svgEl('stop', { offset: '0%', 'stop-color': '#E07A5F', 'stop-opacity': '0.2' }));
    grad.appendChild(svgEl('stop', { offset: '100%', 'stop-color': '#E07A5F', 'stop-opacity': '0' }));
    defs.appendChild(grad);
    svg.appendChild(defs);

    if (n > 1) {
      const budLine = smoothPath(ptsBud);
      svg.appendChild(svgEl('path', {
        d: budLine + 'L' + ptsBud[n - 1][0] + ',' + baseY + 'L' + ptsBud[0][0] + ',' + baseY + 'Z',
        fill: 'url(#nx4-grad-trend)', stroke: 'none',
      }));
      svg.appendChild(svgEl('path', { d: smoothPath(ptsAll), fill: 'none', stroke: '#5C80BC', 'stroke-width': '2.2' }));
      svg.appendChild(svgEl('path', { d: budLine, fill: 'none', stroke: '#E07A5F', 'stroke-width': '2.5' }));
    } else {
      svg.appendChild(svgEl('circle', { cx: ptsAll[0][0], cy: ptsAll[0][1], r: 3.5, fill: '#5C80BC' }));
      svg.appendChild(svgEl('circle', { cx: ptsBud[0][0], cy: ptsBud[0][1], r: 3.5, fill: '#E07A5F' }));
    }

    // rótulos do eixo X (pula ticks quando há muitos pontos)
    const step = Math.max(1, Math.ceil(n / 12));
    for (let i = 0; i < n; i += step) {
      const t = svgEl('text', {
        x: xAt(i), y: H - 6, 'text-anchor': 'middle', 'font-size': '12', fill: '#7A756F',
        'font-family': "'DM Sans', sans-serif",
      });
      t.textContent = data[i].month;
      svg.appendChild(t);
    }

    // linha-cursor + tooltip
    const cursor = svgEl('line', {
      x1: 0, y1: m.top, x2: 0, y2: baseY, stroke: '#CCC7C1', 'stroke-width': '1',
      'stroke-dasharray': '3 3', visibility: 'hidden',
    });
    svg.appendChild(cursor);
    const tip = attachTooltip(box);
    svg.addEventListener('mousemove', (e) => {
      const r = svg.getBoundingClientRect();
      const px = e.clientX - r.left;
      let idx = n === 1 ? 0 : Math.round(((px - m.left) / iw) * (n - 1));
      idx = Math.max(0, Math.min(n - 1, idx));
      const p = data[idx];
      cursor.setAttribute('x1', xAt(idx));
      cursor.setAttribute('x2', xAt(idx));
      cursor.setAttribute('visibility', 'visible');
      const html =
        '<div style="font-size:12px;color:var(--text-secondary);margin-bottom:4px">' + U.esc(p.label) + '</div>' +
        tipRow('All expenses', amt(p.amountAll), '#5C80BC') +
        tipRow('Budget expenses', amt(p.amount), '#E07A5F');
      tip.show(html, e.clientX, e.clientY);
    });
    svg.addEventListener('mouseleave', () => {
      cursor.setAttribute('visibility', 'hidden');
      tip.hide();
    });

    box.appendChild(svg);
  }

  // By Category: donut 140×140 (innerRadius 38, outerRadius 62, stroke #FBF7F4)
  function drawDonut(box, slices, tipHost) {
    box.innerHTML = '';
    const size = 140, cx = 70, cy = 70, rIn = 38, rOut = 62;
    const total = slices.reduce((s, x) => s + x.value, 0);
    if (total <= 0) return;
    const svg = svgEl('svg', { width: size, height: size, viewBox: `0 0 ${size} ${size}` });
    svg.style.display = 'block';
    const polar = (r, ang) => [cx + r * Math.cos(ang), cy + r * Math.sin(ang)];
    const tip = attachTooltip(tipHost);
    let a0 = -Math.PI / 2;
    slices.forEach((s) => {
      let sweep = (s.value / total) * Math.PI * 2;
      if (sweep >= Math.PI * 2) sweep = Math.PI * 2 - 1e-4;
      const a1 = a0 + sweep;
      const large = sweep > Math.PI ? 1 : 0;
      const [x1, y1] = polar(rOut, a0), [x2, y2] = polar(rOut, a1);
      const [x3, y3] = polar(rIn, a1), [x4, y4] = polar(rIn, a0);
      const path = svgEl('path', {
        d: `M${x1} ${y1} A${rOut} ${rOut} 0 ${large} 1 ${x2} ${y2} L${x3} ${y3} A${rIn} ${rIn} 0 ${large} 0 ${x4} ${y4} Z`,
        fill: s.color, stroke: '#FBF7F4', 'stroke-width': '2',
      });
      path.addEventListener('mousemove', (e) => {
        const html =
          '<div style="font-size:12px;color:var(--text-secondary);margin-bottom:4px">' + U.esc(s.name) + '</div>' +
          '<div style="font-size:14px;font-weight:600;color:' + s.color + '">' + U.esc(U.fmtMoney(s.value)) + '</div>';
        tip.show(html, e.clientX, e.clientY);
      });
      path.addEventListener('mouseleave', () => tip.hide());
      svg.appendChild(path);
      a0 = a1;
    });
    box.appendChild(svg);
  }

  /* ── Input monetário em centavos (fiel ao padrão de digitação do 3.x) ── */
  function centsInput(initialCents) {
    let cents = initialCents || '';
    const input = el('input', {
      className: 'form-input', type: 'text', inputMode: 'numeric', placeholder: U.fmtMoney(0),
    });
    const refresh = () => { input.value = cents ? U.fmtCents(cents) : ''; };
    const set = (v) => {
      cents = String(v || '').replace(/\D/g, '').replace(/^0+(?=\d)/, '');
      refresh();
    };
    input.addEventListener('keydown', (e) => {
      const sel = e.currentTarget.selectionStart !== e.currentTarget.selectionEnd;
      if (/^\d$/.test(e.key)) { e.preventDefault(); set(sel ? e.key : cents + e.key); }
      else if (e.key === 'Backspace') { e.preventDefault(); set(sel ? '' : cents.slice(0, -1)); }
      else if (e.key === 'Delete') { e.preventDefault(); set(sel ? '' : cents); }
    });
    input.addEventListener('paste', (e) => {
      e.preventDefault();
      const v = ((e.clipboardData && e.clipboardData.getData('text')) || '').replace(/\D/g, '');
      if (!v) return;
      const sel = e.currentTarget.selectionStart !== e.currentTarget.selectionEnd;
      set(sel ? v : cents + v);
    });
    refresh();
    return { input, get cents() { return cents; } };
  }

  /* ── Última data de expense (funcionalidade 3.4, agora nativa) ───────── */
  function readLastExpenseDate() {
    try {
      const v = localStorage.getItem(LAST_EXPENSE_DATE_KEY);
      if (v && /^\d{4}-\d{2}-\d{2}$/.test(v) && !isNaN(U.parseDate(v))) return v;
    } catch (_) {}
    return null;
  }
  function rememberLastExpenseDate(dateStr) {
    if (!dateStr || !/^\d{4}-\d{2}-\d{2}$/.test(dateStr) || isNaN(U.parseDate(dateStr))) return;
    const stored = readLastExpenseDate();
    const best = stored && stored > dateStr ? stored : dateStr;
    try { localStorage.setItem(LAST_EXPENSE_DATE_KEY, best); } catch (_) {}
  }

  /* ── Persistência de expenses (ST do 3.x) ────────────────────────────── */
  function saveExpense(form, existing) {
    if (existing && existing.id != null) {
      const rest = Object.assign({}, form);
      delete rest.installmentCount;
      Nexo.store.update((d) => {
        d.expenses = d.expenses.map((x) => (x.id === existing.id ? Object.assign({}, x, rest) : x));
      });
      Nexo.ui.toast('Expense updated');
      return;
    }
    if (form.installmentCount > 1) {
      const N = Math.max(2, parseInt(form.installmentCount, 10) || 2);
      const gid = 'installment_' + Date.now();
      const rows = [];
      for (let q = 0; q < N; q++) {
        const rest = Object.assign({}, form);
        delete rest.installmentCount;
        rows.push(Object.assign(rest, {
          id: U.numId(),
          description: `${form.description} (${q + 1}/${N})`,
          date: q === 0 ? form.date : firstDayPlusMonths(form.date, q),
          installmentGroupId: gid,
          installmentIndex: q + 1,
          installmentTotal: N,
        }));
      }
      Nexo.store.update((d) => { d.expenses = d.expenses.concat(rows); });
      Nexo.ui.toast(`${N} installments added`);
      rememberLastExpenseDate(form.date);
    } else {
      const rest = Object.assign({}, form);
      delete rest.installmentCount;
      rest.id = U.numId();
      Nexo.store.update((d) => { d.expenses = d.expenses.concat([rest]); });
      Nexo.ui.toast('Expense added');
      rememberLastExpenseDate(form.date);
    }
  }
  function deleteExpense(id) {
    Nexo.store.update((d) => { d.expenses = d.expenses.filter((e) => e.id !== id); });
    Nexo.ui.toast('✓ Expense deleted');
  }

  /* ── Modal New Category (WJ/wT do 3.x) ───────────────────────────────── */
  function createCategory(name, icon) {
    const trimmed = String(name || '').trim();
    if (!trimmed) { Nexo.ui.toast('Add a category name first'); return null; }
    const all = Nexo.categories.all();
    const dup = all.find((c) => c.name.toLowerCase() === trimmed.toLowerCase());
    if (dup) { Nexo.ui.toast('Category already exists'); return dup; }
    const slug = 'custom_' + trimmed.toLowerCase().trim().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');
    const customs = Nexo.store.data.customCategories || [];
    const collisions = customs.filter((c) => String(c.id).startsWith(slug)).length;
    const palette = Nexo.categories.newCatPalette;
    const pal = palette[customs.length % palette.length];
    const cat = {
      id: collisions ? `${slug}_${collisions + 1}` : slug,
      name: trimmed, icon, color: pal.color, bg: pal.bg,
    };
    Nexo.store.update((d) => { d.customCategories = (d.customCategories || []).concat([cat]); });
    Nexo.ui.toast(`Category "${trimmed}" created`);
    return cat;
  }

    if (!amount) return null;
    const rec = !!e.isRecurringMonthly;
    return {
      id: Number(e.id) || U.numId(),
      title: String(e.title || '').trim() || 'Income',
      type: String(e.type || 'salary').trim().toLowerCase(),
      amount,
      date: e.date || U.todayISO(),
      notes: String(e.notes || '').trim(),
      isRecurringMonthly: rec,
      recurrenceEndDate: rec ? String(e.recurrenceEndDate || '') : '',
    };
  }
  function saveIncome(form) {
    const norm = normalizeIncome(Object.assign({}, form, { id: form.id || U.numId() }));

      d.incomes = form.id

    const modal = Nexo.ui.modal(content);
    content.appendChild(
      el('div', { style: { display: 'flex', gap: '8px', justifyContent: 'flex-end', marginTop: '24px' } },
        el('button', { className: 'btn btn-ghost', onclick: () => modal.close() }, 'Cancel'),
        el('button', {
          className: 'btn btn-primary',
          onclick: () => {
            const title = titleInput.value.trim();
            const amount = U.centsToNumber(money.cents);
            if (!title) return void alert('Income title is required.');
            if (!amount) return void alert('Income amount is required.');
            if (!dateInput.value) return void alert('Income date is required.');
            if (recurringCb.checked && endInput.value && endInput.value < dateInput.value)
              return void alert('Recurrence end date cannot be before income start date.');
            const form = Object.assign({}, existing || {}, {
              title,
              amount,
              type: typeSelect.value || 'salary',
              date: dateInput.value,
              notes: String(notesInput.value || '').trim(),
              isRecurringMonthly: !!recurringCb.checked,
              recurrenceEndDate: recurringCb.checked ? String(endInput.value || '') : '',
            });
            if (saveIncome(form)) modal.close();
          },
        }, existing ? 'Save Income' : 'Add Income')));
  }

  /* ══════════════════════════════════════════════════════════════════════
     ABA 1 — DASHBOARD
     ══════════════════════════════════════════════════════════════════════ */
  Nexo.registerTab('dashboard', function () {
    let root = null;
    let includeOffBudget = false; // estado local do checkbox do By Category

    function statCard(label, valueText, subNode) {
      const c = el('div', { className: 'stat-card' },
        el('div', { className: 'stat-label' }, label),
        el('div', { className: 'stat-value' }, valueText));
      if (subNode) c.appendChild(subNode);
      return c;
    }
    const subMuted = (text) =>
      el('div', { className: 'stat-change', style: { color: 'var(--text-secondary)' } }, text);

    // dados da série do Spending Trend (LT do 3.x)
    function buildTrendData(type, days, allInRange, budgetInRange, range) {
      const monthly = type === 'last3months' || type === 'thisYear' || (type === 'custom' && days > 62);
      const keyOf = (d) => monthly
        ? `${d.getFullYear()}-${d.getMonth()}`
        : `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
      const budMap = {}, allMap = {};
      budgetInRange.forEach((e) => { const k = keyOf(te(e.date)); budMap[k] = (budMap[k] || 0) + amt(e.amount); });
      allInRange.forEach((e) => { const k = keyOf(te(e.date)); allMap[k] = (allMap[k] || 0) + amt(e.amount); });
      const out = [];
      if (monthly) {
        const cur = new Date(range.start.getFullYear(), range.start.getMonth(), 1);
        const end = new Date(range.end.getFullYear(), range.end.getMonth(), 1);
        while (cur.getTime() <= end.getTime()) {
          const k = `${cur.getFullYear()}-${cur.getMonth()}`;
          out.push({
            month: U.MONTHS_PT[cur.getMonth()],
            amount: budMap[k] || 0,
            amountAll: allMap[k] || 0,
            label: `${U.MONTHS_PT[cur.getMonth()]}/${cur.getFullYear()}`,
          });
          cur.setMonth(cur.getMonth() + 1);
        }
        return out;
      }
      const cur = startOfDay(range.start), end = startOfDay(range.end);
      while (cur.getTime() <= end.getTime()) {
        const k = `${cur.getFullYear()}-${cur.getMonth()}-${cur.getDate()}`;
        out.push({
          month: String(cur.getDate()).padStart(2, '0'),
          amount: budMap[k] || 0,
          amountAll: allMap[k] || 0,
          label: cur.toLocaleDateString('pt-BR'),
        });
        cur.setDate(cur.getDate() + 1);
      }
      return out;
    }

    function render() {
      if (!root) return;
      const data = Nexo.store.data;
      const expenses = data.expenses || [], incomes = data.incomes || [], loans = data.loans || [];
      const now = new Date();
      const y = now.getFullYear(), m = now.getMonth();
      const prev = new Date(y, m - 1, 1);

      const budgetExpenses = expenses.filter(inBudget);
      const allThisMonth = expenses.filter((e) => sameMonth(e.date, y, m));
      const budThisMonth = budgetExpenses.filter((e) => sameMonth(e.date, y, m));
      const budPrevMonth = budgetExpenses.filter((e) => sameMonth(e.date, prev.getFullYear(), prev.getMonth()));

      const totalAllMonth = allThisMonth.reduce((s, e) => s + amt(e.amount), 0);           // d0
      const totalBudMonth = budThisMonth.reduce((s, e) => s + amt(e.amount), 0);           // p0
      const totalBudPrev = budPrevMonth.reduce((s, e) => s + amt(e.amount), 0);            // Zd
      const delta = totalBudPrev ? Number((((totalBudMonth - totalBudPrev) / totalBudPrev) * 100).toFixed(0)) : 0; // Jd

      const incomeMonth = incomeMonthTotal(incomes, y, m);                                 // ep
      const incomePrev = incomeMonthTotal(incomes, prev.getFullYear(), prev.getMonth());   // O0
      const loanActual = loanPaymentsMonthSigned(loans, y, m);                             // h0
      const loanExpected = loansMonthNet(loans, y, m);                                     // m0
      const netLoan = loanActual + loanExpected.net;                                       // v0
      const netCash = incomeMonth - totalAllMonth + netLoan;                               // MT

      const nextMonth = new Date(y, m + 1, 1);                                             // or
      const nextExpenses = expenses.reduce((s, e) => {
        const d = te(e.date);
        return d.getFullYear() !== nextMonth.getFullYear() || d.getMonth() !== nextMonth.getMonth()
          ? s : s + U.parseMoney(e.amount);
      }, 0);                                                                               // y0
      const nextIncome = incomes.filter((i) => i.isRecurringMonthly)
        .map((i) => incomeOccurrence(i, nextMonth.getFullYear(), nextMonth.getMonth()))
        .filter(Boolean)
        .reduce((s, o) => s + U.parseMoney(o.amount), 0);                                  // g0
      const nextLoans = loansMonthNet(loans, nextMonth.getFullYear(), nextMonth.getMonth()); // ru
      const expectedNetCash = nextIncome - nextExpenses + nextLoans.net;                   // IT

      // Spending Trend
      const period = data.dashboardPeriod || { type: 'thisMonth', from: '', to: '' };
      const range = resolvePeriod(period.type, now, period.from, period.to);
      const days = rangeDays(range);
      const inPeriodAll = expenses.filter((e) => inRange(e.date, range));                  // qo
      const inPeriodBud = inPeriodAll.filter(inBudget);                                    // b0
      const trendData = buildTrendData(period.type, days, inPeriodAll, inPeriodBud, range);

      // By Category (sempre mês corrente)
      const catSource = includeOffBudget ? allThisMonth : budThisMonth;                    // f0
      const sums = {};
      catSource.forEach((e) => { sums[e.category] = (sums[e.category] || 0) + amt(e.amount); });
      const byCat = Nexo.categories.all()
        .map((c) => Object.assign({}, c, { total: sums[c.id] || 0 }))
        .filter((c) => c.total > 0)
        .sort((a, b) => b.total - a.total);                                                // w0

      // Recent Expenses (data ≤ hoje, 5 itens)
      const sortedDesc = [...expenses].sort((a, b) => te(b.date) - te(a.date));
      const todayT = startOfDay(now).getTime();
      const recent = sortedDesc.filter((e) => startOfDay(e.date).getTime() <= todayT).slice(0, 5);

      /* ── DOM ── */
      root.innerHTML = '';

      root.appendChild(el('h1', { className: 'page-title' }, 'Dashboard'));
      root.appendChild(el('p', { className: 'page-sub' },
        `Your financial overview for ${U.MONTHS_PT[m]} ${y}`));

      // linha 1
      root.appendChild(el('div', { className: 'stats-row' },
        statCard('Income This Month', U.fmtMoney(incomeMonth), subMuted(`${U.fmtMoney(incomePrev)} last month`)),
        statCard('Expenses This Month', U.fmtMoney(totalAllMonth),
          el('div', { className: 'stat-change ' + (delta > 0 ? 'up' : 'down') },
            `${delta > 0 ? 'up' : 'down'} ${Math.abs(delta)}% vs last month`)),
        statCard('Net Loan This Month', U.fmtMoney(netLoan),
          subMuted(`actual ${U.fmtMoney(loanActual)} · expected ${U.fmtMoney(loanExpected.net)}`)),
        statCard('Net Cash Available', U.fmtMoney(netCash))));

      // linha 2 (próximo mês)
      const row2 = el('div', { className: 'stats-row', style: { marginTop: '-8px' } },
        statCard('Next Month Expected Income', U.fmtMoney(nextIncome), subMuted('expected recurring only')),
        statCard('Next Month Expenses', U.fmtMoney(nextExpenses), subMuted('already registered')),
        statCard('Net Loans Next Month', U.fmtMoney(nextLoans.net),
          subMuted(`receive ${U.fmtMoney(nextLoans.receive)} · pay ${U.fmtMoney(nextLoans.pay)}`)),
        statCard('Expected Net Cash', U.fmtMoney(expectedNetCash)));
      root.appendChild(row2);

      // Spending Trend
      const periodSelect = el('select', { className: 'form-input', style: { width: '170px' } },
        el('option', { value: 'last7' }, 'Last 7 days'),
        el('option', { value: 'last30' }, 'Last 30 days'),
        el('option', { value: 'thisMonth' }, 'This month'),
        el('option', { value: 'last3months' }, 'Last 3 months'),
        el('option', { value: 'thisYear' }, 'This year'),
        el('option', { value: 'custom' }, 'Custom range'));
      periodSelect.value = period.type;
      periodSelect.addEventListener('change', () => {
        Nexo.store.update((d) => {
          d.dashboardPeriod = { type: periodSelect.value, from: period.from || '', to: period.to || '' };
        });
      });
      const headerControls = el('div', {
        style: { display: 'flex', gap: '8px', flexWrap: 'wrap', justifyContent: 'flex-end' },
      }, periodSelect);
      if (period.type === 'custom') {
        const fromInput = el('input', { className: 'form-input', type: 'date', value: period.from || '' });
        fromInput.addEventListener('change', () => {
          Nexo.store.update((d) => {
            d.dashboardPeriod = { type: 'custom', from: fromInput.value, to: period.to || '' };
          });
        });
        const toInput = el('input', { className: 'form-input', type: 'date', value: period.to || '' });
        toInput.addEventListener('change', () => {
          Nexo.store.update((d) => {
            d.dashboardPeriod = { type: 'custom', from: period.from || '', to: toInput.value };
          });
        });
        headerControls.appendChild(fromInput);
        headerControls.appendChild(toInput);
      }
      const trendBox = el('div', { style: { position: 'relative', width: '100%', height: '220px' } });
      const trendCard = el('div', { className: 'card' },
        el('div', { className: 'card-header' },
          el('span', { className: 'card-title' }, 'Spending Trend'),
          headerControls),
        inPeriodAll.length > 0 ? trendBox : emptyState('📉', 'No expenses in the selected period.'));

      // By Category
      const offBudgetCb = el('input', { type: 'checkbox' });
      offBudgetCb.checked = includeOffBudget;
      offBudgetCb.addEventListener('change', () => {
        includeOffBudget = offBudgetCb.checked;
        render();
      });
      const donutWrap = el('div', {
        style: { display: 'flex', alignItems: 'center', gap: '16px', position: 'relative' },
      });
      const donutBox = el('div', { style: { width: '140px', height: '140px', flexShrink: '0' } });
      const legend = el('div', { style: { flex: '1', display: 'flex', flexDirection: 'column', gap: '6px' } });
      byCat.slice(0, 5).forEach((c) => {
        legend.appendChild(el('div', { style: { display: 'flex', alignItems: 'center', gap: '8px', fontSize: '13px' } },
          el('span', { style: { width: '10px', height: '10px', borderRadius: '3px', background: c.color, flexShrink: '0' } }),
          el('span', { style: { flex: '1', color: 'var(--text-secondary)' } }, c.name.split(' ')[0]),
          el('span', { style: { fontWeight: '600' } }, U.fmtMoney(c.total))));
      });
      donutWrap.appendChild(donutBox);
      donutWrap.appendChild(legend);
      const catCard = el('div', { className: 'card' },
        el('div', { className: 'card-header' },
          el('span', { className: 'card-title' }, 'By Category'),
          el('span', { style: { fontSize: '12px', color: 'var(--text-secondary)' } },
            `${U.MONTHS_PT[m]}/${y}`)),
        el('label', {
          style: { display: 'inline-flex', alignItems: 'center', gap: '8px', fontSize: '12px', color: 'var(--text-secondary)', marginBottom: '10px' },
        }, offBudgetCb, 'Include off budget items'),
        byCat.length > 0 ? donutWrap : emptyState('📊', 'No data for the current month.'));

      root.appendChild(el('div', { className: 'grid-2' }, trendCard, catCard));

      // Recent Expenses
      const recentCard = el('div', { className: 'card' },
        el('div', { className: 'card-header' },
          el('span', { className: 'card-title' }, 'Recent Expenses'),
          el('div', { style: { display: 'flex', gap: '8px' } },
            el('button', { className: 'btn btn-primary', html: ICON_PLUS, onclick: () => openExpenseModal(null) },
              ' Add Expense'))));
      recent.forEach((e) => recentCard.appendChild(expenseRowNode(e, { withYear: false })));
      if (recent.length === 0) recentCard.appendChild(emptyState('✨', 'No expenses yet'));
      root.appendChild(recentCard);

      // desenha gráficos depois de anexado (medição de largura síncrona)
      if (inPeriodAll.length > 0) drawTrendChart(trendBox, trendData);
      if (byCat.length > 0)
        drawDonut(donutBox, byCat.map((c) => ({ name: c.name, value: c.total, color: c.color })), donutWrap);
    }

    return {
      mount(section) {
        root = section;
        document.addEventListener('nexo:data', () => {
          if (Nexo.router.current === 'dashboard') render();
        });
        render();
      },
      show() { render(); },
      hide() {},
    };
  });

  /* ══════════════════════════════════════════════════════════════════════
     ABA 2 — EXPENSES
     ══════════════════════════════════════════════════════════════════════ */
  Nexo.registerTab('expenses', function () {
    let root = null;
    let filter = { from: '', to: U.todayISO(), category: 'all', query: '' };
    let subEl = null, listCard = null, totalCard = null;

    function filteredExpenses() {
      const expenses = Nexo.store.data.expenses || [];
      const sorted = [...expenses].sort((a, b) => te(b.date) - te(a.date));
      const q = normSearch(filter.query);
      return sorted.filter((e) => {
        const t = startOfDay(e.date).getTime();
        if (filter.from && t < startOfDay(filter.from).getTime()) return false;
        if (filter.to && t > startOfDay(filter.to).getTime()) return false;
        if (filter.category !== 'all' && e.category !== filter.category) return false;
        if (q && !normSearch(e.description).includes(q)) return false;
        return true;
      });
    }

    function renderList() {
      if (!listCard) return;
      const expenses = Nexo.store.data.expenses || [];
      const shown = filteredExpenses();
      if (subEl) subEl.textContent = `${shown.length} shown of ${expenses.length} transactions`;
      // "Total filtrado" (recurso do 3.13, agora nativo — antes raspava o DOM)
      if (totalCard) {
        const total = shown.reduce((s, e) => s + (Number(e.amount) || 0), 0);
        totalCard.style.display = shown.length ? '' : 'none';
        totalCard.innerHTML =
          '<span class="nx-t-label">Total filtrado</span>' +
          '<div class="nx-t-right"><span class="nx-t-val">−' + U.esc(U.fmtMoney(total)) +
          '</span><span class="nx-t-count">' + shown.length +
          (shown.length === 1 ? ' lançamento' : ' lançamentos') + '</span></div>';
      }
      listCard.innerHTML = '';
      shown.forEach((e) => {
        listCard.appendChild(expenseRowNode(e, {
          withYear: true,
          onEdit: () => openExpenseModal(e),
          onDelete: () => deleteExpense(e.id),  // sem confirm (fiel ao 3.x)
        }));
      });
      if (shown.length === 0)
        listCard.appendChild(emptyState('📝', 'No expenses match the current filters.'));
    }

    function render() {
      if (!root) return;
      const expenses = Nexo.store.data.expenses || [];
      const cats = Nexo.categories.all();
      root.innerHTML = '';

      // cabeçalho
      subEl = el('p', { className: 'page-sub' }, '');
      const headerBtns = el('div', { style: { display: 'flex', gap: '8px' } });
      if (expenses.length > 0)
        headerBtns.appendChild(el('button', { className: 'btn btn-danger', onclick: clearAllExpenses }, 'Clear All'));
      headerBtns.appendChild(el('button', { className: 'btn btn-outline', html: ICON_PLUS, onclick: openCategoryModal }, ' New Category'));
      headerBtns.appendChild(el('button', { className: 'btn btn-primary', html: ICON_PLUS, onclick: () => openExpenseModal(null) }, ' Add Expense'));
      root.appendChild(el('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' } },
        el('div', {}, el('h1', { className: 'page-title' }, 'Expenses'), subEl),
        headerBtns));

      // filtros
      const fromInput = el('input', { className: 'form-input', type: 'date', value: filter.from });
      fromInput.addEventListener('change', () => { filter.from = fromInput.value; renderList(); });
      const toInput = el('input', { className: 'form-input', type: 'date', value: filter.to });
      toInput.addEventListener('change', () => { filter.to = toInput.value; renderList(); });
      const catSelect = el('select', { className: 'form-input' },
        el('option', { value: 'all' }, 'All categories'),
        cats.map((c) => el('option', { value: c.id }, c.name)));
      catSelect.value = filter.category;
      catSelect.addEventListener('change', () => { filter.category = catSelect.value; renderList(); });
      const queryInput = el('input', { className: 'form-input', placeholder: 'Search description', value: filter.query });
      queryInput.addEventListener('input', () => { filter.query = queryInput.value; renderList(); });

      root.appendChild(el('div', { className: 'card', style: { marginBottom: '12px' } },
        el('div', { className: 'card-header', style: { marginBottom: '12px' } },
          el('span', { className: 'card-title' }, 'Filters'),
          el('button', {
            className: 'btn btn-ghost',
            onclick: () => {
              filter = { from: '', to: U.todayISO(), category: 'all', query: '' }; // to volta para HOJE
              render();
            },
          }, 'Clear Filters')),
        el('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(180px, 1fr))', gap: '10px' } },
          fromInput, toInput, catSelect, queryInput)));

      // total filtrado + lista
      totalCard = el('div', { id: 'nx-total' });
      root.appendChild(totalCard);
      listCard = el('div', { className: 'card' });
      root.appendChild(listCard);
      renderList();
    }

    return {
      mount(section) {
        root = section;
        document.addEventListener('nexo:data', () => {
          if (Nexo.router.current === 'expenses') render();
        });
        render();
      },
      show() { render(); },
      hide() {},
    };
  });

  /* ══════════════════════════════════════════════════════════════════════
     ABA 3 — INCOME
     ══════════════════════════════════════════════════════════════════════ */
  Nexo.registerTab('income', function () {
    let root = null;

    function statCard(label, valueText, subText) {
      return el('div', { className: 'stat-card' },
        el('div', { className: 'stat-label' }, label),
        el('div', { className: 'stat-value' }, valueText),
        el('div', { className: 'stat-change', style: { color: 'var(--text-secondary)' } }, subText));
    }

    function render() {
      if (!root) return;
      const incomes = Nexo.store.data.incomes || [];
      const now = new Date();
      const y = now.getFullYear(), m = now.getMonth();
      const prev = new Date(y, m - 1, 1);

      const thisMonthTotal = incomeMonthTotal(incomes, y, m);                              // ep
      const monthEntries = incomeOccurrences(incomes, y, m);                               // BT
      const lastMonthTotal = incomeMonthTotal(incomes, prev.getFullYear(), prev.getMonth()); // O0

      // série mensal do 1º mês com income até o mês corrente (au)
      const series = [];
      if (incomes.length) {
        const firstDate = incomes.map((i) => te(i.date)).sort((a, b) => a.getTime() - b.getTime())[0];
        const cur = new Date(firstDate.getFullYear(), firstDate.getMonth(), 1);
        const end = new Date(y, m, 1);
        while (cur.getTime() <= end.getTime()) {
          series.push({ year: cur.getFullYear(), month: cur.getMonth(), total: incomeMonthTotal(incomes, cur.getFullYear(), cur.getMonth()) });
          cur.setMonth(cur.getMonth() + 1);
        }
      }
      const ytd = series.filter((s) => s.year === y).reduce((s, x) => s + x.total, 0);     // FT
      const nonZero = series.filter((s) => s.total > 0);
      const avg = nonZero.length ? nonZero.reduce((s, x) => s + x.total, 0) / nonZero.length : 0; // zT

      const sorted = [...incomes].sort((a, b) => te(b.date) - te(a.date));                 // ap

      root.innerHTML = '';

      root.appendChild(el('div', {
        style: { display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: '10px' },
      },
        el('div', {},
          el('h1', { className: 'page-title' }, 'Income'),
          el('p', { className: 'page-sub' }, 'Track salary, PLR, gifts and any other cash inflow')),
        el('button', { className: 'btn btn-primary', html: ICON_PLUS, onclick: () => openIncomeModal(null) }, ' Add Income')));

      root.appendChild(el('div', { className: 'stats-row' },
        statCard('This Month', U.fmtMoney(thisMonthTotal), `${monthEntries.length} entry(ies)`),
        statCard('Last Month', U.fmtMoney(lastMonthTotal), 'previous month total'),
        statCard('Year to Date', U.fmtMoney(ytd), String(y)),
        statCard('Average / Month', U.fmtMoney(avg), 'historical average')));

      const card = el('div', { className: 'card' },
        el('div', { className: 'card-header' },
          el('span', { className: 'card-title' }, 'Income Entries'),
          el('span', { style: { fontSize: '12px', color: 'var(--text-secondary)' } },
            `${sorted.length} item(s)`)));

      if (sorted.length === 0) {
        card.appendChild(emptyState('💰', 'No income entries yet.'));
      } else {
        sorted.forEach((inc) => {
          const typeLabel = (INCOME_TYPES.find((t) => t.value === inc.type) || {}).label || 'Other';
          let meta = `${typeLabel} · ${te(inc.date).toLocaleDateString('pt-BR', { month: 'short', day: 'numeric', year: 'numeric' })}`;
          if (inc.isRecurringMonthly) meta += ' · Recurring monthly';
          if (inc.isRecurringMonthly && inc.recurrenceEndDate)
            meta += ` until ${te(inc.recurrenceEndDate).toLocaleDateString('pt-BR')}`;
          if (inc.notes) meta += ` · ${inc.notes}`;
          const row = el('div', { className: 'expense-row' },
            el('div', { className: 'expense-icon', style: { background: '#EEF6F0', color: '#6C9A78' } }, '💰'),
            el('div', { className: 'expense-info' },
              el('div', { className: 'expense-desc' }, inc.title),
              el('div', { className: 'expense-meta' }, meta)),
            el('div', { className: 'expense-amount', style: { color: '#6C9A78' } },
              '+' + U.fmtMoney(Number(inc.amount) || 0)),
            el('div', { className: 'expense-actions' },
              el('button', { className: 'action-btn', html: ICON_PENCIL, onclick: () => openIncomeModal(inc) }),
              el('button', { className: 'action-btn del', html: ICON_TRASH, onclick: () => deleteIncome(inc.id) })));
          card.appendChild(row);
        });
      }
      root.appendChild(card);
    }

    return {
      mount(section) {
        root = section;
        document.addEventListener('nexo:data', () => {
          if (Nexo.router.current === 'income') render();
        });
        render();
      },
      show() { render(); },
      hide() {},
    };
  });
})();

</script>
<script>
/* ═══ tabs-part2.js ═══ */
/* ══════════════════════════════════════════════════════════════════════════

  /* ── Input monetário em centavos (padrão qn/Rn/Ho/dh do 3.x) ─────────── */
  function moneyInput(initialCents, opts) {
    opts = opts || {};
    let str = String(initialCents || '');
    const fmt = opts.plain
      ? (s) => U.fmtNumber2(U.centsToNumber(s))
      : (s) => U.fmtCents(s);

      className: 'form-input', type: 'text', inputMode: 'numeric',
