n' || m.type === 'dividend' || m.type === 'addTxForAsset') return renderTxModal(assets, m);\n    return '';\n  }\n\n  function renderNewAssetModal() {\n    const d = state.modal.data || {};\n    const isEdit = state.modal && state.modal.type === 'editAsset';\n    const cls = d.assetClass || 'ETF';\n    const fi = isFixedIncome(cls);\n    const isRV = ['ETF', 'Stock', 'Fund'].indexOf(cls) >= 0;\n    const clr = nxClassColor(cls);\n    const prevName = (d.name || '').trim() || 'Asset name…';\n    const prevMeta = ((d.ticker || '').trim() ? (d.ticker || '').trim().toUpperCase() + ' · ' : '') + cls + (fi && (d.issuer || '').trim() ? ' · ' + (d.issuer || '').trim() : '');\n    return `\n      <div class=\"nx-modal-overlay\" data-action=\"modal-overlay-close\">\n        <div class=\"nx-modal\">\n          <div class=\"nx-modal-title\">${isEdit ? 'Edit asset' : 'New asset'}<\/div>\n          <div class=\"nx-modal-field\"><label>Asset class *<\/label>\n            <div class=\"nx-type-grid\">\n              ${['ETF','Stock','Fund','CDB','LCI','LCA','Cash'].map(c => { const cc = nxClassColor(c); const sel = cls === c; return `<button class=\"nx-type-opt${sel?' sel':''}\" data-action=\"nm-set-class\" data-val=\"${c}\" style=\"${sel?`border-color:${cc};background:${cc}1f;color:${cc};`:''}\"><span class=\"nx-chip-dot\" style=\"background:${cc}\"><\/span>${c}<\/button>`; }).join('')}\n            <\/div>\n          <\/div>\n          <div class=\"nx-modal-row\">\n            <div class=\"nx-modal-field\" style=\"flex:2;\"><label>Name *<\/label><input type=\"text\" id=\"nm-name\" value=\"${escHtml(d.name||'')}\" placeholder=\"e.g. iShares S&P 500\" /><\/div>\n            <div class=\"nx-modal-field\" style=\"flex:1;\"><label>Ticker<\/label><input type=\"text\" id=\"nm-ticker\" value=\"${escHtml(d.ticker||'')}\" placeholder=\"e.g. IVVB11\" /><\/div>\n          <\/div>\n          ${fi ? `<div class=\"nx-modal-row\">\n            <div class=\"nx-modal-field\" style=\"flex:1;\"><label>Issuer<\/label><input type=\"text\" id=\"nm-issuer\" value=\"${escHtml(d.issuer||'')}\" placeholder=\"e.g. Banco XYZ\" /><\/div>\n            <div class=\"nx-modal-field\" style=\"flex:1;\"><label>Maturity date<\/label><input type=\"date\" id=\"nm-maturity\" value=\"${escHtml(d.maturityDate||'')}\" /><\/div>\n          <\/div>` : ''}\n          ${isRV ? `<div class=\"nx-modal-field\"><label>Region<\/label>\n            <div class=\"nx-type-grid nx-region-grid\">\n              ${[['BR','Domestic (BR)'],['INTL','International'],['CRYPTO','Crypto']].map(r => { const sel = (d.region||'BR') === r[0]; return `<button class=\"nx-type-opt${sel?' sel':''}\" data-action=\"nm-set-region\" data-val=\"${r[0]}\" style=\"${sel?'border-color:var(--accent,#E07A5F);background:rgba(224,122,95,.1);color:var(--accent,#E07A5F);':''}\">${r[1]}<\/button>`; }).join('')}\n            <\/div><\/div>` : ''}\n          <div class=\"nx-modal-field\"><label>Notes<\/label><textarea id=\"nm-notes\" rows=\"2\" placeholder=\"Optional…\">${escHtml(d.notes||'')}<\/textarea><\/div>\n          <div class=\"nx-asset-preview\">\n            <div style=\"min-width:0;\">\n              <div class=\"nx-ap-prev-cap\">Preview<\/div>\n              <div class=\"nx-ap-prev-name\" id=\"na-prev-name\">${escHtml(prevName)}<\/div>\n              <div class=\"nx-ap-prev-meta\" id=\"na-prev-meta\">${escHtml(prevMeta)}<\/div>\n            <\/div>\n            <span class=\"nx-ap-prev-badge\" id=\"na-prev-badge\" style=\"background:${clr}1f;color:${clr};\">${escHtml(cls)}<\/span>\n          <\/div>\n          <div class=\"nx-modal-footer\">\n            <button class=\"nx-btn nx-btn-ghost\" data-action=\"modal-close\">Cancel<\/button>\n            <button class=\"nx-btn nx-btn-primary\" data-action=\"save-new-asset\">Save asset<\/button>\n          <\/div>\n        <\/div>\n      <\/div>`;\n  }\n\n  function renderTxModal(assets, m) {\n    const d = m.data || {};\n    const isEdit = m.type === 'editTx';\n    const isIncomeModal = m.type === 'coupon' || m.type === 'dividend';\n    const type = isIncomeModal ? 'income' : (d.type || 'buy');\n    const title = isEdit ? 'Edit transaction' : (m.type === 'coupon' ? 'Add coupon' : (m.type === 'dividend' ? 'Add dividend' : 'Add transaction'));\n    const ac = assets.find(a => a.id === (d.assetId || ''));\n    const fi = ac ? isFixedIncome(ac.assetClass) : false;\n    const amountTotal = fi || type === 'income' || type === 'adjustment';\n    const meta = NX_TX_TYPE[type] || NX_TX_TYPE.buy;\n\n    // ── Type selector ──\n    const typeRow = isIncomeModal\n      ? `<div class=\"nx-type-locked\"><span class=\"nx-chip-dot\" style=\"background:${NX_TX_TYPE.income.color}\"><\/span>${m.type === 'coupon' ? 'Coupon' : 'Dividend'} · income<\/div>`\n      : `<div class=\"nx-type-grid\">${['buy','sell','income','adjustment'].map(t => { const tm = NX_TX_TYPE[t]; const sel = type === t; return `<button class=\"nx-type-opt${sel?' sel':''}\" data-action=\"tm-set-type\" data-val=\"${t}\" style=\"${sel?`border-color:${tm.color};background:${tm.light};color:${tm.color};`:''}\"><span class=\"nx-chip-dot\" style=\"background:${tm.color}\"><\/span>${tm.label}<\/button>`; }).join('')}<\/div>`;\n\n    // ── Asset picker (search + scrollable list, or selected chip) ──\n    const allTx = getTxs();\n    const lastAt = {}; allTx.forEach(t => { if (!lastAt[t.assetId] || t.date > lastAt[t.assetId]) lastAt[t.assetId] = t.date; });\n    const sortedAssets = assets.slice().sort((a, b) => String(lastAt[b.id] || '').localeCompare(String(lastAt[a.id] || '')));\n    let pickerHTML;\n    if (ac && isIncomeModal) {\n      pickerHTML = `<div class=\"nx-ap-selected\" style=\"cursor:default;\"><div><div class=\"nx-ap-sel-name\">${escHtml(ac.name)}<\/div><div class=\"nx-ap-sel-meta\">${(ac.ticker ? escHtml(ac.ticker) + ' · ' : '') + escHtml(ac.assetClass || '')}<\/div><\/div><\/div>`;\n    } else if (ac) {\n      pickerHTML = `<div class=\"nx-ap-selected\"><div><div class=\"nx-ap-sel-name\">${escHtml(ac.name)}<\/div><div class=\"nx-ap-sel-meta\">${(ac.ticker ? escHtml(ac.ticker) + ' · ' : '') + escHtml(ac.assetClass || '')}<\/div><\/div><button class=\"nx-ap-change\" data-action=\"tm-change-asset\">Change<\/button><\/div>`;\n    } else {\n      const presentCls = ASSET_CLASSES.filter(c => assets.some(a => (a.assetClass || '') === c));\n      const clsChips = ['all'].concat(presentCls).map(c => `<button type=\"button\" class=\"nx-ap-clschip${txPickerClass === c ? ' active' : ''}\" data-clsfilter=\"${escHtml(c)}\">${c === 'all' ? 'All' : escHtml(c)}<\/button>`).join('');\n      pickerHTML = `\n        ${presentCls.length > 1 ? `<div class=\"nx-ap-classfilter\">${clsChips}<\/div>` : ''}\n        <input type=\"text\" id=\"tm-asset-search\" class=\"nx-ap-search\" placeholder=\"Search by name or ticker…\" autocomplete=\"off\" />\n        <div class=\"nx-ap-list\" id=\"tm-asset-list\">\n          ${sortedAssets.map(a => { const cc = nxClassColor(a.assetClass); return `<button class=\"nx-ap-item\" data-action=\"tm-pick-asset\" data-asset-id=\"${escHtml(a.id)}\" data-class=\"${escHtml(a.assetClass || '')}\" data-search=\"${escHtml((a.name + ' ' + (a.ticker || '')).toLowerCase())}\"><span><span class=\"nx-ap-item-name\">${escHtml(a.name)}<\/span><span class=\"nx-ap-item-meta\">${(a.ticker ? escHtml(a.ticker) + ' · ' : '') + escHtml(a.assetClass || '')}<\/span><\/span><span class=\"nx-ap-item-badge\" style=\"background:${cc}1f;color:${cc};\">${escHtml(a.assetClass || '')}<\/span><\/button>`; }).join('')}\n          ${sortedAssets.length ? '' : '<div class=\"nx-ap-empty\">No assets yet — create one first.<\/div>'}\n          <div class=\"nx-ap-empty\" id=\"tm-asset-empty\" style=\"display:none;\">No assets match your search<\/div>\n        <\/div>`;\n    }\n\n    const amountLabel = !amountTotal ? 'Unit price (R$)'\n      : (type === 'income' ? (fi ? 'Coupon amount (R$)' : 'Dividend amount (R$)')\n      : (type === 'adjustment' ? 'Adjustment value (R$)' : 'Total amount (R$)'));\n    const dateField = `<div class=\"nx-modal-field\" style=\"flex:1;\"><label>Date *<\/label><input type=\"date\" id=\"tm-date\" value=\"${escHtml(d.date || new Date().toISOString().slice(0, 10))}\" /><\/div>`;\n    const qtyField = `<div class=\"nx-modal-field\" style=\"flex:1;\" id=\"tm-qty-wrap\"><label>Quantity<\/label><input type=\"number\" id=\"tm-qty\" value=\"${escHtml(d.quantity || '')}\" placeholder=\"0\" step=\"any\" min=\"0\" /><\/div>`;\n    const dateQtyRow = amountTotal ? dateField : `<div class=\"nx-modal-row\">${dateField}${qtyField}<\/div>`;\n\n    // ── Live summary ──\n    const curQty = parseFloat(d.quantity) || 0;\n    const curAmt = d.amount ? parseBR(d.amount) : 0;\n    const total0 = amountTotal ? curAmt : curQty * curAmt;\n    const sumLabels = { buy: 'Total to invest', sell: 'Total proceeds', income: 'Income received', adjustment: 'Adjustment value' };\n    const sign0 = type === 'buy' ? '−' : (type === 'adjustment' ? '' : '+');\n    let sub0;\n    if (!ac) sub0 = 'Select an asset';\n    else if (amountTotal) sub0 = ac.name;\n    else if (curQty > 0 && curAmt > 0) sub0 = fmtQty(curQty) + ' × R$ ' + fmtBR(curAmt) + ' · ' + ac.name;\n    else sub0 = 'Enter quantity and unit price';\n\n    return `\n      <div class=\"nx-modal-overlay\" data-action=\"modal-overlay-close\">\n        <div class=\"nx-modal\">\n          <div class=\"nx-modal-title\">${escHtml(title)}<\/div>\n          <div class=\"nx-modal-field\"><label>Type *<\/label>${typeRow}<\/div>\n          <div class=\"nx-modal-field\"><label>Asset *<\/label>${pickerHTML}<\/div>\n          ${dateQtyRow}\n          <div class=\"nx-modal-field\">\n            <label id=\"tm-amount-label\">${amountLabel} *<\/label>\n            <div style=\"display:flex;align-items:center;gap:6px;border:1.5px solid var(--border,#e8e8e8);border-radius:8px;padding:0 10px;background:var(--input-bg,#fafafa);\">\n              <span style=\"font-size:13px;color:var(--text-secondary,#6b7280);flex-shrink:0;\">R$<\/span>\n              <input type=\"text\" id=\"tm-amount\" class=\"nx-modal-money-input\"\n                inputmode=\"decimal\" autocomplete=\"off\"\n                value=\"${d.amount ? parseBR(d.amount).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}) : '0,00'}\"\n                placeholder=\"0,00\"\n                style=\"border:none;background:transparent;outline:none;font-size:14px;width:100%;padding:10px 0;color:var(--text,#1a1a1a);\" />\n            <\/div>\n          <\/div>\n          <div class=\"nx-modal-field\"><label>Notes<\/label><textarea id=\"tm-notes\" rows=\"2\" placeholder=\"Optional…\">${escHtml(d.notes||'')}<\/textarea><\/div>\n          <div id=\"tm-save-error\" style=\"display:none;color:var(--sell,#C25450);font-size:13px;margin-bottom:8px;\"><\/div>\n          <div class=\"nx-tx-summary\">\n            <div>\n              <div class=\"nx-tx-summary-label\" id=\"tm-sum-label\">${escHtml(sumLabels[type] || 'Total')}<\/div>\n              <div class=\"nx-tx-summary-sub\" id=\"tm-sum-sub\">${escHtml(sub0)}<\/div>\n            <\/div>\n            <div class=\"nx-tx-summary-total\" id=\"tm-sum-total\" style=\"color:${total0 > 0 ? meta.color : 'var(--text-secondary,#6b6b6b)'};\">${total0 > 0 ? sign0 : ''}R$ ${fmtBR(total0)}<\/div>\n          <\/div>\n          <div class=\"nx-modal-footer\">\n            <button class=\"nx-btn nx-btn-ghost\" data-action=\"modal-close\">Cancel<\/button>\n            <button class=\"nx-btn nx-btn-primary\" data-action=\"save-tx\" ${isEdit ? `data-tx-id=\"${escHtml(d.id||'')}\"` : ''} style=\"background:${meta.color};\">${isEdit ? 'Save changes' : 'Save transaction'}<\/button>\n          <\/div>\n        <\/div>\n      <\/div>`;\n  }\n\n  function renderConfirmModal() {\n    if (!state.confirmDelete) return '';\n    return `\n      <div class=\"nx-modal-overlay\" data-action=\"modal-overlay-close\">\n        <div class=\"nx-confirm-modal\">\n          <p>Delete this transaction? This action cannot be undone.<\/p>\n          <div class=\"nx-modal-footer\">\n            <button class=\"nx-btn nx-btn-ghost nx-btn-sm\" data-action=\"cancel-delete\">Cancel<\/button>\n            <button class=\"nx-btn nx-btn-danger nx-btn-sm\" data-action=\"confirm-delete\" data-tx-id=\"${escHtml(state.confirmDelete.txId)}\">Delete<\/button>\n          <\/div>\n        <\/div>\n      <\/div>`;\n  }\n\n  // ── Modal Close position (absorvido do cpx.js — renderizado no fluxo normal) ──\n  function renderClosePositionModal(assets, allTxs) {\n    const cm = state.closeModal;\n    if (!cm) return '';\n    const asset = assets.find(a => a.id === cm.assetId);\n    if (!asset) return '';\n    const txs = allTxs.filter(t => t.assetId === asset.id);\n    const fi = isFixedIncome(asset.assetClass);\n    const qty = calcQty(txs);\n    const cost = calcTotalCost(txs, asset.assetClass);\n    const income = calcIncomeTotal(txs);\n    const priorProceeds = calcProceeds(asset, txs);\n    const base = priorProceeds + income - cost;              // resultado realizado ANTES desta venda\n    const value = (cm.value != null) ? cm.value : calcPosition(asset, qty); // pré-preenche com valor atual estimado\n    const realizedNow = base + value;\n\n    const posInfo = fi\n      ? `Net invested: <strong>R$ ${fmtBR(cost - priorProceeds)}<\/strong> · cost basis R$ ${fmtBR(cost)}`\n      : `Current position: <strong>${fmtQty(qty)}<\/strong> shares · cost basis R$ ${fmtBR(cost)}`;\n    const warn = (!fi && qty <= 0)\n      ? '<div class=\"cpx-err\" style=\"display:block;\">This asset has no open shares to close.<\/div>' : '';\n\n    return `\n      <div class=\"cpx-overlay\" data-action=\"close-position-overlay\">\n        <div class=\"cpx-modal\" role=\"dialog\" aria-modal=\"true\">\n          <h3>Close position — ${escHtml(asset.name)}<\/h3>\n          <p class=\"cpx-sub\">Records the full sale, removes the asset from the active wallet and keeps its history so the realized profit/loss stays available.<\/p>\n          <div class=\"cpx-info\">${posInfo}<\/div>\n          ${warn}\n          <div class=\"cpx-field\"><label>Sale date *<\/label><input type=\"date\" id=\"cpx-date\" value=\"${escHtml(cm.date || new Date().toISOString().slice(0, 10))}\"><\/div>\n          <div class=\"cpx-field\"><label>Total amount received (R$) *<\/label>\n            <div class=\"cpx-money\"><span>R$<\/span>\n              <input type=\"text\" id=\"cpx-value\" inputmode=\"decimal\" autocomplete=\"off\" data-base=\"${base}\" value=\"${fmtBR(value)}\" placeholder=\"0,00\">\n            <\/div><\/div>\n          <div class=\"cpx-field\"><label>Note<\/label><textarea id=\"cpx-note\" rows=\"2\" placeholder=\"Optional…\">${escHtml(cm.note || '')}<\/textarea><\/div>\n          <div class=\"cpx-preview\"><span class=\"lbl\">Realized P/L<\/span>\n            <span class=\"val ${realizedNow >= 0 ? 'cpx-pos' : 'cpx-neg'}\" id=\"cpx-realized\">${realizedNow >= 0 ? '+' : '−'}R$ ${fmtBR(Math.abs(realizedNow))}<\/span><\/div>\n          <div class=\"cpx-err\" id=\"cpx-error\"><\/div>\n          <div class=\"cpx-foot\">\n            <button class=\"cpx-btn cpx-btn-ghost\" data-action=\"close-position-cancel\">Cancel<\/button>\n            <button class=\"cpx-btn cpx-btn-primary\" data-action=\"close-position-confirm\" data-asset-id=\"${escHtml(asset.id)}\">Close position<\/button>\n          <\/div>\n        <\/div>\n      <\/div>`;\n  }\n\n  // Confirma o encerramento: cria a sell \"closing\", marca o asset e persiste\n  // atomicamente (mesmas chaves de localStorage e mesmo sync ao Gist do cpx.js).\n  function confirmClosePosition(container, assetId) {\n    const assets = getAssets();\n    const idx = assets.findIndex(a => a.id === assetId);\n    if (idx < 0) return;\n    const asset = assets[idx];\n    const fi = isFixedIncome(asset.assetClass);\n    const txs = getTxs();\n    const mine = txs.filter(t => t.assetId === assetId);\n    const qty = calcQty(mine);\n\n    const valEl = container.querySelector('#cpx-value');\n    const dateEl = container.querySelector('#cpx-date');\n    const noteEl = container.querySelector('#cpx-note');\n    const errEl = container.querySelector('#cpx-error');\n    const digits = ((valEl && valEl.value) || '').replace(/\\D/g, '');\n    const saleValue = parseInt(digits || '0', 10) / 100;\n    const date = (dateEl && dateEl.value) || new Date().toISOString().slice(0, 10);\n    const note = (noteEl && noteEl.value) || '';\n\n    function fail(msg) { if (errEl) { errEl.textContent = msg; errEl.style.display = 'block'; } }\n    if (isNaN(saleValue) || saleValue < 0) { fail('Enter a valid sale amount.'); return; }\n    if (!fi && qty <= 0) { fail('This asset has no open shares to close.'); return; }\n\n    const closingTx = {\n      id: cpxUid(),\n      assetId: assetId,\n      type: 'sell',\n      date: date,\n      quantity: fi ? 1 : qty,\n      amount: fi ? saleValue : (qty > 0 ? saleValue / qty : 0),\n      notes: note || 'Position closed (full sale)',\n      closing: true\n    };\n    txs.push(closingTx);\n\n    asset.closed = true;\n    asset.closedAt = date;\n    asset.closeProceeds = saleValue;\n    asset.closeTxId = closingTx.id;\n    asset.manualUnitPrice = 0;            // zera o valor atual → sai da carteira ativa e do dashboard\n    asset.priceUpdatedAt = new Date().toISOString();\n    assets[idx] = asset;\n\n    persist(assets, txs);\n    editState[assetId] = { raw: fmtBR(0), dirty: false, justSaved: false }; // input reflete o preço zerado\n    state.closeModal = null;\n    setAssetView('closed');               // pula para a visão \"Closed\" para o resultado ficar visível\n    renderAll();\n  }\n\n  function reopenAsset(assetId) {\n    const assets = getAssets();\n    const idx = assets.findIndex(a => a.id === assetId);\n    if (idx < 0) return;\n    const asset = assets[idx];\n    let txs = getTxs();\n    if (asset.closeTxId) txs = txs.filter(t => t.id !== asset.closeTxId);\n    delete asset.closed;\n    delete asset.closedAt;\n    delete asset.closeProceeds;\n    delete asset.closeTxId;\n    assets[idx] = asset;\n    persist(assets, txs);\n    renderAll();\n  }\n\n  // ── 9. EVENT HANDLERS ─────────────────────────────────────────────────────\n  function attachEventListeners(container) {\n    if (!container) return;\n\n    // Delegated click — remove antes de adicionar para evitar acúmulo entre re-renders\n    container.removeEventListener('click', handleClick);\n    container.addEventListener('click', handleClick);\n\n    // Aba Assets: filtro/ordenação por classe (persistidos)\n    container.querySelectorAll('[data-afilter]').forEach(el => {\n      el.addEventListener('change', () => {\n        const k = el.dataset.afilter;\n        state[k] = el.value;\n        localStorage.setItem(k === 'assetClassFilter' ? 'nexo:assets:classFilter' : 'nexo:assets:sort', el.value);\n        renderAssetsPage();\n      });\n    });\n\n    // Filter inputs (change + input)\n    container.querySelectorAll('[data-filter]').forEach(el => {\n      el.addEventListener('change', handleFilterChange);\n      el.addEventListener('input', handleFilterChange);\n    });\n\n    // Price inputs (keydown for Enter, input for dirty)\n    container.querySelectorAll('.nx-editable-input').forEach(el => {\n      el.addEventListener('input', handlePriceInput);\n      el.addEventListener('keydown', handlePriceKeydown);\n      // Ao focar, seleciona tudo: o primeiro dígito digitado substitui o valor anterior,\n      // garantindo que o input calculadora comece do zero.\n      el.addEventListener('focus', () => el.select());\n    });\n\n    // New asset modal — sync typed fields into state + live preview\n    ['nm-name', 'nm-ticker', 'nm-issuer', 'nm-maturity', 'nm-notes'].forEach(id => {\n      const el = container.querySelector('#' + id);\n      if (!el) return;\n      el.addEventListener('input', () => {\n        if (!state.modal) return;\n        const d = state.modal.data || (state.modal.data = {});\n        if (id === 'nm-maturity') d.maturityDate = el.value;\n        else d[id.slice(3)] = el.value;\n        nxUpdateAssetPreview(container);\n      });\n    });\n\n    // Modal amount input — formato calculadora (igual ao campo de preço dos asset cards)\n    const tmAmount = container.querySelector('#tm-amount');\n    if (tmAmount) {\n      tmAmount.addEventListener('input', function () {\n        const digits = tmAmount.value.replace(/\\D/g, '');\n        const cents = parseInt(digits || '0', 10);\n        const fmt = (cents / 100).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });\n        tmAmount.value = fmt;\n        tmAmount.setSelectionRange(fmt.length, fmt.length);\n        // Limpa erro se existir\n        const errEl = container.querySelector('#tm-save-error');\n        if (errEl) errEl.style.display = 'none';\n        if (state.modal) state.modal.data.amount = cents / 100;\n        updateTxSummary(container);\n      });\n      tmAmount.addEventListener('focus', function () { tmAmount.select(); });\n    }\n\n    // Tx modal — sync qty/date/notes + asset search filter + live summary\n    const tmQty = container.querySelector('#tm-qty');\n    if (tmQty) tmQty.addEventListener('input', () => { if (state.modal) state.modal.data.quantity = tmQty.value; updateTxSummary(container); });\n    const tmDate = container.querySelector('#tm-date');\n    if (tmDate) tmDate.addEventListener('change', () => { if (state.modal) state.modal.data.date = tmDate.value; });\n    const tmNotes = container.querySelector('#tm-notes');\n    if (tmNotes) tmNotes.addEventListener('input', () => { if (state.modal) state.modal.data.notes = tmNotes.value; });\n    const tmSearch = container.querySelector('#tm-asset-search');\n    if (tmSearch) {\n      tmSearch.addEventListener('input', () => nxFilterAssetList(container));\n    }\n    container.querySelectorAll('[data-clsfilter]').forEach(ch => {\n      ch.addEventListener('click', () => {\n        txPickerClass = ch.dataset.clsfilter;\n        container.querySelectorAll('[data-clsfilter]').forEach(x => x.classList.toggle('active', x.dataset.clsfilter === txPickerClass));\n        nxFilterAssetList(container);\n      });\n    });\n    if (container.querySelector('#tm-asset-list')) nxFilterAssetList(container);\n    updateTxSummary(container);\n\n    // Close-position modal — input calculadora + preview de Realized P/L (ex-recompute do cpx)\n    const cpxValue = container.querySelector('#cpx-value');\n    if (cpxValue) {\n      cpxValue.addEventListener('input', () => {\n        const digits = cpxValue.value.replace(/\\D/g, '');\n        const cents = parseInt(digits || '0', 10);\n        const fmt = (cents / 100).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });\n        cpxValue.value = fmt;\n        try { cpxValue.setSelectionRange(fmt.length, fmt.length); } catch (e) {}\n        if (state.closeModal) state.closeModal.value = cents / 100; // sobrevive a re-renders\n        const prev = container.querySelector('#cpx-realized');\n        if (prev) {\n          const b = parseFloat(cpxValue.getAttribute('data-base')) || 0;\n          const rl = b + cents / 100;\n          prev.textContent = (rl >= 0 ? '+' : '−') + 'R$ ' + fmtBR(Math.abs(rl));\n          prev.className = 'val ' + (rl >= 0 ? 'cpx-pos' : 'cpx-neg');\n        }\n        const err = container.querySelector('#cpx-error');\n        if (err) err.style.display = 'none';\n      });\n      cpxValue.addEventListener('focus', () => cpxValue.select());\n    }\n    const cpxDate = container.querySelector('#cpx-date');\n    if (cpxDate) cpxDate.addEventListener('change', () => { if (state.closeModal) state.closeModal.date = cpxDate.value; });\n    const cpxNote = container.querySelector('#cpx-note');\n    if (cpxNote) cpxNote.addEventListener('input', () => { if (state.closeModal) state.closeModal.note = cpxNote.value; });\n  }\n\n  function handleClick(e) {\n    // O mesmo handler serve às duas abas: o container vem do evento delegado.\n    const container = e.currentTarget;\n    const host = (container === _assetsContainer) ? 'assets' : 'tx';\n    const btn = e.target.closest('[data-action]');\n    if (!btn) return;\n    const action = btn.dataset.action;\n\n    if (action === 'open-new-asset') { state.modal = { type: 'newAsset', data: {} }; renderAssetsPage(); return; }\n    if (action === 'open-add-tx') { txPickerClass = 'all'; state.modal = { type: 'addTx', data: {} }; renderTxPage(); return; }\n    if (action === 'toggle-asset-menu') { const id = btn.dataset.assetId; state.openMenu = (state.openMenu === id) ? null : id; renderAssetsPage(); return; }\n    if (action === 'add-tx-for-asset') { state.openMenu = null; state.modal = { type: 'addTxForAsset', data: { assetId: btn.dataset.assetId, type: 'buy', date: new Date().toISOString().slice(0, 10) } }; renderAssetsPage(); return; }\n    if (action === 'tm-set-type') { if (state.modal) { syncTxModal(container); state.modal.data.type = btn.dataset.val; renderHost(host); } return; }\n    if (action === 'tm-pick-asset') { if (state.modal) { syncTxModal(container); state.modal.data.assetId = btn.dataset.assetId; renderHost(host); } return; }\n    if (action === 'tm-change-asset') { if (state.modal) { syncTxModal(container); state.modal.data.assetId = ''; renderHost(host); } return; }\n    if (action === 'nm-set-class') { if (state.modal) { syncAssetModal(container); state.modal.data.assetClass = btn.dataset.val; renderAssetsPage(); } return; }\n    if (action === 'nm-set-region') { if (state.modal) { syncAssetModal(container); state.modal.data.region = btn.dataset.val; renderAssetsPage(); } return; }\n    if (action === 'open-coupon') {\n      const assetId = btn.dataset.assetId;\n      state.openMenu = null;\n      state.modal = { type: 'coupon', data: { assetId, type: 'income' } };\n      renderAssetsPage(); return;\n    }\n    if (action === 'open-dividend') {\n      const assetId = btn.dataset.assetId;\n      state.openMenu = null;\n      state.modal = { type: 'dividend', data: { assetId, type: 'income' } };\n      renderAssetsPage(); return;\n    }\n    if (action === 'open-edit-asset') {\n      const assetId = btn.dataset.assetId;\n      state.openMenu = null;\n      const asset = getAssets().find(a => a.id === assetId);\n      if (asset) { state.modal = { type: 'editAsset', data: { ...asset } }; renderAssetsPage(); }\n      return;\n    }\n    if (action === 'modal-close') { state.modal = null; renderHost(host); return; }\n    // modal-overlay-close: fecha apenas se o clique foi direto no overlay (não em conteúdo interno)\n    if (action === 'modal-overlay-close') { if (e.target === btn) { state.modal = null; renderHost(host); } return; }\n    if (action === 'toggle-assets') { state.showAssets = !state.showAssets; renderAssetsPage(); return; }\n    if (action === 'type-filter') { state.typeFilter = btn.dataset.val; renderTxPage(); return; }\n    if (action === 'set-view') {\n      state.view = btn.dataset.val;\n      localStorage.setItem(VIEW_KEY, state.view);\n      renderTxPage(); return;\n    }\n    if (action === 'clear-filters') {\n      state.from = ''; state.to = ''; state.assetId = ''; state.search = ''; state.typeFilter = 'all';\n      renderTxPage(); return;\n    }\n    if (action === 'price-save') {\n      const assetId = btn.dataset.assetId;\n      savePriceForAsset(assetId);\n      return;\n    }\n    if (action === 'save-new-asset') { doSaveNewAsset(container); return; }\n    if (action === 'save-tx') { doSaveTx(container, btn.dataset.txId); return; }\n    if (action === 'edit-tx') {\n      const txId = btn.dataset.txId;\n      const tx = getTxs().find(t => t.id === txId);\n      if (tx) { state.modal = { type: 'editTx', data: { ...tx } }; renderTxPage(); }\n      return;\n    }\n    if (action === 'delete-tx') {\n      state.confirmDelete = { txId: btn.dataset.txId };\n      renderTxPage(); return;\n    }\n    if (action === 'cancel-delete') { state.confirmDelete = null; renderTxPage(); return; }\n    if (action === 'confirm-delete') {\n      const txId = btn.dataset.txId;\n      const txs = getTxs().filter(t => t.id !== txId);\n      saveTxs(txs);\n      state.confirmDelete = null;\n      renderAll(); return;\n    }\n\n    // ── ações da visão Active/Closed (absorvidas do cpx.js) ──\n    if (action === 'set-asset-view') { setAssetView(btn.dataset.val); renderAssetsPage(); return; }\n    if (action === 'open-close-position') {\n      state.openMenu = null;\n      state.closeModal = { assetId: btn.dataset.assetId };\n      renderAssetsPage();\n      const inp = _assetsContainer && _assetsContainer.querySelector('#cpx-value');\n      if (inp) { try { inp.focus({ preventScroll: true }); inp.select(); } catch (err) {} }\n      return;\n    }\n    if (action === 'close-position-cancel') { state.closeModal = null; renderAssetsPage(); return; }\n    if (action === 'close-position-overlay') { if (e.target === btn) { state.closeModal = null; renderAssetsPage(); } return; }\n    if (action === 'close-position-confirm') { confirmClosePosition(container, btn.dataset.assetId); return; }\n    if (action === 'reopen-asset') { reopenAsset(btn.dataset.assetId); return; }\n  }\n\n  function handleFilterChange(e) {\n    const el = e.target;\n    const key = el.dataset.filter;\n    if (key) { state[key] = el.value; renderTxPage(); }\n  }\n\n  function handlePriceInput(e) {\n    const el = e.target;\n    const assetId = el.dataset.assetId;\n    if (!assetId) return;\n\n    // Formato calculadora: extrai só os dígitos, trata como centavos e shifta pra esquerda.\n    // Ex.: digitar \"1\",\"2\",\"3\",\"4\",\"5\" → \"0,01\" → \"0,12\" → \"1,23\" → \"12,34\" → \"123,45\"\n    const digits = el.value.replace(/\\D/g, '');\n    const cents = parseInt(digits || '0', 10);\n    const formatted = (cents / 100).toLocaleString('pt-BR', {\n      minimumFractionDigits: 2,\n      maximumFractionDigits: 2,\n    });\n    // Atualiza o valor exibido e reposiciona o cursor no fim\n    el.value = formatted;\n    el.setSelectionRange(formatted.length, formatted.length);\n\n    if (!editState[assetId]) editState[assetId] = { raw: formatted, dirty: false, justSaved: false };\n    editState[assetId].raw = formatted;\n    editState[assetId].dirty = true;\n    editState[assetId].justSaved = false;\n\n    // O input de preço só existe na aba Assets.\n    const confirmBtn = _assetsContainer && _assetsContainer.querySelector(`.nx-editable-confirm[data-asset-id=\"${assetId}\"]`);\n    if (confirmBtn) confirmBtn.disabled = false;\n    const subEl = el.closest('.nx-editable-wrap') && el.closest('.nx-editable-wrap').querySelector('.nx-editable-sub');\n    if (subEl) subEl.innerHTML = `<span class=\"nx-stat-accent\">Press Enter or ✓ to save<\/span>`;\n  }\n\n  function handlePriceKeydown(e) {\n    if (e.key === 'Enter') {\n      const assetId = e.target.dataset.assetId;\n      if (assetId) savePriceForAsset(assetId);\n    }\n  }\n\n  function savePriceForAsset(assetId) {\n    const es = editState[assetId];\n    if (!es) return;\n    const raw = es.raw;\n    const val = parseBR(raw);\n    if (isNaN(val) || val < 0) return;\n    const assets = getAssets();\n    const asset = assets.find(a => a.id === assetId);\n    if (!asset) return;\n    asset.manualUnitPrice = val;\n    asset.priceUpdatedAt = new Date().toISOString();\n    saveAsset(asset);\n    editState[assetId].dirty = false;\n    editState[assetId].justSaved = true;\n    editState[assetId].raw = fmtBR(val);\n    renderAll();\n    // clear justSaved after 2s (cosmético — só afeta a aba Assets)\n    setTimeout(() => {\n      if (editState[assetId]) {\n        editState[assetId].justSaved = false;\n        renderAssetsPage();\n      }\n    }, 2000);\n  }\n\n  // Sincroniza os campos digitados no modal para state.modal.data antes de um re-render\n  // (evita perder o que o usuário digitou ao clicar num botão de tipo/asset/classe).\n  function syncTxModal(container) {\n    const m = state.modal; if (!m) return; const d = m.data || (m.data = {});\n    const dt = container.querySelector('#tm-date'); if (dt) d.date = dt.value;\n    const q = container.querySelector('#tm-qty'); if (q) d.quantity = q.value;\n    const am = container.querySelector('#tm-amount'); if (am) d.amount = parseBR(am.value);\n    const nt = container.querySelector('#tm-notes'); if (nt) d.notes = nt.value;\n  }\n  function syncAssetModal(container) {\n    const m = state.modal; if (!m) return; const d = m.data || (m.data = {});\n    ['name', 'ticker', 'issuer', 'notes'].forEach(k => { const el = container.querySelector('#nm-' + k); if (el) d[k] = el.value; });\n    const mt = container.querySelector('#nm-maturity'); if (mt) d.maturityDate = mt.value;\n  }\n  function nxTxTotalParts() {\n    const m = state.modal; if (!m) return null;\n    const d = m.data || {};\n    const type = (m.type === 'coupon' || m.type === 'dividend') ? 'income' : (d.type || 'buy');\n    const asset = getAssets().find(a => a.id === d.assetId);\n    const fi = asset ? isFixedIncome(asset.assetClass) : false;\n    const amountTotal = fi || type === 'income' || type === 'adjustment';\n    const qty = parseFloat(d.quantity) || 0;\n    const amt = d.amount ? parseBR(d.amount) : 0;\n    const total = amountTotal ? amt : qty * amt;\n    const labels = { buy: 'Total to invest', sell: 'Total proceeds', income: 'Income received', adjustment: 'Adjustment value' };\n    const sign = type === 'buy' ? '\\u2212' : (type === 'adjustment' ? '' : '+');\n    let sub;\n    if (!asset) sub = 'Select an asset';\n    else if (amountTotal) sub = asset.name;\n    else if (qty > 0 && amt > 0) sub = fmtQty(qty) + ' \\u00d7 R$ ' + fmtBR(amt) + ' \\u00b7 ' + asset.name;\n    else sub = 'Enter quantity and unit price';\n    const meta = NX_TX_TYPE[type] || NX_TX_TYPE.buy;\n    return { label: labels[type] || 'Total', sub: sub, total: total, sign: sign, color: total > 0 ? meta.color : 'var(--text-secondary,#6b6b6b)' };\n  }\n  function nxFilterAssetList(container) {\n    const searchEl = container.querySelector('#tm-asset-search');\n    const q = (searchEl ? searchEl.value : '').trim().toLowerCase();\n    let shown = 0;\n    container.querySelectorAll('#tm-asset-list .nx-ap-item').forEach(it => {\n      const okText = !q || (it.dataset.search || '').indexOf(q) >= 0;\n      const okClass = txPickerClass === 'all' || (it.dataset.class || '') === txPickerClass;\n      const match = okText && okClass;\n      it.style.display = match ? '' : 'none';\n      if (match) shown++;\n    });\n    const empty = container.querySelector('#tm-asset-empty');\n    if (empty) empty.style.display = shown ? 'none' : 'block';\n  }\n  function updateTxSummary(container) {\n    const p = nxTxTotalParts(); if (!p) return;\n    const l = container.querySelector('#tm-sum-label'); if (l) l.textContent = p.label;\n    const s = container.querySelector('#tm-sum-sub'); if (s) s.textContent = p.sub;\n    const t = container.querySelector('#tm-sum-total'); if (t) { t.textContent = (p.total > 0 ? p.sign : '') + 'R$ ' + fmtBR(p.total); t.style.color = p.color; }\n  }\n  function nxUpdateAssetPreview(container) {\n    const m = state.modal; if (!m) return; const d = m.data || {};\n    const cls = d.assetClass || 'ETF'; const fi = isFixedIncome(cls);\n    const nm = container.querySelector('#na-prev-name'); if (nm) nm.textContent = (d.name || '').trim() || 'Asset name\\u2026';\n    const mt = container.querySelector('#na-prev-meta'); if (mt) mt.textContent = ((d.ticker || '').trim() ? (d.ticker || '').trim().toUpperCase() + ' \\u00b7 ' : '') + cls + (fi && (d.issuer || '').trim() ? ' \\u00b7 ' + (d.issuer || '').trim() : '');\n  }\n\n  function doSaveNewAsset(container) {\n    const m = state.modal || {}; const d = m.data || {};\n    const g = (id, fb) => { const el = container.querySelector(id); return el ? el.value : (fb || ''); };\n    const name = g('#nm-name', d.name);\n    const ticker = g('#nm-ticker', d.ticker);\n    const assetClass = d.assetClass || 'ETF';\n    const issuer = g('#nm-issuer', d.issuer);\n    const maturityDate = g('#nm-maturity', d.maturityDate);\n    const region = d.region || 'BR';\n    const notes = g('#nm-notes', d.notes);\n    if (!name.trim()) { alert('Name is required.'); return; }\n    if (m.type === 'editAsset' && m.data && m.data.id) {\n      const arr = getAssets();\n      const idx = arr.findIndex(a => a.id === m.data.id);\n      if (idx >= 0) {\n        arr[idx] = { ...arr[idx], name: name.trim(), ticker: ticker.trim(), assetClass, region, issuer, maturityDate, notes };\n        saveAssets(arr);\n      }\n    } else {\n      const asset = { id: generateId(), name: name.trim(), ticker: ticker.trim(), assetClass, region, issuer, maturityDate, notes, manualUnitPrice: 0, priceUpdatedAt: '' };\n      saveAsset(asset);\n    }\n    state.modal = null;\n    renderAll();\n  }\n\n  function doSaveTx(container, existingId) {\n    const m = state.modal || {}; const d = m.data || {};\n    const assetId = d.assetId || '';\n    const type = (m.type === 'coupon' || m.type === 'dividend') ? 'income' : (d.type || 'buy');\n    const date = (container.querySelector('#tm-date') || {}).value || d.date || '';\n    const qtyEl = container.querySelector('#tm-qty');\n    const quantity = qtyEl ? (qtyEl.value || '1') : '1';\n    const amountEl = container.querySelector('#tm-amount');\n    const amount = amountEl ? amountEl.value : (d.amount != null ? String(d.amount) : '');\n    const notes = (container.querySelector('#tm-notes') || {}).value || d.notes || '';\n    if (!assetId || !date || !amount) {\n      // Mostra erro inline em vez de alert()\n      const errEl = container.querySelector('#tm-save-error');\n      if (errEl) { errEl.textContent = 'Asset, date and amount are required.'; errEl.style.display = 'block'; }\n      return;\n    }\n    const parsedAmount = parseBR(amount); // suporta \"1.234,56\", \"1234,56\" e \"1234.56\"\n    const txs = getTxs();\n    if (existingId) {\n      const idx = txs.findIndex(t => t.id === existingId);\n      if (idx >= 0) txs[idx] = { ...txs[idx], assetId, type, date, quantity: parseFloat(quantity)||1, amount: parsedAmount, notes };\n    } else {\n      txs.push({ id: generateId(), assetId, type, date, quantity: parseFloat(quantity)||1, amount: parsedAmount, notes });\n    }\n    saveTxs(txs);\n    state.modal = null;\n    renderAll();\n  }\n\n  // ── 10. MOUNT ─────────────────────────────────────────────────────────────\n\n  // Esc fecha o modal Close position (paridade com o cpx.js).\n  document.addEventListener('keydown', function (e) {\n    if (e.key === 'Escape' && state.closeModal) {\n      state.closeModal = null;\n      renderAssetsPage();\n    }\n  });\n\n  // Fecha o menu \\u22ef de um asset ao clicar fora dele.\n  document.addEventListener('click', function (e) {\n    if (state.openMenu && (!e.target.closest || !e.target.closest('.nx-ac-menu-wrap'))) {\n      state.openMenu = null;\n      renderAssetsPage();\n    }\n  });\n\n  /* Nexo 4.0: abas registradas no roteador síncrono — sem observers/timeouts.\n     A visão Active/Closed é decidida no próprio render (sem pós-patch → sem flick). */\n  Nexo.registerTab('investments_transactions', function () {\n    return {\n      mount(section) {\n        injectCSS();\n        _txContainer = document.createElement('div');\n        _txContainer.id = 'nx-it-root';\n        section.appendChild(_txContainer);\n        renderTxPage(); // pinta já com dados locais\n        loadFromGist().finally(renderAll);\n      },\n      show() {\n        renderTxPage();\n        loadFromGist().finally(renderAll);\n      },\n    };\n  });\n\n  Nexo.registerTab('assets', function () {\n    return {\n      mount(section) {\n        injectCSS();\n        _assetsContainer = document.createElement('div');\n        _assetsContainer.id = 'nx-assets-root';\n        section.appendChild(_assetsContainer);\n        renderAssetsPage(); // já nasce filtrando fechados — sem flick\n        loadFromGist().finally(renderAll);\n      },\n      show() {\n        renderAssetsPage();\n        loadFromGist().finally(renderAll);\n      },\n    };\n  });\n})();\n\n<\/script>\n<script>\n/* ═══ new-investments.js ═══ */\n\n/* ── Nexo — New Investments ─────────────────────────────────────────────── */\n(function () {\n  'use strict';\n\n  // ── Constants ─────────────────────────────────────────────────────────────\n  var ASSETS_KEY     = 'nexo_investment_assets';\n  var TXS_KEY        = 'nexo_investment_transactions';\n  var STRATEGY_KEY   = 'nexo_target_strategy';\n  var REGION_MAP_KEY = 'nexo_asset_region_map';\n  var LAST_AMT_KEY   = 'nexo_ni_last_amount';\n  var FIXED_INCOME = ['CDB','LCI','LCA','Fund'];\n\n  // 4 buckets — order is important (drives UI and aggressiveness scoring)\n  var BUCKET_KEYS = ['rf','rvNac','rvInt','crypto'];\n  var BUCKET_META = {\n    rf:     { name: 'Fixed Income',         color: '#6B9E7A', riskWeight: 0   },\n    rvNac:  { name: 'Domestic Equity',      color: '#E07A5F', riskWeight: 1.0 },\n    rvInt:  { name: 'International Equity', color: '#4C7A99', riskWeight: 1.0 },\n    crypto: { name: 'Crypto',               color: '#7A3F8F', riskWeight: 1.5 }\n  };\n\n  // Risk profiles\n  var RISK_PROFILES = [\n    { max: 20,  name: 'Very Conservative', color: '#3F6F50' },\n    { max: 40,  name: 'Conservative',      color: '#6B9E7A' },\n    { max: 60,  name: 'Moderate',          color: '#B58A3B' },\n    { max: 80,  name: 'Aggressive',        color: '#D55F3E' },\n    { max: 999, name: 'Very Aggressive',   color: '#7A3F8F' }\n  ];\n\n  // ── Gist sync (shared with the rest of the React app via /api/sync/data) ──\n  async function loadNiFromGist() {\n    try {\n      const resp = await fetch('/api/sync/data');\n      if (!resp.ok) return;\n      const json = await resp.json();\n      const d = json && json.payload && json.payload.data;\n      if (!d) return;\n      if (d.targetStrategy && typeof d.targetStrategy === 'object')\n        localStorage.setItem(STRATEGY_KEY, JSON.stringify(d.targetStrategy));\n      if (d.assetRegionMap && typeof d.assetRegionMap === 'object')\n        localStorage.setItem(REGION_MAP_KEY, JSON.stringify(d.assetRegionMap));\n      if (typeof d.niLastAmount === 'number')\n        localStorage.setItem(LAST_AMT_KEY, String(d.niLastAmount));\n      if (d.beaSettings && typeof d.beaSettings === 'object')\n        localStorage.setItem('nexo_bea_settings', JSON.stringify(d.beaSettings));\n      if (d.ibovComposition && Array.isArray(d.ibovComposition.stocks))\n        localStorage.setItem('nexo_ibov_composition', JSON.stringify(d.ibovComposition));\n    } catch (e) {\n      console.warn('[Nexo NI] loadFromGist failed:', e);\n    }\n  }\n\n  var _niSyncTimer = null;\n  function syncNiToGistDebounced() {\n    if (_niSyncTimer) clearTimeout(_niSyncTimer);\n    _niSyncTimer = setTimeout(syncNiToGist, 600);\n  }\n  async function syncNiToGist() {\n    try {\n      const resp = await fetch('/api/sync/data');\n      if (!resp.ok) return;\n      const json = await resp.json();\n      if (!json || !json.payload) return;\n      const payload = json.payload;\n      if (!payload.data) payload.data = {};\n      payload.data.targetStrategy   = loadStrategy();\n      payload.data.assetRegionMap   = loadRegionMap();\n      payload.data.niLastAmount     = parseFloat(localStorage.getItem(LAST_AMT_KEY) || '0') || 0;\n      payload.data.beaSettings      = loadBEASettings();\n      payload.data.ibovComposition  = loadStoredIbov();   // may be null when no CSV was imported\n      if (!payload.meta) payload.meta = {};\n      payload.meta.updatedAt = new Date().toISOString();\n      await fetch('/api/sync/data', {\n        method: 'PUT',\n        headers: { 'Content-Type': 'application/json' },\n        body: JSON.stringify(payload),\n      });\n    } catch (e) {\n      console.warn('[Nexo NI] syncToGist failed:', e);\n    }\n  }\n\n  // ── Helpers ──────────────────────────────────────────────────────────────\n  function loadJSON(k, def) {\n    try { return JSON.parse(localStorage.getItem(k) || def); }\n    catch (e) { return JSON.parse(def); }\n  }\n  function saveJSON(k, v) { localStorage.setItem(k, JSON.stringify(v)); }\n  function loadAssets()   { return loadJSON(ASSETS_KEY, '[]'); }\n  function loadTxs()      { return loadJSON(TXS_KEY, '[]'); }\n  function loadStrategy() {\n    var d = loadJSON(STRATEGY_KEY, '{}');\n    return {\n      rf:     Number.isFinite(+d.rf)     ? +d.rf     : 50,\n      rvNac:  Number.isFinite(+d.rvNac)  ? +d.rvNac  : 20,\n      rvInt:  Number.isFinite(+d.rvInt)  ? +d.rvInt  : 25,\n      crypto: Number.isFinite(+d.crypto) ? +d.crypto : 5\n    };\n  }\n  function saveStrategy(s) { saveJSON(STRATEGY_KEY, s); syncNiToGistDebounced(); }\n  function loadRegionMap() { return loadJSON(REGION_MAP_KEY, '{}'); }\n  function saveRegionMap(m) { saveJSON(REGION_MAP_KEY, m); syncNiToGistDebounced(); }\n  function isFixedIncome(cls) { return FIXED_INCOME.indexOf(cls) >= 0; }\n  function escHtml(s) {\n    return String(s == null ? '' : s).replace(/[&<>\"']/g, function (c) {\n      return ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '\"':'&quot;', \"'\":'&#39;' })[c];\n    });\n  }\n  function fmtBRL(v, d) {\n    if (v == null || isNaN(v)) return 'R$ —';\n    var opts = { minimumFractionDigits: d == null ? 2 : d, maximumFractionDigits: d == null ? 2 : d };\n    return 'R$ ' + Math.abs(v).toLocaleString('pt-BR', opts);\n  }\n  function parseBR(str) {\n    if (str == null) return 0;\n    var s = String(str).trim().replace(/\\s/g,'').replace(/R\\$/g,'');\n    if (s.indexOf(',') >= 0) s = s.replace(/\\./g,'').replace(',', '.');\n    var n = parseFloat(s);\n    return isNaN(n) ? 0 : n;\n  }\n  function isValidRegion(r) { return r === 'BR' || r === 'INTL' || r === 'CRYPTO'; }\n  function getRegion(asset, regionMap) {\n    if (isValidRegion(asset.region))            return asset.region;\n    if (isValidRegion(regionMap[asset.id]))     return regionMap[asset.id];\n    return null; // explicitly unclassified\n  }\n  function classifyBucket(asset, regionMap) {\n    if (isFixedIncome(asset.assetClass) || asset.assetClass === 'Cash') return 'rf';\n    var r = getRegion(asset, regionMap);\n    if (r === 'INTL')   return 'rvInt';\n    if (r === 'CRYPTO') return 'crypto';\n    // null or 'BR' → defaults to Domestic Equity for display purposes\n    return 'rvNac';\n  }\n\n  // ── Aggressiveness scoring ───────────────────────────────────────────────\n  // Score = Σ (weight_i × pct_i). Max = 100 × 1.5 (all crypto) = 150.\n  // We normalize the threshold buckets against the raw weighted score (not divided).\n  // 100% RF → 0;  100% RV  → 100;  100% Crypto → 150.\n  function aggressivenessScore(pcts) {\n    var sum = 0, total = 0;\n    BUCKET_KEYS.forEach(function (k) {\n      var p = +pcts[k] || 0;\n      sum += p * BUCKET_META[k].riskWeight;\n      total += p;\n    });\n    if (total <= 0) return 0;\n    // Re-normalize percentages so they sum to 100 (in case input is unnormalized)\n    return sum * (100 / total);\n  }\n  function riskProfileFor(score) {\n    for (var i = 0; i < RISK_PROFILES.length; i++) {\n      if (score <= RISK_PROFILES[i].max) return RISK_PROFILES[i];\n    }\n    return RISK_PROFILES[RISK_PROFILES.length - 1];\n  }\n\n\n  // ── Ibovespa snapshot ────────────────────────────────────────────────────\n  // Approximate weights based on B3 quadrimestre prior to user's session.\n  // Update by editing this array (or, in the future, fetched dynamically).\n  var IBOV_SNAPSHOT = {\n    date: 'Snapshot ~Jan/2025 (approx., user-editable)',\n    stocks: [\n      { ticker: 'VALE3',  company: 'Vale',                weight: 11.5 },\n      { ticker: 'ITUB4',  company: 'Itaú Unibanco',       weight: 9.5  },\n      { ticker: 'PETR4',  company: 'Petrobras',           weight: 7.0  },\n      { ticker: 'PETR3',  company: 'Petrobras',           weight: 5.5  },\n      { ticker: 'ELET3',  company: 'Eletrobras ON',       weight: 4.2  },\n      { ticker: 'B3SA3',  company: 'B3',                  weight: 4.0  },\n      { ticker: 'BBAS3',  company: 'Banco do Brasil',     weight: 4.0  },\n      { ticker: 'ABEV3',  company: 'Ambev',               weight: 3.8  },\n      { ticker: 'WEGE3',  company: 'WEG',                 weight: 3.5  },\n      { ticker: 'BBDC4',  company: 'Bradesco',         weight: 3.5  },\n      { ticker: 'ITSA4',  company: 'Itaúsa',           weight: 3.0  },\n      { ticker: 'SUZB3',  company: 'Suzano',              weight: 2.8  },\n      { ticker: 'RDOR3',  company: \"Rede D'Or\",           weight: 2.5  },\n      { ticker: 'PRIO3',  company: 'PRIO',                weight: 2.4  },\n      { ticker: 'JBSS3',  company: 'JBS',                 weight: 2.2  },\n      { ticker: 'RENT3',  company: 'Localiza',            weight: 2.0  },\n      { ticker: 'VBBR3',  company: 'Vibra Energia',       weight: 1.9  },\n      { ticker: 'BPAC11', company: 'BTG Pactual',    weight: 1.8  },\n      { ticker: 'VIVT3',  company: 'Telefônica/Vivo',     weight: 1.7  },\n      { ticker: 'EQTL3',  company: 'Equatorial',          weight: 1.6  },\n      { ticker: 'ASAI3',  company: 'Assaí',               weight: 1.5  },\n      { ticker: 'KLBN11', company: 'Klabin',         weight: 1.5  },\n      { ticker: 'HAPV3',  company: 'Hapvida',             weight: 1.4  },\n      { ticker: 'SBSP3',  company: 'Sabesp',              weight: 1.4  },\n      { ticker: 'UGPA3',  company: 'Ultrapar',            weight: 1.3  },\n      { ticker: 'TIMS3',  company: 'TIM',                 weight: 1.2  },\n      { ticker: 'RAIL3',  company: 'Rumo',                weight: 1.2  },\n      { ticker: 'LREN3',  company: 'Lojas Renner',        weight: 1.1  },\n      { ticker: 'CCRO3',  company: 'CCR',                 weight: 1.0  },\n      { ticker: 'BBSE3',  company: 'BB Seguridade',       weight: 1.0  }\n    ]\n  };\n\n  // ── Indexed proxies (ETFs that replicate the Ibovespa) ──────────────────\n  // Any holdings of these tickers are decomposed across the IBOV_SNAPSHOT universe,\n  // i.e. treated as if the user already owned each Ibov stock proportionally.\n  // Add or remove tickers here as needed.\n  var INDEXED_PROXIES = ['BOVA11', 'BOVB11', 'BBOV11', 'XBOV11', 'BOVV11', 'IBOV11'];\n\n  // ── Imported Ibov composition (from B3 CSV) ──────────────────────────────\n  var STORED_IBOV_KEY = 'nexo_ibov_composition';\n  function loadStoredIbov() {\n    var d = loadJSON(STORED_IBOV_KEY, 'null');\n    if (!d || !Array.isArray(d.stocks) || d.stocks.length === 0) return null;\n    return d;\n  }\n  function saveStoredIbov(c) { saveJSON(STORED_IBOV_KEY, c); syncNiToGistDebounced(); }\n  function clearStoredIbov() { try { localStorage.removeItem(STORED_IBOV_KEY); } catch (e) {} syncNiToGistDebounced(); }\n\n  function getActiveIbovSnapshot() {\n    var stored = loadStoredIbov();\n    if (stored) {\n      return {\n        date: 'Carteira do Dia ' + (stored.compositionDate || '?') + ' (imported)',\n        stocks: stored.stocks,\n        imported: true,\n        importedAt: stored.importedAt\n      };\n    }\n    return { date: IBOV_SNAPSHOT.date, stocks: IBOV_SNAPSHOT.stocks, imported: false };\n  }\n\n  function parseB3IbovCSV(text) {\n    // Expected format:\n    //   Line 1:  \"IBOV - Carteira do Dia DD/MM/YY\"\n    //   Line 2:  \"Código;Ação;Tipo;Qtde. Teórica;Part. (%)\"\n    //   Data:    TICKER;COMPANY;TYPE;QTY;WEIGHT;\n    //   Footer:  \"Quantidade Teórica Total...\" then \"Redutor...\"\n    var lines = text.split(/\\r?\\n/).map(function (l) { return l.replace(/^\\uFEFF/, ''); });\n    var rows = lines.filter(function (l) { return l && l.trim().length > 0; });\n    if (rows.length < 4) throw new Error('Arquivo não parece ser uma carteira do Ibovespa.');\n    var titleLine = rows[0];\n    var dateMatch = titleLine.match(/(\\d{1,2}\\/\\d{1,2}\\/\\d{2,4})/);\n    if (!/IBOV/i.test(titleLine)) throw new Error('Cabeçalho IBOV não encontrado no arquivo.');\n    var compositionDate = dateMatch ? dateMatch[1] : null;\n    var stocks = [];\n    for (var i = 2; i < rows.length; i++) {\n      var row = rows[i];\n      // Footer rows — encoding-robust prefix check\n      if (/^Quantidade/i.test(row)) break;\n      if (/^Redutor/i.test(row)) break;\n      var fields = row.split(';');\n      if (fields.length < 5) continue;\n      var ticker = fields[0].trim();\n      var company = fields[1].trim();\n      var type = fields[2].trim();\n      var qty = parseBR(fields[3]);\n      var weight = parseBR(fields[4]);\n      if (!ticker || !/^[A-Z0-9]{4,7}$/.test(ticker)) continue;\n      if (!isFinite(weight) || weight <= 0) continue;\n      stocks.push({ ticker: ticker, company: company, type: type, qty: qty, weight: weight });\n    }\n    if (stocks.length === 0) throw new Error('Nenhuma ação foi lida do arquivo.');\n    return { compositionDate: compositionDate, stocks: stocks, importedAt: new Date().toISOString() };\n  }\n\n  function normalizeCompanyName(name) {\n    return String(name || '').toUpperCase()\n      .replace(/\\bS\\/A\\b/g, 'SA')\n      .replace(/\\bS\\.A\\.?\\b/g, 'SA')\n      .replace(/[^A-Z0-9 ]+/g, ' ')\n      .replace(/\\b(ON|PN|PNA|PNB|UNT|UNIT)\\b/g, '')\n      .replace(/\\s+/g, ' ')\n      .trim();\n  }\n\n  function loadBEASettings() {\n    var d = loadJSON('nexo_bea_settings', '{}');\n    return {\n      numStocks:       Number.isFinite(+d.numStocks)       ? +d.numStocks       : 15,\n      minPerStock:     Number.isFinite(+d.minPerStock)     ? +d.minPerStock     : 50,\n      onlyMostLiquid:  d.onlyMostLiquid !== false   // default true\n    };\n  }\n  function saveBEASettings(s) {\n    // Persist only known keys so stale junk (e.g. from older builds) doesn't pile up\n    var clean = { numStocks: +s.numStocks || 15, minPerStock: +s.minPerStock || 0, onlyMostLiquid: !!s.onlyMostLiquid };\n    saveJSON('nexo_bea_settings', clean);\n    syncNiToGistDebounced();\n  }\n\n  // Returns { stocks: [...], aliases: { 'PETR3': 'PETR4', ... }, snapshotDate, imported }\n  function getEffectiveIbov(settings) {\n    var snap = getActiveIbovSnapshot();\n    var stocks = snap.stocks.map(function (s) { return { ticker: s.ticker, company: s.company, weight: +s.weight || 0 }; });\n    var aliases = {};\n    if (settings.onlyMostLiquid) {\n      // Group by normalized company name; fold non-primary share classes into the highest-weight one\n      var groups = {};\n      stocks.forEach(function (s) {\n        var key = normalizeCompanyName(s.company);\n        if (!key) key = s.ticker;\n        if (!groups[key]) groups[key] = [];\n        groups[key].push(s);\n      });\n      var folded = [];\n      Object.keys(groups).forEach(function (k) {\n        var group = groups[k].slice().sort(function (a, b) { return b.weight - a.weight; });\n        var primary = group[0];\n        var combinedWeight = group.reduce(function (sum, s) { return sum + s.weight; }, 0);\n        folded.push({ ticker: primary.ticker, company: primary.company, weight: combinedWeight });\n        for (var i = 1; i < group.length; i++) aliases[group[i].ticker] = primary.ticker;\n      });\n      stocks = folded;\n    }\n    stocks.sort(function (a, b) { return b.weight - a.weight; });\n    var N = Math.max(3, Math.min(stocks.length || 1, settings.numStocks || 15));\n    var topN = stocks.slice(0, N);\n    var sum = topN.reduce(function (s, x) { return s + x.weight; }, 0);\n    if (sum > 0) topN.forEach(function (x) { x.weight = x.weight / sum * 100; });\n    return { stocks: topN, aliases: aliases, snapshotDate: snap.date, imported: snap.imported, totalConstituents: snap.stocks.length };\n  }\n\n  // Apply the dynamic alias map produced by getEffectiveIbov (so PETR3 → PETR4 etc.)\n  function normalizeHoldingTicker(t, aliases) {\n    if (!t) return '';\n    var up = String(t).trim().toUpperCase();\n    if (aliases && aliases[up]) return aliases[up];\n    return up;\n  }\n\n  function computeIbovAllocation(domesticItems, totalDomestic, contribBR, settings) {\n    var eff = getEffectiveIbov(settings);\n    var universe = eff.stocks;\n    var aliases = eff.aliases;\n    var newTotal = totalDomestic + contribBR;\n\n    // Aggregate user's current holdings into:\n    //   stockMap  — direct holdings of universe stocks (possibly aliased)\n    //   proxyTotal — sum of holdings of indexed-proxy ETFs (BOVA11 etc.)\n    var stockMap = {};\n    var proxyTotal = 0;\n    var proxyDetails = []; // list of { ticker, position } for display\n    (domesticItems || []).forEach(function (it) {\n      if (!it.ticker) return;\n      var up = String(it.ticker).trim().toUpperCase();\n      if (INDEXED_PROXIES.indexOf(up) >= 0) {\n        proxyTotal += it.position || 0;\n        proxyDetails.push({ ticker: up, position: it.position || 0 });\n        return;\n      }\n      var key = normalizeHoldingTicker(it.ticker, aliases);\n      if (!key) return;\n      stockMap[key] = (stockMap[key] || 0) + (it.position || 0);\n    });\n\n    // Build rows — current value combines direct holdings + decomposed proxy exposure.\n    // Proxy decomposition uses the renormalized weights of the selected universe.\n    var rows = universe.map(function (s) {\n      var direct = stockMap[s.ticker] || 0;\n      var fromProxy = proxyTotal * s.weight / 100;\n      var current = direct + fromProxy;\n      var targetValue = newTotal * s.weight / 100;\n      return {\n        ticker: s.ticker,\n        company: s.company,\n        weight: s.weight,\n        currentValue: current,\n        currentDirect: direct,\n        currentFromProxy: fromProxy,\n        targetValue: targetValue,\n        deviationValue: targetValue - current  // positive = underweight, needs buying\n      };\n    });\n\n    // Allocation: distribute contribution to positive deviations\n    var posDev = rows.map(function (r) { return Math.max(0, r.deviationValue); });\n    var sumPosDev = posDev.reduce(function (s, d) { return s + d; }, 0);\n    var alloc = rows.map(function () { return 0; });\n\n    if (sumPosDev <= 0) {\n      // Already overweight on everything tracked — distribute proportional to target weights\n      var sumW = rows.reduce(function (s, r) { return s + r.weight; }, 0);\n      if (sumW > 0) rows.forEach(function (r, i) { alloc[i] = contribBR * r.weight / sumW; });\n    } else if (sumPosDev >= contribBR) {\n      // Aporte cabe dentro dos gaps — proporcional ao deviation\n      rows.forEach(function (r, i) { alloc[i] = (posDev[i] / sumPosDev) * contribBR; });\n    } else {\n      // Cobre todos os gaps, distribui sobra proporcional aos pesos\n      var leftover = contribBR - sumPosDev;\n      var sumW2 = rows.reduce(function (s, r) { return s + r.weight; }, 0);\n      rows.forEach(function (r, i) { alloc[i] = posDev[i] + (sumW2 > 0 ? leftover * r.weight / sumW2 : 0); });\n    }\n\n    // Apply minimum per stock — collapse small allocations into a \"remaining cash\" bucket\n    var minP = +settings.minPerStock || 0;\n    var remaining = 0;\n    if (minP > 0) {\n      // Iterative: drop the smallest allocations below min, redistribute their share\n      var changed = true;\n      while (changed) {\n        changed = false;\n        var validIdx = [];\n        var validSum = 0;\n        var droppedSum = 0;\n        rows.forEach(function (r, i) {\n          if (alloc[i] >= minP) { validIdx.push(i); validSum += alloc[i]; }\n          else { droppedSum += alloc[i]; alloc[i] = 0; }\n        });\n        if (droppedSum > 0 && validIdx.length > 0) {\n          // Try to redistribute droppedSum proportionally among valid (by deviation if any pos, else by weight)\n          var basis = validIdx.map(function (i) { return posDev[i] > 0 ? posDev[i] : rows[i].weight; });\n          var basisSum = basis.reduce(function (s, x) { return s + x; }, 0);\n          if (basisSum > 0) {\n            validIdx.forEach(function (i, j) { alloc[i] += droppedSum * basis[j] / basisSum; });\n            changed = true;\n          } else {\n  type=\"button\" class=\"btn btn-primary\" data-act=\"export\">⬇ Download backup<\/button>' +\n        '<button type=\"button\" class=\"btn btn-outline\" data-act=\"restore\">⬆ Restore from file<\/button>' +\n      '<\/div>' +\n      '<div class=\"nx-bk-note\">The GitHub token is never included in the backup file. Restoring replaces your current data and reloads the app.<\/div>';\n    parent.appendChild(card);\n    card.querySelector('[data-act=\"export\"]').addEventListener('click', function () { exportBackup(); });\n    card.querySelector('[data-act=\"restore\"]').addEventListener('click', function () { ensureFileInput().click(); });\n  }\n\n  /* ── monthly reminder (gated by an actual backup, read from the Gist) ── */\n  function getDonePeriod() {\n    return getGist().then(function (gist) {\n      var lb = gist && gist.payload && gist.payload.meta && gist.payload.meta.lastBackup;\n      if (lb && lb.period) return lb.period;\n      try { return localStorage.getItem(LOCAL_PERIOD_KEY) || ''; } catch (e) { return ''; }\n    }).catch(function () {\n      try { return localStorage.getItem(LOCAL_PERIOD_KEY) || ''; } catch (e) { return ''; }\n    });\n  }\n  function showReminder(period) {\n    if (document.querySelector('.nx-bk-overlay')) return;\n    var overlay = document.createElement('div'); overlay.className = 'nx-bk-overlay';\n    overlay.innerHTML =\n      '<div class=\"nx-bk-card\" role=\"dialog\" aria-modal=\"true\">' +\n        '<h3>🛟 Time for your monthly backup<\/h3>' +\n        '<p><strong>' + monthLabel(period) + '<\/strong> has ended. Download a backup of your data (expenses, income, investments and settings) to keep it safe?<\/p>' +\n        '<div class=\"nx-bk-row\">' +\n          '<button type=\"button\" class=\"nx-bk-ghost\" data-act=\"later\">Not now<\/button>' +\n          '<button type=\"button\" class=\"nx-bk-primary\" data-act=\"now\">Download backup now<\/button>' +\n        '<\/div>' +\n      '<\/div>';\n    // \"Not now\" does NOT mark as done → it will show again next time the app opens.\n    overlay.querySelector('[data-act=\"later\"]').addEventListener('click', function () { overlay.remove(); });\n    overlay.querySelector('[data-act=\"now\"]').addEventListener('click', function () { overlay.remove(); exportBackup(); });\n    document.body.appendChild(overlay);\n  }\n  function maybeRemind() {\n    var period = periodToBackup(new Date());\n    getDonePeriod().then(function (done) { if (done !== period) showReminder(period); });\n  }\n\n  // Mostra o card só na página Options; remove ao sair (evita aparecer em\n  // todas as abas, já que o nó vive fora da árvore reconciliada pelo React).\n  function reconcileCard() { if (onOptionsPage()) injectCard(); }\n\n  /* ── boot (Nexo 4.0: ancorado no roteador; o card vive dentro da section\n     Options, que o roteador esconde/mostra — sem observers) ── */\n  function boot() {\n    document.addEventListener('nexo:tab', function (e) {\n      if (e.detail && e.detail.id === 'options') injectCard();\n    });\n    reconcileCard();\n    setTimeout(maybeRemind, 1400);\n  }\n  try { window.__nxBackup = { gatherBackup: gatherBackup, periodToBackup: periodToBackup, exportBackup: exportBackup, restoreFromFile: restoreFromFile, maybeRemind: maybeRemind, recordBackupDone: recordBackupDone, getDonePeriod: getDonePeriod, injectCard: injectCard, reconcileCard: reconcileCard }; } catch (e) {}\n  boot();\n})();\n  \n<\/script>\n  \n\n<\/body><\/html>"
