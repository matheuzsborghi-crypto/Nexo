      str = String(s || '').replace(/\D/g, '').replace(/^0+(?=\d)/, '');
      input.value = str ? fmt(str) : '';
      if (opts.onChange) opts.onChange(str);
    }
    input.value = str ? fmt(str) : '';
    input.addEventListener('keydown', (e) => {
      const sel = e.currentTarget.selectionStart !== e.currentTarget.selectionEnd;
      if (/^\d$/.test(e.key)) { e.preventDefault(); setStr(sel ? e.key : str + e.key); }
      else if (e.key === 'Backspace') { e.preventDefault(); setStr(sel ? '' : str.slice(0, -1)); }
      else if (e.key === 'Delete') { e.preventDefault(); setStr(sel ? '' : str); }
    });
    input.addEventListener('paste', (e) => {
      e.preventDefault();
      const v = (e.clipboardData.getData('text') || '').replace(/\D/g, '');
      if (!v) return;
      const sel = e.currentTarget.selectionStart !== e.currentTarget.selectionEnd;
      setStr(sel ? v : str + v);
    });
    return { el: input, get cents() { return str; }, set: setStr };
  }

  /* ── Helpers de loans (Ug/Uv/Rd/vn/Wg/Bd/Qt/_i/fJ/Hg/nJ do 3.x) ──────── */
  function addMonthsClamped(dateStr, n) {
    const d = teD(dateStr);
    const y = d.getFullYear(), m = d.getMonth() + n, day = d.getDate();
    const dim = new Date(y, m + 1, 0).getDate();
    const r = new Date(y, m, Math.min(day, dim));
    return U.toISODate(r);
  }
  function genInstallmentDates(first, count) {
    const n = Math.max(1, parseInt(count, 10) || 1);
    return Array.from({ length: n }, (_, i) => addMonthsClamped(first, i));
  }
  function normPayment(p) {
    const amt = Math.max(0, U.parseMoney(p == null ? null : p.amount));
    if (!amt) return null;
    const n = Math.max(0, parseInt(p == null ? null : p.installmentNumber, 10) || 0);
    return {
      id: (p && p.id) || U.uid('pay'),
      date: (p && p.date) || todayStr(),
      amount: amt,
      notes: String((p && p.notes) || ''),
      installmentNumber: n || null,
      isInstallmentPayment: !!(p && p.isInstallmentPayment),
    };
  }
  function normLoan(e) {
    if (!e || typeof e !== 'object') return null;
    const t = e.type === 'borrowed' ? 'borrowed' : 'lent';
    const n = Math.max(0, U.parseMoney(e.originalAmount));
    if (!n) return null;
    const r = e.startDate || todayStr();
    const i = Math.max(1, parseInt(e.installmentCount, 10) || 1);
    const a = e.firstInstallmentDate ||
      (Array.isArray(e.installmentDueDates) && e.installmentDueDates[0]) ||
      (i > 1 ? r : e.dueDate || r);
    const o = (Array.isArray(e.installmentDueDates) && e.installmentDueDates.length === i)
      ? e.installmentDueDates : genInstallmentDates(a, i);
    const s = Array.isArray(e.payments) ? e.payments.map(normPayment).filter(Boolean) : [];
    const l = e.dueDate || o[0] || '';
    return {
      id: e.id || U.uid('loan'),
      type: t,
      personName: String(e.personName || '').trim(),
      title: String(e.title || '').trim(),
      originalAmount: n,
      startDate: r,
      dueDate: l,
      firstInstallmentDate: a,
      installmentCount: i,
      installmentDueDates: o,
      notes: String(e.notes || ''),
      payments: s,
    };
  }
  function totalPaid(l) { return (l.payments || []).reduce((t, n) => t + U.parseMoney(n.amount), 0); }
  function remaining(l) { return Math.max(0, U.parseMoney(l.originalAmount) - totalPaid(l)); }
  function splitInstallments(amount, count) {
    const n = Math.round(Math.max(0, U.parseMoney(amount)) * 100);
    const r = Math.max(1, parseInt(count, 10) || 1);
    const base = Math.floor(n / r);
    const rest = n - base * r;
    return Array.from({ length: r }, (_, i) => (base + (i < rest ? 1 : 0)) / 100);
  }
  function effDates(e) {
    const t = Math.max(1, parseInt(e == null ? null : e.installmentCount, 10) || 1);
    if (e && Array.isArray(e.installmentDueDates) && e.installmentDueDates.length === t) return e.installmentDueDates;
    const n = (e && e.firstInstallmentDate) ||
      (e && Array.isArray(e.installmentDueDates) && e.installmentDueDates[0]) ||
      (t > 1 ? e && e.startDate : e && e.dueDate) || (e && e.startDate) || todayStr();
    return genInstallmentDates(n, t);
  }
  function nextDue(e) {
    if (remaining(e) <= 0) return null;
    if (Math.max(1, parseInt(e == null ? null : e.installmentCount, 10) || 1) <= 1) return (e && e.dueDate) || null;
    const dates = effDates(e);
    const done = new Set(((e && e.payments) || [])
      .map((a) => Math.max(0, parseInt(a == null ? null : a.installmentNumber, 10) || 0)).filter(Boolean));
    for (let a = 0; a < dates.length; a += 1) if (!done.has(a + 1)) return dates[a];
    return dates[dates.length - 1] || (e && e.dueDate) || null;
  }
  function statusOf(e, today) {
    const t = today || new Date();
    if (remaining(e) <= 0) return 'paid';
    const r = nextDue(e);
    if (r) {
      const i = teD(r);
      const a = new Date(t.getFullYear(), t.getMonth(), t.getDate());
      if (new Date(i.getFullYear(), i.getMonth(), i.getDate()).getTime() < a.getTime()) return 'overdue';
    }
    return 'active';
  }
  function isDueSoon(e, today) {
    const t = today || new Date();
    const n = nextDue(e);
    if (!n || statusOf(e, t) !== 'active') return false;
    const r = teD(n);
    const i = new Date(t.getFullYear(), t.getMonth(), t.getDate());
    const a = new Date(r.getFullYear(), r.getMonth(), r.getDate());
    const o = Math.ceil((a.getTime() - i.getTime()) / (1000 * 60 * 60 * 24));
    return o >= 0 && o <= 7;
  }

  /* ── Helpers de gráfico SVG ──────────────────────────────────────────── */
  const SVG_NS = 'http://www.w3.org/2000/svg';
  function svgEl(tag, attrs) {
    const n = document.createElementNS(SVG_NS, tag);
    if (attrs) for (const k in attrs) { if (attrs[k] != null) n.setAttribute(k, attrs[k]); }
    return n;
  }
  function svgText(x, y, text, o) {
    const t = svgEl('text', {
      x, y, 'text-anchor': (o && o.anchor) || 'start',
      'font-size': 12, fill: '#7A756F', 'font-family': "'DM Sans', sans-serif",
    });
    t.textContent = text;
    return t;
  }
  function roundedTopRect(x, y, w, h, r) {
    r = Math.min(r, w / 2, h);
    return 'M' + x + ',' + (y + h) +
      ' L' + x + ',' + (y + r) +
      ' Q' + x + ',' + y + ' ' + (x + r) + ',' + y +
      ' L' + (x + w - r) + ',' + y +
      ' Q' + (x + w) + ',' + y + ' ' + (x + w) + ',' + (y + r) +
      ' L' + (x + w) + ',' + (y + h) + ' Z';
  }
  function axisTicks(maxV) {
    const raw = maxV / 4;
    const p = Math.pow(10, Math.floor(Math.log10(raw)));
    const f = raw / p;
    const st = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p;
    const top = Math.ceil(maxV / st) * st;
    const out = [];
    for (let v = 0; v <= top + st * 1e-6; v += st) out.push(v);
    return out;
  }
  function tipHtml(label, rows) {
    return '<div style="font-size:12px;color:var(--text-secondary);margin-bottom:6px">' + U.esc(label) + '</div>' +
      rows.map((r) =>
        '<div style="display:flex;justify-content:space-between;gap:12px;font-size:13px;margin-top:4px">' +
        '<span style="color:' + (r.nameColor || 'var(--text-secondary)') + '">' + U.esc(r.name) + '</span>' +
        '<span style="font-weight:600;color:' + (r.valueColor || 'var(--text)') + '">' + U.esc(Z(r.value)) + '</span>' +
        '</div>').join('');
  }
  function makeTip(wrap) {
    const tip = el('div', {
      className: 'tooltip-custom',
      style: { position: 'absolute', display: 'none', pointerEvents: 'none', zIndex: '30', left: '0', top: '0', whiteSpace: 'nowrap' },
    });
    wrap.appendChild(tip);
    return {
      show(html, ev) { tip.innerHTML = html; tip.style.display = 'block'; this.move(ev); },
      move(ev) {
        const r = wrap.getBoundingClientRect();
        let x = ev.clientX - r.left + 14, y = ev.clientY - r.top - 12;
        const tw = tip.offsetWidth || 140, th = tip.offsetHeight || 40;
        if (x + tw > r.width) x = Math.max(0, ev.clientX - r.left - tw - 14);
        if (y + th > r.height) y = Math.max(0, r.height - th);
        if (y < 0) y = 0;
        tip.style.left = x + 'px'; tip.style.top = y + 'px';
      },
      hide() { tip.style.display = 'none'; },
    };
  }
  // Bar chart (empilhado ou single) — série(s) com {key,name,color}
  function drawStackedBars(host, cfg) {
    host.innerHTML = '';
    const W = Math.max(320, host.clientWidth || 720), H = cfg.height;
    const left = 24 + (cfg.yAxisWidth || 84), right = 8, top = 8, bottom = 26;
    const plotW = W - left - right, plotH = H - top - bottom;
    const totals = cfg.data.map((it) => cfg.series.reduce((s, se) => s + (Number(it[se.key]) || 0), 0));
    const maxV = Math.max(0, ...totals, 0);
    let ticks, topV;
    if (maxV > 0) { ticks = axisTicks(maxV); topV = ticks[ticks.length - 1] || 1; }
    else { ticks = [0]; topV = 1; }
    const y = (v) => top + plotH * (1 - v / topV);
    const svg = svgEl('svg', { width: '100%', height: H, viewBox: '0 0 ' + W + ' ' + H });
    svg.style.display = 'block';
    const wrap = el('div', { style: { position: 'relative' } });
    const tipC = makeTip(wrap);
    ticks.forEach((t) => svg.appendChild(svgText(left - 8, y(t) + 4, Z(t), { anchor: 'end' })));
    const n = Math.max(1, cfg.data.length), slotW = plotW / n;
    cfg.data.forEach((it, i) => {
      const cx = left + i * slotW + slotW / 2;
      const bw = Math.max(4, Math.min(cfg.barSize, slotW - 4));
      let acc = 0; const segs = [];
      cfg.series.forEach((se) => {
        const v = Number(it[se.key]) || 0;
        if (v > 0) { segs.push({ color: se.color, from: acc, to: acc + v }); acc += v; }
      });
      segs.forEach((s, si) => {
        const y1 = y(s.to), y0 = y(s.from), hgt = Math.max(0, y0 - y1);
        if (hgt <= 0) return;
        const isTop = si === segs.length - 1;
        if (isTop && cfg.radiusTop > 0) {
          svg.appendChild(svgEl('path', { d: roundedTopRect(cx - bw / 2, y1, bw, hgt, cfg.radiusTop), fill: s.color }));
        } else {
          svg.appendChild(svgEl('rect', { x: cx - bw / 2, y: y1, width: bw, height: hgt, fill: s.color }));
        }
      });
      svg.appendChild(svgText(cx, H - 8, String(it.month), { anchor: 'middle' }));
      const band = svgEl('rect', { x: left + i * slotW, y: top, width: slotW, height: plotH, fill: 'transparent' });
      band.addEventListener('mousemove', (ev) => tipC.show(cfg.tooltipHtml(it), ev));
      band.addEventListener('mouseleave', () => tipC.hide());
      svg.appendChild(band);
    });
    wrap.appendChild(svg);
    host.appendChild(wrap);
  }
  // Line chart (Compound) — domain/ticks pré-calculados
  function drawLineChart(host, cfg) {
    host.innerHTML = '';
    const W = Math.max(320, host.clientWidth || 720), H = cfg.height;
    const left = (cfg.yAxisWidth || 88) + 8, right = 12, top = 10, bottom = 26;
    const plotW = W - left - right, plotH = H - top - bottom;
    const dom = cfg.domain;
    const span = Math.max(1e-9, dom.max - dom.min);
    const y = (v) => top + plotH * (1 - (v - dom.min) / span);
    const n = cfg.data.length;
    const x = (i) => left + (n > 1 ? (i * plotW) / (n - 1) : plotW / 2);
    const svg = svgEl('svg', { width: '100%', height: H, viewBox: '0 0 ' + W + ' ' + H });
    svg.style.display = 'block';
    const wrap = el('div', { style: { position: 'relative' } });
    const tipC = makeTip(wrap);
    dom.ticks.forEach((t) => {
      svg.appendChild(svgEl('line', { x1: left, x2: left + plotW, y1: y(t), y2: y(t), stroke: '#ccc', 'stroke-width': 1, opacity: '0.6' }));
      svg.appendChild(svgText(left - 8, y(t) + 4, Z(t), { anchor: 'end' }));
    });
    const step = Math.max(1, Math.ceil(n / 12));
    for (let i = 0; i < n; i++) {
      if (i % step !== 0 && i !== n - 1) continue;
      svg.appendChild(svgEl('line', { x1: x(i), x2: x(i), y1: top, y2: top + plotH, stroke: '#ccc', 'stroke-width': 1, opacity: '0.35' }));
      svg.appendChild(svgText(x(i), H - 8, String(cfg.data[i][cfg.xKey]), { anchor: 'middle' }));
    }
    cfg.series.forEach((se) => {
      const pts = cfg.data.map((it, i) => x(i) + ',' + y(Number(it[se.key]) || 0)).join(' ');
      svg.appendChild(svgEl('polyline', { points: pts, fill: 'none', stroke: se.color, 'stroke-width': se.width }));
      cfg.data.forEach((it, i) => svg.appendChild(svgEl('circle', { cx: x(i), cy: y(Number(it[se.key]) || 0), r: 2, fill: se.color })));
    });
    const ov = svgEl('rect', { x: left, y: top, width: plotW, height: plotH, fill: 'transparent' });
    ov.addEventListener('mousemove', (ev) => {
      const rct = svg.getBoundingClientRect();
      const px = (ev.clientX - rct.left) * (W / Math.max(1, rct.width));
      let i = n > 1 ? Math.round((px - left) / (plotW / (n - 1))) : 0;
      i = Math.max(0, Math.min(n - 1, i));
      const it = cfg.data[i];
      tipC.show(tipHtml(String(it[cfg.xKey]),
        cfg.series.map((se) => ({ name: se.name, value: it[se.key], valueColor: se.color }))), ev);
    });
    ov.addEventListener('mouseleave', () => tipC.hide());
    svg.appendChild(ov);
    wrap.appendChild(svg);
    host.appendChild(wrap);
  }

  /* ════════════════════════════ ABA LOANS ═══════════════════════════════ */
  Nexo.registerTab('loans', function () {
    let root = null;
    const state = { filters: { type: 'all', status: 'all', query: '' }, sort: 'default' };
    let listBody = null, countEl = null;
    let details = null; // {id, m, rerender}

    function getLoans() {
      return (store.data.loans || []).map(normLoan).filter((l) => l && l.personName);
    }

    /* ── mutações ── */
    function saveLoan(formData, closeFn) {
      const P = normLoan(formData);
      if (!P || !P.personName) { toast('Invalid loan data'); return; }
      store.update((d) => {
        const list = d.loans || [];
        d.loans = formData.id
          ? list.map((raw) => { const L = normLoan(raw); return (L && L.id === formData.id) ? Object.assign({}, L, P) : raw; })
          : list.concat([P]);
      });
      closeFn();
      toast(formData.id ? 'Loan updated' : 'Loan created');
      if (details) details.rerender();
    }
    function deleteLoan(id) {
      if (!window.confirm('Delete this loan and all payments?')) return;
      store.update((d) => {
        d.loans = (d.loans || []).filter((raw) => { const L = normLoan(raw); return !(L && L.id === id); });
      });
      if (details && details.id === id) details.m.close();
      toast('Loan deleted');
    }
    function applyPayment(loanId, payload) {
      let applied = false;
      store.update((d) => {
        d.loans = (d.loans || []).map((raw) => {
          const z = normLoan(raw);
          if (!z || z.id !== loanId) return raw;
          const rem = remaining(z);
          const q = normPayment(payload);
          if (!q) return raw;
          const amt = Math.max(0, U.parseMoney(q.amount));
          if (!amt || amt > rem) return raw;
          applied = true;
          return Object.assign({}, z, { payments: (z.payments || []).concat([Object.assign({}, q, { amount: amt })]) });
        });
      });
      if (applied) toast('Payment added');
      if (details) details.rerender();
      return applied;
    }
    function deletePayment(loanId, payId) {
      if (!window.confirm('Delete this payment?')) return;
      store.update((d) => {
        d.loans = (d.loans || []).map((raw) => {
          const L = normLoan(raw);
          if (!L || L.id !== loanId) return raw;
          return Object.assign({}, L, { payments: (L.payments || []).filter((p) => p.id !== payId) });
        });
      });
      toast('Payment deleted');
      if (details) details.rerender();
    }
    function toggleInstallment(loanId, num, checked) {
      let action = null, blocked = false;
      store.update((d) => {
        d.loans = (d.loans || []).map((raw) => {
          const q = normLoan(raw);
          if (!q || q.id !== loanId) return raw;
          const count = Math.max(1, parseInt(q.installmentCount, 10) || 1);
          if (count <= 1) return raw;
          const idx = num - 1;
          if (idx < 0 || idx >= count) return raw;
          const existing = (q.payments || []).find((p) => p.isInstallmentPayment && Number(p.installmentNumber) === num);
          if (checked) {
            if (existing) return raw;
            const rem = remaining(q);
            const val = splitInstallments(q.originalAmount, count)[idx] || 0;
            if (val <= 0 || rem <= 0 || val > rem) { blocked = true; return raw; }
            const dueD = effDates(q)[idx] || todayStr();
            const pay = normPayment({
              id: U.uid('pay'), date: todayStr(), amount: val,
              notes: 'Installment ' + num + '/' + count + ' paid (due ' + fmtBR(dueD) + ')',
              installmentNumber: num, isInstallmentPayment: true,
            });
            if (!pay) return raw;
            action = 'added';
            return Object.assign({}, q, { payments: (q.payments || []).concat([pay]) });
          }
          if (existing) {
            action = 'removed';
            return Object.assign({}, q, { payments: (q.payments || []).filter((p) => p.id !== existing.id) });
          }
          return raw;
        });
      });
      if (action === 'added') toast('Installment marked as paid');
      else if (action === 'removed') toast('Installment payment removed');
      else if (blocked) toast('Could not mark installment as paid because remaining balance is lower than this installment.');
      if (details) details.rerender();
    }
    function settleLoan(id) {
      const P = getLoans().find((l) => l.id === id);
      if (!P) return;
      const E = remaining(P);
      if (E <= 0) return;
      if (window.confirm('Mark this loan as settled by adding payment ' + Z(E) + '?')) {
        applyPayment(id, { id: U.uid('pay'), date: todayStr(), amount: E, notes: 'Settled' });
      }
    }

    /* ── modal New/Edit Loan (HJ) ── */

      const person = el('input', { className: 'form-input', value: f.personName, placeholder: 'Ex: Rafael' });
      const title = el('input', { className: 'form-input', value: f.title, placeholder: 'Ex: Notebook payment' });
      const amount = moneyInput(U.centsFromValue(f.originalAmount), { placeholder: Z(0) });
      const startIn = el('input', { className: 'form-input', type: 'date', value: f.startDate });
      const dueIn = el('input', { className: 'form-input', type: 'date', value: f.dueDate || '' });
      const instIn = el('input', { className: 'form-input', type: 'number', min: '1', step: '1', value: String(f.installmentCount || 1) });
      instIn.addEventListener('input', () => {
        const v = Math.max(1, parseInt(instIn.value, 10) || 1);
        if (instIn.value !== String(v)) instIn.value = String(v);
      });
      const notesTa = el('textarea', { className: 'form-input', rows: 3, placeholder: 'Optional notes' });
      notesTa.value = f.notes || '';
      const m = Nexo.ui.modal(el('div', {},
        el('h2', {}, isEdit ? 'Edit Loan' : 'New Loan'),
        fg('Type', typeSel),
        fg('Person name', person),
        fg('Title', title),
        fg('Original amount', amount.el),
        el('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px' } },
          fg('Start date', startIn), fg('Due date (optional)', dueIn)),

    function makeSelect(opts, value, onchange) {

    function renderList() {
      const hoje = new Date();
      const q = normSearch(state.filters.query);
      const list = getLoans().filter((P) => {
        const E = statusOf(P, hoje);
        return !((state.filters.type !== 'all' && P.type !== state.filters.type) ||
          (state.filters.status !== 'all' && E !== state.filters.status) ||
          (q && !normSearch(P.personName + ' ' + P.title).includes(q)));
      });
      const F = state.sort;
      const dueT = (P) => { const t = nextDue(P); return t ? teD(t).getTime() : Number.MAX_SAFE_INTEGER; };
      if (F === 'person') list.sort((a, b) => a.personName.localeCompare(b.personName, 'pt-BR'));
      else if (F === 'remaining') list.sort((a, b) => remaining(b) - remaining(a));
      else if (F === 'due') list.sort((a, b) => dueT(a) - dueT(b));
      else if (F === 'newest') list.sort((a, b) => teD(b.startDate) - teD(a.startDate));
      else if (F === 'oldest') list.sort((a, b) => teD(a.startDate) - teD(b.startDate));
      else {
        const pr = { overdue: 0, active: 1, paid: 2 };
        list.sort((a, b) => {
          const da = statusOf(a, hoje), db = statusOf(b, hoje);
          if (pr[da] !== pr[db]) return pr[da] - pr[db];
          if (da === 'active') return dueT(a) - dueT(b);
          return teD(b.startDate) - teD(a.startDate);
        });
      }
      countEl.textContent = list.length + ' item(s)';
      listBody.innerHTML = '';
      if (!list.length) {
        listBody.appendChild(el('div', { className: 'empty-state' },
          el('div', { className: 'ico' }, '💸'),
          el('p', {}, 'No loans match the current filters.')));
        return;

      list.forEach((S) => listBody.appendChild(loanItem(S, hoje)));

    function render() {

        if (E.type === 'lent') acc.lent += D; else acc.borrowed += D;
        if (s !== 'paid') acc.activeCount += 1;
        if (s === 'overdue') { acc.overdue += D; acc.overdueCount += 1; }
        return acc;
      }, { lent: 0, borrowed: 0, overdue: 0, activeCount: 0, overdueCount: 0 });

      const typeSel = makeSelect([['all', 'All types'], ['lent', 'Lent'], ['borrowed', 'Borrowed']],

          typeSel, statusSel, sortSel, searchInput)));

      listBody = el('div');

  /* ═══════════════════════════ ABA REPORTS ══════════════════════════════ */
  Nexo.registerTab('reports', function () {
    let root = null;
    let tab = 'monthly';
    let suppress = false;

    function eligible() {
      return (store.data.expenses || []).filter((e) => e && e.includeInBudget !== false);
    }
    function monthKeyOf(e) { const d = teD(e.date); return d.getFullYear() + '-' + d.getMonth(); }

    function monthlyData() {
      const now = new Date();
      const sums = {}, sumsAll = {};
      eligible().forEach((e) => { const k = monthKeyOf(e); sums[k] = (sums[k] || 0) + (Number(e.amount) || 0); });
      (store.data.expenses || []).forEach((e) => { const k = monthKeyOf(e); sumsAll[k] = (sumsAll[k] || 0) + (Number(e.amount) || 0); });
      const out = [];
      for (let i = 5; i >= 0; i--) {
        const d = new Date(now.getFullYear(), now.getMonth() - i);
        const k = d.getFullYear() + '-' + d.getMonth();
        out.push({
          month: U.MONTHS_EN[d.getMonth()],
          amount: sums[k] || 0,
          amountAll: sumsAll[k] || 0,
          label: U.MONTHS_PT[d.getMonth()] + '/' + d.getFullYear(),
        });
      }
      return out;
    }
    function categoriesData() {
      const now = new Date();
      const cats = Nexo.categories.all();
      const byMonth = {};
      eligible().forEach((e) => {
        const k = monthKeyOf(e);
        if (!byMonth[k]) byMonth[k] = {};
        byMonth[k][e.category] = (byMonth[k][e.category] || 0) + (Number(e.amount) || 0);
      });
      const rows = [];
      for (let i = 5; i >= 0; i--) {
        const d = new Date(now.getFullYear(), now.getMonth() - i);
        const k = d.getFullYear() + '-' + d.getMonth();
        const row = { month: U.MONTHS_EN[d.getMonth()], label: U.MONTHS_PT[d.getMonth()] + '/' + d.getFullYear() };
        cats.forEach((c) => { row[c.id] = (byMonth[k] && byMonth[k][c.id]) || 0; });
        rows.push(row);
      }
      return { rows, used: cats.filter((c) => rows.some((r) => (r[c.id] || 0) > 0)) };
    }

    function buildBudgetCard() {
      const now = new Date();
      const cats = Nexo.categories.all();
      const budgets = store.data.budgets || {};
      const monthElig = eligible().filter((e) => {
        const d = teD(e.date);
        return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
      });
      const spent = monthElig.reduce((s, e) => s + (Number(e.amount) || 0), 0);
      const totalBudget = () => Nexo.categories.all()
        .reduce((s, c) => s + (Number((store.data.budgets || {})[c.id]) || 0), 0);
      const headerRight = el('span', { style: { fontSize: '13px', color: 'var(--text-secondary)' } },
        Z(spent) + ' of ' + Z(totalBudget()) + ' spent');
      const card = el('div', { className: 'card' },
        el('div', { className: 'card-header' },
          el('span', { className: 'card-title' }, 'Budget Overview'), headerRight));
      const sorted = cats.slice().sort((a, b) => {
        const d = (budgets[b.id] || 0) - (budgets[a.id] || 0);
        return d !== 0 ? d : a.name.localeCompare(b.name, 'pt-BR');
      });
      sorted.forEach((cat) => {
        const P = monthElig.filter((e) => e.category === cat.id).reduce((s, e) => s + (Number(e.amount) || 0), 0);
        let E = budgets[cat.id] != null ? budgets[cat.id] : 0;
        const bar = el('div', { className: 'budget-bar' });
        const nums = el('div', { className: 'budget-nums' });
        const input = el('input', { className: 'form-input', placeholder: '0,00', style: { width: '100px', padding: '8px 10px' } });
        input.value = E ? String(E).replace('.', ',') : '';
        function paint() {
          const pct = E > 0 ? Math.min(100, (P / E) * 100) : 0;
          const over = E > 0 && P > E;
          bar.style.width = pct + '%';
          bar.style.background = over ? '#D44' : cat.color;
          nums.textContent = E > 0 ? Z(P) + ' / ' + Z(E) : Z(P) + ' / --';
          nums.style.color = over ? '#D44' : 'var(--text-secondary)';
        }
        paint();
        input.addEventListener('input', () => {
          const v = Math.max(0, U.parseMoney(input.value));
          E = v;
          suppress = true;
          store.update((d) => {
            const next = Object.assign({}, d.budgets);
            next[cat.id] = v;
            d.budgets = next;
          });
          suppress = false;
          input.value = v ? String(v).replace('.', ',') : '';

    function render() {

  /* ═══════════════════ ABA COMPOUND INTEREST SIMULATOR ══════════════════ */
  Nexo.registerTab('compound_interest', function () {
    let root = null;
    const DEFAULTS = { years: 5, initialAmount: 0, monthlyContribution: 500, annualRate: 8 };
    let draft = { years: DEFAULTS.years, annualRate: DEFAULTS.annualRate };
    let initCents = U.centsFromValue(DEFAULTS.initialAmount);         // ''
    let contribCents = U.centsFromValue(DEFAULTS.monthlyContribution); // '50000'
    let applied = Object.assign({}, DEFAULTS);
    let view = 'year';

    // tJ/eJ do 3.x: taxa mensal composta; aporte no fim do mês
    function simulate() {
      const now = new Date();
      const start = new Date(now.getFullYear(), now.getMonth(), 1);
      const months = Math.max(1, Number(applied.years) || 1) * 12;
      const init = Math.max(0, U.parseMoney(applied.initialAmount));
      const contrib = Math.max(0, U.parseMoney(applied.monthlyContribution));
      const u = Math.pow(1 + (Number(applied.annualRate) || 0) / 100, 1 / 12) - 1;
      let d = init, totC = 0, totE = 0;
      const rows = [];
      for (let h = 0; h < months; h += 1) {
        const g = new Date(start.getFullYear(), start.getMonth() + h, 1);
        const earnings = d * u;
        const bal = d + contrib + earnings;
        totC += contrib; totE += earnings;
        rows.push({ idx: h + 1, date: U.toISODate(g), contribution: contrib, earnings, balance: bal });
        d = bal;
      }
      return { monthlyRate: u, totalContributions: totC, totalEarnings: totE, finalBalance: d, rows };
    }

    function render() {
      root.innerHTML = '';
      const sim = simulate();
      const init0 = U.parseMoney(applied.initialAmount);
      let inv = init0, ti = 0;
      const monthly = sim.rows.map((r) => {
        inv += r.contribution; ti += r.earnings;
        const dt = teD(r.date);
        return {
          monthIndex: r.idx,
          month: dt.toLocaleDateString('en-US', { month: 'short', year: '2-digit' }),
          yearLabel: dt.getFullYear(),
          monthlyInterest: r.earnings,
          totalInvested: inv,
          totalInterest: ti,
          totalAccumulated: r.balance,
        };
      });
      const yearly = [{
        monthIndex: 0, yearIndex: 0, month: 'Year 0', monthlyInterest: 0,
        totalInvested: init0, totalInterest: 0, totalAccumulated: init0,
      }].concat(monthly.filter((r) => r.monthIndex % 12 === 0).map((r) =>
        Object.assign({}, r, { yearIndex: Math.floor(r.monthIndex / 12), month: 'Year ' + Math.floor(r.monthIndex / 12) })));
      const chartData = view === 'year' ? yearly : monthly;
      const tableRows = [{
        monthIndex: 0, monthlyInterest: 0, totalInvested: init0, totalInterest: 0, totalAccumulated: init0,
      }].concat(monthly);
      const totalInvestedAll = init0 + sim.totalContributions;
      const vals = chartData.map((r) => [r.totalAccumulated, r.totalInvested])
        .reduce((a, b) => a.concat(b), []).filter(Number.isFinite);
      let dom = { min: 0, max: 1e4, ticks: [0, 5e3, 1e4] };
      if (vals.length) {
        const mn = Math.min.apply(null, vals);
        const mx = Math.max.apply(null, vals);
        const range = Math.max(1, mx - mn);
        const steps = [5e3, 1e4, 2e4, 5e4, 1e5, 2e5, 5e5, 1e6];
        const st = steps.find((s) => s >= range / 5) || steps[steps.length - 1];
        const dmin = Math.floor(mn / st) * st;
        const dmax = Math.ceil(mx / st) * st;
        const ticks = [];
        for (let v = dmin; v <= dmax; v += st) ticks.push(v);
        dom = { min: dmin, max: dmax, ticks };
      }

      /* card de inputs */
      const initIn = moneyInput(initCents, { plain: true, onChange: (s) => { initCents = s; } });
      const contribIn = moneyInput(contribCents, { plain: true, onChange: (s) => { contribCents = s; } });
      const rateIn = el('input', { className: 'form-input', type: 'number', min: '0', step: '0.01', value: String(draft.annualRate) });
      rateIn.addEventListener('input', () => { draft.annualRate = rateIn.value; });
      const yearsIn = el('input', { className: 'form-input', type: 'number', min: '1', max: '60', value: String(draft.years) });
      yearsIn.addEventListener('input', () => { draft.years = yearsIn.value; });
      const quick = el('div', { style: { display: 'flex', gap: '6px', marginTop: '8px' } },
        [5, 10, 15, 20, 25, 30].map((n) => el('button', {
          className: 'btn btn-ghost', style: { padding: '6px 9px' },
          onclick: () => { draft.years = n; yearsIn.value = String(n); },
        }, n + 'y')));
      const pop = el('div', {
        style: {
          position: 'absolute', top: 'calc(100% + 6px)', right: '0', width: '280px',
          background: 'var(--surface)', border: '1px solid var(--border)', borderRadius: '10px',
          padding: '8px 10px', boxShadow: 'var(--shadow-md)', color: 'var(--text-secondary)',

        },
      }, 'Formula: each month uses previous balance × monthly rate, then adds monthly contribution. Monthly rate = (1 + annual rate)^(1/12) - 1.');
      const infoWrap = el('span', { style: { position: 'relative', display: 'inline-flex', alignItems: 'center' } },
        el('button', { className: 'btn btn-ghost', style: { padding: '2px 8px', minHeight: '0', height: '24px', lineHeight: '20px' } }, 'Information'),
        pop);
      infoWrap.addEventListener('mouseenter', () => { pop.style.display = 'block'; });

      root.appendChild(el('div', { className: 'card', style: { marginBottom: '12px' } },
        el('h1', { className: 'page-title', style: { marginBottom: '4px' } }, 'Compound Interest Simulator'),
        el('p', { className: 'page-sub', style: { marginBottom: '18px' } }, 'Projection based on monthly contributions + monthly compounding'),
        el('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '14px' } },
          fg('Initial amount', initIn.el),
          fg('Monthly contribution', contribIn.el),
          fg('Interest rate (% annual)', rateIn),
          el('div', { className: 'form-group' }, el('label', { className: 'form-label' }, 'Period (years)'), yearsIn, quick)),
        el('div', { style: { marginTop: '10px', color: 'var(--text-secondary)', fontSize: '12px', display: 'flex', alignItems: 'center', gap: '8px' } },
          el('span', {}, 'Compounding assumes monthly contribution at month-end and monthly accrued interest.'),
          infoWrap),
        el('div', { style: { display: 'flex', gap: '10px', marginTop: '14px' } },
          el('button', {
            className: 'btn btn-primary',
            onclick: () => {
              const next = {
                years: Math.max(1, parseInt(draft.years, 10) || 1),
                initialAmount: Math.max(0, U.centsToNumber(initCents)),
                monthlyContribution: Math.max(0, U.centsToNumber(contribCents)),
                annualRate: Math.max(0, Number(draft.annualRate) || 0),
              };
              draft = { years: next.years, annualRate: next.annualRate };
              applied = next;
              render();
            },
          }, 'Calculate'),
          el('button', {
            className: 'btn btn-ghost',
            onclick: () => {
              draft = { years: DEFAULTS.years, annualRate: DEFAULTS.annualRate };
              applied = Object.assign({}, DEFAULTS);
              initCents = U.centsFromValue(DEFAULTS.initialAmount);
              contribCents = U.centsFromValue(DEFAULTS.monthlyContribution);
              render();
            },
          }, 'Clear'))));

      /* card Results */
      const viewSel = el('select', { className: 'form-input', style: { width: '220px' } },
        el('option', { value: 'year' }, 'Year view'),
        el('option', { value: 'month' }, 'Month view'));
      viewSel.value = view;
      viewSel.addEventListener('change', () => { view = viewSel.value; render(); });
      const chartHost = el('div');
      root.appendChild(el('div', { className: 'card', style: { marginBottom: '12px' } },
        el('div', { className: 'card-header' }, el('span', { className: 'card-title' }, 'Results')),
        el('div', { className: 'stats-row', style: { marginTop: '0' } },
          el('div', { className: 'stat-card', style: { background: '#A10F09', borderColor: '#A10F09', color: '#FFF' } },
            el('div', { className: 'stat-label', style: { color: 'rgba(255,255,255,0.82)' } }, 'Final balance'),
            el('div', { className: 'stat-value' }, Z(sim.finalBalance)),
            el('div', { className: 'stat-change', style: { color: 'rgba(255,255,255,0.82)' } }, applied.years + ' year(s)')),
          el('div', { className: 'stat-card' },
            el('div', { className: 'stat-label' }, 'Total invested'),
            el('div', { className: 'stat-value' }, Z(totalInvestedAll)),
            el('div', { className: 'stat-change', style: { color: 'var(--text-secondary)' } }, 'initial + monthly')),
          el('div', { className: 'stat-card' },
            el('div', { className: 'stat-label' }, 'Total interest'),
            el('div', { className: 'stat-value' }, Z(sim.totalEarnings)),
            el('div', { className: 'stat-change', style: { color: 'var(--text-secondary)' } }, U.fmtPct(sim.monthlyRate * 100) + ' monthly'))),
        el('div', { style: { marginTop: '10px', marginBottom: '8px', fontWeight: '700', color: '#A10F09', textAlign: 'center' } }, 'Chart'),
        el('div', { style: { display: 'flex', justifyContent: 'flex-end', marginBottom: '8px' } }, viewSel),
        chartHost));
      if (chartData.length > 1) {
        drawLineChart(chartHost, {
          data: chartData,
          xKey: view === 'year' ? 'yearIndex' : 'monthIndex',
          height: 260, yAxisWidth: 88, domain: dom,
          series: [
            { key: 'totalAccumulated', name: 'Total Accumulated', color: '#A10F09', width: 2.4 },
            { key: 'totalInvested', name: 'Total Invested', color: '#222', width: 2.1 },
          ],
        });
      } else {
        chartHost.appendChild(el('div', { className: 'empty-state' },
          el('div', { className: 'ico' }, '📈'),
          el('p', {}, 'Not enough data for chart.')));
      }

      /* card Table */
      const thS = { textAlign: 'left', padding: '10px 12px', borderBottom: '1px solid var(--border)' };
      const tdS = { padding: '9px 12px', borderBottom: '1px solid var(--border)' };
      const tbody = el('tbody', {}, tableRows.map((r) => el('tr', {},
        el('td', { style: tdS }, String(r.monthIndex)),
        el('td', { style: tdS }, Z(r.monthlyInterest)),
        el('td', { style: tdS }, Z(r.totalInvested)),
        el('td', { style: tdS }, Z(r.totalInterest)),
        el('td', { style: tdS }, Z(r.totalAccumulated)))));
      root.appendChild(el('div', { className: 'card' },

              el('th', { style: thS }, 'Total Interest'),
              el('th', { style: thS }, 'Total Accumulated'))),

    }

    return {
      mount(section) {
        root = section;
        document.addEventListener('nexo:data', () => { if (Nexo.router.current === 'compound_interest') render(); });

          'Nexo is a personal finance dashboard designed to make daily money management clear and practical. It helps you see your numbers fast, keep control of expenses and loans, and make better decisions with confidence.'),

        el('div', { style: { marginTop: '4px', color: 'var(--text-secondary)', fontSize: '13px' } }, 'Version: v4.0.0')));

  /* ═══════════════════════════ ABA OPTIONS ══════════════════════════════ */
  Nexo.registerTab('options', function () {
    let root = null;
    let busy = false;
    let headEl = null, bodyEl = null;

    function statusText() {
      const m = store.syncMode;
      if (m === 'server') return 'GitHub Gist connected';
      if (m === 'local') return 'Local only — configure GitHub sync';
      return 'Checking sync status…';
    }
    function renderSync() {
      if (!headEl) return;
      headEl.textContent = store.syncMode === 'server' ? 'Connected' : 'Not connected';
      bodyEl.innerHTML = '';
      const lines = el('div', { style: { fontSize: '13px', color: 'var(--text-secondary)', display: 'grid', gap: '4px', marginBottom: '12px' } });
      lines.appendChild(el('div', {}, 'Status: ' + statusText()));
      if (store.lastSyncedAt) {
        const d = new Date(store.lastSyncedAt);
        if (!isNaN(d)) lines.appendChild(el('div', {}, 'Last update: ' + d.toLocaleString('pt-BR')));
      }
      if (store.lastError) {
        lines.appendChild(el('div', { style: { color: '#B46A50' } }, 'Error: ' + store.lastError));
      }
      bodyEl.appendChild(lines);
      bodyEl.appendChild(el('div', { className: 'sync-actions' },
        el('button', {
          className: 'btn btn-outline',
          disabled: busy || store.syncMode !== 'server',
          onclick: doSync,
        }, 'Sync Now'),
        el('button', { className: 'btn btn-ghost', disabled: busy, onclick: doDisconnect }, 'Disconnect')));
    }
    function doSync() {
      if (busy) return;
      busy = true;
      renderSync();
      store.syncNow()
        .then(() => { toast('Synced to GitHub Gist'); })
        .catch((err) => { toast('Sync failed — ' + String((err && err.message) || err)); })
        .then(() => { busy = false; renderSync(); });
    }
    function doDisconnect() {
      if (!window.confirm('Disconnect GitHub sync from this device? Local data will be kept.')) return;
      try {
        localStorage.removeItem('nexo_github_sync_config');
        localStorage.removeItem('nexo_github_sync_sha');
      } catch (_) {}
      location.reload();
    }

    return {
      mount(section) {
        root = section;
        root.appendChild(el('h1', { className: 'page-title' }, 'Options'));
        root.appendChild(el('p', { className: 'page-sub' }, 'Manage sync, shortcuts, and portability across computers.'));
        headEl = el('span', { style: { fontSize: '13px', color: 'var(--text-secondary)' } });
        bodyEl = el('div');
        root.appendChild(el('div', { className: 'card' },
          el('div', { className: 'card-header' }, el('span', { className: 'card-title' }, 'Sync File'), headEl),
          bodyEl));
        root.appendChild(el('div', { id: 'nx4-backup-slot' }));
        document.addEventListener('nexo:sync-state', () => { if (Nexo.router.current === 'options') renderSync(); });
        document.addEventListener('nexo:data', () => { if (Nexo.router.current === 'options') renderSync(); });
        renderSync();
      },
      show() { renderSync(); },
    };
  });
})();

<script>
/* ═══ inv-dashboard.js ═══ */

/* ── Nexo — Investments Dashboard Redesign ──────────────────────────────── */
(function () {
  'use strict';

  // ── Helpers ──────────────────────────────────────────────────────────────
  const ASSETS_KEY = 'nexo_investment_assets';
  const TXS_KEY    = 'nexo_investment_transactions';
  const FIXED_INCOME = new Set(['CDB','LCI','LCA','Fund']);

  function loadAssets()  { try { return JSON.parse(localStorage.getItem(ASSETS_KEY) || '[]'); } catch { return []; } }
  function loadTxs()     { try { return JSON.parse(localStorage.getItem(TXS_KEY) || '[]'); } catch { return []; } }

  // Carrega dados frescos do Gist para o localStorage antes de renderizar
  async function loadFromGist() {
    try {
      const resp = await fetch('/api/sync/data');
      if (!resp.ok) return;
      const json = await resp.json();
      const d = json && json.payload && json.payload.data;
      if (!d) return;
      if (Array.isArray(d.investmentAssets))
        localStorage.setItem(ASSETS_KEY, JSON.stringify(d.investmentAssets));
      if (Array.isArray(d.investmentTransactions))
        localStorage.setItem(TXS_KEY, JSON.stringify(d.investmentTransactions));
    } catch (e) {
      console.warn('[Nexo Dash] loadFromGist failed:', e);
    }
  }

  function fmtBRL(v, d) {
    if (v == null || isNaN(v)) return 'R$ —';
    const opts = { minimumFractionDigits: d ?? 2, maximumFractionDigits: d ?? 2 };
    return 'R$ ' + Math.abs(v).toLocaleString('pt-BR', opts);
  }
  function fmtPct(v) {
    if (v == null || isNaN(v)) return '—';
    return (v >= 0 ? '+' : '') + v.toFixed(2) + '%';
  }
  function fmtK(v) {
    if (Math.abs(v) >= 1e6) return 'R$ ' + (v/1e6).toFixed(1) + 'M';
    if (Math.abs(v) >= 1e3) return 'R$ ' + (v/1e3).toFixed(1) + 'k';
    return 'R$ ' + v.toFixed(0);
  }
  function fmtDate(str) {
    if (!str) return '—';
    const [y,m,d] = str.split('-');
    return d+'/'+m+'/'+y;
  }
  function today() {
    const n = new Date();
    return n.toISOString().slice(0,10);
  }

  // ── Class colours ─────────────────────────────────────────────────────────
  const CLASS_COLORS = {
    'ETF':   'var(--accent, #E07A5F)',
    'Stock': '#8E5A8A',
    'CDB':   '#B58A3B',
    'LCI':   '#6B9E7A',
    'LCA':   '#5C8A6C',
    'Fund':  '#4C7A99',
    'Cash':  '#7A756F',
  };
  function classColor(cls) { return CLASS_COLORS[cls] || '#7A756F'; }

  // ── XIRR ─────────────────────────────────────────────────────────────────
  function computeXIRR(cashflows) {
    if (!cashflows || cashflows.length < 2) return null;
    const t0 = new Date(cashflows[0].date).getTime();
    function npv(r) {
      return cashflows.reduce((s, cf) => {
        const t = new Date(cf.date).getTime();
        const years = (t - t0) / (365.25 * 24 * 3600 * 1000);
        return s + cf.amount / Math.pow(1 + r, years);
      }, 0);
    }
    let lo = -0.999, hi = 100, mid = 0;
    for (let i = 0; i < 200; i++) {
      mid = (lo + hi) / 2;
      if (npv(mid) > 0) lo = mid; else hi = mid;
      if (hi - lo < 1e-8) break;
    }
    return isFinite(mid) ? mid : null;
  }

  // ── Portfolio calculations ────────────────────────────────────────────────
  function calcPortfolio() {
    const assets = loadAssets();
    const txs    = loadTxs();

    const result = assets.map(asset => {
      const myTxs = txs.filter(t => t.assetId === asset.id);
      const fi = FIXED_INCOME.has(asset.assetClass);

      let qtyNet = 0, firstBuyDate = null;
      let totalBuyQty = 0, weightedBuyCost = 0;
      let totalBuyAmt = 0, totalSellAmt = 0; // para fundos/renda fixa

      myTxs.forEach(t => {
        const d = t.date;
        if (t.type === 'buy' || t.type === 'adjustment') {
          const qty = parseFloat(t.quantity) || 1;
          const amt = parseFloat(t.amount)   || 0;
          qtyNet          += fi ? 0 : qty;   // fundos não contam qty
          weightedBuyCost += fi ? 0 : amt * qty;
          totalBuyQty     += fi ? 0 : qty;
          totalBuyAmt     += fi ? amt : 0;   // fundos: soma o valor total
          if (!firstBuyDate || d < firstBuyDate) firstBuyDate = d;
        } else if (t.type === 'sell') {
          const qty = parseFloat(t.quantity) || 1;
          const amt = parseFloat(t.amount)   || 0;
          qtyNet      -= fi ? 0 : qty;
          totalSellAmt += fi ? amt : 0;
        }
      });

      const manualPrice = parseFloat(asset.manualUnitPrice) || 0;
      let avgPrice, position, pl, costBasis;

      if (!fi) {
        // ETF: preço médio ponderado por qtd de cotas
        avgPrice  = totalBuyQty > 0 ? weightedBuyCost / totalBuyQty : 0;
        position  = qtyNet * manualPrice;
        pl        = (manualPrice - avgPrice) * qtyNet;
        costBasis = avgPrice * qtyNet;
      } else {
        // Fundo/renda fixa: capital líquido = Σbuys − Σsells
        const netInvested = totalBuyAmt - totalSellAmt;
        avgPrice  = netInvested;  // usado para exibir "Capital invested" no Dashboard
        position  = manualPrice;
        // Para renda fixa: P/L inclui cupons/dividendos recebidos
        const assetIncome = myTxs
          .filter(t => t.type === 'income')
          .reduce((s, t) => s + (parseFloat(t.amount) || 0), 0);
        pl        = (manualPrice - netInvested) + assetIncome;
        costBasis = netInvested;
      }

      return {
        ...asset,
        qtyNet, avgPrice, position, pl, costBasis,
        firstBuyDate,
        txs: myTxs,
        fi,
      };
    }).filter(a => a.position > 0 || a.qtyNet > 0);

    const totalPosition = result.reduce((s, a) => s + a.position, 0);
    result.forEach(a => { a.allocation = totalPosition > 0 ? (a.position / totalPosition) * 100 : 0; });

    // Income totals
    const allIncome = txs.filter(t => t.type === 'income');
    const totalIncome = allIncome.reduce((s,t) => s + (parseFloat(t.amount)||0), 0);
    const couponClasses = ['CDB','LCI','LCA'];
    const couponCount = allIncome.filter(t => {
      const a = assets.find(x => x.id === t.assetId);
      return a && couponClasses.includes(a.assetClass);
    }).length;
    const dividendCount = allIncome.filter(t => {
      const a = assets.find(x => x.id === t.assetId);
      return a && !couponClasses.includes(a.assetClass);
    }).length;

    // Total cost basis & P/L
    const totalCostBasis = result.reduce((s,a) => s + a.costBasis, 0);
    const totalPL        = result.reduce((s,a) => s + a.pl, 0);
    const totalPLpct     = totalCostBasis > 0 ? (totalPL / totalCostBasis) * 100 : 0;

    // XIRR cashflows
    const allTxsSorted = txs.slice().sort((a,b)=> a.date < b.date ? -1 : 1);
    const xirrCFs = allTxsSorted.map(t => {
      const amt = parseFloat(t.amount) || 0;
      const qty = parseFloat(t.quantity) || 1;
      const a   = assets.find(x => x.id === t.assetId);
      const fi2 = a ? FIXED_INCOME.has(a.assetClass) : false;
      let cash;
      if (t.type === 'buy' || t.type === 'adjustment') {
        cash = fi2 ? -amt : -(amt * qty);
      } else if (t.type === 'sell' || t.type === 'income') {
        cash = fi2 ? amt : (amt * qty);
      } else {
        cash = 0;
      }
      return { date: t.date, amount: cash };
    }).filter(c => c.amount !== 0);

    if (xirrCFs.length > 0 && totalPosition > 0) {
      xirrCFs.push({ date: today(), amount: +totalPosition });
    }

    const irr = xirrCFs.length >= 2 ? computeXIRR(xirrCFs) : null;
    const firstTxDate = allTxsSorted.length > 0 ? allTxsSorted[0].date : null;

    return {
      assets: result,
      totalPosition,
      totalIncome,
      dividendCount,
      couponCount,
      totalCostBasis,
      totalPL,
      totalPLpct,
      irr,
      firstTxDate,
      allTxs: txs,
    };
  }

  function goToInvestmentsTx() {

  // ── Flow chart data ───────────────────────────────────────────────────────
  function getFlowData(txs, assets, period) {
    const now = new Date();
    let fromDate;
    if (period === 'month') {
      fromDate = new Date(now.getFullYear(), now.getMonth(), 1);
    } else if (period === '30d') {
      fromDate = new Date(now.getTime() - 30*24*3600*1000);
    } else if (period === 'year') {
      fromDate = new Date(now.getFullYear(), 0, 1);
    } else {
      fromDate = null;
    }

    const filtered = txs.filter(t => !fromDate || t.date >= fromDate.toISOString().slice(0,10));

    const months = {};
    filtered.forEach(t => {
      const [y,m] = t.date.split('-');
      const key = y+'-'+m;
      if (!months[key]) months[key] = { buy: 0, income: 0, sell: 0, adj: 0 };
      const a   = assets.find(x => x.id === t.assetId);
      const fi  = a ? FIXED_INCOME.has(a.assetClass) : false;
      const amt = parseFloat(t.amount) || 0;
      const qty = parseFloat(t.quantity) || 1;
      const val = fi ? amt : amt * qty;
      if (t.type === 'buy')        months[key].buy    += val;
      else if (t.type === 'sell')  months[key].sell   += val;
      else if (t.type === 'income')months[key].income += amt;
      else if (t.type === 'adjustment') months[key].adj += val;
    });

    const sorted = Object.keys(months).sort();
    const totals = { buy:0, sell:0, income:0, adj:0 };
    filtered.forEach(t => {
      const a   = assets.find(x => x.id === t.assetId);
      const fi  = a ? FIXED_INCOME.has(a.assetClass) : false;
      const amt = parseFloat(t.amount) || 0;
      const qty = parseFloat(t.quantity) || 1;
      const val = fi ? amt : amt * qty;
      if (t.type === 'buy')         totals.buy    += val;
      else if (t.type === 'sell')   totals.sell   += val;
      else if (t.type === 'income') totals.income += amt;
      else if (t.type === 'adjustment') totals.adj += val;
    });

    return { monthKeys: sorted, months, totals };
  }

  // ── SVG Donut ─────────────────────────────────────────────────────────────
  function buildDonutSVG(segments, totalPosition) {
    const cx=120, cy=120, r=90, sw=28;
    const circ = 2*Math.PI*r;

    let offset = 0;
    const SEGS = segments.map(s => {
      const dash = (s.pct/100)*circ;
      const seg = { ...s, dash, offset };
      offset += dash;
      return seg;
    });

    const segPaths = SEGS.map((s,i) =>
      `<circle data-seg-i="${i}" data-seg-cls="${s.cls}" cx="${cx}" cy="${cy}" r="${r}"
        fill="none" stroke="${s.color}" stroke-width="${sw}"
        stroke-dasharray="${s.dash.toFixed(3)} ${(circ-s.dash).toFixed(3)}"
        stroke-dashoffset="${(circ/4 - s.offset).toFixed(3)}"
        style="transition:opacity .2s;cursor:pointer"
        transform="rotate(-90 ${cx} ${cy})"
      />`
    ).join('');

    const valStr  = totalPosition >= 1e6 ? (totalPosition/1e6).toFixed(1)+'M' : totalPosition >= 1e3 ? (totalPosition/1e3).toFixed(0)+'k' : totalPosition.toFixed(0);
    const nCls    = segments.length;

    return `<svg id="nx-dash-donut" viewBox="0 0 240 240" width="240" height="240" xmlns="http://www.w3.org/2000/svg">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--surface-hover,#f0ece8)" stroke-width="${sw}" />
      ${segPaths}
      <text x="${cx}" y="${cy-16}" text-anchor="middle" font-size="10" fill="var(--text-muted,#888)" font-family="inherit" letter-spacing="1">TOTAL</text>
      <text x="${cx}" y="${cy+2}" text-anchor="middle" font-size="16" fill="var(--text,#1a1a1a)" font-family="Fraunces,serif" font-weight="600">R$ ${valStr}</text>
      <text x="${cx}" y="${cy+18}" text-anchor="middle" font-size="10" fill="var(--text-muted,#888)" font-family="inherit">${nCls} classe${nCls!==1?'s':''}</text>
    </svg>`;
  }

  // ── Bar chart SVG ─────────────────────────────────────────────────────────
  function buildBarChartSVG(monthKeys, months) {
    if (!monthKeys.length) {
      return `<svg width="100%" height="220" xmlns="http://www.w3.org/2000/svg">
        <text x="50%" y="110" text-anchor="middle" fill="var(--text-muted,#888)" font-size="13">No data for this period</text>
      </svg>`;
    }

    const W=600, H=220, padL=52, padR=16, padT=16, padB=36;
    const chartW = W - padL - padR;
    const chartH = H - padT - padB;

    const maxVal = Math.max(1, ...monthKeys.map(k => (months[k].buy||0) + (months[k].adj||0) + (months[k].income||0)));
    const ticks  = [0, maxVal/2, maxVal];

    const slotW  = chartW / monthKeys.length;
    const barW   = Math.min(slotW * 0.55, 28);

    const MONTH_ABBR = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

    const bars = monthKeys.map((k, i) => {
      const mo   = months[k];
      const base = (mo.buy||0) + (mo.adj||0);
      const inc  = mo.income||0;
      const sell = mo.sell||0;
      const x    = padL + slotW*i + slotW/2;

      const hBase = (base/maxVal)*chartH;
      const hInc  = (inc/maxVal)*chartH;
      const hSell = (sell/maxVal)*chartH;

      const yBase = padT + chartH - hBase;
      const yInc  = yBase - hInc;

      const mo2   = months[k];
      const tt    = `${k}: Buy R$${(mo2.buy||0).toFixed(0)} Adj R$${(mo2.adj||0).toFixed(0)} Income R$${inc.toFixed(0)} Sell R$${sell.toFixed(0)}`;

      let rects = '';
      if (hBase > 0) rects += `<rect x="${(x - barW/2).toFixed(1)}" y="${yBase.toFixed(1)}" width="${barW.toFixed(1)}" height="${hBase.toFixed(1)}" rx="2" fill="var(--buy,#5C8A6C)" data-tooltip="${tt}" />`;
      if (hInc  > 0) rects += `<rect x="${(x - barW/2).toFixed(1)}" y="${yInc.toFixed(1)}" width="${barW.toFixed(1)}" height="${hInc.toFixed(1)}" rx="2" fill="#B58A3B" data-tooltip="${tt}" />`;
      if (hSell > 0) rects += `<rect x="${(x + barW/2 + 2).toFixed(1)}" y="${(padT+chartH - hSell).toFixed(1)}" width="${(barW*0.6).toFixed(1)}" height="${hSell.toFixed(1)}" rx="2" fill="var(--sell,#C0614A)" data-tooltip="${tt}" />`;

      const [yr,mo3] = k.split('-');
      const lbl = MONTH_ABBR[parseInt(mo3,10)-1] + (yr !== String(new Date().getFullYear()) ? ' '+yr.slice(2) : '');
      const xlbl = `<text x="${x.toFixed(1)}" y="${(H-padB+14).toFixed(1)}" text-anchor="middle" font-size="10" fill="var(--text-muted,#888)">${lbl}</text>`;

      return rects + xlbl;
    }).join('');

    const tickLines = ticks.map(v => {
      const y = padT + chartH - (v/maxVal)*chartH;
      return `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="var(--border,#e0dbd5)" stroke-width="1" stroke-dasharray="3 3"/>
        <text x="${(padL-4).toFixed(1)}" y="${(y+4).toFixed(1)}" text-anchor="end" font-size="9" fill="var(--text-muted,#888)">${fmtK(v)}</text>`;
    }).join('');

    return `<svg id="nx-dash-bars" viewBox="0 0 ${W} ${H}" width="100%" height="220" xmlns="http://www.w3.org/2000/svg" style="overflow:visible">
      ${tickLines}
      ${bars}
    </svg>`;
  }

            totalCostBasis, totalPL, totalPLpct, irr, firstTxDate, allTxs } = data;

    if (!assets.length) {

    // ── KPI Cards ──

    const irrSign = irr != null && irr >= 0 ? '+' : (irr != null ? '−' : '');

    // ── Allocation by class ──

      const cls = a.assetClass || 'Other';
      if (!byClass[cls]) byClass[cls] = { cls, color: classColor(cls), position: 0, assets: [] };

    });
    const classSegs = Object.values(byClass)
      .sort((a,b) => b.position - a.position)
      .map(c => ({ ...c, pct: totalPosition > 0 ? (c.position/totalPosition)*100 : 0 }));

    const donutSVG = buildDonutSVG(classSegs, totalPosition);

    // Allocation list HTML
    let allocListHTML = '';

              <div class="nx-dash-alloc-bar-wrap"><div class="nx-dash-alloc-bar" style="width:${c.pct.toFixed(1)}%;background:${c.color}"></div></div>
            </div>
            <div class="nx-dash-alloc-pct">${c.pct.toFixed(1)}%</div>

          </div>`;

    } else {
      assets.slice().sort((a,b) => b.position - a.position).forEach(a => {
        const color = classColor(a.assetClass);
        allocListHTML += `
          <div class="nx-dash-alloc-row">
            <div class="nx-dash-dot" style="background:${color}"></div>
            <div class="nx-dash-alloc-info">
              <div class="nx-dash-alloc-name">${a.name}</div>
              <div class="nx-dash-alloc-sub">${a.assetClass}${a.ticker?' · '+a.ticker:''}</div>
              <div class="nx-dash-alloc-bar-wrap"><div class="nx-dash-alloc-bar" style="width:${a.allocation.toFixed(1)}%;background:${color}"></div></div>
            </div>
            <div class="nx-dash-alloc-pct">${a.allocation.toFixed(1)}%</div>
            <div class="nx-dash-alloc-val">${fmtBRL(a.position)}</div>
          </div>`;
      });
    }

    const nClasses  = classSegs.length;
    const allocToggleLabel = state.allocationView === 'class' ? 'By asset →' : 'By class →';

    // ── Holdings table ──
    const holdingsRows = assets.slice().sort((a,b) => b.position - a.position).map(a => {
      const plColor2 = a.pl >= 0 ? 'var(--pos,#3a7d44)' : 'var(--neg,#b52b27)';
      const plSign2  = a.pl >= 0 ? '+' : '−';
      const plPct2   = a.costBasis > 0 ? (a.pl / a.costBasis)*100 : 0;
      const clr = classColor(a.assetClass);
      const unit = a.fi ? 'units' : 'shares';
      const costLbl = a.fi ? 'per unit' : 'per share';
      return `
        <tr class="nx-dash-row" data-asset-id="${a.id}">
          <td class="nx-dash-td">
            <div class="nx-dash-asset-name">${a.name}</div>
            <div class="nx-dash-asset-sub">
              <span class="nx-dash-badge" style="background:${clr}22;color:${clr}">${a.assetClass}</span>
              ${a.ticker ? '<span class="nx-dash-ticker">'+a.ticker+'</span>' : ''}
              ${a.firstBuyDate ? '· since '+fmtDate(a.firstBuyDate) : ''}
            </div>
          </td>
          <td class="nx-dash-td nx-dash-right">
            <div class="nx-dash-tabnum">${a.qtyNet > 0 ? a.qtyNet.toFixed(a.fi?0:4) : '—'}</div>

              </div>
              <span class="nx-dash-tabnum" style="min-width:42px;text-align:right">${a.allocation.toFixed(1)}%</span>
            </div>
          </td>
          <td class="nx-dash-td nx-dash-right">
            <div style="font-family:Fraunces,serif;font-weight:600;color:${plColor2}">${plSign2} ${fmtBRL(a.pl)}</div>
            <div class="nx-dash-muted">${plPct2>=0?'+':''}${plPct2.toFixed(2)}%</div>
          </td>
        </tr>`;
    }).join('');

    // ── Flows ──
    const allAssets = loadAssets();
    const { monthKeys, months, totals } = getFlowData(allTxs, allAssets, state.period);
    const barSVG = buildBarChartSVG(monthKeys, months);
    const netContrib = totals.buy + totals.adj - totals.sell;

    const periodBtns = ['month','30d','year','all'].map(p => {
      const labels = { month:'This month', '30d':'Last 30 days', year:'This year', all:'All' };
      const active = state.period === p ? ' nx-dash-period-active' : '';
      return `<button class="nx-dash-period-btn${active}" data-action="set-period" data-period="${p}">${labels[p]}</button>`;
    }).join('');

    // ── Asset classes, risk & variable-income breakdown (Nexo 3.10) ──
    const NX_BUCKETS = [
      { k:'rf',     name:'Fixed Income',        color:'#6B9E7A', w:0   },
      { k:'rvNac',  name:'Domestic Equity',     color:'#E07A5F', w:1.0 },
      { k:'rvInt',  name:'International Equity', color:'#4C7A99', w:1.0 },
      { k:'crypto', name:'Crypto',              color:'#7A3F8F', w:1.5 },
    ];
    const NX_BK = {}; NX_BUCKETS.forEach(b => NX_BK[b.k] = b);
    let nxRegionMap = {};
    try { nxRegionMap = JSON.parse(localStorage.getItem('nexo_asset_region_map') || '{}') || {}; } catch (e) { nxRegionMap = {}; }
    const nxValidRegion = r => r === 'BR' || r === 'INTL' || r === 'CRYPTO';
    function nxBucketOf(a) {
      const c = a.assetClass;
      if (c === 'CDB' || c === 'LCI' || c === 'LCA' || c === 'Fund' || c === 'Cash') return 'rf';
      const r = nxValidRegion(a.region) ? a.region : (nxValidRegion(nxRegionMap[a.id]) ? nxRegionMap[a.id] : null);
      if (r === 'INTL') return 'rvInt';
      if (r === 'CRYPTO') return 'crypto';
      return 'rvNac';
    }
    const nxBT = { rf:0, rvNac:0, rvInt:0, crypto:0 };
    const nxRvAssets = [];
    assets.forEach(a => { const bk = nxBucketOf(a); nxBT[bk] += a.position; if (bk !== 'rf') nxRvAssets.push({ ...a, _bk: bk }); });
    const nxTotal = NX_BUCKETS.reduce((s,b) => s + nxBT[b.k], 0);
    const nxRvTotal = nxBT.rvNac + nxBT.rvInt + nxBT.crypto;
    const nxPct = k => nxTotal > 0 ? (nxBT[k] / nxTotal * 100) : 0;

    // Aggressiveness (replica New Investments: score = Σ pct_k × weight_k, pcts somando 100)
    let nxAggr = 0; if (nxTotal > 0) NX_BUCKETS.forEach(b => { nxAggr += nxPct(b.k) * b.w; });
    const NX_PROFILES = [
      { max:20,  name:'Very Conservative', color:'#3F6F50' },
      { max:40,  name:'Conservative',      color:'#6B9E7A' },
      { max:60,  name:'Moderate',          color:'#B58A3B' },
      { max:80,  name:'Aggressive',        color:'#D55F3E' },
      { max:999, name:'Very Aggressive',   color:'#7A3F8F' },
    ];
    let nxProfile = NX_PROFILES[NX_PROFILES.length - 1];
    for (let i = 0; i < NX_PROFILES.length; i++) { if (nxAggr <= NX_PROFILES[i].max) { nxProfile = NX_PROFILES[i]; break; } }
    const nxAggrPos = Math.max(0, Math.min(100, nxAggr / 150 * 100));

    // Concentração (portfolio todo)

    function nxRvDonut(segs) {
      const cx=110, cy=110, r=82, sw=26, circ=2*Math.PI*r; let off=0;
      const paths = segs.map((g,i) => { const dash=(g.pct/100)*circ; const c=`<circle data-rv-i="${i}" cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${g.color}" stroke-width="${sw}" stroke-dasharray="${dash.toFixed(2)} ${(circ-dash).toFixed(2)}" stroke-dashoffset="${(circ/4-off).toFixed(2)}" transform="rotate(-90 ${cx} ${cy})" style="transition:opacity .2s;cursor:pointer"/>`; off+=dash; return c; }).join('');
      const v = nxRvTotal>=1e6?(nxRvTotal/1e6).toFixed(1)+'M':nxRvTotal>=1e3?(nxRvTotal/1e3).toFixed(0)+'k':nxRvTotal.toFixed(0);
      return `<svg id="nx-dash-rv-donut" viewBox="0 0 220 220" width="220" height="220" xmlns="http://www.w3.org/2000/svg"><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--surface-hover,#f0ece8)" stroke-width="${sw}"/>${paths}<text x="${cx}" y="${cy-14}" text-anchor="middle" font-size="10" fill="var(--text-muted,#888)" letter-spacing="1">VARIABLE</text><text x="${cx}" y="${cy+4}" text-anchor="middle" font-size="15" fill="var(--text,#1a1a1a)" font-family="Fraunces,serif" font-weight="600">R$ ${v}</text><text x="${cx}" y="${cy+20}" text-anchor="middle" font-size="10" fill="var(--text-muted,#888)">${segs.length} asset${segs.length!==1?'s':''}</text></svg>`;
    }
    const nxRvDonutSVG = nxRvSorted.length ? nxRvDonut(nxRvSorted) : '<div class="nx-dash-muted" style="padding:24px 8px">No variable-income assets yet.</div>';

    nxRvSorted.forEach(a => {

            <div class="nx-dash-alloc-bar-wrap"><div class="nx-dash-alloc-bar" style="width:${a.pct.toFixed(1)}%;background:${a.color}"></div></div>

    const investCardHTML = `

              <div style="position:absolute;top:-3px;width:3px;height:14px;border-radius:2px;background:var(--text,#1a1a1a);left:calc(${nxAggrPos.toFixed(1)}% - 1.5px)"></div>
            </div>
          </div>
        </div>

      <div class="nx-dash-card">

          <span class="nx-dash-card-title">Variable income by asset</span>

        </div>
        <div class="nx-dash-alloc-grid">
          <div id="nx-dash-rv-donut-wrap">${nxRvDonutSVG}</div>
          <div class="nx-dash-alloc-list">${nxRvListHTML}</div>
        </div>
      </div>`;

      <!-- Header -->
      <div class="nx-dash-header">

        <div class="nx-dash-kpi">

      donutEl.addEventListener('mouseover', e => {
        const seg = e.target.closest('[data-seg-i]');
        if (!seg) return;
        const i = parseInt(seg.getAttribute('data-seg-i'), 10);
        const cls = classSegs[i];
        if (!cls) return;
        donutEl.querySelectorAll('[data-seg-i]').forEach((s, si) => {
          s.style.opacity = si === i ? '1' : '0.3';
        });
        tooltip.style.display = 'block';
        tooltip.innerHTML = `<b>${cls.cls}</b>: ${fmtBRL(cls.position)} (${cls.pct.toFixed(1)}%)`;
      });
      donutEl.addEventListener('mousemove', e => {
        if (tooltip.style.display === 'none') return;
        tooltip.style.left = (e.clientX + 14) + 'px';
        tooltip.style.top  = (e.clientY - 8) + 'px';
      });
      donutEl.addEventListener('mouseout', e => {
        if (!e.relatedTarget || !e.relatedTarget.closest('#nx-dash-donut')) {
          donutEl.querySelectorAll('[data-seg-i]').forEach(s => s.style.opacity = '1');
          tooltip.style.display = 'none';
        }
      });
    }

    document.head.appendChild(s);

  // ── Event delegation ──────────────────────────────────────────────────────
  function setupEvents() {
    document.addEventListener('click', e => {
      const el = e.target.closest('[data-action]');
      if (!el) return;
      const root = document.getElementById('nx-dash-root');
      if (!root || !root.contains(el)) return;
      const action = el.getAttribute('data-action');
      if (action === 'goto-tx') { goToInvestmentsTx(); return; }
      if (action === 'set-period') {
        state.period = el.getAttribute('data-period');
        renderPage();
        return;
      }
      if (action === 'toggle-alloc-view') {
        state.allocationView = state.allocationView === 'class' ? 'asset' : 'class';
        renderPage();
        return;
      }
      if (action === 'export') {
        // Basic CSV export
        const data = calcPortfolio();
        const rows = [['Asset','Class','Ticker','Position (R$)','Avg Cost','Qty','P/L (R$)','Allocation %']];
        data.assets.forEach(a => {
          rows.push([a.name, a.assetClass, a.ticker||'', a.position.toFixed(2), a.avgPrice.toFixed(2), a.qtyNet, a.pl.toFixed(2), a.allocation.toFixed(2)]);
        });
        const csv = rows.map(r => r.map(v => '"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
        const blob = new Blob([csv], { type:'text/csv' });
        const url  = URL.createObjectURL(blob);
        const a    = document.createElement('a');
        a.href = url; a.download = 'portfolio-export.csv'; a.click();
        URL.revokeObjectURL(url);
        return;
      }
    });
  }

  // ── Nav detection & mount/unmount ─────────────────────────────────────────
  function getActiveNavLabel() {
    const btn = document.querySelector('.sidebar button.nav-item.active');
    if (!btn) return '';
    let lbl = '';
    btn.childNodes.forEach(n => { if (n.nodeType === 3) lbl += n.textContent.trim(); });
    return lbl;
  }
  function isInvestmentsDashboard() {
    const lbl = getActiveNavLabel();
    return /investment/i.test(lbl) && !/trans/i.test(lbl) && !/new/i.test(lbl);
  }
  function navLabelOf(btn) {
    let l = ''; btn.childNodes.forEach(n => { if (n.nodeType === 3) l += n.textContent.trim(); }); return l;
  }
  function isDashTarget(btn) {
    if (!btn || btn.hasAttribute('data-novosinv')) return false;
    const l = navLabelOf(btn);
    return /investment/i.test(l) && !/trans/i.test(l) && !/new/i.test(l);
  }

  let _mounted = false, _container = null;

  setupEvents();

  /* Nexo 4.0: aba registrada no roteador síncrono — sem observers/timeouts. */
  Nexo.registerTab('investments_dashboard', function () {
    return {
      mount(section) {
        injectCSS();
        _container = document.createElement('div');
        _container.id = 'nx-dash-root';
        section.appendChild(_container);
        _mounted = true;
        renderPage(); // pinta já com dados locais
        loadFromGist().finally(() => { if (_mounted) renderPage(); });
      },
      show() {
        renderPage();
        loadFromGist().finally(() => { if (_mounted) renderPage(); });
      },
    };
  });
})();

</script>

    .cpx-preview .val{font-family:"Fraunces",Georgia,serif;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;}
