  function parseB3IbovCSV(text) {
    // Expected format:
    //   Line 1:  "IBOV - Carteira do Dia DD/MM/YY"
    //   Line 2:  "Código;Ação;Tipo;Qtde. Teórica;Part. (%)"
    //   Data:    TICKER;COMPANY;TYPE;QTY;WEIGHT;
    //   Footer:  "Quantidade Teórica Total..." then "Redutor..."
    var lines = text.split(/\r?\n/).map(function (l) { return l.replace(/^\uFEFF/, ''); });
    var rows = lines.filter(function (l) { return l && l.trim().length > 0; });
    if (rows.length < 4) throw new Error('Arquivo não parece ser uma carteira do Ibovespa.');
    var titleLine = rows[0];
    var dateMatch = titleLine.match(/(\d{1,2}\/\d{1,2}\/\d{2,4})/);
    if (!/IBOV/i.test(titleLine)) throw new Error('Cabeçalho IBOV não encontrado no arquivo.');
    var compositionDate = dateMatch ? dateMatch[1] : null;
    var stocks = [];
    for (var i = 2; i < rows.length; i++) {
      var row = rows[i];
      // Footer rows — encoding-robust prefix check
      if (/^Quantidade/i.test(row)) break;
      if (/^Redutor/i.test(row)) break;
      var fields = row.split(';');
      if (fields.length < 5) continue;
      var ticker = fields[0].trim();
      var company = fields[1].trim();
      var type = fields[2].trim();
      var qty = parseBR(fields[3]);
      var weight = parseBR(fields[4]);
      if (!ticker || !/^[A-Z0-9]{4,7}$/.test(ticker)) continue;
      if (!isFinite(weight) || weight <= 0) continue;
      stocks.push({ ticker: ticker, company: company, type: type, qty: qty, weight: weight });
    }
    if (stocks.length === 0) throw new Error('Nenhuma ação foi lida do arquivo.');
    return { compositionDate: compositionDate, stocks: stocks, importedAt: new Date().toISOString() };
  }

  function normalizeCompanyName(name) {
    return String(name || '').toUpperCase()
      .replace(/\bS\/A\b/g, 'SA')
      .replace(/\bS\.A\.?\b/g, 'SA')
      .replace(/[^A-Z0-9 ]+/g, ' ')
      .replace(/\b(ON|PN|PNA|PNB|UNT|UNIT)\b/g, '')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function loadBEASettings() {
    var d = loadJSON('nexo_bea_settings', '{}');
    return {
      numStocks:       Number.isFinite(+d.numStocks)       ? +d.numStocks       : 15,
      minPerStock:     Number.isFinite(+d.minPerStock)     ? +d.minPerStock     : 50,
      onlyMostLiquid:  d.onlyMostLiquid !== false   // default true
    };
  }
  function saveBEASettings(s) {
    // Persist only known keys so stale junk (e.g. from older builds) doesn't pile up
    var clean = { numStocks: +s.numStocks || 15, minPerStock: +s.minPerStock || 0, onlyMostLiquid: !!s.onlyMostLiquid };
    saveJSON('nexo_bea_settings', clean);
    syncNiToGistDebounced();
  }

  // Returns { stocks: [...], aliases: { 'PETR3': 'PETR4', ... }, snapshotDate, imported }
  function getEffectiveIbov(settings) {
    var snap = getActiveIbovSnapshot();
    var stocks = snap.stocks.map(function (s) { return { ticker: s.ticker, company: s.company, weight: +s.weight || 0 }; });
    var aliases = {};
    if (settings.onlyMostLiquid) {
      // Group by normalized company name; fold non-primary share classes into the highest-weight one
      var groups = {};
      stocks.forEach(function (s) {
        var key = normalizeCompanyName(s.company);
        if (!key) key = s.ticker;
        if (!groups[key]) groups[key] = [];
        groups[key].push(s);
      });
      var folded = [];
      Object.keys(groups).forEach(function (k) {
        var group = groups[k].slice().sort(function (a, b) { return b.weight - a.weight; });
        var primary = group[0];
        var combinedWeight = group.reduce(function (sum, s) { return sum + s.weight; }, 0);
        folded.push({ ticker: primary.ticker, company: primary.company, weight: combinedWeight });
        for (var i = 1; i < group.length; i++) aliases[group[i].ticker] = primary.ticker;
      });
      stocks = folded;
    }
    stocks.sort(function (a, b) { return b.weight - a.weight; });
    var N = Math.max(3, Math.min(stocks.length || 1, settings.numStocks || 15));
    var topN = stocks.slice(0, N);
    var sum = topN.reduce(function (s, x) { return s + x.weight; }, 0);
    if (sum > 0) topN.forEach(function (x) { x.weight = x.weight / sum * 100; });
    return { stocks: topN, aliases: aliases, snapshotDate: snap.date, imported: snap.imported, totalConstituents: snap.stocks.length };
  }

  // Apply the dynamic alias map produced by getEffectiveIbov (so PETR3 → PETR4 etc.)
  function normalizeHoldingTicker(t, aliases) {
    if (!t) return '';
    var up = String(t).trim().toUpperCase();
    if (aliases && aliases[up]) return aliases[up];
    return up;
  }

  function computeIbovAllocation(domesticItems, totalDomestic, contribBR, settings) {
    var eff = getEffectiveIbov(settings);
    var universe = eff.stocks;
    var aliases = eff.aliases;
    var newTotal = totalDomestic + contribBR;

    // Aggregate user's current holdings into:
    //   stockMap  — direct holdings of universe stocks (possibly aliased)
    //   proxyTotal — sum of holdings of indexed-proxy ETFs (BOVA11 etc.)
    var stockMap = {};
    var proxyTotal = 0;
    var proxyDetails = []; // list of { ticker, position } for display
    (domesticItems || []).forEach(function (it) {
      if (!it.ticker) return;
      var up = String(it.ticker).trim().toUpperCase();
      if (INDEXED_PROXIES.indexOf(up) >= 0) {
        proxyTotal += it.position || 0;
        proxyDetails.push({ ticker: up, position: it.position || 0 });
        return;
      }
      var key = normalizeHoldingTicker(it.ticker, aliases);
      if (!key) return;
      stockMap[key] = (stockMap[key] || 0) + (it.position || 0);
    });

    // Build rows — current value combines direct holdings + decomposed proxy exposure.
    // Proxy decomposition uses the renormalized weights of the selected universe.
    var rows = universe.map(function (s) {
      var direct = stockMap[s.ticker] || 0;
      var fromProxy = proxyTotal * s.weight / 100;
      var current = direct + fromProxy;
      var targetValue = newTotal * s.weight / 100;
      return {
        ticker: s.ticker,
        company: s.company,
        weight: s.weight,
        currentValue: current,
        currentDirect: direct,
        currentFromProxy: fromProxy,
        targetValue: targetValue,
        deviationValue: targetValue - current  // positive = underweight, needs buying
      };
    });

    // Allocation: distribute contribution to positive deviations
    var posDev = rows.map(function (r) { return Math.max(0, r.deviationValue); });
    var sumPosDev = posDev.reduce(function (s, d) { return s + d; }, 0);
    var alloc = rows.map(function () { return 0; });

    if (sumPosDev <= 0) {
      // Already overweight on everything tracked — distribute proportional to target weights
      var sumW = rows.reduce(function (s, r) { return s + r.weight; }, 0);
      if (sumW > 0) rows.forEach(function (r, i) { alloc[i] = contribBR * r.weight / sumW; });
    } else if (sumPosDev >= contribBR) {
      // Aporte cabe dentro dos gaps — proporcional ao deviation
      rows.forEach(function (r, i) { alloc[i] = (posDev[i] / sumPosDev) * contribBR; });
    } else {
      // Cobre todos os gaps, distribui sobra proporcional aos pesos
      var leftover = contribBR - sumPosDev;
      var sumW2 = rows.reduce(function (s, r) { return s + r.weight; }, 0);
      rows.forEach(function (r, i) { alloc[i] = posDev[i] + (sumW2 > 0 ? leftover * r.weight / sumW2 : 0); });
    }

    // Apply minimum per stock — collapse small allocations into a "remaining cash" bucket
    var minP = +settings.minPerStock || 0;
    var remaining = 0;
    if (minP > 0) {
      // Iterative: drop the smallest allocations below min, redistribute their share
      var changed = true;
      while (changed) {
        changed = false;
        var validIdx = [];
        var validSum = 0;
        var droppedSum = 0;
        rows.forEach(function (r, i) {
          if (alloc[i] >= minP) { validIdx.push(i); validSum += alloc[i]; }
          else { droppedSum += alloc[i]; alloc[i] = 0; }
        });
        if (droppedSum > 0 && validIdx.length > 0) {
          // Try to redistribute droppedSum proportionally among valid (by deviation if any pos, else by weight)
          var basis = validIdx.map(function (i) { return posDev[i] > 0 ? posDev[i] : rows[i].weight; });
          var basisSum = basis.reduce(function (s, x) { return s + x; }, 0);
          if (basisSum > 0) {
            validIdx.forEach(function (i, j) { alloc[i] += droppedSum * basis[j] / basisSum; });
            changed = true;
          } else {
            remaining += droppedSum;
          }
        } else if (droppedSum > 0) {
          // No valid recipients — keep as remaining
          remaining += droppedSum;
        }
      }
    }

    rows.forEach(function (r, i) { r.buy = alloc[i]; });
    var allocated = rows.reduce(function (s, r) { return s + r.buy; }, 0);
    if (allocated < contribBR - 0.005) remaining += (contribBR - allocated);

    return { rows: rows, remaining: remaining, newTotal: newTotal, universeSize: universe.length, proxyTotal: proxyTotal, proxyDetails: proxyDetails };
  }

  function computeTrackingDeviation(rows, base) {
    // L1 distance (sum of absolute % gaps across the Ibov universe)
    if (!rows.length || base <= 0) return 0;
    return rows.reduce(function (s, r) {
      var curPct = (r.currentValue / base) * 100;
      return s + Math.abs(curPct - r.weight);
    }, 0);
  }
  function computeTrackingDeviationAfter(rows, base) {
    if (!rows.length || base <= 0) return 0;
    return rows.reduce(function (s, r) {
      var newVal = r.currentValue + (r.buy || 0);
      var newPct = (newVal / base) * 100;
      return s + Math.abs(newPct - r.weight);
    }, 0);
  }

  function renderBrazilianAssistant(buckets, total, allocResult, beaSettings) {
    var contribBR = allocResult.alloc.rvNac;
    if (!contribBR || contribBR <= 0) return '';

    var domesticItems = buckets.rvNac.items || [];
    var totalDomestic = buckets.rvNac.total;
    var result = computeIbovAllocation(domesticItems, totalDomestic, contribBR, beaSettings);
    var newTotalDomestic = result.newTotal;

    // For display, filter rows: show stocks that the user holds OR that will receive a buy
    var displayRows = result.rows.slice().filter(function (r) { return (r.buy > 0.005) || (r.currentValue > 0.005); });
    displayRows.sort(function (a, b) { return (b.buy - a.buy) || (b.weight - a.weight); });

    // Tracking deviations
    var trackingBefore = computeTrackingDeviation(result.rows, totalDomestic);
    var trackingAfter  = computeTrackingDeviationAfter(result.rows, newTotalDomestic);

    var activeSnap = getActiveIbovSnapshot();
    var snapLabel = activeSnap.imported
      ? activeSnap.date + (activeSnap.importedAt ? ' · uploaded ' + activeSnap.importedAt.slice(0,10) : '')
      : activeSnap.date;
    var html = '<div class="nxni-card">' +
      '<div class="nxni-card-title">Brazilian Equity Contribution Assistant</div>' +
      '<div class="nxni-card-sub">Distribute your Domestic Equity contribution (' + fmtBRL(contribBR) + ') across Brazilian stocks following the current Ibovespa composition.</div>';

    // Snapshot source + import controls
    html += '<div class="nxni-bea-source">' +
      '<div class="nxni-bea-source-row">' +
        '<div><div class="nxni-bea-source-lbl">Index composition</div><div class="nxni-bea-source-val">' + escHtml(snapLabel) + '</div></div>' +
        '<div class="nxni-bea-source-actions">' +
          '<input type="file" accept=".csv,text/csv" data-bea="csv-input" style="display:none" />' +
          '<button class="nxni-btn" data-action="bea-import">Import CSV</button>' +
          (activeSnap.imported ? '<button class="nxni-btn" data-action="bea-reset">Reset to embedded</button>' : '') +
        '</div>' +
      '</div>' +
      '<div class="nxni-bea-source-help">Download the latest composition from B3: <a href="https://www.b3.com.br/pt_br/market-data-e-indices/indices/indices-amplos/indice-ibovespa-ibovespa-composicao-da-carteira.htm" target="_blank" rel="noopener">B3 — Ibovespa</a>. Use the export button to download the CSV (IBOVDia_DD-MM-YY.csv) and upload it here.</div>' +
      '<div class="nxni-bea-source-msg" id="nxni-bea-msg"></div>' +
    '</div>';

    // Controls
    html += '<div class="nxni-bea-controls">' +
      '<label>Stocks to use <input type="number" min="3" max="50" step="1" data-bea="numStocks" value="' + beaSettings.numStocks + '" /></label>' +
      '<label>Min per stock R$ <input type="number" min="0" step="10" data-bea="minPerStock" value="' + beaSettings.minPerStock + '" /></label>' +
      '<label class="nxni-bea-check"><input type="checkbox" data-bea="onlyMostLiquid" ' + (beaSettings.onlyMostLiquid ? 'checked' : '') + ' /> Use only most liquid share class</label>' +
    '</div>';

    // Optional: proxy decomposition note
    if (result.proxyTotal > 0.005) {
      var proxyList = result.proxyDetails.map(function (p) { return escHtml(p.ticker) + ' (' + fmtBRL(p.position) + ')'; }).join(', ');
      html += '<div class="nxni-bea-proxy-note"><strong>Indexed proxy exposure detected:</strong> ' + proxyList + '. These holdings are treated as full Ibovespa exposure and decomposed across the universe below.</div>';
    }

    // Section 1 — Suggested purchases
    html += '<div class="nxni-section-title">Suggested purchases</div>';
    if (displayRows.length === 0) {

        '</tr></thead><tbody>';
      displayRows.forEach(function (r) {
        var curPct = newTotalDomestic > 0 ? (r.currentValue / newTotalDomestic) * 100 : 0;
        var dev = r.weight - curPct;
        var devCls = Math.abs(dev) < 0.05 ? 'dev-ok' : (dev > 0 ? 'dev-pos' : 'dev-neg');
        html += '<tr>' +
          '<td><strong>' + escHtml(r.ticker) + '</strong></td>' +
          '<td>' + escHtml(r.company) + '</td>' +
          '<td class="right">' + r.weight.toFixed(2) + '%</td>' +
          '<td class="right">' + curPct.toFixed(2) + '%</td>' +
          '<td class="right ' + devCls + '">' + (dev > 0 ? '+' : '') + dev.toFixed(2) + '</td>' +
          '<td class="right">' + (r.buy > 0.005 ? '<strong>' + fmtBRL(r.buy) + '</strong>' : '—') + '</td>' +
        '</tr>';
      });
      html += '</tbody></table></div>';
    }
    if (result.remaining > 0.005) {
      html += '<div class="nxni-bea-cash">Remaining cash (below minimum per stock): <strong>' + fmtBRL(result.remaining) + '</strong></div>';
    }

    // Section 2 — Portfolio Impact
    html += '<div class="nxni-section-title">Portfolio impact</div>';
    html += '<div class="nxni-bea-impact">' +
      '<div><div class="nxni-bea-impact-lbl">Current domestic equity</div><div class="nxni-bea-impact-val">' + fmtBRL(totalDomestic) + '</div></div>' +
      '<div><div class="nxni-bea-impact-lbl">After contribution</div><div class="nxni-bea-impact-val">' + fmtBRL(newTotalDomestic) + '</div></div>' +
      '<div><div class="nxni-bea-impact-lbl">Tracking deviation</div><div class="nxni-bea-impact-val">' + trackingBefore.toFixed(1) + ' pp → <strong>' + trackingAfter.toFixed(1) + ' pp</strong></div></div>' +
    '</div>';

    // Section 3 — Strategy Notes
    html += '<div class="nxni-section-title">Strategy notes</div>' +
      '<ul class="nxni-bea-notes">' +
        '<li>Contribution-only rebalancing — no positions are ever sold.</li>' +

        '<li>Snapshot weights are approximate. Update the IBOV_SNAPSHOT block in the HTML when B3 publishes a new quadrimestre.</li>' +
      '</ul>';

    html += '</div>';
    return html;
  }

  // ── Portfolio computation (mirrors calcPortfolio) ─────────────────────────
  function computeBuckets() {
    var assets = loadAssets();
    var txs = loadTxs();
    var regionMap = loadRegionMap();
    var buckets = {
      rf:     { total: 0, items: [] },
      rvNac:  { total: 0, items: [] },
      rvInt:  { total: 0, items: [] },
      crypto: { total: 0, items: [] }
    };
    var unclassifiedRV = [];

    assets.forEach(function (asset) {
      var myTxs = txs.filter(function (t) { return t.assetId === asset.id; });
      var fi = isFixedIncome(asset.assetClass);
      var qtyNet = 0, weightedBuyCost = 0, totalBuyQty = 0;
      var totalBuyAmt = 0, totalSellAmt = 0;
      myTxs.forEach(function (t) {
        var qty = parseFloat(t.quantity) || 1;
        var amt = parseFloat(t.amount)   || 0;
        if (t.type === 'buy' || t.type === 'adjustment') {
          qtyNet          += fi ? 0 : qty;
          weightedBuyCost += fi ? 0 : amt * qty;
          totalBuyQty     += fi ? 0 : qty;
          totalBuyAmt     += fi ? amt : 0;
        } else if (t.type === 'sell') {
          qtyNet       -= fi ? 0 : qty;
          totalSellAmt += fi ? amt : 0;
        }
      });
      var manualPrice = parseFloat(asset.manualUnitPrice) || 0;
      var position;
      if (!fi) {
        position = qtyNet * manualPrice;
        if (position <= 0) {
          var avg = totalBuyQty > 0 ? weightedBuyCost / totalBuyQty : 0;
          position = avg * qtyNet;
        }
      } else {
        position = manualPrice;
        if (position <= 0) position = totalBuyAmt - totalSellAmt;
      }
      if (position <= 0 || isNaN(position)) return;

      var explicitRegion = isValidRegion(asset.region) || isValidRegion(regionMap[asset.id]);
      var bucket = classifyBucket(asset, regionMap);
      var item = {
        id: asset.id,
        name: asset.name,
        ticker: asset.ticker,
        assetClass: asset.assetClass,
        position: position,
        region: getRegion(asset, regionMap),  // may be null
        explicitRegion: explicitRegion,
        fi: fi
      };
      buckets[bucket].total += position;
      buckets[bucket].items.push(item);
      if (!fi && !explicitRegion) unclassifiedRV.push(item);
    });

    var total = buckets.rf.total + buckets.rvNac.total + buckets.rvInt.total + buckets.crypto.total;
    return { buckets: buckets, total: total, unclassifiedRV: unclassifiedRV };
  }

  // ── Rebalancing logic ────────────────────────────────────────────────────
  function computeAllocation(buckets, total, strategy, X) {
    var sumPct = BUCKET_KEYS.reduce(function (s, k) { return s + (+strategy[k] || 0); }, 0);
    if (sumPct <= 0) return null;
    var pct = {};
    BUCKET_KEYS.forEach(function (k) { pct[k] = (+strategy[k] || 0) / sumPct; });
    var newTotal = total + X;
    var targetVal = {};
    var gap = {};
    var alloc = {};
    BUCKET_KEYS.forEach(function (k) {
      targetVal[k] = newTotal * pct[k];
      gap[k] = Math.max(0, targetVal[k] - buckets[k].total);
      alloc[k] = 0;
    });
    var sumGap = BUCKET_KEYS.reduce(function (s, k) { return s + gap[k]; }, 0);

    if (sumGap <= 0) {
      BUCKET_KEYS.forEach(function (k) { alloc[k] = X * pct[k]; });
    } else if (sumGap >= X) {
      BUCKET_KEYS.forEach(function (k) { alloc[k] = (gap[k] / sumGap) * X; });
    } else {
      var leftover = X - sumGap;
      BUCKET_KEYS.forEach(function (k) { alloc[k] = gap[k] + leftover * pct[k]; });
    }
    var newPos = {};
    BUCKET_KEYS.forEach(function (k) { newPos[k] = buckets[k].total + alloc[k]; });
    return { pct: pct, targetVal: targetVal, gap: gap, alloc: alloc, newPos: newPos, newTotal: newTotal };
  }

  function renderRiskGauge(strategy, currentPcts) {
    var targetScore = aggressivenessScore(strategy);
    var currentScore = aggressivenessScore(currentPcts);
    var targetProfile = riskProfileFor(targetScore);
    var currentProfile = riskProfileFor(currentScore);
    function pos(score) { return Math.max(0, Math.min(100, (score / 100) * 100)); }
    return '<div class="nxni-risk">' +

        '<div class="nxni-risk-label">Target portfolio risk</div>' +
        '<div class="nxni-risk-name" style="color:' + targetProfile.color + '">' + targetProfile.name + '</div>' +
        '<div class="nxni-risk-bar"><div class="nxni-risk-marker" style="left:' + pos(targetScore).toFixed(1) + '%"></div></div>' +
        '<div class="nxni-risk-scale"><span>Conservative</span><span>Moderate</span><span>Aggressive</span></div>' +
      '</div>' +
      (currentPcts._hasData ?
        '<div class="nxni-risk-row">' +
          '<div class="nxni-risk-label">Current portfolio risk</div>' +
          '<div class="nxni-risk-name" style="color:' + currentProfile.color + '">' + currentProfile.name + '</div>' +
          '<div class="nxni-risk-bar"><div class="nxni-risk-marker" style="left:' + pos(currentScore).toFixed(1) + '%"></div></div>' +
          '<div class="nxni-risk-scale"><span>Conservative</span><span>Moderate</span><span>Aggressive</span></div>' +
        '</div>' : '') +
    '</div>';
  }

  function gapClass(curPct, targetPct) {
    var d = curPct - targetPct;
    if (Math.abs(d) < 0.5) return 'ok';
    return d < 0 ? 'under' : 'over';
  }
  function gapLabel(curPct, targetPct) {
    var d = curPct - targetPct;
    if (Math.abs(d) < 0.05) return 'on target';
    return (d > 0 ? '+' : '') + d.toFixed(1) + ' p.p.';
  }

  function renderStrategySection(s, buckets, total) {
    var sum = BUCKET_KEYS.reduce(function (a, k) { return a + (+s[k] || 0); }, 0);
    var ok = Math.abs(sum - 100) < 0.01;
    // Compute current portfolio % for the gauge
    var currentPcts = { _hasData: total > 0 };
    BUCKET_KEYS.forEach(function (k) {
      currentPcts[k] = total > 0 ? (buckets[k].total / total) * 100 : 0;
    });

    var stratHtml = '<div class="nxni-strategy">';
    BUCKET_KEYS.forEach(function (k) {
      stratHtml +=
        '<div class="nxni-strategy-row">' +
          '<span class="nxni-strategy-label" style="background:' + BUCKET_META[k].color + '">' + BUCKET_META[k].name + '</span>' +
          '<input type="number" min="0" max="100" step="0.5" data-strat="' + k + '" value="' + (+s[k] || 0) + '" />' +
          '<span class="nxni-strategy-pct">%</span>' +
        '</div>';
    });
    stratHtml += '</div>';

    return '' +
      '<div class="nxni-card">' +
        '<div class="nxni-card-title">Target strategy</div>' +
        '<div class="nxni-card-sub">Define the desired percentage for each class. The total must be 100%.</div>' +
        '<div class="nxni-strategy-wrap">' +
          '<div>' +
            stratHtml +
            '<div class="nxni-strategy-total ' + (ok ? 'ok' : 'bad') + '" id="nxni-total-pct">Total: <strong>' + sum.toFixed(1) + '%</strong></div>' +
            '<div style="display:flex;align-items:center;margin-top:4px">' +
              '<button class="nxni-btn nxni-btn-primary" data-action="save-strategy" ' + (ok ? '' : 'disabled') + '>Save strategy</button>' +
              '<span class="nxni-saved-msg" id="nxni-saved-msg">Saved</span>' +
            '</div>' +
          '</div>' +
          renderRiskGauge(s, currentPcts) +
        '</div>' +
      '</div>';
  }

  function renderCurrentSection(buckets, total, strategy, unclassifiedRV) {
    if (total <= 0) {
      return '<div class="nxni-card"><div class="nxni-empty">Your portfolio has no positions yet. Add assets and transactions to view current allocation.</div></div>';
    }
    var html = '<div class="nxni-card">' +
      '<div class="nxni-card-title">Current allocation</div>' +
      '<div class="nxni-card-sub">Portfolio total: <strong>' + fmtBRL(total) + '</strong></div>' +
      '<div class="nxni-grid-row">';
    BUCKET_KEYS.forEach(function (k) {
      var b = buckets[k];
      var curPct = total > 0 ? (b.total / total) * 100 : 0;
      var tgtPct = +strategy[k] || 0;
      var gc = gapClass(curPct, tgtPct);
      html += '<div class="nxni-bucket-card">' +
        '<div class="nxni-bucket-name" style="color:' + BUCKET_META[k].color + '">' + BUCKET_META[k].name + '</div>' +
        '<div class="nxni-bucket-val">' + fmtBRL(b.total) + '</div>' +
        '<div class="nxni-bucket-detail">' + curPct.toFixed(1) + '% current · ' + tgtPct.toFixed(1) + '% target</div>' +
        '<span class="nxni-bucket-gap ' + gc + '">' + gapLabel(curPct, tgtPct) + '</span>' +
      '</div>';
    });
    html += '</div>';

    // Collect every ETF/Fund position across the three equity buckets for region editing
    var allEquity = [];
    ['rvNac','rvInt','crypto'].forEach(function (k) {
      buckets[k].items.forEach(function (it) { if (!it.fi) allEquity.push(it); });
    });
    // Unclassified come first (highlighted), then the rest
    if (unclassifiedRV && unclassifiedRV.length > 0) {
      html += '<div class="nxni-unclass"><div class="nxni-unclass-title">' +
        unclassifiedRV.length + ' ETF/Fund without region defined. Please classify:</div>';
      unclassifiedRV.forEach(function (it) {
        html += '<div class="nxni-unclass-row"><span class="nm">' +
          escHtml(it.name) + (it.ticker ? ' <span style="color:#999">(' + escHtml(it.ticker) + ')</span>' : '') +
          '</span><select data-region-for="' + escHtml(it.id) + '">' +
          '<option value="" selected>— Select region —</option>' +
          '<option value="BR">Domestic (BR)</option>' +
          '<option value="INTL">International</option>' +
          '<option value="CRYPTO">Crypto</option>' +
          '</select></div>';
      });
      html += '</div>';
    }
    // Manage classifications — always available so the user can fix mistakes
    var classified = allEquity.filter(function (it) { return it.explicitRegion; });
    if (classified.length > 0) {
      html += '<details class="nxni-manage"><summary>Manage classifications (' + classified.length + ' asset' + (classified.length === 1 ? '' : 's') + ')</summary>';
      classified.forEach(function (it) {
        html += '<div class="nxni-unclass-row"><span class="nm">' +
          escHtml(it.name) + (it.ticker ? ' <span style="color:#999">(' + escHtml(it.ticker) + ')</span>' : '') +
          '</span><select data-region-for="' + escHtml(it.id) + '">' +
          '<option value="BR" ' + (it.region === 'BR' ? 'selected' : '') + '>Domestic (BR)</option>' +
          '<option value="INTL" ' + (it.region === 'INTL' ? 'selected' : '') + '>International</option>' +
          '<option value="CRYPTO" ' + (it.region === 'CRYPTO' ? 'selected' : '') + '>Crypto</option>' +
          '</select></div>';
      });
      html += '</details>';
    }
    html += '</div>';
    return html;
  }

  function renderInputSection(amount) {
    var amtFmt = amount > 0 ? amount.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : '';
    return '<div class="nxni-card">' +
      '<div class="nxni-card-title">New contribution</div>' +
      '<div class="nxni-card-sub">How much do you have available to invest right now?</div>' +
      '<div class="nxni-amt-wrap">' +
        '<span class="nxni-amt-prefix">R$</span>' +
        '<input class="nxni-amt-input" type="text" id="nxni-amount" inputmode="decimal" placeholder="0,00" value="' + escHtml(amtFmt) + '" />' +
        '<button class="nxni-btn nxni-btn-primary" data-action="calc">Calculate</button>' +
      '</div>' +
    '</div>';
  }

  function renderResultSection(buckets, total, strategy, amount) {
    if (!amount || amount <= 0) return '';
    var r = computeAllocation(buckets, total, strategy, amount);
    if (!r) return '';
    var html = '<div class="nxni-card">' +
      '<div class="nxni-card-title">Suggested allocation</div>' +
      '<div class="nxni-card-sub">Distributing <strong>' + fmtBRL(amount) + '</strong> to align the portfolio with your strategy.</div>' +
      '<div class="nxni-result">';
    BUCKET_KEYS.forEach(function (k) {
      var v = r.alloc[k];
      var pct = amount > 0 ? (v / amount) * 100 : 0;
      html += '<div class="nxni-result-card" style="background:' + BUCKET_META[k].color + '">' +
        '<div class="nxni-result-name">' + BUCKET_META[k].name + '</div>' +
        '<div class="nxni-result-val">' + fmtBRL(v) + '</div>' +
        '<div class="nxni-result-pct">' + pct.toFixed(1) + '% of contribution</div>' +
      '</div>';
    });
    html += '</div>';
    html += '<div style="margin-top:6px;font-size:13px;font-weight:600;margin-bottom:8px">Portfolio after contribution (' + fmtBRL(r.newTotal) + '):</div>' +
      '<div class="nxni-after-row">';
    BUCKET_KEYS.forEach(function (k) {
      var newPct = r.newTotal > 0 ? (r.newPos[k] / r.newTotal) * 100 : 0;
      var tgtPct = +strategy[k] || 0;
      html += '<div><span style="color:' + BUCKET_META[k].color + '">●</span> ' +
        BUCKET_META[k].name + ': <strong>' + newPct.toFixed(1) + '%</strong> ' +
        '<span style="opacity:.6">(target ' + tgtPct.toFixed(1) + '%)</span></div>';
    });
    html += '</div></div>';
    // Append Brazilian Equity Contribution Assistant below the suggested allocation
    html += renderBrazilianAssistant(buckets, total, r, state.beaSettings);
    return html;
  }

  function renderPage() {
    if (!_container) return;
    var data = computeBuckets();
    var html = '<h1>New investments</h1>' +
      '<div class="nxni-sub">Distribute a new contribution across your asset classes following your strategy.</div>' +
      renderStrategySection(state.strategy, data.buckets, data.total) +
      renderCurrentSection(data.buckets, data.total, state.strategy, data.unclassifiedRV) +
      renderInputSection(state.amount) +
      (state.showResult ? renderResultSection(data.buckets, data.total, state.strategy, state.amount) : '');
    _container.innerHTML = html;
    wireEvents();
  }

  function wireEvents() {
    if (!_container) return;
    Array.from(_container.querySelectorAll('input[data-strat]')).forEach(function (inp) {
      inp.addEventListener('input', function () {
        var key = inp.getAttribute('data-strat');
        var v = parseFloat(inp.value);
        if (isNaN(v)) v = 0;
        state.strategy[key] = v;
        state.dirtyStrategy = true;
        var sum = BUCKET_KEYS.reduce(function (a, k) { return a + (+state.strategy[k] || 0); }, 0);
        var totEl = _container.querySelector('#nxni-total-pct');
        if (totEl) {
          totEl.innerHTML = 'Total: <strong>' + sum.toFixed(1) + '%</strong>';
          totEl.classList.toggle('ok', Math.abs(sum-100) < 0.01);
          totEl.classList.toggle('bad', Math.abs(sum-100) >= 0.01);
        }
        var saveBtn = _container.querySelector('[data-action="save-strategy"]');
        if (saveBtn) saveBtn.disabled = Math.abs(sum-100) >= 0.01;
        var score = aggressivenessScore(state.strategy);
        var profile = riskProfileFor(score);
        var riskRow = _container.querySelector('.nxni-risk-row');
        if (riskRow) {
          var nameEl = riskRow.querySelector('.nxni-risk-name');
          var marker = riskRow.querySelector('.nxni-risk-marker');
          if (nameEl) { nameEl.textContent = profile.name; nameEl.style.color = profile.color; }
          if (marker) marker.style.left = Math.max(0, Math.min(100, score)).toFixed(1) + '%';
        }
      });
    });
    var amtEl = _container.querySelector('#nxni-amount');
    if (amtEl) {
      amtEl.addEventListener('input', function () {
        var digits = amtEl.value.replace(/\D/g, '');
        var cents = parseInt(digits || '0', 10);
        var fmt = (cents / 100).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        amtEl.value = fmt;
        try { amtEl.setSelectionRange(fmt.length, fmt.length); } catch (e) {}
      });
      amtEl.addEventListener('focus', function () { amtEl.select(); });
      amtEl.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); doCalculate(); }
      });
    }
    _container.addEventListener('click', function (e) {
      var t = e.target.closest('[data-action]');
      if (!t) return;
      var act = t.getAttribute('data-action');
      if (act === 'save-strategy') doSaveStrategy();
      else if (act === 'calc')     doCalculate();
      else if (act === 'bea-import') {
        var inp = _container.querySelector('input[data-bea="csv-input"]');
        if (inp) inp.click();
      }
      else if (act === 'bea-reset') {
        if (confirm('Remove the imported Ibovespa composition and use the embedded snapshot?')) {
          clearStoredIbov();
          renderPage();
        }
      }
    });

    // CSV file input handler
    var csvInp = _container.querySelector('input[data-bea="csv-input"]');
    if (csvInp) {
      csvInp.addEventListener('change', function (e) {
        var file = csvInp.files && csvInp.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function (ev) {
          try {
            var buf = ev.target.result;
            var text;
            if (buf instanceof ArrayBuffer && typeof TextDecoder !== 'undefined') {
              try { text = new TextDecoder('iso-8859-1', { fatal: false }).decode(buf); }
              catch (e1) {
                // Older browsers may not know 'iso-8859-1' — fall back to manual byte mapping
                var bytes = new Uint8Array(buf), s = '';
                for (var k = 0; k < bytes.length; k++) s += String.fromCharCode(bytes[k]);
                text = s;
              }
            } else {
              text = String(buf || '');
            }
            console.log('[Nexo BEA] CSV read,', text.length, 'chars, first 80:', text.slice(0,80));
            var parsed = parseB3IbovCSV(text);
            console.log('[Nexo BEA] parsed', parsed.stocks.length, 'stocks');
            saveStoredIbov(parsed);
            renderPage();
            var msg = _container.querySelector('#nxni-bea-msg');
            if (msg) { msg.textContent = '✓ Imported ' + parsed.stocks.length + ' stocks (Carteira ' + (parsed.compositionDate || '') + ').'; msg.className = 'nxni-bea-source-msg ok'; }
          } catch (err) {
            var msg2 = _container.querySelector('#nxni-bea-msg');
            if (msg2) { msg2.textContent = '✗ ' + (err && err.message ? err.message : 'Failed to parse the CSV.'); msg2.className = 'nxni-bea-source-msg err'; }
            else alert('Failed to parse CSV: ' + (err && err.message ? err.message : err));
          }
          csvInp.value = ''; // allow re-upload of same file
        };
        reader.onerror = function () {
          var msg3 = _container.querySelector('#nxni-bea-msg');
          if (msg3) { msg3.textContent = '✗ Could not read the file.'; msg3.className = 'nxni-bea-source-msg err'; }
        };
        // B3 ships the CSV as ISO-8859-1. Use ArrayBuffer + TextDecoder for reliable
        // cross-browser decoding (readAsText's encoding parameter is poorly supported).
        reader.readAsArrayBuffer(file);
      });
    }
    // BEA controls — skip file inputs (handled separately)
    Array.from(_container.querySelectorAll('[data-bea]')).forEach(function (el) {
      if (el.type === 'file') return;
      var key = el.getAttribute('data-bea');
      var evt = el.type === 'checkbox' ? 'change' : 'input';
      el.addEventListener(evt, function () {
        var v;
        if (el.type === 'checkbox') v = el.checked;
        else { v = parseFloat(el.value); if (isNaN(v)) v = 0; }
        state.beaSettings[key] = v;
        saveBEASettings(state.beaSettings);
        renderPage();
      });
    });
    Array.from(_container.querySelectorAll('select[data-region-for]')).forEach(function (sel) {
      sel.addEventListener('change', function () {
        var id = sel.getAttribute('data-region-for');
        var v = sel.value;
        if (!isValidRegion(v)) return;
        var map = loadRegionMap();
        map[id] = v;
        saveRegionMap(map);
        renderPage();
      });
    });
  }

  function doSaveStrategy() {
    var sum = BUCKET_KEYS.reduce(function (a, k) { return a + (+state.strategy[k] || 0); }, 0);
    if (Math.abs(sum - 100) >= 0.01) return;
    saveStrategy(state.strategy);
    state.dirtyStrategy = false;
    var msg = _container.querySelector('#nxni-saved-msg');
    if (msg) {
      msg.classList.add('show');
      setTimeout(function () { msg.classList.remove('show'); }, 1800);
    }
    renderPage();
  }

  function doCalculate() {
    var amtEl = _container.querySelector('#nxni-amount');
    var v = amtEl ? parseBR(amtEl.value) : 0;
    state.amount = v;
    state.showResult = v > 0;
    localStorage.setItem(LAST_AMT_KEY, String(v));
    syncNiToGistDebounced();
    renderPage();
    var res = _container.querySelector('.nxni-result');
    if (res) res.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  /* Nexo 4.0: aba registrada no roteador síncrono — sem observers/timeouts. */
  function refreshStateAndRender() {
    state.strategy    = loadStrategy();
    state.amount      = parseFloat(localStorage.getItem(LAST_AMT_KEY) || '0') || 0;
    state.showResult  = state.amount > 0;
    state.beaSettings = loadBEASettings();
    if (_mounted) renderPage();
  }
  Nexo.registerTab('new_investments', function () {
    return {
      mount(section) {
        injectCSS();
        _container = document.createElement('div');
        _container.id = 'nx-ni-root';
        section.appendChild(_container);
        _mounted = true;
        refreshStateAndRender(); // pinta já com dados locais
        loadNiFromGist().finally(refreshStateAndRender);
      },
      show() {
        refreshStateAndRender();
        loadNiFromGist().finally(refreshStateAndRender);
      },
    };
  });
})();

</script>
<script>
/* ═══ mobile.js ═══ */

/* ── Nexo 3.0.0 — Mobile Header + Tab Bar ───────────────────────────────── */
(function () {
  'use strict';

  var s = document.createElement('style');
  s.textContent =
    /* Header laranja (52px) */
    '#nm-header{display:none;position:fixed;top:0;left:0;right:0;height:52px;' +
    'background:var(--accent,#E07A5F);z-index:1001;align-items:center;' +
    'flex-direction:row;padding:0 16px;box-shadow:0 2px 10px rgba(0,0,0,.18);}' +
    '#nm-header .nm-title{font-family:"Fraunces",serif;font-size:22px;' +
    'font-weight:700;color:#fff;letter-spacing:-.4px;}' +

    /* Barra de tabs (44px) logo abaixo do header */
    '#nm-tabs{display:none;position:fixed;top:52px;left:0;right:0;height:44px;' +
    'background:var(--surface,#fff);border-bottom:1px solid var(--border,#e5e7eb);' +
    'z-index:1000;overflow-x:auto;overflow-y:hidden;white-space:nowrap;' +
    '-webkit-overflow-scrolling:touch;scrollbar-width:none;}' +
    '#nm-tabs::-webkit-scrollbar{display:none;}' +
    '#nm-tabs .nm-tab{display:inline-flex;align-items:center;height:44px;' +
    'padding:0 15px;font-size:13px;font-weight:500;white-space:nowrap;' +
    'color:var(--text-secondary,#6b7280);background:none;border:none;' +
    'border-bottom:2px solid transparent;cursor:pointer;font-family:inherit;' +
    'transition:color .15s,border-color .15s;}' +
    '#nm-tabs .nm-tab.active{color:var(--accent,#E07A5F);' +
    'border-bottom-color:var(--accent,#E07A5F);font-weight:600;}' +

    '@media(max-width:900px){#nm-header{display:flex;}#nm-tabs{display:block;}}';
  document.head.appendChild(s);

  /* Elementos fixos */
  var header = document.createElement('header');
  header.id = 'nm-header';
  header.innerHTML = '<span class="nm-title">Nexo</span>';

  var tabBar = document.createElement('nav');
  tabBar.id = 'nm-tabs';

  document.body.appendChild(header);
  document.body.appendChild(tabBar);

  /* Centraliza a tab ativa na barra */
  function scrollToActive() {
    var active = tabBar.querySelector('.nm-tab.active');
    if (!active) return;
    var offset = active.offsetLeft - (tabBar.clientWidth / 2) + (active.offsetWidth / 2);
    tabBar.scrollTo({ left: Math.max(0, offset), behavior: 'smooth' });
  }

  /* Sincroniza classe active sem reconstruir o DOM */
  function syncTabs() {
    var btns = document.querySelectorAll('.sidebar button.nav-item');
    var tabs = tabBar.querySelectorAll('.nm-tab');
    btns.forEach(function(b, i) {
      if (tabs[i]) tabs[i].classList.toggle('active', b.classList.contains('active'));
    });
    scrollToActive();
  }

  /* Constrói as tabs a partir dos nav-items da sidebar */
  var _builtCount = 0;

  function buildTabs() {
    var btns = document.querySelectorAll('.sidebar button.nav-item');
    if (!btns.length) return false;
    if (btns.length === _builtCount) { syncTabs(); return true; }

    _mo.disconnect();
    tabBar.innerHTML = '';
    btns.forEach(function(sb) {
      var tab = document.createElement('button');
      tab.className = 'nm-tab' + (sb.classList.contains('active') ? ' active' : '');
      var lbl = '';
      sb.childNodes.forEach(function(n) { if (n.nodeType === 3) lbl += n.textContent.trim(); });
      tab.textContent = lbl;
      (function(src) {
        tab.addEventListener('click', function() { src.click(); });
      })(sb);
      tabBar.appendChild(tab);
    });
    _builtCount = btns.length;
    scrollToActive();
    _mo.observe(document.body, { subtree: true, attributes: true, attributeFilter: ['class'] });
    return true;
  }

  /* Observer só para sincronizar o active */
  var _mo = new MutationObserver(function() { if (_builtCount) syncTabs(); });
  _mo.observe(document.body, { subtree: true, attributes: true, attributeFilter: ['class'] });

  /* Aguarda o React renderizar a sidebar */
  var _n = 0;
  var _iv = setInterval(function() { if (buildTabs() || ++_n > 60) clearInterval(_iv); }, 200);
})();
  
</script>
<script>
/* ═══ backup-restore.js ═══ */

/* ── Nexo 3.8 — Backup / Restore + monthly reminder ──────────────────────
   • Backup card lives inside the "Options" page.
   • Backup: downloads a .json with everything (synced Gist data + nexo_*
     local keys), excluding the GitHub token (security).
   • Restore: reads that .json back, rewrites the Gist and localStorage, reloads.
   • Reminder: once a month has closed, a pop-up suggests a backup on app open.
     It keeps showing every time the app opens UNTIL a backup is actually made.
     The "backup done" mark is stored in the Gist (meta.lastBackup), so doing
     the backup on one device stops the reminder on every device.
──────────────────────────────────────────────────────────────────────────── */
(function () {
  'use strict';

  var TOKEN_KEYS = { 'nexo_github_sync_config': 1, 'nexo_github_sync_sha': 1 };
  var LOCAL_PERIOD_KEY = 'nexo_last_backup_period'; // fallback offline

  /* ── styles (modal/toast + card buttons spacing) ── */
  var s = document.createElement('style');
  s.textContent =
    '#nx-backup-card .nx-bk-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}' +
    '#nx-backup-card .nx-bk-note{font-size:12px;color:var(--text-secondary,#6b7280);margin-top:10px;line-height:1.45;}' +
    '.nx-bk-overlay{position:fixed;inset:0;z-index:2147483647;background:rgba(17,24,39,.45);' +
    'display:flex;align-items:center;justify-content:center;padding:20px;' +
    'font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;}' +
    '.nx-bk-card{background:#fff;border-radius:16px;max-width:420px;width:100%;padding:24px;' +
    'box-shadow:0 20px 60px rgba(0,0,0,.3);color:#1f2937;}' +
    '.nx-bk-card h3{margin:0 0 8px;font-size:18px;font-weight:700;}' +
    '.nx-bk-card p{margin:0 0 18px;font-size:14px;line-height:1.5;color:#4b5563;}' +
    '.nx-bk-card .nx-bk-row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;}' +
    '.nx-bk-card button{border-radius:10px;padding:10px 16px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid transparent;}' +
    '.nx-bk-card .nx-bk-primary{background:#E07A5F;color:#fff;}' +
    '.nx-bk-card .nx-bk-primary:hover{filter:brightness(1.07);}' +
    '.nx-bk-card .nx-bk-ghost{background:#fff;border-color:#e5e7eb;color:#4b5563;}' +
    '.nx-bk-card .nx-bk-ghost:hover{background:#f9fafb;}' +
    '#nx-bk-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:2147483647;' +
    'max-width:90%;background:#1f2937;color:#fff;border-radius:12px;padding:12px 18px;font-size:13px;' +
    'box-shadow:0 8px 24px rgba(0,0,0,.25);font-family:Inter,system-ui,sans-serif;display:none;}' +
    '#nx-bk-toast.err{background:#7f1d1d;}';
  document.head.appendChild(s);

  function toast(msg, isErr) {
    var el = document.getElementById('nx-bk-toast');
    if (!el) { el = document.createElement('div'); el.id = 'nx-bk-toast'; document.body.appendChild(el); }
    el.className = isErr ? 'err' : '';
    el.textContent = msg; el.style.display = '';
    clearTimeout(el._t); el._t = setTimeout(function () { el.style.display = 'none'; }, 6000);
  }

  function pad2(n) { return String(n).padStart(2, '0'); }
  function todayStr() { var d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }

  /* Period to back up: if today is the last day of the month → current month;
     otherwise → the month that just closed. Format "YYYY-MM". */
  function periodToBackup(d) {
    d = d || new Date();
    var y = d.getFullYear(), m = d.getMonth();
    var isLastDay = new Date(y, m, d.getDate() + 1).getMonth() !== m;
    if (!isLastDay) { m -= 1; if (m < 0) { m = 11; y -= 1; } }
    return y + '-' + pad2(m + 1);
  }
  var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  function monthLabel(period) { var p = String(period).split('-'); return (MONTHS[parseInt(p[1], 10) - 1] || '') + ' ' + p[0]; }

  /* ── data gathering ── */
  function collectLocal() {
    var out = {};
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (!k || k.indexOf('nexo') !== 0) continue;
        if (TOKEN_KEYS[k]) continue; // never export the token
        out[k] = localStorage.getItem(k);
      }
    } catch (e) {}
    return out;
  }
  function getGist() {
    return fetch('/api/sync/data', { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .catch(function () { return null; });
  }
  function gatherBackup() {
    return getGist().then(function (gist) {
      return {
        format: 'nexo-backup', version: 1, exportedAt: new Date().toISOString(),
        gistAvailable: !!(gist && gist.payload), gist: gist || null, localStorage: collectLocal()
      };
    });
  }

  /* Records that a backup was made for the current period, in the Gist
     (cross-device) and in localStorage (offline fallback). */
  function recordBackupDone() {
    var period = periodToBackup(new Date());
    try { localStorage.setItem(LOCAL_PERIOD_KEY, period); } catch (e) {}
    return getGist().then(function (gist) {
      var payload = gist && gist.payload;
      if (!payload) return;
      if (!payload.meta) payload.meta = {};
      payload.meta.lastBackup = { period: period, at: new Date().toISOString() };
      return fetch('/api/sync/data', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    }).catch(function () {});
  }

  function exportBackup() {
    return gatherBackup().then(function (backup) {
      var blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = 'nexo-backup-' + todayStr() + '.json';
      document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1000);
      if (!backup.gistAvailable) toast('Backup saved (local data only — Gist unavailable; set your token for a full backup).', true);
      else toast('✓ Backup downloaded.');
      return recordBackupDone();
    });
  }

  /* ── restore ── */
  function restoreFromFile(file) {
    var r = new FileReader();
    r.onload = function () {
      var backup;
      try { backup = JSON.parse(r.result); }
      catch (e) { toast('Invalid file: not valid JSON.', true); return; }
      if (!backup || backup.format !== 'nexo-backup') { toast('Unrecognized file (expected a Nexo backup).', true); return; }
      var when = backup.exportedAt ? new Date(backup.exportedAt).toLocaleString() : 'unknown date';
      if (!confirm('Restore the backup from ' + when + '?\n\nThis will REPLACE your current data (expenses, income, investments, etc.). The app will reload.')) return;
      try {
        var ls = backup.localStorage || {};
        Object.keys(ls).forEach(function (k) {
          if (TOKEN_KEYS[k] || k.indexOf('nexo') !== 0) return;
          localStorage.setItem(k, ls[k]);
        });
      } catch (e) {}
      var payload = backup.gist && backup.gist.payload;
      if (payload) {
        fetch('/api/sync/data', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) })
          .then(function (resp) {
            if (!resp.ok) throw new Error('Failed to write to the Gist (token?).');
            toast('✓ Backup restored. Reloading…'); setTimeout(function () { location.reload(); }, 1500);
          })
          .catch(function (e) { toast('Local data restored, but the Gist write failed: ' + (e.message || e), true); });
      } else {
        toast('Backup has no Gist data; restored local data only. Reloading…');
        setTimeout(function () { location.reload(); }, 1500);
      }
    };
    r.onerror = function () { toast('Could not read the file.', true); };
    r.readAsText(file);
  }

  /* ── Options page card ── */
  function onOptionsPage() {
    return !!(window.Nexo && Nexo.router && Nexo.router.current === 'options');
  }
  var _fileInput = null;
  function ensureFileInput() {
    if (_fileInput) return _fileInput;
    _fileInput = document.createElement('input');
    _fileInput.type = 'file'; _fileInput.accept = '.json,application/json'; _fileInput.style.display = 'none';
    _fileInput.addEventListener('change', function () { var f = _fileInput.files && _fileInput.files[0]; _fileInput.value = ''; if (f) restoreFromFile(f); });
    document.body.appendChild(_fileInput);
    return _fileInput;
  }
  function injectCard() {
    if (document.getElementById('nx-backup-card')) return;
    var parent = document.getElementById('nx4-backup-slot');
    if (!parent) return;
    var card = document.createElement('div');
    card.className = 'card';
    card.id = 'nx-backup-card';
    card.innerHTML =
      '<div class="card-header"><span class="card-title">Backup &amp; Restore</span></div>' +
      '<div style="color:var(--text-secondary,#6b7280);font-size:14px;margin-bottom:4px;">' +
      'Download a single file with all your data (expenses, income, investments, budgets and settings), or restore from one.</div>' +
      '<div class="nx-bk-actions">' +
        '<button type="button" class="btn btn-primary" data-act="export">⬇ Download backup</button>' +
        '<button type="button" class="btn btn-outline" data-act="restore">⬆ Restore from file</button>' +
      '</div>' +
      '<div class="nx-bk-note">The GitHub token is never included in the backup file. Restoring replaces your current data and reloads the app.</div>';
    parent.appendChild(card);
    card.querySelector('[data-act="export"]').addEventListener('click', function () { exportBackup(); });
    card.querySelector('[data-act="restore"]').addEventListener('click', function () { ensureFileInput().click(); });
  }

  /* ── monthly reminder (gated by an actual backup, read from the Gist) ── */
  function getDonePeriod() {
    return getGist().then(function (gist) {
      var lb = gist && gist.payload && gist.payload.meta && gist.payload.meta.lastBackup;
      if (lb && lb.period) return lb.period;
      try { return localStorage.getItem(LOCAL_PERIOD_KEY) || ''; } catch (e) { return ''; }
    }).catch(function () {
      try { return localStorage.getItem(LOCAL_PERIOD_KEY) || ''; } catch (e) { return ''; }
    });
  }
  function showReminder(period) {
    if (document.querySelector('.nx-bk-overlay')) return;
    var overlay = document.createElement('div'); overlay.className = 'nx-bk-overlay';
    overlay.innerHTML =
      '<div class="nx-bk-card" role="dialog" aria-modal="true">' +
        '<h3>🛟 Time for your monthly backup</h3>' +
        '<p><strong>' + monthLabel(period) + '</strong> has ended. Download a backup of your data (expenses, income, investments and settings) to keep it safe?</p>' +
        '<div class="nx-bk-row">' +
          '<button type="button" class="nx-bk-ghost" data-act="later">Not now</button>' +
          '<button type="button" class="nx-bk-primary" data-act="now">Download backup now</button>' +
        '</div>' +
      '</div>';
    // "Not now" does NOT mark as done → it will show again next time the app opens.
    overlay.querySelector('[data-act="later"]').addEventListener('click', function () { overlay.remove(); });
    overlay.querySelector('[data-act="now"]').addEventListener('click', function () { overlay.remove(); exportBackup(); });
    document.body.appendChild(overlay);
  }
  function maybeRemind() {
    var period = periodToBackup(new Date());
    getDonePeriod().then(function (done) { if (done !== period) showReminder(period); });
  }

  // Mostra o card só na página Options; remove ao sair (evita aparecer em
  // todas as abas, já que o nó vive fora da árvore reconciliada pelo React).
  function reconcileCard() { if (onOptionsPage()) injectCard(); }

  /* ── boot (Nexo 4.0: ancorado no roteador; o card vive dentro da section
     Options, que o roteador esconde/mostra — sem observers) ── */
  function boot() {
    document.addEventListener('nexo:tab', function (e) {
      if (e.detail && e.detail.id === 'options') injectCard();
    });
    reconcileCard();
    setTimeout(maybeRemind, 1400);
  }
  try { window.__nxBackup = { gatherBackup: gatherBackup, periodToBackup: periodToBackup, exportBackup: exportBackup, restoreFromFile: restoreFromFile, maybeRemind: maybeRemind, recordBackupDone: recordBackupDone, getDonePeriod: getDonePeriod, injectCard: injectCard, reconcileCard: reconcileCard }; } catch (e) {}
  boot();
})();
  
</script>
  </body>
</html>
