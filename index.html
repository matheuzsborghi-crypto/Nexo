 solid var(--border,#e5e7eb);border-radius:10px;padding:14px 20px;margin-bottom:16px;box-shadow:var(--shadow-sm,0 1px 3px rgba(0,0,0,.06));}\n#nx-total .nx-t-label{font-size:13px;font-weight:600;color:var(--text-secondary,#6b7280);text-transform:uppercase;letter-spacing:.5px;}\n#nx-total .nx-t-right{display:flex;flex-direction:column;align-items:flex-end;gap:2px;}\n#nx-total .nx-t-val{font-size:20px;font-weight:700;color:var(--accent,#E07A5F);letter-spacing:-.4px;}\n#nx-total .nx-t-count{font-size:12px;color:var(--text-secondary,#6b7280);}\n\n    <\/style>\n  <\/head>\n  <body>\n    <div class=\"app\">\n      <nav class=\"sidebar\"><\/nav>\n      <main class=\"main\"><\/main>\n    <\/div>\n<script>\n/* ═══ gist-sync.js ═══ */\n\n(() => {\n  const CONFIG_KEY = \"nexo_github_sync_config\";\n  const SHA_KEY = \"nexo_github_sync_sha\";\n  const originalFetch = window.fetch.bind(window);\n\n  function loadConfig() {\n    try { return JSON.parse(localStorage.getItem(CONFIG_KEY) || \"null\"); } catch { return null; }\n  }\n\n  function saveConfig(config) {\n    localStorage.setItem(CONFIG_KEY, JSON.stringify(config));\n  }\n\n  function encodeUtf8Base64(text) {\n    const bytes = new TextEncoder().encode(text);\n    let binary = \"\";\n    bytes.forEach((byte) => { binary += String.fromCharCode(byte); });\n    return btoa(binary);\n  }\n\n  function decodeUtf8Base64(base64) {\n    const binary = atob(String(base64 || \"\").replace(/\\n/g, \"\"));\n    const bytes = Uint8Array.from(binary, (char) => char.charCodeAt(0));\n    return new TextDecoder().decode(bytes);\n  }\n\n  const GIST_DESCRIPTION = \"Nexo HTML Sync Database\";\n  const GIST_FILE_NAME = \"data-nexo.json\";\n\n  async function githubRequest(config, url, options = {}) {\n    const headers = {\n      Accept: \"application/vnd.github+json\",\n      \"X-GitHub-Api-Version\": \"2022-11-28\",\n      ...(options.headers || {}),\n    };\n    if (config.token) headers.Authorization = `Bearer ${config.token}`;\n    return originalFetch(url, { ...options, headers });\n  }\n\n  async function findNexoGist(config) {\n    const cachedId = localStorage.getItem(SHA_KEY) || \"\";\n    if (cachedId) {\n      const cached = await githubRequest(config, `https://api.github.com/gists/${cachedId}`, { cache: \"no-store\" });\n      if (cached.ok) return cached.json();\n      localStorage.removeItem(SHA_KEY);\n    }\n\n    const response = await githubRequest(config, \"https://api.github.com/gists?per_page=100\", { cache: \"no-store\" });\n    if (!response.ok) throw new Error(`GitHub Gist search failed (${response.status})`);\n    const gists = await response.json();\n    const gist = Array.isArray(gists)\n      ? gists.find((item) => item.description === GIST_DESCRIPTION && item.files && item.files[GIST_FILE_NAME])\n      : null;\n    if (gist?.id) {\n      localStorage.setItem(SHA_KEY, gist.id);\n      const full = await githubRequest(config, `https://api.github.com/gists/${gist.id}`, { cache: \"no-store\" });\n      if (!full.ok) throw new Error(`GitHub Gist read failed (${full.status})`);\n      return full.json();\n    }\n    return null;\n  }\n\n  async function readGistPayload(config) {\n    const gist = await findNexoGist(config);\n    if (!gist) return { exists: false, fileName: GIST_FILE_NAME, payload: null };\n    const file = gist.files?.[GIST_FILE_NAME];\n    if (!file) return { exists: false, fileName: GIST_FILE_NAME, payload: null };\n    let text = file.content || \"\";\n    if (file.truncated && file.raw_url) {\n      const raw = await githubRequest(config, file.raw_url, { cache: \"no-store\" });\n      if (!raw.ok) throw new Error(`GitHub Gist raw read failed (${raw.status})`);\n      text = await raw.text();\n    }\n    const payload = text.trim() ? JSON.parse(text) : null;\n    return { exists: true, fileName: GIST_FILE_NAME, payload };\n  }\n\n  async function writeGistPayload(config, payload) {\n    const content = JSON.stringify(payload, null, 2);\n    const gist = await findNexoGist(config);\n    const body = {\n      description: GIST_DESCRIPTION,\n      public: false,\n      files: { [GIST_FILE_NAME]: { content } },\n    };\n    const url = gist?.id ? `https://api.github.com/gists/${gist.id}` : \"https://api.github.com/gists\";\n    const response = await githubRequest(config, url, {\n      method: gist?.id ? \"PATCH\" : \"POST\",\n      headers: { \"Content-Type\": \"application/json\" },\n      body: JSON.stringify(body),\n    });\n    if (!response.ok) {\n      const details = await response.text().catch(() => \"\");\n      throw new Error(`GitHub Gist write failed (${response.status}) ${details}`);\n    }\n    const data = await response.json();\n    if (data?.id) localStorage.setItem(SHA_KEY, data.id);\n    return { ok: true, fileName: GIST_FILE_NAME };\n  }\n  function jsonResponse(body, status = 200) {\n    return new Response(JSON.stringify(body), {\n      status,\n      headers: { \"Content-Type\": \"application/json; charset=utf-8\" },\n    });\n  }\n\n  // ── Migração de categorias: \"delivery\" foi fundido em \"restaurants\"\n  //    (rótulo \"Food & Beverages\"). Remapeia tanto na leitura quanto na\n  //    escrita do Gist, de forma idempotente, para não deixar lançamentos\n  //    antigos órfãos. Roda no carregamento e persiste no próximo save.\n  function nexoMigrateCategories(data) {\n    if (!data || typeof data !== \"object\") return;\n    if (Array.isArray(data.expenses)) {\n      data.expenses.forEach((e) => { if (e && e.category === \"delivery\") e.category = \"restaurants\"; });\n    }\n    if (data.budgets && typeof data.budgets === \"object\" && data.budgets.delivery != null) {\n      const dv = Number(data.budgets.delivery) || 0;\n      data.budgets.restaurants = (Number(data.budgets.restaurants) || 0) + dv;\n      delete data.budgets.delivery;\n    }\n    if (Array.isArray(data.customCategories)) {\n      data.customCategories = data.customCategories.filter((c) => !(c && c.id === \"delivery\"));\n    }\n  }\n\n  // Preserva meta.lastBackup (marca de \"backup feito\", usada pelo lembrete e\n  // compartilhada via Gist entre dispositivos). Os saves normais do app\n  // reconstroem o meta e apagariam esse campo — então recapturamos na leitura\n  // e re-injetamos em toda escrita.\n  var nexoLastBackup = null;\n  function nexoCaptureBackup(payload) {\n    if (payload && payload.meta && payload.meta.lastBackup) nexoLastBackup = payload.meta.lastBackup;\n  }\n  function nexoInjectBackup(payload) {\n    if (!payload) return;\n    if (payload.meta && payload.meta.lastBackup) { nexoLastBackup = payload.meta.lastBackup; return; }\n    if (nexoLastBackup) { if (!payload.meta) payload.meta = {}; payload.meta.lastBackup = nexoLastBackup; }\n  }\n\n  window.fetch = async (input, init = {}) => {\n    const url = typeof input === \"string\" ? input : input?.url;\n    const method = String(init?.method || input?.method || \"GET\").toUpperCase();\n    if (url === \"/api/sync/status\") {\n      const config = loadConfig();\n      if (!config?.token) return jsonResponse({ available: false, mode: \"gist\", exists: false }, 503);\n      return jsonResponse({ available: true, mode: \"gist\", fileName: GIST_FILE_NAME, exists: true });\n    }\n    if (url === \"/api/sync/data\") {\n      const config = loadConfig();\n      if (!config?.token) return jsonResponse({ error: \"GitHub Gist sync is not configured\" }, 503);\n      try {\n        if (method === \"GET\") {\n          const result = await readGistPayload(config);\n          if (result && result.payload && result.payload.data) nexoMigrateCategories(result.payload.data);\n          if (result && result.payload) nexoCaptureBackup(result.payload);\n          return jsonResponse(result);\n        }\n        if (method === \"PUT\") {\n          const incoming = JSON.parse(init.body || \"null\");\n          if (incoming && incoming.data) nexoMigrateCategories(incoming.data);\n          nexoInjectBackup(incoming);\n          return jsonResponse(await writeGistPayload(config, incoming));\n        }\n        return jsonResponse({ error: \"Method Not Allowed\" }, 405);\n      } catch (error) {\n        console.error(error);\n        return jsonResponse({ error: String(error?.message || error) }, 500);\n      }\n    }\n    return originalFetch(input, init);\n  };\n\n  function mountPanel() {\n    if (document.getElementById(\"nexo-github-panel\")) return;\n    const panel = document.createElement(\"div\");\n    panel.id = \"nexo-github-panel\";\n    panel.innerHTML = `\n      <button type=\"button\" class=\"nexo-gh-toggle\" title=\"GitHub sync\">GitHub<\/button>\n      <form class=\"nexo-gh-form\" hidden>\n        <strong>GitHub Gist sync<\/strong>\n        <input name=\"token\" type=\"password\" placeholder=\"GitHub token with Gist access\" autocomplete=\"off\" />\n        <div class=\"nexo-gh-actions\">\n          <button type=\"submit\">Save<\/button>\n          <button type=\"button\" data-clear>Clear<\/button>\n        <\/div>\n        <button type=\"button\" class=\"nexo-gh-import\" data-import>Import JSON to Gist<\/button>\n        <button type=\"button\" class=\"nexo-gh-import\" data-reveal-token>Reveal Token<\/button>\n        <input type=\"file\" data-import-file accept=\".json,application/json\" hidden />\n        <small>Nexo will create or reuse a secret Gist named Nexo HTML Sync Database.<\/small>\n      <\/form>`;\n    document.body.appendChild(panel);\n    const form = panel.querySelector(\"form\");\n    const config = loadConfig() || {};\n    form.elements.token.value = config.token || \"\";\n    panel.querySelector(\".nexo-gh-toggle\").addEventListener(\"click\", () => { form.hidden = !form.hidden; });\n    panel.querySelector(\"[data-clear]\").addEventListener(\"click\", () => {\n      localStorage.removeItem(CONFIG_KEY);\n      localStorage.removeItem(SHA_KEY);\n      alert(\"GitHub sync settings cleared. Reloading Nexo.\");\n      location.reload();\n    });\n    const importInput = panel.querySelector(\"[data-import-file]\");\n    panel.querySelector(\"[data-reveal-token]\").addEventListener(\"click\", async () => {\n      const typedToken = form.elements.token.value.trim();\n      if (typedToken) saveConfig({ token: typedToken });\n      const savedToken = loadConfig()?.token || \"\";\n      if (!savedToken) {\n        alert(\"No GitHub token is saved in this browser yet.\");\n        return;\n      }\n      const shouldReveal = confirm(\"Reveal your saved GitHub token? Only do this on a device you trust.\");\n      if (!shouldReveal) return;\n      try { await navigator.clipboard?.writeText(savedToken); } catch {}\n      prompt(\"Saved GitHub token. It was copied if your browser allowed it:\", savedToken);\n    });\n    panel.querySelector(\"[data-import]\").addEventListener(\"click\", () => {\n      const typedToken = form.elements.token.value.trim();\n      if (typedToken) saveConfig({ token: typedToken });\n      const configForImport = loadConfig();\n      if (!configForImport?.token) {\n        alert(\"Save your GitHub Gist token before importing the old Nexo JSON file.\");\n        return;\n      }\n      importInput.click();\n    });\n    importInput.addEventListener(\"change\", async () => {\n      const file = importInput.files?.[0];\n      importInput.value = \"\";\n      if (!file) return;\n      try {\n        const text = await file.text();\n        const payload = JSON.parse(text);\n        if (!payload || typeof payload !== \"object\" || !payload.data) {\n          alert(\"This does not look like a Nexo sync JSON file.\");\n          return;\n        }\n        await writeGistPayload(loadConfig(), payload);\n        alert(\"Old Nexo data imported to GitHub Gist. Nexo will reload and pull it now.\");\n        location.reload();\n      } catch (error) {\n        console.error(error);\n        alert(`Could not import JSON: ${error?.message || error}`);\n      }\n    });\n    form.addEventListener(\"submit\", (event) => {\n      event.preventDefault();\n      saveConfig({ token: form.elements.token.value.trim() });\n      alert(\"GitHub sync settings saved. Nexo will reload now.\");\n      location.reload();\n    });\n  }\n\n  function mountAboutTutorial() {\n    const existingCard = document.getElementById(\"nexo-github-tutorial\");\n    const title = Array.from(document.querySelectorAll(\".page-title\")).find((node) => node.textContent.trim() === \"Options\");\n    if (!title) {\n      existingCard?.remove();\n      return;\n    }\n    const main = title.closest(\"main\") || document.querySelector(\"main\");\n    if (!main) return;\n    let card = document.getElementById(\"nexo-github-tutorial\");\n    if (!card) {\n      card = document.createElement(\"div\");\n      card.id = \"nexo-github-tutorial\";\n      card.className = \"card nexo-gh-tutorial\";\n      card.innerHTML = `\n      <div class=\"nexo-gh-tutorial-head\">\n        <div>\n          <h2>Information Syncronize Setup<\/h2>\n          <p>Create one GitHub token so this HTML can store your Nexo information.<\/p>\n        <\/div>\n        <button type=\"button\" class=\"btn btn-outline nexo-gh-open-panel\">Open GitHub Panel<\/button>\n      <\/div>\n      <div class=\"nexo-gh-stepbox\">\n        <h3>Step by step<\/h3>\n        <ol>\n          <li>Create or sign in to your GitHub account at <a href=\"https://github.com/signup\" target=\"_blank\" rel=\"noreferrer\">github.com/signup<\/a>.<\/li>\n          <li>Open <a href=\"https://github.com/settings/tokens\" target=\"_blank\" rel=\"noreferrer\">github.com/settings/tokens<\/a>.<\/li>\n          <li>Click <strong>Generate new token<\/strong>, then choose <strong>Generate new token (classic)<\/strong>.<\/li>\n          <li>In <strong>Note<\/strong>, write something like <strong>Personal Finance<\/strong>.<\/li>\n          <li>In <strong>Expiration<\/strong>, choose <strong>No expiration<\/strong>.<\/li>\n          <li>In <strong>Select scopes<\/strong>, mark only <strong>gist<\/strong>.<\/li>\n          <li>Click <strong>Generate token<\/strong> and copy the token immediately. GitHub shows it only once.<\/li>\n          <li>Return to Nexo, click the floating <strong>GitHub<\/strong> button, paste the token, and save.<\/li>\n        <\/ol>\n      <\/div>`;\n    }\n    const directCards = Array.from(main.children).filter((child) => child.classList?.contains(\"card\") && child.id !== \"nexo-github-tutorial\");\n    const anchor = directCards.find((child) => child.querySelector(\".card-title\")?.textContent.trim() === \"Sync File\") || directCards[0];\n    if (anchor && card.previousElementSibling !== anchor) anchor.after(card);\n    else if (!anchor && card.parentElement !== main) main.appendChild(card);\n    const openButton = card.querySelector(\".nexo-gh-open-panel\");\n    openButton?.addEventListener(\"click\", () => {\n      const form = document.querySelector(\"#nexo-github-panel .nexo-gh-form\");\n      if (form) form.hidden = false;\n    });\n  }\n\n\n  function cleanOptionsSyncPanel() {\n    const title = Array.from(document.querySelectorAll(\".page-title\")).find((node) => node.textContent.trim() === \"Options\");\n    if (!title) return;\n    const main = title.closest(\"main\") || document.querySelector(\"main\");\n    if (!main) return;\n\n    Array.from(main.querySelectorAll(\".card-title\")).forEach((node) => {\n      if (node.textContent.trim() === \"Launcher Shortcut File\") {\n        const card = node.closest(\".card\");\n        if (card) card.style.display = \"none\";\n      }\n    });\n\n    Array.from(main.querySelectorAll(\".card\")).forEach((card) => {\n      const titleNode = card.querySelector(\".card-title\");\n      if (titleNode?.textContent.trim() !== \"Sync File\") return;\n      Array.from(card.querySelectorAll(\"div\")).forEach((node) => {\n        if (/^File:\\s*/.test(node.textContent.trim())) node.style.display = \"none\";\n      });\n    });\n  }\n  function watchAboutTutorial() {\n    mountAboutTutorial();\n    cleanOptionsSyncPanel();\n    const observer = new MutationObserver(() => { mountAboutTutorial(); cleanOptionsSyncPanel(); });\n    observer.observe(document.body, { childList: true, subtree: true });\n  }\n  const style = document.createElement(\"style\");\n  style.textContent = `\n    #nexo-github-panel{position:fixed;right:14px;bottom:14px;z-index:2147483647;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#1f2937}\n    .nexo-gh-toggle{border:0;border-radius:8px;background:#111827;color:#fff;padding:9px 12px;font-weight:700;box-shadow:0 10px 24px rgba(15,23,42,.22);cursor:pointer}\n    .nexo-gh-form{position:absolute;right:0;bottom:44px;width:280px;padding:12px;border:1px solid #d7dde8;border-radius:8px;background:#fff;box-shadow:0 18px 42px rgba(15,23,42,.20)}\n    .nexo-gh-form strong{display:block;font-size:13px;margin-bottom:8px}.nexo-gh-form input{width:100%;box-sizing:border-box;margin:4px 0;padding:8px;border:1px solid #cbd5e1;border-radius:6px;font-size:12px}.nexo-gh-actions{display:flex;gap:8px;margin-top:8px}.nexo-gh-actions button{flex:1;border:0;border-radius:6px;padding:8px;font-weight:700;cursor:pointer}.nexo-gh-actions button:first-child{background:#2563eb;color:#fff}.nexo-gh-actions button:last-child{background:#e5e7eb;color:#111827}.nexo-gh-import{width:100%;margin-top:8px;border:1px solid #cbd5e1;border-radius:6px;background:#fff;color:#111827;padding:8px;font-weight:700;cursor:pointer}.nexo-gh-form small{display:block;margin-top:8px;color:#64748b;line-height:1.35}\n    .nexo-gh-tutorial{margin-top:12px}.nexo-gh-tutorial-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:14px}.nexo-gh-tutorial h2{margin:0;font-family:Fraunces,serif;font-size:24px;font-weight:700;color:var(--text)}.nexo-gh-tutorial p{margin:6px 0 0;color:var(--text-secondary);line-height:1.55;max-width:760px}.nexo-gh-stepbox{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:14px ;\n  const fmtPct = (e) => `${(Number(e) || 0).toFixed(2)}%`;\n  const fmtNumber2 = (n) =>\n    new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(Number(n) || 0);\n\n  // parse \"R$ 1.234,56\" | \"1234.56\" | 1234.56 → Number  (fiel ao Me() do 3.x)\n  function parseMoney(e) {\n    if (typeof e === 'number') return e;\n    if (e == null) return 0;\n    const t = String(e).trim();\n    if (!t) return 0;\n    const n = t.replace(/\\s/g, '').replace(/^R\\$\\s?/, '');\n    const hasC = n.includes(','), hasD = n.includes('.');\n    let a = n;\n    if (hasC && hasD) a = n.replace(/\\./g, '').replace(',', '.');\n    else if (hasC) a = n.replace(',', '.');\n    return Number.parseFloat(a) || 0;\n  }\n  // input monetário em centavos (fiel a qn/Rn/Ho do 3.x)\n  const centsFromValue = (e) => { const t = Math.round(parseMoney(e) * 100); return t > 0 ? String(t) : ''; };\n  const centsToNumber = (e) => (Number(e) || 0) / 100;\n  const fmtCents = (e) => fmtMoney(centsToNumber(e));\n\n  // Datas: sempre em horário local, nunca UTC (fiel a te() do 3.x)\n  function parseDate(e) {\n    if (e instanceof Date && !isNaN(e)) return e;\n    if (typeof e === 'string') {\n      const m = e.match(/^(\\d{4})-(\\d{2})-(\\d{2})/);\n      if (m) return new Date(+m[1], +m[2] - 1, +m[3]);\n      const d = new Date(e);\n      if (!isNaN(d)) return d;\n    }\n    return new Date(NaN);\n  }\n  const pad2 = (n) => String(n).padStart(2, '0');\n  const toISODate = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;\n  const todayISO = () => toISODate(new Date());\n  const monthKey = (dateStrOrDate) => {\n    const d = dateStrOrDate instanceof Date ? dateStrOrDate : parseDate(dateStrOrDate);\n    return isNaN(d) ? '' : `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`;\n  };\n  const daysInMonth = (y, m0) => new Date(y, m0 + 1, 0).getDate();\n\n  const MONTHS_EN = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];\n  const MONTHS_PT = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];\n\n  const esc = (s) =>\n    String(s == null ? '' : s).replace(/[&<>\"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' }[c]));\n\n  // el('div', {className:'card', onclick:fn}, child1, 'texto', ...)\n  function el(tag, attrs, ...children) {\n    const node = document.createElement(tag);\n    if (attrs) {\n      for (const k in attrs) {\n        const v = attrs[k];\n        if (v == null) continue;\n        if (k === 'className') node.className = v;\n        else if (k === 'style' && typeof v === 'object') Object.assign(node.style, v);\n        else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2).toLowerCase(), v);\n        else if (k === 'dataset') Object.assign(node.dataset, v);\n        else if (k === 'html') node.innerHTML = v;\n        else if (k in node && k !== 'list' && k !== 'form') { try { node[k] = v; } catch (_) { node.setAttribute(k, v); } }\n        else node.setAttribute(k, v);\n      }\n    }\n    for (const c of children.flat(Infinity)) {\n      if (c == null || c === false) continue;\n      node.appendChild(c instanceof Node ? c : document.createTextNode(String(c)));\n    }\n    return node;\n  }\n\n  function debounce(fn, ms) {\n    let t = null;\n    const d = function (...a) { clearTimeout(t); t = setTimeout(() => fn.apply(this, a), ms); };\n    d.flush = () => { clearTimeout(t); fn(); };\n    d.cancel = () => clearTimeout(t);\n    return d;\n  }\n\n  // id numérico (expenses/incomes, fiel ao 3.x) e id string (loans etc.)\n  let _lastNumId = 0;\n  const numId = () => { let n = Date.now(); if (n <= _lastNumId) n = _lastNumId + 1; _lastNumId = n; return n; };\n  const uid = (prefix) => `${prefix}_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;\n\n  Nexo.util = { fmtMoney, fmtPct, fmtNumber2, parseMoney, centsFromValue, centsToNumber, fmtCents,\n    pa ;\n      if (Array.isArray(d.customCategories)) t.customCategories = d.customCategories;\n      if (d.budgets && typeof d.budgets === 'object') t.budgets = Object.assign({}, DEFAULT_BUDGETS, d.budgets);\n      if (d.brandSubtitle != null) t.brandSubtitle = sanitizeSubtitle(d.brandSubtitle);\n      if (d.dashboardPeriod && typeof d.dashboardPeriod === 'object')\n        t.dashboardPeriod = { type: d.dashboardPeriod.type || 'thisMonth', from: d.dashboardPeriod.from || '', to: d.dashboardPeriod.to || '' };\n      // investimentos: os módulos de investimento leem direto do localStorage\n      if (Array.isArray(d.investmentAssets)) lsSet('nexo_investment_assets', d.investmentAssets);\n      if (Array.isArray(d.investmentTransactions)) lsSet('nexo_investment_transactions', d.investmentTransactions);\n    },\n\n    _mirror() {\n      const t = this.data;\n      lsSet(LS_KEYS.expenses, t.expenses);\n      lsSet(LS_KEYS.incomes, t.incomes);\n      lsSet(LS_KEYS.loans, t.loans);\n      lsSet(LS_KEYS.customCategories, t.customCategories);\n      lsSet(LS_KEYS.budgets, t.budgets);\n      lsSet(LS_KEYS.brandSubtitle, t.brandSubtitle);\n      lsSet(LS_KEYS.dashboardPeriod, t.dashboardPeriod);\n    },\n\n    _loadLocal() {\n      this._applyData({\n        expenses: lsGet(LS_KEYS.expenses, []),\n        incomes: lsGet(LS_KEYS.incomes, []),\n        loans: lsGet(LS_KEYS.loans, []),\n        customCategories: lsGet(LS_KEYS.customCategories, []),\n        budgets: lsGet(LS_KEYS.budgets, null) || undefined,\n        brandSubtitle: lsGet(LS_KEYS.brandSubtitle, null) || undefined,\n        dashboardPeriod: lsGet(LS_KEYS.dashboardPeriod, null) || undefined,\n      });\n    },\n\n    buildPayload() {\n      const t = this.data;\n      return {\n        meta: { app: 'Nexo', version: 1, updatedAt: new Date().toISOString() },\n        data: {\n          expenses: t.expenses, incomes: t.incomes, loans: t.loans,\n          customCategories: t.customCategories, budgets: t.budgets, brandSubtitle s, compound_interest, about, options\n   Vanilla JS, sem libs externas. Fiel ao comportamento do 3.x (app.pretty.js).\n   ══════════════════════════════════════════════════════════════════════════ */\n(function () {\n  'use strict';\n\n  const U = Nexo.util;\n  const Z = U.fmtMoney;\n  const el = U.el;\n  const store = Nexo.store;\n  const toast = (m) => Nexo.ui.toast(m);\n  const todayStr = () => U.todayISO();\n\n  // te() do 3.x: inválido → new Date()\n  function teD(s) { const d = U.parseDate(s); return isNaN(d) ? new Date() : d; }\n  const fmtBR = (s) => teD(s).toLocaleDateString('pt-BR');\n\n  // xa() do 3.x: sem acentos, lowercase\n  function normSearch(s) {\n    return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();\n  }\n\n  const TRASH_SVG = '<svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"3 6 5 6 21 6\"/><path d=\"M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6\"/><line x1=\"10\" y1=\"11\" x2=\"10\" y2=\"17\"/><line x1=\"14\" y1=\"11\" x2=\"14\" y2=\"17\"/><path d=\"M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2\"/><\/svg>';\n\n  const fg = (label, node) => el('div', { className: 'form-group' },\n    el('label', { className: 'form-label' }, label), node);\n\n  /* ── Input monetário em centavos (padrão qn/Rn/Ho/dh do 3.x) ─────────── */\n  function moneyInput(initialCents, opts) {\n    opts = opts || {};\n    let str = String(initialCents || '');\n    const fmt = opts.plain\n      ? (s) => U.fmtNumber2(U.centsToNumber(s))\n      : (s) => U.fmtCents(s);\n    const input = el('input', {\n      className: 'form-input', type: 'text', inputMode: 'numeric',\n      placeholder: opts.placeholder != null ? opts.placeholder : '',\n    });\n    function setStr(s) {\n      str = String(s || '').replace(/\\D/g, '').replace(/^0+(?=\\d)/, '');\n      input.value = str ? fmt(str) : '';\n      if (opts.onChange) opts.onChang nvestments Dashboard Redesign ──────────────────────────────── */\n(function () {\n  'use strict';\n\n  // ── Helpers ──────────────────────────────────────────────────────────────\n  const ASSETS_KEY = 'nexo_investment_assets';\n  const TXS_KEY    = 'nexo_investment_transactions';\n  const FIXED_INCOME = new Set(['CDB','LCI','LCA','Fund']);\n\n  function loadAssets()  { try { return JSON.parse(localStorage.getItem(ASSETS_KEY) || '[]'); } catch { return []; } }\n  function loadTxs()     { try { return JSON.parse(localStorage.getItem(TXS_KEY) || '[]'); } catch { return []; } }\n\n  // Carrega dados frescos do Gist para o localStorage antes de renderizar\n  async function loadFromGist() {\n    try {\n      const resp = await fetch('/api/sync/data');\n      if (!resp.ok) return;\n      const json = await resp.json();\n      const d = json && json.payload && json.payload.data;\n      if (!d) return;\n      if (Array.isArray(d.investmentAssets))\n        localStorage.setItem(ASSETS_KEY, JSON.stringify(d.investmentAssets));\n      if (Array.isArray(d.investmentTransactions))\n        localStorage.setItem(TXS_KEY, JSON.stringify(d.investmentTransactions));\n    } catch (e) {\n      console.warn('[Nexo Dash] loadFromGist failed:', e);\n    }\n  }\n\n  function fmtBRL(v, d) {\n    if (v == null || isNaN(v)) return 'R$ —';\n    const opts = { minimumFractionDigits: d ?? 2, maximumFractionDigits: d ?? 2 };\n    return 'R$ ' + Math.abs(v).toLocaleString('pt-BR', opts);\n  }\n  function fmtPct(v) {\n    if (v == null || isNaN(v)) return '—';\n    return (v >= 0 ? '+' : '') + v.toFixed(2) + '%';\n  }\n  function fmtK(v) {\n    if (Math.abs(v) >= 1e6) return 'R$ ' + (v/1e6).toFixed(1) + 'M';\n    if (Math.abs(v) >= 1e3) return 'R$ ' + (v/1e3).toFixed(1) + 'k';\n    return 'R$ ' + v.toFixed(0);\n  }\n  function fmtDate(str) {\n    if (!str) return '—';\n    const [y,m,d] = str.split('-');\n    return d+'/'+m+'/'+y;\n  }\n  function today() {\n    const n = new Date();\n    return n.toISOString().slice(0,10);\n  }\n\n  // ── Class colours ─────────────────────────────────────────────────────────\n  const CLASS_COLORS = {\n    'ETF':   'var(--accent, #E07A5F)',\n    'Stock': '#8E5A8A',\n    'CDB':   '#B58A3B',\n    'LCI':   '#6B9E7A',\n    'LCA':   '#5C8A6C',\n    'Fund':  '#4C7A99',\n    'Cash':  '#7A756F',\n  };\n  function classColor(cls) { return CLASS_COLORS[cls] || '#7A756F'; }\n\n  // ── XIRR ─────────────────────────────────────────────────────────────────\n  function computeXIRR(cashflows) {\n    if (!cashflows || cashflows.length < 2) return null;\n    const t0 = new Date(cashflows[0].date).getTime();\n    function npv(r) {\n      return cashflows.reduce((s, cf) => {\n        const t = new Date(cf.date).getTime();\n        const years = (t - t0) / (365.25 * 24 * 3600 * 1000);\n        return s + cf.amount / Math.pow(1 + r, years);\n      }, 0);\n    }\n    let lo = -0.999, hi = 100, mid = 0;\n    for (let i = 0; i < 200; i++) {\n      mid = (lo + hi) / 2;\n      if (npv(mid) > 0) lo = mid; else hi = mid;\n      if (hi - lo < 1e-8) break;\n    }\n    return isFinite(mid) ? mid : null;\n  }\n\n  // ── Portfolio calculations ────────────────────────────────────────────────\n  function calcPortfolio() {\n    const assets = loadAssets();\n    const txs    = loadTxs();\n\n    const result = assets.map(asset => {\n      const myTxs = txs.filter(t => t.assetId === asset.id);\n      const fi = FIXED_INCOME.has(asset.assetClass);\n\n      let qtyNet = 0, firstBuyDate = null;\n      let totalBuyQty = 0, weightedBuyCost = 0;\n      let totalBuyAmt = 0, totalSellAmt = 0; // para fundos/renda fixa\n\n      myTxs.forEach(t => {\n        const d = t.date;\n        if (t.type === 'buy' || t.type === 'adjustment') {\n          const qty = parseFloat(t.quantity) || 1;\n          const amt = parseFloat(t.amount)   || 0;\n          qtyNet          += fi ? 0 : qty;   // fundos não contam qty\n          weightedBuyCost += fi ? 0 : amt * qty;\n          totalBuyQty     += fi ? 0 : qty;\n          totalBuyAmt     += fi ? amt : 0;   // fundos: soma o valor total\n          if (!firstBuyDate || d < firstBuyDate) firstBuyDate = d;\n        } else if (t.type === 'sell') {\n          const qty = parseFloat(t.quantity) || 1;\n          const amt = parseFloat(t.amount)   || 0;\n          qtyNet      -= fi ? 0 : qty;\n          totalSellAmt += fi ? amt : 0;\n        }\n      });\n\n      const manualPrice = parseFloat(asset.manualUnitPrice) || 0;\n      let avgPrice, position, pl, costBasis;\n\n      if (!fi) {\n        // ETF: preço médio ponderado por qtd de cotas\n        avgPrice  = totalBuyQty > 0 ? weightedBuyCost / totalBuyQty : 0;\n        position  = qtyNet * manualPrice;\n        pl        = (manualPrice - avgPrice) * qtyNet;\n        costBasis = avgPrice * qtyNet;\n      } else {\n        // Fundo/renda fixa: capital líquido = Σbuys − Σsells\n        const netInvested = totalBuyAmt - totalSellAmt;\n        avgPrice  = netInvested;  // usado para exibir \"Capital invested\" no Dashboard\n        position  = manualPrice;\n        // Para renda fixa: P/L inclui cupons/dividendos recebidos\n        const assetIncome = myTxs\n          .filter(t => t.type === 'income')\n          .reduce((s, t) => s + (parseFloat(t.amount) || 0), 0);\n        pl        = (manualPrice - netInvested) + assetIncome;\n        costBasis = netInvested;\n      }\n\n      return {\n        ...asset,\n        qtyNet, avgPrice, position, pl, costBasis,\n        firstBuyDate,\n        txs: myTxs,\n        fi,\n      };\n    }).filter(a => a.position > 0 || a.qtyNet > 0);\n\n    const totalPosition = result.reduce((s, a) => s + a.position, 0);\n    result.forEach(a => { a.allocation = totalPosition > 0 ? (a.position / totalPosition) * 100 : 0; });\n\n    // Income totals\n    const allIncome = txs.filter(t => t.type === 'income');\n    const totalIncome = allIncome.reduce((s,t) => s + (parseFloat(t.amount)||0), 0);\n    const couponClasses = ['CDB','LCI','LCA'];\n    const couponCount = allIncome.filter(t => {\n      const a = assets.find(x => x.id === t.assetId);\n      return a && couponClasses.includes(a.assetClass);\n    }).length;\n    const dividendCount = allIncome.filter(t => {\n      const a = assets.find(x => x.id === t.assetId);\n      return a && !couponClasses.includes(a.assetClass);\n    }).length;\n\n    // Total cost basis & P/L\n    const totalCostBasis = result.reduce((s,a) => s + a.costBasis, 0);\n    const totalPL        = result.reduce((s,a) => s + a.pl, 0);\n    const totalPLpct     = totalCostBasis > 0 ? (totalPL / totalCostBasis) * 100 : 0;\n\n    // XIRR cashflows\n    const allTxsSorted = txs.slice().sort((a,b)=> a.date < b.date ? -1 : 1);\n    const xirrCFs = allTxsSorted.map(t => {\n      const amt = parseFloat(t.amount) || 0;\n      const qty = parseFloat(t.quantity) || 1;\n      const a   = assets.find(x => x.id === t.assetId);\n      const fi2 = a ? FIXED_INCOME.has(a.assetClass) : false;\n      let cash;\n      if (t.type === 'buy' || t.type === 'adjustment') {\n        cash = fi2 ? -amt : -(amt * qty);\n      } else if (t.type === 'sell' || t.type === 'income') {\n        cash = fi2 ? amt : (amt * qty);\n      } else {\n        cash = 0;\n      }\n      return { date: t.date, amount: cash };\n    }).filter(c => c.amount !== 0);\n\n    if (xirrCFs.length > 0 && totalPosition > 0) {\n      xirrCFs.push({ date: today(), amount: +totalPosition });\n    }\n\n    const irr = xirrCFs.length >= 2 ? computeXIRR(xirrCFs) : null;\n    const firstTxDate = allTxsSorted.length > 0 ? allTxsSorted[0].date : null;\n\n    return {\n      assets: result,\n      totalPosition,\n      totalIncome,\n      dividendCount,\n      couponCount,\n      totalCostBasis,\n      totalPL,\n      totalPLpct,\n      irr,\n      firstTxDate,\n      allTxs: txs,\n    };\n  }\n\n  // ── State ─────────────────────────────────────────────────────────────────\n  const state = { period: 'all', allocationView: 'class' };\n\n  // ── Navigation ────────────────────────────────────────────────────────────\n  function goToInvestmentsTx() {\n    const btns = document.querySelectorAll('.sidebar button.nav-item');\n    btns.forEach(btn => {\n      let lbl = '';\n      btn.childNodes.forEach(n => { if (n.nodeType === 3) lbl += n.textContent; });\n      if (/trans/i.test(lbl) && /invest/i.test(lbl)) btn.click();\n    });\n  }\n\n  // ── Flow chart data ───────────────────────────────────────────────────────\n  function getFlowData(txs, assets, period) {\n    const now = new Date();\n    let fromDate;\n    if (period === 'month') {\n      fromDate = new Date(now.getFullYear(), now.getMonth(), 1);\n    } else if (period === '30d') {\n      fromDate = new Date(now.getTime() - 30*24*3600*1000);\n    } else if (period === 'year') {\n      fromDate = new Date(now.getFullYear(), 0, 1);\n    } else {\n      fromDate = null;\n    }\n\n    const filtered = txs.filter(t => !fromDate || t.date >= fromDate.toISOString().slice(0,10));\n\n    const months = {};\n    filtered.forEach(t => {\n      const [y,m] = t.date.split('-');\n      const key = y+'-'+m;\n      if (!months[key]) months[key] = { buy: 0, income: 0, sell: 0, adj: 0 };\n      const a   = assets.find(x => x.id === t.assetId);\n      const fi  = a ? FIXED_INCOME.has(a.assetClass) : false;\n      const amt = parseFloat(t.amount) || 0;\n      const qty = parseFloat(t.quantity) || 1;\n      const val = fi ? amt : amt * qty;\n      if (t.type === 'buy')        months[key].buy    += val;\n      else if (t.type === 'sell')  months[key].sell   += val;\n      else if (t.type === 'income')months[key].income += amt;\n      else if (t.type === 'adjustment') months[key].adj += val;\n    });\n\n    const sorted = Object.keys(months).sort();\n    const totals = { buy:0, sell:0, income:0, adj:0 };\n    filtered.forEach(t => {\n      const a   = assets.find(x => x.id === t.assetId);\n      const fi  = a ? FIXED_INCOME.has(a.assetClass) : false;\n      const amt = parseFloat(t.amount) || 0;\n      const qty = parseFloat(t.quantity) || 1;\n      const val = fi ? amt : amt * qty;\n      if (t.type === 'buy')         totals.buy    += val;\n      else if (t.type === 'sell')   totals.sell   += val;\n      else if (t.type === 'income') totals.income += amt;\n      else if (t.type === 'adjustment') totals.adj += val;\n    });\n\n    return { monthKeys: sorted, months, totals };\n  }\n\n  // ── SVG Donut ─────────────────────────────────────────────────────────────\n  function buildDonutSVG(segments, totalPosition) {\n    const cx=120, cy=120, r=90, sw=28;\n    const circ = 2*Math.PI*r;\n\n    let offset = 0;\n    const SEGS = segments.map(s => {\n      const dash = (s.pct/100)*circ;\n      const seg = { ...s, dash, offset };\n      offset += dash;\n      return seg;\n    });\n\n    const segPaths = SEGS.map((s,i) =>\n      `<circle data-seg-i=\"${i}\" data-seg-cls=\"${s.cls}\" cx=\"${cx}\" cy=\"${cy}\" r=\"${r}\"\n        fill=\"none\" stroke=\"${s.color}\" stroke-width=\"${sw}\"\n        stroke-dasharray=\"${s.dash.toFixed(3)} ${(circ-s.dash).toFixed(3)}\"\n        stroke-dashoffset=\"${(circ/4 - s.offset).toFixed(3)}\"\n        style=\"transition:opacity .2s;cursor:pointer\"\n        transform=\"rotate(-90 ${cx} ${cy})\"\n      />`\n    ).join('');\n\n    const valStr  = totalPosition >= 1e6 ? (totalPosition/1e6).toFixed(1)+'M' : totalPosition >= 1e3 ? (totalPosition/1e3).toFixed(0)+'k' : totalPosition.toFixed(0);\n    const nCls    = segments.length;\n\n    return `<svg id=\"nx-dash-donut\" viewBox=\"0 0 240 240\" width=\"240\" height=\"240\" xmlns=\"http://www.w3.org/2000/svg\">\n      <circle cx=\"${cx}\" cy=\"${cy}\" r=\"${r}\" fill=\"none\" stroke=\"var(--surface-hover,#f0ece8)\" stroke-width=\"${sw}\" />\n      ${segPaths}\n      <text x=\"${cx}\" y=\"${cy-16}\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--text-muted,#888)\" font-family=\"inherit\" letter-spacing=\"1\">TOTAL<\/text>\n      <text x=\"${cx}\" y=\"${cy+2}\" text-anchor=\"middle\" font-size=\"16\" fill=\"var(--text,#1a1a1a)\" font-family=\"Fraunces,serif\" font-weight=\"600\">R$ ${valStr}<\/text>\n      <text x=\"${cx}\" y=\"${cy+18}\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--text-muted,#888)\" font-family=\"inherit\">${nCls} classe${nCls!==1?'s':''}<\/text>\n    <\/svg>`;\n  }\n\n  // ── Bar chart SVG ─────────────────────────────────────────────────────────\n  function buildBarChartSVG(monthKeys, months) {\n    if (!monthKeys.length) {\n      return `<svg width=\"100%\" height=\"220\" xmlns=\"http://www.w3.org/2000/svg\">\n        <text x=\"50%\" y=\"110\" text-anchor=\"middle\" fill=\"var(--text-muted,#888)\" font-size=\"13\">No data for this period<\/text>\n      <\/svg>`;\n    }\n\n    const W=600, H=220, padL=52, padR=16, padT=16, padB=36;\n    const chartW = W - padL - padR;\n    const chartH = H - padT - padB;\n\n    const maxVal = Math.max(1, ...monthKeys.map(k => (months[k].buy||0) + (months[k].adj||0) + (months[k].income||0)));\n    const ticks  = [0, maxVal/2, maxVal];\n\n    const slotW  = chartW / monthKeys.length;\n    const barW   = Math.min(slotW * 0.55, 28);\n\n    const MONTH_ABBR = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];\n\n    const bars = monthKeys.map((k, i) => {\n      const mo   = months[k];\n      const base = (mo.buy||0) + (mo.adj||0);\n      const inc  = mo.income||0;\n      const sell = mo.sell||0;\n      const x    = padL + slotW*i + slotW/2;\n\n      const hBase = (base/maxVal)*chartH;\n      const hInc  = (inc/maxVal)*chartH;\n      const hSell = (sell/maxVal)*chartH;\n\n      const yBase = padT + chartH - hBase;\n      const yInc  = yBase - hInc;\n\n      const mo2   = months[k];\n      const tt    = `${k}: Buy R$${(mo2.buy||0).toFixed(0)} Adj R$${(mo2.adj||0).toFixed(0)} Income R$${inc.toFixed(0)} Sell R$${sell.toFixed(0)}`;\n\n      let rects = '';\n      if (hBase > 0) rects += `<rect x=\"${(x - barW/2).toFixed(1)}\" y=\"${yBase.toFixed(1)}\" width=\"${barW.toFixed(1)}\" height=\"${hBase.toFixed(1)}\" rx=\"2\" fill=\"var(--buy,#5C8A6C)\" data-tooltip=\"${tt}\" />`;\n      if (hInc  > 0) rects += `<rect x=\"${(x - barW/2).toFixed(1)}\" y=\"${yInc.toFixed(1)}\" width=\"${barW.toFixed(1)}\" height=\"${hInc.toFixed(1)}\" rx=\"2\" fill=\"#B58A3B\" data-tooltip=\"${tt}\" />`;\n      if (hSell > 0) rects += `<rect x=\"${(x + barW/2 + 2).toFixed(1)}\" y=\"${(padT+chartH - hSell).toFixed(1)}\" width=\"${(barW*0.6).toFixed(1)}\" height=\"${hSell.toFixed(1)}\" rx=\"2\" fill=\"var(--sell,#C0614A)\" data-tooltip=\"${tt}\" />`;\n\n      const [yr,mo3] = k.split('-');\n      const lbl = MONTH_ABBR[parseInt(mo3,10)-1] + (yr !== String(new Date().getFullYear()) ? ' '+yr.slice(2) : '');\n      const xlbl = `<text x=\"${x.toFixed(1)}\" y=\"${(H-padB+14).toFixed(1)}\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--text-muted,#888)\">${lbl}<\/text>`;\n\n      return rects + xlbl;\n    }).join('');\n\n    const tickLines = ticks.map(v => {\n      const y = padT + chartH - (v/maxVal)*chartH;\n      return `<line x1=\"${padL}\" y1=\"${y.toFixed(1)}\" x2=\"${W-padR}\" y2=\"${y.toFixed(1)}\" stroke=\"var(--border,#e0dbd5)\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/>\n        <text x=\"${(padL-4).toFixed(1)}\" y=\"${(y+4).toFixed(1)}\" text-anchor=\"end\" font-size=\"9\" fill=\"var(--text-muted,#888)\">${fmtK(v)}<\/text>`;\n    }).join('');\n\n    return `<svg id=\"nx-dash-bars\" viewBox=\"0 0 ${W} ${H}\" width=\"100%\" height=\"220\" xmlns=\"http://www.w3.org/2000/svg\" style=\"overflow:visible\">\n      ${tickLines}\n      ${bars}\n    <\/svg>`;\n  }\n\n  // ── Main render ───────────────────────────────────────────────────────────\n  function renderPage() {\n    const root = document.getElementById('nx-dash-root');\n    if (!root) return;\n\n    const data = calcPortfolio();\n    const { assets, totalPosition, totalIncome, dividendCount, couponCount,\n            totalCostBasis, totalPL, totalPLpct, irr, firstTxDate, allTxs } = data;\n\n    // ── Empty state ──\n    if (!assets.length) {\n      root.innerHTML = `\n        <div class=\"nx-dash-empty\">\n          <div class=\"nx-dash-empty-icon\">📊<\/div>\n          <h2>No investments yet<\/h2>\n          <p>Start tracking your portfolio by adding your first transaction.<\/p>\n          <button data-action=\"goto-tx\" class=\"nx-dash-btn-accent\">＋ Add your first transaction<\/button>\n        <\/div>`;\n      return;\n    }\n\n    // ── KPI Cards ──\n    const plSign = totalPL >= 0 ? '+' : '−';\n    const irrVal = irr != null ? (irr*100).toFixed(2)+'%' : '—';\n    const irrSign = irr != null && irr >= 0 ? '+' : (irr != null ? '−' : '');\n    const irrSub = firstTxDate\n      ? `annualized · since ${fmtDate(firstTxDate)}`\n      : 'not enough data yet';\n    const irrDisplay = irr != null ? (irrSign + Math.abs(irr*100).toFixed(2)+'%') : '—';\n    const irrColor   = irr != null ? (irr >= 0 ? 'var(--pos,#3a7d44)' : 'var(--neg,#b52b27)') : 'var(--text,#1a1a1a)';\n\n    const plColor   = totalPL >= 0 ? 'var(--pos,#3a7d44)' : 'var(--neg,#b52b27)';\n    const plPctPill = `<span class=\"nx-dash-pill ${totalPL>=0?'nx-dash-pill-pos':'nx-dash-pill-neg'}\">${totalPL>=0?'▲':'▼'} ${Math.abs(totalPLpct).toFixed(2)}%<\/span>`;\n\n    // ── Allocation by class ──\n    const byClass = {};\n    assets.forEach(a => {\n      const cls = a.assetClass || 'Other';\n      if (!byClass[cls]) byClass[cls] = { cls, color: classColor(cls), position: 0, assets: [] };\n      byClass[cls].position += a.position;\n      byClass[cls].assets.push(a);\n    });\n    const classSegs = Object.values(byClass)\n      .sort((a,b) => b.position - a.position)\n      .map(c => ({ ...c, pct: totalPosition > 0 ? (c.position/totalPosition)*100 : 0 }));\n\n    const donutSVG = buildDonutSVG(classSegs, totalPosition);\n\n    // Allocation list HTML\n    let allocListHTML = '';\n    if (state.allocationView === 'class') {\n      classSegs.forEach(c => {\n        allocListHTML += `\n          <div class=\"nx-dash-alloc-row\">\n            <div class=\"nx-dash-dot\" style=\"background:${c.color}\"><\/div>\n            <div class=\"nx-dash-alloc-info\">\n              <div class=\"nx-dash-alloc-name\">${c.cls}<\/div>\n              <div class=\"nx-dash-alloc-sub\">${c.assets.length} asset${c.assets.length!==1?'s':''}<\/div>\n              <div class=\"nx-dash-alloc-bar-wrap\"><div class=\"nx-dash-alloc-bar\" style=\"width:${c.pct.toFixed(1)}%;background:${c.color}\"><\/div><\/div>\n            <\/div>\n            <div class=\"nx-dash-alloc-pct\">${c.pct.toFixed(1)}%<\/div>\n            <div class=\"nx-dash-alloc-val\">${fmtBRL(c.position)}<\/div>\n          <\/div>`;\n      });\n    } else {\n      assets.slice().sort((a,b) => b.position - a.position).forEach(a => {\n        const color = classColor(a.assetClass);\n        allocListHTML += `\n          <div class=\"nx-dash-alloc-row\">\n            <div class=\"nx-dash-dot\" style=\"background:${color}\"><\/div>\n            <div class=\"nx-dash-alloc-info\">\n              <div class=\"nx-dash-alloc-name\">${a.name}<\/div>\n              <div class=\"nx-dash-alloc-sub\">${a.assetClass}${a.ticker?' · '+a.ticker:''}<\/div>\n              <div class=\"nx-dash-alloc-bar-wrap\"><div class=\"nx-dash-alloc-bar\" style=\"width:${a.allocation.toFixed(1)}%;background:${color}\"><\/div><\/div>\n            <\/div>\n            <div class=\"nx-dash-alloc-pct\">${a.allocation.toFixed(1)}%<\/div>\n            <div class=\"nx-dash-alloc-val\">${fmtBRL(a.position)}<\/div>\n          <\/div>`;\n      });\n    }\n\n    const nClasses  = classSegs.length;\n    const allocToggleLabel = state.allocationView === 'class' ? 'By asset →' : 'By class →';\n\n    // ── Holdings table ──\n    const holdingsRows = assets.slice().sort((a,b) => b.position - a.position).map(a => {\n      const plColor2 = a.pl >= 0 ? 'var(--pos,#3a7d44)' : 'var(--neg,#b52b27)';\n      const plSign2  = a.pl >= 0 ? '+' : '−';\n      const plPct2   = a.costBasis > 0 ? (a.pl / a.costBasis)*100 : 0;\n      const clr = classColor(a.assetClass);\n      const unit = a.fi ? 'units' : 'shares';\n      const costLbl = a.fi ? 'per unit' : 'per share';\n      return `\n        <tr class=\"nx-dash-row\" data-asset-id=\"${a.id}\">\n          <td class=\"nx-dash-td\">\n            <div class=\"nx-dash-asset-name\">${a.name}<\/div>\n            <div class=\"nx-dash-asset-sub\">\n              <span class=\"nx-dash-badge\" style=\"background:${clr}22;color:${clr}\">${a.assetClass}<\/span>\n              ${a.ticker ? '<span class=\"nx-dash-ticker\">'+a.ticker+'<\/span>' : ''}\n              ${a.firstBuyDate ? '· since '+fmtDate(a.firstBuyDate) : ''}\n            <\/div>\n          <\/td>\n          <td class=\"nx-dash-td nx-dash-right\">\n            <div class=\"nx-dash-tabnum\">${a.qtyNet > 0 ? a.qtyNet.toFixed(a.fi?0:4) : '—'}<\/div>\n            <div class=\"nx-dash-muted\">${unit}<\/div>\n          <\/td>\n          <td class=\"nx-dash-td nx-dash-right\">\n            <div class=\"nx-dash-tabnum\">${fmtBRL(a.avgPrice)}<\/div>\n            <div class=\"nx-dash-muted\">${costLbl}<\/div>\n          <\/td>\n          <td class=\"nx-dash-td nx-dash-right\">\n            <div><span class=\"nx-dash-muted\">R$<\/span> <span style=\"font-family:Fraunces,serif;font-size:15.5px;font-weight:600\">${Math.abs(a.position).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}<\/span><\/div>\n          <\/td>\n          <td class=\"nx-dash-td\">\n            <div style=\"display:flex;align-items:center;gap:8px\">\n              <div style=\"flex:1;height:6px;background:var(--surface-hover,#f0ece8);border-radius:999px;overflow:hidden\">\n                <div style=\"height:100%;width:${a.allocation.toFixed(1)}%;background:${clr};border-radius:999px\"><\/div>\n              <\/div>\n              <span class=\"nx-dash-tabnum\" style=\"min-width:42px;text-align:right\">${a.allocation.toFixed(1)}%<\/span>\n            <\/div>\n          <\/td>\n          <td class=\"nx-dash-td nx-dash-right\">\n            <div style=\"font-family:Fraunces,serif;font-weight:600;color:${plColor2}\">${plSign2} ${fmtBRL(a.pl)}<\/div>\n            <div class=\"nx-dash-muted\">${plPct2>=0?'+':''}${plPct2.toFixed(2)}%<\/div>\n          <\/td>\n        <\/tr>`;\n    }).join('');\n\n    // ── Flows ──\n    const allAssets = loadAssets();\n    const { monthKeys, months, totals } = getFlowData(allTxs, allAssets, state.period);\n    const barSVG = buildBarChartSVG(monthKeys, months);\n    const netContrib = totals.buy + totals.adj - totals.sell;\n\n    const periodBtns = ['month','30d','year','all'].map(p => {\n      const labels = { month:'This month', '30d':'Last 30 days', year:'This year', all:'All' };\n      const active = state.period === p ? ' nx-dash-period-active' : '';\n      return `<button class=\"nx-dash-period-btn${active}\" data-action=\"set-period\" data-period=\"${p}\">${labels[p]}<\/button>`;\n    }).join('');\n\n    // ── Asset classes, risk & variable-income breakdown (Nexo 3.10) ──\n    const NX_BUCKETS = [\n      { k:'rf',     name:'Fixed Income',        color:'#6B9E7A', w:0   },\n      { k:'rvNac',  name:'Domestic Equity',     color:'#E07A5F', w:1.0 },\n      { k:'rvInt',  name:'International Equity', color:'#4C7A99', w:1.0 },\n      { k:'crypto', name:'Crypto',              color:'#7A3F8F', w:1.5 },\n    ];\n    const NX_BK = {}; NX_BUCKETS.forEach(b => NX_BK[b.k] = b);\n    let nxRegionMap = {};\n    try { nxRegionMap = JSON.parse(localStorage.getItem('nexo_asset_region_map') || '{}') || {}; } catch (e) { nxRegionMap = {}; }\n    const nxValidRegion = r => r === 'BR' || r === 'INTL' || r === 'CRYPTO';\n    function nxBucketOf(a) {\n      const c = a.assetClass;\n      if (c === 'CDB' || c === 'LCI' || c === 'LCA' || c === 'Fund' || c === 'Cash') return 'rf';\n      const r = nxValidRegion(a.region) ? a.region : (nxValidRegion(nxRegionMap[a.id]) ? nxRegionMap[a.id] : null);\n      if (r === 'INTL') return 'rvInt';\n      if (r === 'CRYPTO') return 'crypto';\n      return 'rvNac';\n    }\n    const nxBT = { rf:0, rvNac:0, rvInt:0, crypto:0 };\n    const nxRvAssets = [];\n    assets.forEach(a => { const bk = nxBucketOf(a); nxBT[bk] += a.position; if (bk !== 'rf') nxRvAssets.push({ ...a, _bk: bk }); });\n    const nxTotal = NX_BUCKETS.reduce((s,b) => s + nxBT[b.k], 0);\n    const nxRvTotal = nxBT.rvNac + nxBT.rvInt + nxBT.crypto;\n    const nxPct = k => nxTotal > 0 ? (nxBT[k] / nxTotal * 100) : 0;\n\n    // Aggressiveness (replica New Investments: score = Σ pct_k × weight_k, pcts somando 100)\n    let nxAggr = 0; if (nxTotal > 0) NX_BUCKETS.forEach(b => { nxAggr += nxPct(b.k) * b.w; });\n    const NX_PROFILES = [\n      { max:20,  name:'Very Conservative', color:'#3F6F50' },\n      { max:40,  name:'Conservative',      color:'#6B9E7A' },\n      { max:60,  name:'Moderate',          color:'#B58A3B' },\n      { max:80,  name:'Aggressive',        color:'#D55F3E' },\n      { max:999, name:'Very Aggressive',   color:'#7A3F8F' },\n    ];\n    let nxProfile = NX_PROFILES[NX_PROFILES.length - 1];\n    for (let i = 0; i < NX_PROFILES.length; i++) { if (nxAggr <= NX_PROFILES[i].max) { nxProfile = NX_PROFILES[i]; break; } }\n    const nxAggrPos = Math.max(0, Math.min(100, nxAggr / 150 * 100));\n\n    // Concentração (portfolio todo)\n    const nxSorted = assets.slice().sort((a,b) => b.position - a.position);\n    const nxTop1 = nxSorted.length ? (nxSorted[0].position / (totalPosition || 1) * 100) : 0;\n    const nxTop3 = nxSorted.slice(0,3).reduce((s,a) => s + a.position, 0) / (totalPosition || 1) * 100;\n    const nxConcWarn = nxTop1 > 30;\n\n    // RV vs RF\n    const nxRfPct = nxPct('rf');\n    const nxRvPct = Math.max(0, 100 - nxRfPct);\n\n    // Barra de classes + legenda\n    let nxBucketBar = '', nxBucketLegend = '';\n    NX_BUCKETS.forEach(b => {\n      const p = nxPct(b.k);\n      if (p > 0) nxBucketBar += `<div style=\"width:${p.toFixed(2)}%;background:${b.color}\" title=\"${b.name}: ${p.toFixed(1)}%\"><\/div>`;\n      nxBucketLegend += `\n        <div class=\"nx-dash-alloc-row\">\n          <div class=\"nx-dash-dot\" style=\"background:${b.color}\"><\/div>\n          <div class=\"nx-dash-alloc-info\">\n            <div class=\"nx-dash-alloc-name\">${b.name}<\/div>\n            <div class=\"nx-dash-alloc-bar-wrap\"><div class=\"nx-dash-alloc-bar\" style=\"width:${p.toFixed(1)}%;background:${b.color}\"><\/div><\/div>\n          <\/div>\n          <div class=\"nx-dash-alloc-pct\">${p.toFixed(1)}%<\/div>\n          <div class=\"nx-dash-alloc-val\">${fmtBRL(nxBT[b.k])}<\/div>\n        <\/div>`;\n    });\n\n    // RV por ativo (donut + lista)\n    const nxRvSorted = nxRvAssets.slice().sort((a,b) => b.position - a.position)\n      .map(a => ({ ...a, pct: nxRvTotal > 0 ? (a.position / nxRvTotal * 100) : 0, color: NX_BK[a._bk].color }));\n    function nxRvDonut(segs) {\n      const cx=110, cy=110, r=82, sw=26, circ=2*Math.PI*r; let off=0;\n      const paths = segs.map((g,i) => { const dash=(g.pct/100)*circ; const c=`<circle data-rv-i=\"${i}\" cx=\"${cx}\" cy=\"${cy}\" r=\"${r}\" fill=\"none\" stroke=\"${g.color}\" stroke-width=\"${sw}\" stroke-dasharray=\"${dash.toFixed(2)} ${(circ-dash).toFixed(2)}\" stroke-dashoffset=\"${(circ/4-off).toFixed(2)}\" transform=\"rotate(-90 ${cx} ${cy})\" style=\"transition:opacity .2s;cursor:pointer\"/>`; off+=dash; return c; }).join('');\n      const v = nxRvTotal>=1e6?(nxRvTotal/1e6).toFixed(1)+'M':nxRvTotal>=1e3?(nxRvTotal/1e3).toFixed(0)+'k':nxRvTotal.toFixed(0);\n      return `<svg id=\"nx-dash-rv-donut\" viewBox=\"0 0 220 220\" width=\"220\" height=\"220\" xmlns=\"http://www.w3.org/2000/svg\"><circle cx=\"${cx}\" cy=\"${cy}\" r=\"${r}\" fill=\"none\" stroke=\"var(--surface-hover,#f0ece8)\" stroke-width=\"${sw}\"/>${paths}<text x=\"${cx}\" y=\"${cy-14}\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--text-muted,#888)\" letter-spacing=\"1\">VARIABLE<\/text><text x=\"${cx}\" y=\"${cy+4}\" text-anchor=\"middle\" font-size=\"15\" fill=\"var(--text,#1a1a1a)\" font-family=\"Fraunces,serif\" font-weight=\"600\">R$ ${v}<\/text><text x=\"${cx}\" y=\"${cy+20}\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--text-muted,#888)\">${segs.length} asset${segs.length!==1?'s':''}<\/text><\/svg>`;\n    }\n    const nxRvDonutSVG = nxRvSorted.length ? nxRvDonut(nxRvSorted) : '<div class=\"nx-dash-muted\" style=\"padding:24px 8px\">No variable-income assets yet.<\/div>';\n    let nxRvListHTML = nxRvSorted.length ? '' : '<div class=\"nx-dash-muted\">No variable-income assets yet.<\/div>';\n    nxRvSorted.forEach(a => {\n      nxRvListHTML += `\n        <div class=\"nx-dash-alloc-row\">\n          <div class=\"nx-dash-dot\" style=\"background:${a.color}\"><\/div>\n          <div class=\"nx-dash-alloc-info\">\n            <div class=\"nx-dash-alloc-name\">${a.name || a.ticker || '—'}<\/div>\n            <div class=\"nx-dash-alloc-sub\">${NX_BK[a._bk].name}<\/div>\n            <div class=\"nx-dash-alloc-bar-wrap\"><div class=\"nx-dash-alloc-bar\" style=\"width:${a.pct.toFixed(1)}%;background:${a.color}\"><\/div><\/div>\n          <\/div>\n          <div class=\"nx-dash-alloc-pct\">${a.pct.toFixed(1)}%<\/div>\n          <div class=\"nx-dash-alloc-val\">${fmtBRL(a.position)}<\/div>\n        <\/div>`;\n    });\n\n    const investCardHTML = `\n      <div class=\"nx-dash-card\">\n        <div class=\"nx-dash-card-header\">\n          <span class=\"nx-dash-card-title\">Asset classes &amp; risk<\/span>\n          <span class=\"nx-dash-pill-neutral\">fixed income, equities &amp; crypto<\/span>\n        <\/div>\n        <div style=\"display:flex;height:14px;border-radius:7px;overflow:hidden;margin-bottom:14px;background:var(--surface-hover,#f0ece8)\">${nxBucketBar}<\/div>\n        <div class=\"nx-dash-alloc-list\">${nxBucketLegend}<\/div>\n        <div style=\"margin-top:16px\">\n          <div class=\"nx-dash-tile\">\n            <div class=\"nx-dash-tile-label\">Portfolio Risk<\/div>\n            <div class=\"nx-dash-tile-val\" style=\"color:${nxProfile.color}\">${nxProfile.name}<\/div>\n            <div style=\"position:relative;height:8px;border-radius:4px;margin-top:10px;background:linear-gradient(90deg,#3F6F50,#6B9E7A,#B58A3B,#D55F3E,#7A3F8F)\">\n              <div style=\"position:absolute;top:-3px;width:3px;height:14px;border-radius:2px;background:var(--text,#1a1a1a);left:calc(${nxAggrPos.toFixed(1)}% - 1.5px)\"><\/div>\n            <\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n\n      <div class=\"nx-dash-card\">\n        <div class=\"nx-dash-card-header\">\n          <span class=\"nx-dash-card-title\">Variable income by asset<\/span>\n          <span class=\"nx-dash-pill-neutral\">${nxRvSorted.length} asset${nxRvSorted.length!==1?'s':''} · ${fmtBRL(nxRvTotal)}<\/span>\n        <\/div>\n        <div class=\"nx-dash-alloc-grid\">\n          <div id=\"nx-dash-rv-donut-wrap\">${nxRvDonutSVG}<\/div>\n          <div class=\"nx-dash-alloc-list\">${nxRvListHTML}<\/div>\n        <\/div>\n      <\/div>`;\n\n\n    root.innerHTML = `\n      <div id=\"nx-dash-tooltip\" style=\"display:none;position:fixed;z-index:9999;pointer-events:none;background:var(--surface,#fff);border:1px solid var(--border,#e0dbd5);border-radius:8px;padding:8px 12px;font-size:12px;box-shadow:0 4px 16px rgba(0,0,0,.12)\"><\/div>\n\n      <!-- Header -->\n      <div class=\"nx-dash-header\">\n        <div>\n          <h1 class=\"nx-dash-title\">Investments Dashboard<\/h1>\n          <p class=\"nx-dash-subtitle\">Portfolio value, allocation, and performance — at a glance.<\/p>\n        <\/div>\n        <div class=\"nx-dash-header-actions\">\n          <button class=\"nx-dash-btn-outline\" data-action=\"export\">Export<\/button>\n          <button class=\"nx-dash-btn-accent\"  data-action=\"goto-tx\">＋ Transaction<\/button>\n        <\/div>\n      <\/div>\n\n      <!-- KPI Strip -->\n      <div class=\"nx-dash-kpi-grid\">\n        <!-- Hero: Portfolio Value -->\n        <div class=\"nx-dash-kpi nx-dash-kpi-hero\">\n          <div class=\"nx-dash-kpi-label\">PORTFOLIO VALUE<\/div>\n          <div class=\"nx-dash-kpi-value nx-dash-fraunces42\">${fmtBRL(totalPosition)}<\/div>\n          <div class=\"nx-dash-kpi-meta\">\n            ${plPctPill}\n            <span class=\"nx-dash-pill ${totalPL>=0?'nx-dash-pill-pos':'nx-dash-pill-neg'}\">${plSign} ${fmtBRL(totalPL)}<\/span>\n            <span class=\"nx-dash-muted\" style=\"font-size:12px\">vs cost basis · ${fmtBRL(totalCostBasis)}<\/span>\n          <\/div>\n        <\/div>\n        <!-- Income -->\n        <div class=\"nx-dash-kpi\">\n          <div class=\"nx-dash-kpi-label\">INCOME (ALL-TIME) <span class=\"nx-dash-info-icon\" data-tooltip-text=\"Soma de dividendos e cupons recebidos em toda a história do portfolio\">ⓘ<\/span><\/div>\n          <div class=\"nx-dash-kpi-value nx-dash-fraunces28\">${fmtBRL(totalIncome)}<\/div>\n          <div class=\"nx-dash-kpi-meta nx-dash-muted\" style=\"font-size:12px\">${dividendCount} dividend${dividendCount!==1?'s':''} · ${couponCount} coupon${couponCount!==1?'s':''}<\/div>\n        <\/div>\n        <!-- Total P/L -->\n        <div class=\"nx-dash-kpi\">\n          <div class=\"nx-dash-kpi-label\">TOTAL P/L<\/div>\n          <div class=\"nx-dash-kpi-value nx-dash-fraunces28\" style=\"color:${plColor}\">${fmtBRL(totalPL)}<\/div>\n          <div class=\"nx-dash-kpi-meta\">${plPctPill} <span class=\"nx-dash-muted\" style=\"font-size:12px\">unrealized<\/span><\/div>\n        <\/div>\n        <!-- IRR -->\n        <div class=\"nx-dash-kpi\">\n          <div class=\"nx-dash-kpi-label\">PORTFOLIO IRR <span class=\"nx-dash-info-icon\" data-tooltip-text=\"Taxa interna de retorno anualizada, calculada sobre os fluxos de caixa do portfolio\">ⓘ<\/span><\/div>\n          <div class=\"nx-dash-kpi-value nx-dash-fraunces28\" style=\"color:${irrColor}\">${irrDisplay}<\/div>\n          <div class=\"nx-dash-kpi-meta nx-dash-muted\" style=\"font-size:12px\">${irrSub}<\/div>\n        <\/div>\n      <\/div>\n\n      <!-- Allocation -->\n      <div class=\"nx-dash-card\">\n        <div class=\"nx-dash-card-header\">\n          <span class=\"nx-dash-card-title\">Allocation<\/span>\n          <span class=\"nx-dash-pill-neutral\">${nClasses} classe${nClasses!==1?'s':''} · ${assets.length} asset${assets.length!==1?'s':''}<\/span>\n          <button class=\"nx-dash-btn-ghost\" data-action=\"toggle-alloc-view\">${allocToggleLabel}<\/button>\n        <\/div>\n        <div class=\"nx-dash-alloc-grid\">\n          <div id=\"nx-dash-donut-wrap\">${donutSVG}<\/div>\n          <div class=\"nx-dash-alloc-list\">${allocListHTML}<\/div>\n        <\/div>\n      <\/div>\n\n      ${investCardHTML}\n\n      <!-- Holdings -->\n      <div class=\"nx-dash-card\">\n        <div class=\"nx-dash-card-header\">\n          <span class=\"nx-dash-card-title\">Holdings<\/span>\n          <span class=\"nx-dash-pill-neutral\">${assets.length} asset${assets.length!==1?'s':''} · sorted by value<\/span>\n          <button class=\"nx-dash-btn-ghost\" data-action=\"goto-tx\">See all transactions →<\/button>\n        <\/div>\n        <div style=\"overflow-x:auto\">\n          <table class=\"nx-dash-table\">\n            <thead>\n              <tr>\n                <th class=\"nx-dash-th\">Asset<\/th>\n                <th class=\"nx-dash-th nx-dash-right\">Quantity<\/th>\n                <th class=\"nx-dash-th nx-dash-right\">Avg cost<\/th>\n                <th class=\"nx-dash-th nx-dash-right\">Current value<\/th>\n                <th class=\"nx-dash-th\">Allocation<\/th>\n                <th class=\"nx-dash-th nx-dash-right\">P/L<\/th>\n              <\/tr>\n            <\/thead>\n            <tbody>${holdingsRows}<\/tbody>\n          <\/table>\n        <\/div>\n      <\/div>\n\n      <!-- Investment Flows -->\n      <div class=\"nx-dash-card\">\n        <div class=\"nx-dash-card-header\">\n          <span class=\"nx-dash-card-title\">Investment flows<\/span>\n          <span class=\"nx-dash-pill-neutral\">Capital in/out and income · monthly<\/span>\n          <div class=\"nx-dash-period-seg\">${periodBtns}<\/div>\n        <\/div>\n        <div class=\"nx-dash-flows-grid\">\n          <div>${barSVG}<\/div>\n          <div class=\"nx-dash-flows-tiles\">\n            <div class=\"nx-dash-tile\">\n              <div class=\"nx-dash-tile-label\"><span class=\"nx-dash-dot\" style=\"background:var(--accent,#E07A5F)\"><\/span> Net contributions<\/div>\n              <div class=\"nx-dash-tile-val\">${fmtBRL(netContrib)}<\/div>\n            <\/div>\n            <div class=\"nx-dash-tile\">\n              <div class=\"nx-dash-tile-label\"><span class=\"nx-dash-dot\" style=\"background:var(--buy,#5C8A6C)\"><\/span> Buys &amp; adjustments<\/div>\n              <div class=\"nx-dash-tile-val\">${fmtBRL(totals.buy + totals.adj)}<\/div>\n            <\/div>\n            <div class=\"nx-dash-tile\">\n              <div class=\"nx-dash-tile-label\"><span class=\"nx-dash-dot\" style=\"background:var(--sell,#C0614A)\"><\/span> Sells<\/div>\n              <div class=\"nx-dash-tile-val\">${fmtBRL(totals.sell)}<\/div>\n            <\/div>\n            <div class=\"nx-dash-tile\">\n              <div class=\"nx-dash-tile-label\"><span class=\"nx-dash-dot\" style=\"background:#B58A3B\"><\/span> Income<\/div>\n              <div class=\"nx-dash-tile-val\">${fmtBRL(totals.income)}<\/div>\n            <\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n    `;\n\n    // ── Donut hover ──\n    const donutEl = document.getElementById('nx-dash-donut');\n    const tooltip  = document.getElementById('nx-dash-tooltip');\n    if (donutEl && tooltip) {\n      donutEl.addEventListener('mouseover', e => {\n        const seg = e.target.closest('[data-seg-i]');\n        if (!seg) return;\n        const i = parseInt(seg.getAttribute('data-seg-i'), 10);\n        const cls = classSegs[i];\n        if (!cls) return;\n        donutEl.querySelectorAll('[data-seg-i]').forEach((s, si) => {\n          s.style.opacity = si === i ? '1' : '0.3';\n        });\n        tooltip.style.display = 'block';\n        tooltip.innerHTML = `<b>${cls.cls}<\/b>: ${fmtBRL(cls.position)} (${cls.pct.toFixed(1)}%)`;\n      });\n      donutEl.addEventListener('mousemove', e => {\n        if (tooltip.style.display === 'none') return;\n        tooltip.style.left = (e.clientX + 14) + 'px';\n        tooltip.style.top  = (e.clientY - 8) + 'px';\n      });\n      donutEl.addEventListener('mouseout', e => {\n        if (!e.relatedTarget || !e.relatedTarget.closest('#nx-dash-donut')) {\n          donutEl.querySelectorAll('[data-seg-i]').forEach(s => s.style.opacity = '1');\n          tooltip.style.display = 'none';\n        }\n      });\n    }\n\n    // ── Variable-income donut hover ──\n    const rvDonutEl = document.getElementById('nx-dash-rv-donut');\n    if (rvDonutEl && tooltip) {\n      rvDonutEl.addEventListener('mouseover', e => {\n        const seg = e.target.closest('[data-rv-i]');\n        if (!seg) return;\n        const a = nxRvSorted[parseInt(seg.getAttribute('data-rv-i'), 10)];\n        if (!a) return;\n        rvDonutEl.querySelectorAll('[data-rv-i]').forEach((s, si) => {\n          s.style.opacity = si === parseInt(seg.getAttribute('data-rv-i'), 10) ? '1' : '0.3';\n        });\n        tooltip.style.display = 'block';\n        tooltip.innerHTML = `<b>${a.name || a.ticker || '—'}<\/b><br><span style=\"color:var(--text-muted,#888)\">${NX_BK[a._bk].name}<\/span><br>${fmtBRL(a.position)} · ${a.pct.toFixed(1)}%`;\n      });\n      rvDonutEl.addEventListener('mousemove', e => {\n        if (tooltip.style.display === 'none') return;\n        tooltip.style.left = (e.clientX + 14) + 'px';\n        tooltip.style.top  = (e.clientY - 8) + 'px';\n      });\n      rvDonutEl.addEventListener('mouseout', e => {\n        if (!e.relatedTarget || !e.relatedTarget.closest('#nx-dash-rv-donut')) {\n          rvDonutEl.querySelectorAll('[data-rv-i]').forEach(s => s.style.opacity = '1');\n          tooltip.style.display = 'none';\n        }\n      });\n    }\n\n    // ── Bar chart hover ──\n    const barEl = document.getElementById('nx-dash-bars');\n    if (barEl && tooltip) {\n      barEl.addEventListener('mouseover', e => {\n        const bar = e.target.closest('[data-tooltip]');\n        if (!bar) return;\n        tooltip.style.display = 'block';\n        tooltip.innerHTML = bar.getAttribute('data-tooltip').replace(/([A-Z][a-z]+)/g, '<b>$1<\/b>');\n      });\n      barEl.addEventListener('mousemove', e => {\n        tooltip.style.left = (e.clientX + 14) + 'px';\n        tooltip.style.top  = (e.clientY - 8) + 'px';\n      });\n      barEl.addEventListener('mouseout', () => { tooltip.style.display = 'none'; });\n    }\n\n    // ── Info icon tooltip ──\n    root.querySelectorAll('.nx-dash-info-icon').forEach(el => {\n      const txt = el.getAttribute('data-tooltip-text');\n      el.addEventListener('mouseenter', e => {\n        tooltip.style.display = 'block';\n        tooltip.innerHTML = txt;\n        tooltip.style.left = (e.clientX + 14) + 'px';\n        tooltip.style.top  = (e.clientY - 8) + 'px';\n      });\n      el.addEventListener('mousemove', e => {\n        tooltip.style.left = (e.clientX + 14) + 'px';\n        tooltip.style.top  = (e.clientY - 8) + 'px';\n      });\n      el.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; });\n    });\n  }\n\n  // ── CSS injection ─────────────────────────────────────────────────────────\n  function injectCSS() {\n    if (document.getElementById('nx-dash-css')) return;\n    const s = document.createElement('style');\n    s.id = 'nx-dash-css';\n    s.textContent = `\n      #nx-dash-root { padding: 24px 28px; max-width: 1200px; margin: 0 auto; font-family: inherit; }\n      .nx-dash-header { display:flex; align-items:flex-start; justify-content:space-between; flex-wrap:wrap; gap:16px; margin-bottom:28px; }\n      .nx-dash-title  { font-family:Fraunces,serif; font-size:32px; font-weight:600; margin:0 0 6px; color:var(--text,#1a1a1a); }\n      .nx-dash-subtitle { color:var(--text-muted,#888); font-size:14px; margin:0; }\n      .nx-dash-header-actions { display:flex; gap:10px; align-items:center; padding-top:4px; }\n\n      /* KPI */\n      .nx-dash-kpi-grid { display:grid; grid-template-columns:2fr 1fr 1fr 1fr; gap:14px; margin-bottom:20px; }\n      .nx-dash-kpi { background:var(--surface,#fff); border:1px solid var(--border,#e0dbd5); border-radius:14px; padding:20px 22px; }\n      .nx-dash-kpi-hero { }\n      .nx-dash-kpi-label { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted,#888); margin-bottom:8px; display:flex; align-items:center; gap:5px; }\n      .nx-dash-kpi-value { margin:4px 0 10px; }\n      .nx-dash-kpi-meta  { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }\n      .nx-dash-fraunces42 { font-family:Fraunces,serif; font-size:42px; font-weight:600; color:var(--text,#1a1a1a); line-height:1.1; }\n      .nx-dash-fraunces28 { font-family:Fraunces,serif; font-size:28px; font-weight:600; color:var(--text,#1a1a1a); line-height:1.2; }\n\n      /* Pills */\n      .nx-dash-pill { display:inline-flex; align-items:center; border-radius:999px; padding:3px 9px; font-size:12px; font-weight:600; }\n      .nx-dash-pill-pos { background:#dcf0e2; color:#3a7d44; }\n      .nx-dash-pill-neg { background:#fde8e8; color:#b52b27; }\n      .nx-dash-pill-neutral { background:var(--surface-hover,#f5f1ed); color:var(--text-muted,#888); display:inline-flex; align-items:center; border-radius:999px; padding:3px 9px; font-size:12px; }\n\n      /* Buttons */\n      .nx-dash-btn-accent  { background:var(--accent,#E07A5F); color:#fff; border:none; border-radius:8px; padding:9px 16px; font-size:13.5px; font-weight:600; cursor:pointer; }\n      .nx-dash-btn-accent:hover { filter:brightness(1.08); }\n      .nx-dash-btn-outline { background:transparent; color:var(--text,#1a1a1a); border:1.5px solid var(--border,#e0dbd5); border-radius:8px; padding:8px 15px; font-size:13.5px; font-weight:500; cursor:pointer; }\n      .nx-dash-btn-outline:hover { background:var(--surface-hover,#f5f1ed); }\n      .nx-dash-btn-ghost { background:transparent; border:none; color:var(--accent,#E07A5F); font-size:13px; font-weight:500; cursor:pointer; padding:4px 0; margin-left:auto; }\n      .nx-dash-btn-ghost:hover { text-decoration:underline; }\n\n      /* Cards */\n      .nx-dash-card { background:var(--surface,#fff); border:1px solid var(--border,#e0dbd5); border-radius:14px; padding:22px; margin-bottom:20px; }\n      .nx-dash-card-header { display:flex; align-items:center; gap:10px; margin-bottom:20px; flex-wrap:wrap; }\n      .nx-dash-card-title { font-family:Fraunces,serif; font-size:18px; font-weight:600; color:var(--text,#1a1a1a); }\n\n      /* Allocation */\n      .nx-dash-alloc-grid { display:grid; grid-template-columns:280px 1fr; gap:28px; align-items:start; }\n      .nx-dash-alloc-list { display:flex; flex-direction:column; gap:10px; }\n      .nx-dash-alloc-row { display:grid; grid-template-columns:14px 1fr auto auto; gap:10px; align-items:center; }\n      .nx-dash-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; display:inline-block; }\n      .nx-dash-alloc-info { display:flex; flex-direction:column; gap:2px; }\n      .nx-dash-alloc-name { font-weight:600; font-size:14px; color:var(--text,#1a1a1a); }\n      .nx-dash-alloc-sub  { font-size:11px; color:var(--text-muted,#888); }\n      .nx-dash-alloc-bar-wrap { height:6px; background:var(--surface-hover,#f0ece8); border-radius:999px; overflow:hidden; margin-top:4px; width:100%; }\n      .nx-dash-alloc-bar  { height:100%; border-radius:999px; transition:width .4s; }\n      .nx-dash-alloc-pct  { font-family:Fraunces,serif; font-size:16px; font-weight:600; font-variant-numeric:tabular-nums; text-align:right; min-width:50px; }\n      .nx-dash-alloc-val  { font-size:13px; color:var(--text-muted,#888); text-align:right; min-width:90px; }\n\n      /* Holdings table */\n      .nx-dash-table { width:100%; border-collapse:collapse; font-size:13.5px; }\n      .nx-dash-th { text-align:left; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:var(--text-muted,#888); padding:8px 12px; border-bottom:1px solid var(--border,#e0dbd5); white-space:nowrap; }\n      .nx-dash-td { padding:14px 12px; border-bottom:1px solid var(--border,#e0dbd5); vertical-align:middle; }\n      .nx-dash-row:hover td { background:var(--surface-hover,#f5f1ed); }\n      .nx-dash-right { text-align:right; }\n      .nx-dash-asset-name { font-weight:700; font-size:14px; color:var(--text,#1a1a1a); }\n      .nx-dash-asset-sub  { font-size:11.5px; color:var(--text-muted,#888); margin-top:2px; display:flex; align-items:center; gap:5px; flex-wrap:wrap; }\n      .nx-dash-badge { border-radius:4px; padding:1px 6px; font-size:11px; font-weight:600; }\n      .nx-dash-ticker { font-weight:600; color:var(--text-muted,#888); }\n      .nx-dash-tabnum { font-variant-numeric:tabular-nums; }\n      .nx-dash-muted  { color:var(--text-muted,#888); font-size:12px; }\n\n      /* Flows */\n      .nx-dash-flows-grid { display:grid; grid-template-columns:1fr 260px; gap:24px; align-items:start; }\n      .nx-dash-period-seg { display:flex; gap:0; margin-left:auto; border:1px solid var(--border,#e0dbd5); border-radius:8px; overflow:hidden; }\n      .nx-dash-period-btn { background:transparent; border:none; border-right:1px solid var(--border,#e0dbd5); padding:6px 12px; font-size:12px; font-weight:500; cursor:pointer; color:var(--text-muted,#888); }\n      .nx-dash-period-btn:last-child { border-right:none; }\n      .nx-dash-period-btn:hover { background:var(--surface-hover,#f5f1ed); }\n      .nx-dash-period-active { background:var(--accent,#E07A5F) !important; color:#fff !important; font-weight:600; }\n      .nx-dash-flows-tiles { display:grid; grid-template-columns:1fr 1fr; gap:10px; }\n      .nx-dash-tile { border:1px solid var(--border,#e0dbd5); border-radius:10px; padding:14px; }\n      .nx-dash-tile-label { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-muted,#888); margin-bottom:8px; }\n      .nx-dash-tile-val { font-family:Fraunces,serif; font-size:19px; font-weight:600; color:var(--text,#1a1a1a); }\n\n      /* Info icon */\n      .nx-dash-info-icon { cursor:help; font-size:12px; color:var(--text-muted,#888); }\n\n      /* Empty */\n      .nx-dash-empty { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:80px 24px; text-align:center; gap:14px; }\n      .nx-dash-empty-icon { font-size:48px; }\n      .nx-dash-empty h2 { font-family:Fraunces,serif; font-size:24px; font-weight:600; margin:0; color:var(--text,#1a1a1a); }\n      .nx-dash-empty p  { color:var(--text-muted,#888); margin:0; font-size:14px; }\n\n      /* Responsive */\n      @media (max-width:1100px) {\n        .nx-dash-kpi-grid { grid-template-columns:1fr 1fr; }\n        .nx-dash-kpi-hero { grid-column:1/-1; }\n        .nx-dash-alloc-grid, .nx-dash-flows-grid { grid-template-columns:1fr; }\n        .nx-dash-flows-tiles { grid-template-columns:1fr 1fr; }\n      }\n      @media (max-width:640px) {\n        #nx-dash-root { padding:14px 12px; }\n        .nx-dash-kpi-grid { grid-template-columns:1fr; }\n        .nx-dash-flows-tiles { grid-template-columns:1fr; }\n        .nx-dash-fraunces42 { font-size:30px; }\n        .nx-dash-fraunces28 { font-size:22px; }\n      }\n    `;\n    document.head.appendChild(s);\n  }\n\n  // ── Event delegation ──────────────────────────────────────────────────────\n  function setupEvents() {\n    document.addEventListener('click', e => {\n      const el = e.target.closest('[data-action]');\n      if (!el) return;\n      const root = document.getElementById('nx-dash-root');\n      if (!root || !root.contains(el)) return;\n      const action = el.getAttribute('data-action');\n      if (action === 'goto-tx') { goToInvestmentsTx(); return; }\n      if (action === 'set-period') {\n        state.period = el.getAttribute('data-period');\n        renderPage();\n        return;\n      }\n      if (action === 'toggle-alloc-view') {\n        state.allocationView = state.allocationView === 'class' ? 'asset' : 'class';\n        renderPage();\n        return;\n      }\n      if (action === 'export') {\n        // Basic CSV export\n        const data = calcPortfolio();\n        const rows = [['Asset','Class','Ticker','Position (R$)','Avg Cost','Qty','P/L (R$)','Allocation %']];\n        data.assets.forEach(a => {\n          rows.push([a.name, a.assetClass, a.ticker||'', a.position.toFixed(2), a.avgPrice.toFixed(2), a.qtyNet, a.pl.toFixed(2), a.allocation.toFixed(2)]);\n        });\n        const csv = rows.map(r => r.map(v => '\"'+String(v).replace(/\"/g,'\"\"')+'\"').join(',')).join('\\n');\n        const blob = new Blob([csv], { type:'text/csv' });\n        const url  = URL.createObjectURL(blob);\n        const a    = document.createElement('a');\n        a.href = url; a.download = 'portfolio-export.csv'; a.click();\n        URL.revokeObjectURL(url);\n        return;\n      }\n    });\n  }\n\n  // ── Nav detection & mount/unmount ─────────────────────────────────────────\n  function getActiveNavLabel() {\n    const btn = document.querySelector('.sidebar button.nav-item.active');\n    if (!btn) return '';\n    let lbl = '';\n    btn.childNodes.forEach(n => { if (n.nodeType === 3) lbl += n.textContent.trim(); });\n    return lbl;\n  }\n  function isInvestmentsDashboard() {\n    const lbl = getActiveNavLabel();\n    return /investment/i.test(lbl) && !/trans/i.test(lbl) && !/new/i.test(lbl);\n  }\n  function navLabelOf(btn) {\n    let l = ''; btn.childNodes.forEach(n => { if (n.nodeType === 3) l += n.textContent.trim(); }); return l;\n  }\n  function isDashTarget(btn) {\n    if (!btn || btn.hasAttribute('data-novosinv')) retur ar(--text-primary, #1a1a1a); }\n    .nx-ap-item-meta { display: block; font-size: 11px; color: var(--text-secondary, #6b6b6b); margin-top: 1px; }\n    .nx-ap-item-badge { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; padding: 3px 8px; border-radius: 999px; flex-shrink: 0; }\n    .nx-ap-empty { padding: 14px; font-size: 12.5px; color: var(--text-secondary, #6b6b6b); text-align: center; }\n    .nx-ap-classfilter { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }\n    .nx-ap-clschip { padding: 5px 11px; border-radius: 999px; border: 1.5px solid var(--border, #e8e8e8); background: var(--card-bg, #fff); color: var(--text-secondary, #6b6b6b); font-family: inherit; font-size: 12px; font-weight: 600; cursor: pointer; }\n    .nx-ap-clschip:hover { border-color: #cfc7bf; }\n    .nx-ap-clschip.active { border-color: var(--accent, #E07A5F); background: rgba(224,122,95,.1); color: var(--accent, #E07A5F); }\n    /* Live summary / preview panel */\n    .nx-tx-summary, .nx-asset-preview { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--bg-subtle, #faf7f4); border: 1px solid var(--border, #f0ece7); border-radius: 12px; padding: 14px 16px; margin: 20px 0 4px; }\n    .nx-asset-preview { margin: 8px 0 4px; }\n    .nx-tx-summary-label, .nx-ap-prev-cap { font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--text-secondary, #6b6b6b); font-weight: 700; }\n    .nx-tx-summary-sub, .nx-ap-prev-meta { font-size: 12.5px; color: var(--text-secondary, #6b6b6b); margin-top: 3px; }\n    .nx-tx-summary-total { font-family: 'Fraunces', Georgia, serif; font-size: 23px; font-weight: 700; white-space: nowrap; }\n    .nx-ap-prev-name { font-size: 14px; font-weight: 600; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\n    .nx-ap-prev-badge { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; padding: 4px
